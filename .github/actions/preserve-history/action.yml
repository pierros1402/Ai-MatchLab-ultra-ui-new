name: Preserve history independently of publication
description: Preserve recovery evidence after failures, verify the durable archive, and restore a copy.
runs:
  using: composite
  steps:
    - name: Prepare new and changed recovery evidence
      id: bundle
      shell: bash
      run: |
        node engine-v1/jobs/preserve-history-checkpoint.js bundle \
          --destination="$RUNNER_TEMP/history-recovery-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
          --baseline="${{ github.sha }}"

    - name: Upload recovery evidence even when publication failed
      if: ${{ always() && steps.bundle.outcome == 'success' }}
      uses: actions/upload-artifact@v4
      with:
        name: history-recovery-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/history-recovery-${{ github.run_id }}-${{ github.run_attempt }}/
        retention-days: 90
        if-no-files-found: error

    - name: Persist final evidence on the independent archive branch
      if: ${{ always() }}
      id: archive
      shell: bash
      run: node engine-v1/jobs/preserve-history-checkpoint.js --stage=workflow-final

    - name: Verify recovery from the durable archive
      if: ${{ always() && steps.archive.outcome == 'success' }}
      shell: bash
      run: |
        node engine-v1/jobs/preserve-history-checkpoint.js restore \
          --ref="${{ steps.archive.outputs.archiveCommit }}" \
          --manifest="${{ steps.archive.outputs.manifestPath }}" \
          --destination="$RUNNER_TEMP/history-restore-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
