name: Autonomous Value data preparation
env:
  HISTORY_PRESERVATION_REQUIRED: "1"
  DAY_KEY: ${{ inputs.dayKey }}
  VALUE_VERIFIED_HISTORY_POLICY: "exact-native-future-team-v1"
on:
  schedule:
    - cron: "11 * * * *"
  workflow_dispatch:
    inputs:
      dayKey:
        required: true
        description: "Scan this day and the following seven days."
      apply:
        type: boolean
        default: false
        description: "Persist alarms and run bounded source research."
      publishOnly:
        type: boolean
        default: false
        description: "Publish current verified inputs without repeating source research."
      applyVerifiedContracts:
        type: boolean
        default: false
        description: "Apply reviewed primary-source team-count evidence with full standings validation."
      maxResearchLeagues:
        type: string
        default: "12"
        description: "Bounded catch-up research: 1–12 leagues. Scheduled runs research up to 12 leagues."
      archivedImportManifest:
        type: string
        default: ""
        description: "Optional reviewed data/value-data-acquisition/import-review/*.json batch."
      archivedImportSha256:
        type: string
        default: ""
        description: "Exact SHA-256 of the reviewed manifest (canonical LF bytes)."
permissions:
  contents: write
concurrency:
  group: ai-matchlab-data-writer
  queue: max
  cancel-in-progress: false
jobs:
  alarm:
    runs-on: ubuntu-latest
    # Cold recovery also verifies the full immutable history after each producer.
    # The measured repair + publication path exceeds 40 minutes; keep all checks.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm ci --no-audit --no-fund
      - name: Verify Value input and publication regression guards
        id: regression-guards
        env:
          HISTORY_PRESERVATION_REQUIRED: "0"
        run: node tools/run-value-data-regression-guards.mjs
      - name: Resolve preparation day
        shell: bash
        env:
          REQUESTED_DAY: ${{ inputs.dayKey }}
        run: |
          set -euo pipefail
          DAY_KEY="${REQUESTED_DAY:-$(TZ=Europe/Athens date +%F)}"
          [[ "$DAY_KEY" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          echo "DAY_KEY=$DAY_KEY" >> "$GITHUB_ENV"
      - name: Import an explicitly reviewed historical batch
        id: archived-import
        if: inputs.apply && inputs.archivedImportManifest != ''
        env:
          VALUE_ARCHIVED_IMPORT_MANIFEST: ${{ inputs.archivedImportManifest }}
          VALUE_ARCHIVED_IMPORT_SHA256: ${{ inputs.archivedImportSha256 }}
        run: bash tools/persist-reviewed-archived-import.sh
      - name: Rebuild statistical inputs with explicit competition provenance
        id: competition-foundations
        if: github.event_name == 'schedule' || inputs.apply
        run: bash tools/persist-history-competition-recovery.sh "$DAY_KEY"
      - name: Read-only pre-match readiness diagnosis
        if: ${{ !inputs.publishOnly }}
        run: node engine-v1/jobs/run-value-data-alarm-day.js "$DAY_KEY"
      - name: Persist alarms and execute source research
        if: (github.event_name == 'schedule' || inputs.apply) && !inputs.publishOnly
        env:
          VALUE_APPLY_VERIFIED_CONTRACTS: ${{ inputs.applyVerifiedContracts }}
          VALUE_MAX_RESEARCH_LEAGUES: ${{ inputs.maxResearchLeagues || '12' }}
        run: bash tools/persist-value-data-alarm.sh "$DAY_KEY"
      - name: Repair verified derived inputs before prospective publication
        if: ${{ always() && steps.regression-guards.outcome == 'success' && steps.archived-import.outcome != 'failure' && steps.competition-foundations.outcome != 'failure' && (github.event_name == 'schedule' || inputs.apply) && env.DAY_KEY != '' }}
        run: node tools/run-prospective-value-step.mjs repair "$DAY_KEY"
      - name: Publish the prospective unified plan from verified inputs
        if: ${{ always() && steps.regression-guards.outcome == 'success' && steps.archived-import.outcome != 'failure' && steps.competition-foundations.outcome != 'failure' && (github.event_name == 'schedule' || inputs.apply) && env.DAY_KEY != '' }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node tools/run-prospective-value-step.mjs publish "$DAY_KEY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: value-data-alarm-${{ env.DAY_KEY }}
          path: data/value-data-acquisition/
          if-no-files-found: ignore

      - name: Preserve applied acquisition evidence even when later steps failed
        if: ${{ always() && (github.event_name == 'schedule' || inputs.apply) && env.DAY_KEY != '' }}
        uses: ./.github/actions/preserve-history
