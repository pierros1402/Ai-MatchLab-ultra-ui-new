name: TMP Value coverage audit 2026-09-14 V3

on:
  push:
    branches:
      - audit/20260914-value-coverage-current-main-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  value-coverage-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_SHA: f7a42204e676f0508f14aacc84766cb469400617
      DAY_KEY: 2026-09-14
      TARGET_MATCH_ID: cid_ned2_jongpsv_jongaz_20260914
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify exact current-main base and workflow-only branch delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$BASE_SHA")" = "$BASE_SHA"
          DELTA="$(git diff --name-only "$BASE_SHA..HEAD")"
          test "$DELTA" = ".github/workflows/tmp-value-coverage-audit-20260914-v2.yml"
          echo "AUDIT_BASE_VERIFIED=$BASE_SHA"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          (cd engine-v1 && npm ci --no-audit --no-fund)

      - name: Diagnose Value foundations and one frozen pick
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {
            validateHistoryIndexFoundationSync,
            validateModelPriorsFoundationSync
          } from './engine-v1/core/derived-history-foundation.js';
          import {
            loadValueIndexes,
            loadModelPriors,
            evaluateMatchValue
          } from './engine-v1/core/value-engine-v1.js';
          import { currentSeason } from './engine-v1/core/season.js';

          const season = currentSeason();
          const day = process.env.DAY_KEY;
          const targetId = process.env.TARGET_MATCH_ID;
          const historyFoundation = validateHistoryIndexFoundationSync(season);
          const priorsFoundation = validateModelPriorsFoundationSync(season);
          const indexes = await loadValueIndexes(season);
          const priors = await loadModelPriors(season);
          const fixturesPayload = JSON.parse(fs.readFileSync(`data/deploy-snapshots/${day}/fixtures.json`, 'utf8'));
          const fixtures = Array.isArray(fixturesPayload?.fixtures) ? fixturesPayload.fixtures : [];
          const match = fixtures.find(row => String(row?.canonicalId || row?.matchId || '') === targetId);
          if (!match) throw new Error(`target_match_missing:${targetId}`);
          const input = {
            ...match,
            matchId: match.matchId || match.canonicalId,
            dayKey: day,
            kickoff: match.kickoffUtc || match.kickoff
          };
          const result = await evaluateMatchValue(input, {
            season,
            indexes,
            priors,
            returnNullDiagnostics: true
          });
          const diagnostic = {
            ok: true,
            baseSha: process.env.BASE_SHA,
            dayKey: day,
            season,
            targetMatchId: targetId,
            historyFoundation: {
              ok: historyFoundation.ok === true,
              reason: historyFoundation.reason || null,
              artifactSourceSha256: historyFoundation.artifact?.source?.sha256 || null,
              currentSourceSha256: historyFoundation.current?.source?.sha256 || null,
              artifactOutputsSha256: historyFoundation.artifact?.outputs?.sha256 || null,
              currentOutputsSha256: historyFoundation.current?.outputs?.sha256 || null,
              artifactFoundationFingerprint: historyFoundation.artifact?.foundationFingerprint || null,
              currentFoundationFingerprint: historyFoundation.current?.foundationFingerprint || null
            },
            modelPriorsFoundation: {
              ok: priorsFoundation.ok === true,
              reason: priorsFoundation.reason || null,
              artifactSourceSha256: priorsFoundation.artifact?.source?.sha256 || null,
              currentSourceSha256: priorsFoundation.current?.source?.sha256 || null,
              artifactOutputsSha256: priorsFoundation.artifact?.outputs?.sha256 || null,
              currentOutputsSha256: priorsFoundation.current?.outputs?.sha256 || null,
              artifactFoundationFingerprint: priorsFoundation.artifact?.foundationFingerprint || null,
              currentFoundationFingerprint: priorsFoundation.current?.foundationFingerprint || null
            },
            loaded: {
              historyFoundationGate: indexes?.foundationGate || null,
              modelPriorsFoundationGate: priors?.foundationGate || null,
              teamFormSize: Object.keys(indexes?.teamForm || {}).length,
              leagueFormSize: Object.keys(indexes?.leagueForm || {}).length,
              matchupsSize: Object.keys(indexes?.matchups || {}).length,
              teamPriorsSize: Object.keys(priors?.teamPriors || {}).length,
              leaguePriorsSize: Object.keys(priors?.leaguePriors || {}).length,
              matchupPriorsSize: Object.keys(priors?.matchupPriors || {}).length
            },
            target: {
              leagueSlug: match.leagueSlug,
              homeTeam: match.homeTeam,
              awayTeam: match.awayTeam,
              kickoffUtc: match.kickoffUtc || match.kickoff || null,
              valueReturned: Boolean(result && result.__valueNullDiagnostic !== true),
              nullReason: result?.__valueNullDiagnostic === true ? result.reason : null,
              minimumRecentSample: result?.minimumRecentSample || null,
              resultMeta: result?.meta ? {
                priorsUsed: result.meta?.priorsUsed ?? null,
                homePriorSample: result.meta?.priors?.homePriorSample ?? null,
                awayPriorSample: result.meta?.priors?.awayPriorSample ?? null,
                homeRawSample: result.meta?.recency?.homeOverall?.rawSample ?? null,
                awayRawSample: result.meta?.recency?.awayOverall?.rawSample ?? null
              } : null
            }
          };
          fs.writeFileSync('/tmp/value-foundation-diagnostic.json', JSON.stringify(diagnostic, null, 2) + '\n');
          console.log(JSON.stringify(diagnostic, null, 2));
          NODE

      - name: Build Value coverage report read-only
        shell: bash
        run: |
          set -euo pipefail
          node ./engine-v1/jobs/build-value-coverage-report-day.js "$DAY_KEY"

      - name: Build compact audit summary
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const day = process.env.DAY_KEY;
          const reportPath = `data/value/_coverage-reports/${day}.json`;
          const valuePath = `data/deploy-snapshots/${day}/value.json`;
          const auditPath = `data/deploy-snapshots/${day}/value-audit.json`;
          const planAAuditPath = `data/value-plans/${day}/plan-a-audit.json`;
          const manifestPath = `data/deploy-snapshots/${day}/manifest.json`;
          const read = p => JSON.parse(fs.readFileSync(p, 'utf8'));
          const sha = p => crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          const report = read(reportPath);
          const value = read(valuePath);
          const audit = read(auditPath);
          const planAAudit = read(planAAuditPath);
          const manifest = read(manifestPath);
          const target = (report.rows || []).find(row => row.matchId === process.env.TARGET_MATCH_ID) || null;
          const summary = {
            ok: true,
            baseSha: process.env.BASE_SHA,
            dayKey: day,
            reportSha256: sha(reportPath),
            source: report.source,
            counts: report.counts,
            nullByReason: report.breakdown?.nullByReason || {},
            nullByClass: report.breakdown?.nullByClass || {},
            targetCoverageRow: target,
            publishedPlanA: {
              count: Number(value.count || 0),
              matchIds: (value.picks || []).map(p => p.matchId),
              sha256: sha(valuePath)
            },
            diagnosticAudit: {
              fixtureUniverseCount: Number(audit.fixtureUniverse?.count || 0),
              evaluatedFixtureCount: Number(audit.evaluationAccounting?.evaluatedFixtureCount || 0),
              rejectedFixtureCount: Number(audit.evaluationAccounting?.rejectedFixtureCount || 0),
              approved: Number(audit.universe?.approved || 0),
              candidateMarkets: Number(audit.universe?.candidateMarkets || 0),
              unaccountedFixtureCount: Number(audit.evaluationAccounting?.unaccountedFixtureCount || 0),
              byReason: audit.rejections?.byReason || {},
              sha256: sha(auditPath)
            },
            immutablePlanAObservation: {
              count: Number(planAAudit.count || 0),
              observationSignature: planAAudit.observationSignature || null,
              generatedAt: planAAudit.generatedAt || null,
              sha256: sha(planAAuditPath)
            },
            manifest: {
              canonicalFixtureCount: Number(manifest.canonicalFixtureCount || 0),
              publishedFixtureCount: Number(manifest.publicationUniverse?.publishedFixtureCount || 0),
              details: Number(manifest.counts?.details || 0),
              valuePicks: Number(manifest.counts?.valuePicks || 0),
              frozenReleaseSafe: manifest.valueGate?.frozenReleaseSafe === true,
              orphanPickCount: Number(manifest.valueGate?.orphanPickCount || 0)
            }
          };
          fs.writeFileSync('/tmp/value-coverage-summary.json', JSON.stringify(summary, null, 2) + '\n');
          console.log(JSON.stringify(summary, null, 2));
          NODE

      - name: Require runner-only write set
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(git status --short)"
          echo "$STATUS"
          BAD="$(printf '%s\n' "$STATUS" | grep -vE '^\?\? data/value/_coverage-reports/$|^\?\? data/value/_coverage-reports/2026-09-14\.json$|^ M data/value/_coverage-reports/2026-09-14\.json$' || true)"
          if [ -n "$BAD" ]; then
            echo "ERROR: unexpected runner write set"
            echo "$BAD"
            exit 1
          fi

      - name: Upload Value coverage evidence
        uses: actions/upload-artifact@v4
        with:
          name: value-coverage-audit-20260914-v3
          path: |
            data/value/_coverage-reports/2026-09-14.json
            /tmp/value-coverage-summary.json
            /tmp/value-foundation-diagnostic.json
          if-no-files-found: error
