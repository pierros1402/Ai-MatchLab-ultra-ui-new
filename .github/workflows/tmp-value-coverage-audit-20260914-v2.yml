name: TMP Value foundation rebuild simulation 2026-09-14 V4

on:
  push:
    branches:
      - audit/20260914-value-coverage-current-main-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation-rebuild-simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASE_SHA: f7a42204e676f0508f14aacc84766cb469400617
      DAY_KEY: 2026-09-14
      SEASON: 2026-2027
      TARGET_MATCH_ID: cid_ned2_jongpsv_jongaz_20260914
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify exact base and workflow-only branch delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$BASE_SHA")" = "$BASE_SHA"
          DELTA="$(git diff --name-only "$BASE_SHA..HEAD")"
          test "$DELTA" = ".github/workflows/tmp-value-coverage-audit-20260914-v2.yml"
          echo "SIMULATION_BASE_VERIFIED=$BASE_SHA"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          (cd engine-v1 && npm ci --no-audit --no-fund)

      - name: Capture immutable Value hashes and stale foundation state
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import {
            validateHistoryIndexFoundationSync,
            validateModelPriorsFoundationSync
          } from './engine-v1/core/derived-history-foundation.js';
          const sha = p => crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          const files = [
            `data/deploy-snapshots/${process.env.DAY_KEY}/value.json`,
            `data/deploy-snapshots/${process.env.DAY_KEY}/value-audit.json`,
            `data/value-plans/${process.env.DAY_KEY}/plan-a.json`,
            `data/value-plans/${process.env.DAY_KEY}/plan-a-audit.json`
          ];
          const history = validateHistoryIndexFoundationSync(process.env.SEASON);
          const priors = validateModelPriorsFoundationSync(process.env.SEASON);
          const payload = {
            files: Object.fromEntries(files.map(p => [p, sha(p)])),
            historyFoundation: {
              ok: history.ok === true,
              reason: history.reason || null,
              artifactSourceSha256: history.artifact?.source?.sha256 || null,
              currentSourceSha256: history.current?.source?.sha256 || null,
              artifactOutputsSha256: history.artifact?.outputs?.sha256 || null,
              currentOutputsSha256: history.current?.outputs?.sha256 || null
            },
            priorsFoundation: {
              ok: priors.ok === true,
              reason: priors.reason || null,
              artifactSourceSha256: priors.artifact?.source?.sha256 || null,
              currentSourceSha256: priors.current?.source?.sha256 || null,
              artifactOutputsSha256: priors.artifact?.outputs?.sha256 || null,
              currentOutputsSha256: priors.current?.outputs?.sha256 || null
            }
          };
          if (history.ok || priors.ok) throw new Error('expected_stale_foundations_not_observed');
          fs.writeFileSync('/tmp/before.json', JSON.stringify(payload, null, 2) + '\n');
          console.log(JSON.stringify(payload, null, 2));
          NODE

      - name: Rebuild current-season history indexes in runner
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { rebuildIndexesForSeason } from './engine-v1/jobs/rebuild-indexes-for-season.js';
          const result = await rebuildIndexesForSeason(process.env.DAY_KEY);
          console.log(JSON.stringify(result, null, 2));
          if (result?.ok !== true) process.exit(1);
          NODE

      - name: Rebuild model priors in runner
        shell: bash
        run: |
          set -euo pipefail
          node ./engine-v1/jobs/build-model-priors.js "$SEASON"

      - name: Require foundations valid after rebuild
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {
            validateHistoryIndexFoundationSync,
            validateModelPriorsFoundationSync
          } from './engine-v1/core/derived-history-foundation.js';
          const history = validateHistoryIndexFoundationSync(process.env.SEASON);
          const priors = validateModelPriorsFoundationSync(process.env.SEASON);
          const payload = {
            historyFoundation: {
              ok: history.ok === true,
              reason: history.reason || null,
              sourceSha256: history.artifact?.source?.sha256 || null,
              outputsSha256: history.artifact?.outputs?.sha256 || null,
              foundationFingerprint: history.artifact?.foundationFingerprint || null
            },
            priorsFoundation: {
              ok: priors.ok === true,
              reason: priors.reason || null,
              sourceSha256: priors.artifact?.source?.sha256 || null,
              outputsSha256: priors.artifact?.outputs?.sha256 || null,
              foundationFingerprint: priors.artifact?.foundationFingerprint || null
            }
          };
          console.log(JSON.stringify(payload, null, 2));
          fs.writeFileSync('/tmp/after-foundations.json', JSON.stringify(payload, null, 2) + '\n');
          if (!history.ok || !priors.ok) process.exit(1);
          NODE

      - name: Rebuild Value coverage report after foundation heal
        shell: bash
        run: |
          set -euo pipefail
          rm -rf data/value/_coverage-reports
          node ./engine-v1/jobs/build-value-coverage-report-day.js "$DAY_KEY"

      - name: Inspect healed denominator and frozen target pick
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import { evaluateMatchValue, loadValueIndexes, loadModelPriors } from './engine-v1/core/value-engine-v1.js';
          const day = process.env.DAY_KEY;
          const season = process.env.SEASON;
          const targetId = process.env.TARGET_MATCH_ID;
          const sha = p => crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          const before = JSON.parse(fs.readFileSync('/tmp/before.json','utf8'));
          const report = JSON.parse(fs.readFileSync(`data/value/_coverage-reports/${day}.json`,'utf8'));
          const fixturesPayload = JSON.parse(fs.readFileSync(`data/deploy-snapshots/${day}/fixtures.json`,'utf8'));
          const fixtures = Array.isArray(fixturesPayload?.fixtures) ? fixturesPayload.fixtures : [];
          const match = fixtures.find(row => String(row?.canonicalId || row?.matchId || '') === targetId);
          if (!match) throw new Error(`target_match_missing:${targetId}`);
          const indexes = await loadValueIndexes(season);
          const priors = await loadModelPriors(season);
          const result = await evaluateMatchValue({
            ...match,
            matchId: match.matchId || match.canonicalId,
            dayKey: day,
            kickoff: match.kickoffUtc || match.kickoff
          }, { season, indexes, priors, returnNullDiagnostics: true });
          const files = Object.keys(before.files);
          const afterHashes = Object.fromEntries(files.map(p => [p, sha(p)]));
          const immutableParity = files.every(p => before.files[p] === afterHashes[p]);
          const targetCoverageRow = (report.rows || []).find(row => row.matchId === targetId) || null;
          const summary = {
            ok: true,
            baseSha: process.env.BASE_SHA,
            dayKey: day,
            counts: report.counts,
            nullByReason: report.breakdown?.nullByReason || {},
            nullByClass: report.breakdown?.nullByClass || {},
            returnedByLeague: report.breakdown?.returnedByLeague || {},
            targetCoverageRow,
            loadedSizes: {
              teamForm: Object.keys(indexes?.teamForm || {}).length,
              leagueForm: Object.keys(indexes?.leagueForm || {}).length,
              matchups: Object.keys(indexes?.matchups || {}).length,
              teamPriors: Object.keys(priors?.teamPriors || {}).length,
              leaguePriors: Object.keys(priors?.leaguePriors || {}).length,
              matchupPriors: Object.keys(priors?.matchupPriors || {}).length
            },
            targetDirectEvaluation: {
              valueReturned: Boolean(result && result.__valueNullDiagnostic !== true),
              nullReason: result?.__valueNullDiagnostic === true ? result.reason : null,
              minimumRecentSample: result?.minimumRecentSample || null,
              valuePreview: result && result.__valueNullDiagnostic !== true ? {
                confidence: result.confidence ?? null,
                over25Score: result.over25Score ?? null,
                homeWinScore: result.homeWinScore ?? null,
                awayWinScore: result.awayWinScore ?? null
              } : null
            },
            immutableParity,
            beforeHashes: before.files,
            afterHashes
          };
          console.log(JSON.stringify(summary, null, 2));
          fs.writeFileSync('/tmp/healed-value-coverage-summary.json', JSON.stringify(summary, null, 2) + '\n');
          if (!immutableParity) throw new Error('frozen_value_bytes_changed');
          NODE

      - name: Record simulation write set only
        shell: bash
        run: |
          set -euo pipefail
          git status --short | tee /tmp/write-set.txt
          BAD="$(git status --short | sed -E 's/^.. //' | grep -Ev '^(data/history-index/(team-form|league-form|matchups|foundation)/2026-2027\.json|data/model-priors/(2026-2027\.json|foundation/2026-2027\.json)|data/value/_coverage-reports/)' || true)"
          if [ -n "$BAD" ]; then
            echo "ERROR: unexpected simulation write set"
            echo "$BAD"
            exit 1
          fi

      - name: Upload foundation rebuild simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: value-foundation-rebuild-simulation-20260914-v4
          path: |
            /tmp/before.json
            /tmp/after-foundations.json
            /tmp/healed-value-coverage-summary.json
            /tmp/write-set.txt
            data/value/_coverage-reports/2026-09-14.json
          if-no-files-found: error
