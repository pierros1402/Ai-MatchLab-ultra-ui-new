name: History archive fetch guard
on:
  pull_request:
    paths:
      - .github/workflows/history-archive-fetch-guard.yml
      - engine-v1/storage/history-preservation.js
      - engine-v1/storage/history-preservation-fetch-contract.test.js
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          fetch-tags: false
          filter: blob:none
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: node --check engine-v1/storage/history-preservation.js
      - run: node --test engine-v1/storage/history-preservation-fetch-contract.test.js
      - run: test -z "$(git status --porcelain)"
