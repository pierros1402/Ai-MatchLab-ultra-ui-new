name: P0 Stage20 odds and league persistent memory custody audit
on:
  pull_request:
    paths:
      - "tools/audit-stage20-memory-custody.mjs"
      - "tools/audit-stage20-memory-custody.test.mjs"
      - ".github/workflows/p0-stage20-memory-custody.yml"
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/audit-stage20-memory-custody.mjs
            tools/audit-stage20-memory-custody.test.mjs
            tools/audit-daily954-stage20-history.mjs
            engine-v1/storage/odds-memory-db.js
            engine-v1/storage/league-memory-db.js
            engine-v1/core/daily-resume-stage20-admission.mjs
            engine-v1/core/daily-resume-stage20-journal-admission.mjs
            engine-v1/core/season-closure-contract.js
            .github/workflows/p0-stage20-memory-custody.yml
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check source contracts and negative fixtures
        run: |
          node --check tools/audit-stage20-memory-custody.mjs
          node --check tools/audit-stage20-memory-custody.test.mjs
          node --test --test-reporter=tap tools/audit-stage20-memory-custody.test.mjs
      - uses: actions/download-artifact@v4
        with:
          name: history-recovery-45137286904-1
          run-id: 45137286904
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/stage20-memory-original
      - name: Verify original historical 149 memory files and producer source
        shell: bash
        run: |
          set -euo pipefail
          node tools/audit-stage20-memory-custody.mjs \
            "$RUNNER_TEMP/stage20-memory-original" "$GITHUB_WORKSPACE" \
            > "$RUNNER_TEMP/memory-custody.jsonl"
          cat "$RUNNER_TEMP/memory-custody.jsonl"
          node --input-type=module - "$RUNNER_TEMP/memory-custody.jsonl" <<'NODE'
          import fs from "node:fs";
          import assert from "node:assert/strict";
          const raw=fs.readFileSync(process.argv[2],"utf8").trim();
          assert.ok(raw.startsWith("STAGE20_MEMORY_CUSTODY="));
          const r=JSON.parse(raw.slice(raw.indexOf("=")+1));
          assert.equal(r.oddsFiles,50);
          assert.equal(r.leagueFiles,99);
          assert.equal(r.jsonInvalid,0);
          assert.equal(r.unexpectedPaths,0);
          assert.equal(r.fullMemoryBaselineNeededForByteExactReplay,true);
          assert.equal(r.dropMemoryAllowed,false);
          assert.equal(r.crossCommitResumeAuthorized,false);
          assert.equal(r.productionWrites,0);
          NODE
      - name: No data writes or resume authorization
        run: |
          git diff --exit-code HEAD -- .github/workflows/daily-deploy-snapshot.yml data/
          echo "MEMORY_SOURCE_CUSTODY_READ_ONLY_NO_DROP_NO_RESUME_NO_PUBLISH"
