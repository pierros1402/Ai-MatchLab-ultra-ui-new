name: Current-day publication guard

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/current-day-publication-guard.yml"
  schedule:
    # Staggered between the intraday refresh (07/37) and rollover watchdog
    # (17/47). This guard is deliberately cheap when TODAY is healthy.
    - cron: "27,57 * * * *"

permissions:
  contents: read
  actions: write

concurrency:
  # Share the existing rollover watchdog lane so the two recovery controllers
  # cannot race each other into duplicate Daily dispatches.
  group: ai-matchlab-publication-watchdog
  cancel-in-progress: false

jobs:
  current-day-publication-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout current main
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Inspect current-day publication independently
        id: state
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          CALENDAR_DAY="$(TZ=Europe/Athens date +%F)"
          NEXT_DAY="$(TZ=Europe/Athens date -d 'tomorrow' +%F)"
          CURRENT_MANIFEST="data/deploy-snapshots/${CALENDAR_DAY}/manifest.json"
          LATEST_DAY="$(
            node -e '
              const fs=require("fs");
              try {
                const x=JSON.parse(fs.readFileSync("data/deploy-snapshots/latest.json","utf8"));
                process.stdout.write(String(x?.date || ""));
              } catch {}
            '
          )"

          echo "CALENDAR_DAY=${CALENDAR_DAY}"
          echo "NEXT_DAY=${NEXT_DAY}"
          echo "LATEST_DAY=${LATEST_DAY}"
          echo "CURRENT_MANIFEST=${CURRENT_MANIFEST}"

          CURRENT_VALID=false
          if [[ -f "${CURRENT_MANIFEST}" ]]; then
            set +e
            DAY_KEY="${CALENDAR_DAY}" node --input-type=module -e '
              import fs from "node:fs";
              import { validateDeploySnapshotManifest } from "./engine-v1/core/deploy-snapshot-release-contract.js";
              const day=process.env.DAY_KEY;
              const file=`data/deploy-snapshots/${day}/manifest.json`;
              const manifest=JSON.parse(fs.readFileSync(file,"utf8"));
              const check=validateDeploySnapshotManifest(manifest,day);
              if(!check.ok){
                console.error(JSON.stringify({reason:"current_manifest_invalid",day,errors:check.errors}));
                process.exit(2);
              }
              console.log(JSON.stringify({ok:true,day,hash:manifest.hash}));
            '
            CURRENT_RC=$?
            set -e

            if [[ "${CURRENT_RC}" -eq 0 ]]; then
              CURRENT_VALID=true
            fi
          fi

          echo "CURRENT_VALID=${CURRENT_VALID}"

          if [[ "${CURRENT_VALID}" == "true" ]]; then
            echo "MODE=healthy" >> "$GITHUB_ENV"
            echo "mode=healthy" >> "$GITHUB_OUTPUT"
            echo "Athens current-day snapshot ${CALENDAR_DAY} is present and contract-valid."
            exit 0
          fi

          # A pointer beyond tomorrow is not a recoverable rollover state. Do
          # not manufacture a backward publication or hide the corruption.
          if [[ -n "${LATEST_DAY}" && "${LATEST_DAY}" > "${NEXT_DAY}" ]]; then
            echo "ERROR: latest pointer is beyond allowed next-day horizon: ${LATEST_DAY} > ${NEXT_DAY}" >&2
            exit 1
          fi

          # Critical rollover case: if latest already points to TOMORROW, a
          # manual TODAY Daily run would be rejected by the monotonic latest
          # promoter. Re-run TOMORROW instead. The existing Daily D-1 finalize
          # path rebuilds/exports TODAY with updateLatest=false and stages the
          # D-1 snapshot, while latest remains monotonically on TOMORROW.
          if [[ "${LATEST_DAY}" == "${NEXT_DAY}" ]]; then
            RECOVERY_DAY="${NEXT_DAY}"
            RECOVERY_REASON="current_missing_latest_next_day"
          else
            RECOVERY_DAY="${CALENDAR_DAY}"
            RECOVERY_REASON="current_missing_normal_recovery"
          fi

          echo "RECOVERY_DAY=${RECOVERY_DAY}"
          echo "RECOVERY_REASON=${RECOVERY_REASON}"

          RUNS_FILE="$RUNNER_TEMP/daily-runs-current-day-guard.json"
          API_URL="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/daily-deploy-snapshot.yml/runs?branch=main&per_page=20"

          curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o "${RUNS_FILE}" \
            "${API_URL}"

          DECISION="$(
            node -e '
              const fs=require("fs");
              const payload=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
              const runs=Array.isArray(payload?.workflow_runs)?payload.workflow_runs:[];

              const active=runs.some(
                r => String(r?.status || "").toLowerCase() !== "completed"
              );
              if(active){
                process.stdout.write("active");
                process.exit(0);
              }

              const recentManual=runs
                .filter(r => r?.event === "workflow_dispatch")
                .some(r => {
                  const t=Date.parse(String(r?.created_at || ""));
                  return Number.isFinite(t) && Date.now()-t < 20*60*1000;
                });

              process.stdout.write(recentManual ? "cooldown" : "dispatch");
            ' "${RUNS_FILE}"
          )"

          echo "RECOVERY_DECISION=${DECISION}"

          case "${DECISION}" in
            active|cooldown)
              echo "MODE=wait" >> "$GITHUB_ENV"
              echo "mode=wait" >> "$GITHUB_OUTPUT"
              echo "A Daily run is active/recent; current-day guard will not duplicate it."
              ;;
            dispatch)
              echo "MODE=dispatch" >> "$GITHUB_ENV"
              echo "mode=dispatch" >> "$GITHUB_OUTPUT"
              echo "dayKey=${RECOVERY_DAY}" >> "$GITHUB_OUTPUT"
              echo "reason=${RECOVERY_REASON}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "ERROR: unknown recovery decision: ${DECISION}" >&2
              exit 1
              ;;
          esac

      - name: Dispatch controlled full Daily recovery
        if: steps.state.outputs.mode == 'dispatch'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DAY_KEY: ${{ steps.state.outputs.dayKey }}
          RECOVERY_REASON: ${{ steps.state.outputs.reason }}
        run: |
          set -euo pipefail

          PAYLOAD="$(
            DAY_KEY="${DAY_KEY}" node -e '
              process.stdout.write(JSON.stringify({
                ref:"main",
                inputs:{
                  dayKey:process.env.DAY_KEY,
                  triggerRender:"false"
                }
              }));
            '
          )"

          curl -fsS \
            -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/daily-deploy-snapshot.yml/dispatches" \
            --data "${PAYLOAD}"

          echo "CURRENT_DAY_RECOVERY_DISPATCHED=true"
          echo "CURRENT_DAY_RECOVERY_DAY=${DAY_KEY}"
          echo "CURRENT_DAY_RECOVERY_REASON=${RECOVERY_REASON}"

      - name: Guard summary
        if: always()
        shell: bash
        run: |
          echo "CURRENT_DAY_PUBLICATION_GUARD_MODE=${MODE:-unknown}"
          echo "Athens day: $(TZ=Europe/Athens date +%F)"
