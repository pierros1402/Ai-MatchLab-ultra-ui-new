name: P0 Stage20 research cache writer envelope source parity (read-only)
on:
  pull_request:
    paths:
      - "tools/audit-stage20-research-cache-writer-envelopes.mjs"
      - "tools/audit-stage20-research-cache-writer-envelopes.test.mjs"
      - ".github/workflows/p0-stage20-research-cache-writer-envelopes.yml"
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            tools/audit-stage20-research-cache-writer-envelopes.mjs
            tools/audit-stage20-research-cache-writer-envelopes.test.mjs
            tools/audit-daily954-stage20-history.mjs
            engine-v1/ai-match-intelligence/research-cache.js
            engine-v1/core/daily-resume-stage20-admission.mjs
            engine-v1/core/daily-resume-stage20-journal-admission.mjs
            engine-v1/core/season-closure-contract.js
            .github/workflows/p0-stage20-research-cache-writer-envelopes.yml
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Syntax and seven strict cache envelope negatives
        run: |
          node --check tools/audit-stage20-research-cache-writer-envelopes.mjs
          node --check tools/audit-stage20-research-cache-writer-envelopes.test.mjs
          node --test --test-reporter=tap tools/audit-stage20-research-cache-writer-envelopes.test.mjs
      - name: Prove exact producer/current research cache writer Git blob parity
        shell: bash
        run: |
          set -euo pipefail
          ORIGINAL=33eaa635a8745e75fc0a6075a3594f4cd86d3b32
          FILE=engine-v1/ai-match-intelligence/research-cache.js
          git fetch --no-tags --depth=1 origin "$ORIGINAL"
          EXPECTED=af25594346eee63252d9e42e74776f516a3b7f4f
          test "$(git rev-parse "$ORIGINAL:$FILE")" = "$EXPECTED"
          test "$(git rev-parse "HEAD:$FILE")" = "$EXPECTED"
          test "$(git hash-object "$FILE")" = "$EXPECTED"
          echo "RESEARCH_CACHE_WRITER_PRODUCER_CONSUMER_BLOB_PARITY=PASS"
      - uses: actions/download-artifact@v4
        with:
          name: history-recovery-45137286904-1
          run-id: 45137286904
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/research-writer-original
      - name: Validate original 349 cache envelopes against exact source writer
        shell: bash
        run: |
          set -euo pipefail
          node tools/audit-stage20-research-cache-writer-envelopes.mjs \
            "$RUNNER_TEMP/research-writer-original" > "$RUNNER_TEMP/research-writer-summary.jsonl"
          cat "$RUNNER_TEMP/research-writer-summary.jsonl"
          node --input-type=module - "$RUNNER_TEMP/research-writer-summary.jsonl" <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const raw=fs.readFileSync(process.argv[2],"utf8").trim();
          assert.ok(raw.startsWith("STAGE20_RESEARCH_CACHE_ENVELOPES="));
          const x=JSON.parse(raw.slice(raw.indexOf("=")+1));
          assert.equal(x.originalFiles,9083);
          assert.equal(x.researchCacheFiles,349);
          assert.equal(x.envelopeValid+x.invalid,349);
          assert.equal(x.writerGitBlob,"af25594346eee63252d9e42e74776f516a3b7f4f");
          assert.equal(x.providerResponseReproducibilityProven,false);
          assert.equal(x.omissionAuthorized,false);
          assert.equal(x.resumeAuthorized,false);
          assert.equal(x.productionWrites,0);
          NODE
      - name: No changes to Daily, code producer or production data
        run: |
          git diff --exit-code HEAD -- data/ .github/workflows/daily-deploy-snapshot.yml
          echo "RESEARCH_CACHE_WRITER_ENVELOPE_AUDIT_ONLY_NO_OMISSION_NO_RESUME"
