name: TMP current-day publication recovery 2026-09-13

on:
  push:
    branches:
      - ops/20260913-current-day-publication-recovery
    paths:
      - ".github/workflows/tmp-current-day-publication-recovery-20260913.yml"

permissions:
  contents: read
  actions: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Inspect and dispatch only if needed
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          CALENDAR_DAY="$(TZ=Europe/Athens date +%F)"
          CURRENT_MANIFEST="data/deploy-snapshots/${CALENDAR_DAY}/manifest.json"
          LATEST_DAY="$(node -e 'try{const x=require("./data/deploy-snapshots/latest.json");process.stdout.write(String(x.date||""));}catch{}')"

          echo "CALENDAR_DAY=${CALENDAR_DAY}"
          echo "LATEST_DAY=${LATEST_DAY}"
          echo "CURRENT_MANIFEST=${CURRENT_MANIFEST}"

          CURRENT_VALID=false
          if [[ -f "${CURRENT_MANIFEST}" ]]; then
            set +e
            DAY_KEY="${CALENDAR_DAY}" node --input-type=module -e '
              import fs from "node:fs";
              import { validateDeploySnapshotManifest } from "./engine-v1/core/deploy-snapshot-release-contract.js";
              const day=process.env.DAY_KEY;
              const file=`data/deploy-snapshots/${day}/manifest.json`;
              const manifest=JSON.parse(fs.readFileSync(file,"utf8"));
              const check=validateDeploySnapshotManifest(manifest,day);
              if(!check.ok){console.error(JSON.stringify(check));process.exit(2)}
              console.log(JSON.stringify({ok:true,day,hash:manifest.hash}));
            '
            RC=$?
            set -e
            [[ "$RC" -eq 0 ]] && CURRENT_VALID=true
          fi

          if [[ "$CURRENT_VALID" == "true" ]]; then
            echo "RECOVERY_MODE=healthy"
            exit 0
          fi

          RUNS_FILE="$RUNNER_TEMP/daily-runs.json"
          curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o "${RUNS_FILE}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/daily-deploy-snapshot.yml/runs?branch=main&per_page=20"

          DECISION="$(node -e '
            const fs=require("fs");
            const p=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
            const runs=Array.isArray(p.workflow_runs)?p.workflow_runs:[];
            const active=runs.some(r=>String(r.status||"").toLowerCase()!=="completed");
            if(active){process.stdout.write("active");process.exit(0)}
            const recent=runs.filter(r=>r.event==="workflow_dispatch").some(r=>{
              const t=Date.parse(String(r.created_at||""));
              return Number.isFinite(t) && Date.now()-t < 20*60*1000;
            });
            process.stdout.write(recent?"cooldown":"dispatch");
          ' "${RUNS_FILE}")"

          echo "RECOVERY_DECISION=${DECISION}"

          if [[ "$DECISION" == "active" || "$DECISION" == "cooldown" ]]; then
            echo "RECOVERY_MODE=wait"
            exit 0
          fi

          if [[ "$DECISION" != "dispatch" ]]; then
            echo "ERROR: unexpected decision ${DECISION}" >&2
            exit 1
          fi

          PAYLOAD="$(DAY_KEY="${CALENDAR_DAY}" node -e 'process.stdout.write(JSON.stringify({ref:"main",inputs:{dayKey:process.env.DAY_KEY,triggerRender:"false"}}))')"

          curl -fsS \
            -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/daily-deploy-snapshot.yml/dispatches" \
            --data "${PAYLOAD}"

          echo "RECOVERY_MODE=dispatch"
          echo "RECOVERY_DAY=${CALENDAR_DAY}"
