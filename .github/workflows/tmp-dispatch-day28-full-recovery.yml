name: TMP Dispatch Day28 full recovery

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-dispatch-day28-full-recovery.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch exact Day28 daily recovery
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD='{"ref":"main","inputs":{"dayKey":"2026-08-28","triggerRender":"false","recoverPlanAObservationSignature":""}}'
          CODE="$(curl -sS -o /tmp/dispatch-response.txt -w '%{http_code}' \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPO}/actions/workflows/270329104/dispatches" \
            -d "$PAYLOAD")"
          cat /tmp/dispatch-response.txt || true
          echo "DISPATCH_HTTP_CODE=$CODE"
          test "$CODE" = "204"
          echo 'DAY28_FULL_RECOVERY_DISPATCH=PASS'
