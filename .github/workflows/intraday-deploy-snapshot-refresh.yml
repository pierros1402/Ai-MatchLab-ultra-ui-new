name: Intraday deploy snapshot refresh

on:
  workflow_dispatch:
    inputs:
      dayKey:
        description: "Day key to refresh, YYYY-MM-DD. Leave empty for Europe/Athens today."
        required: false
        default: ""
  schedule:
    # One continuous schedule covers overnight fixtures too. A single non-
    # cancelling writer prevents a newer tick from killing an active publish.
    - cron: "*/5 * * * *"
permissions:
  contents: write
  issues: write
  actions: read

jobs:
  admission:
    runs-on: ubuntu-latest
    outputs:
      allow_writer: ${{ steps.daily-priority.outputs.allow_writer }}
    steps:
      - name: Protect Daily writer priority
        id: daily-priority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API_URL="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/270329104/runs?branch=main&per_page=20"
          RESPONSE_FILE="$RUNNER_TEMP/daily-writer-priority.json"

          if ! curl -fsSL \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o "$RESPONSE_FILE" \
            "$API_URL"; then
            echo "Daily writer lookup failed; failing closed and skipping lower-priority writer."
            echo "allow_writer=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ACTIVE_COUNT="$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1], encoding="utf-8")); print(sum(1 for r in d.get("workflow_runs", []) if str(r.get("status", "")).lower() != "completed"))' "$RESPONSE_FILE" 2>/dev/null || true)"

          if ! [[ "$ACTIVE_COUNT" =~ ^[0-9]+$ ]]; then
            echo "Daily writer response could not be parsed; failing closed."
            echo "allow_writer=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$ACTIVE_COUNT" -gt 0 ]; then
            echo "Daily publication is queued/in progress; lower-priority writer will not enter the shared queue."
            echo "allow_writer=false" >> "$GITHUB_OUTPUT"
          else
            echo "No active Daily publication; lower-priority writer may enter the shared queue."
            echo "allow_writer=true" >> "$GITHUB_OUTPUT"
          fi

  refresh-and-commit-snapshot:
    needs: admission
    if: needs.admission.outputs.allow_writer == 'true'
    concurrency:
      group: ai-matchlab-data-writer
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Resolve day key
        id: day
        shell: bash
        env:
          INPUT_DAY_KEY: ${{ inputs.dayKey }}
        run: |
          set -euo pipefail

          RAW_DAY_KEY="${INPUT_DAY_KEY:-}"
          DAY_KEY="$(printf "%s" "$RAW_DAY_KEY" | grep -Eo '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -n 1 || true)"

          if [ -z "$DAY_KEY" ]; then
            DAY_KEY="$(TZ=Europe/Athens date +%F)"
          fi

          if ! printf "%s" "$DAY_KEY" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "ERROR: invalid DAY_KEY=$DAY_KEY"
            exit 1
          fi

          echo "skipBuild=false" >> "$GITHUB_OUTPUT"
          echo "SKIP_BUILD=false" >> "$GITHUB_ENV"
          echo "dayKey=$DAY_KEY" >> "$GITHUB_OUTPUT"
          echo "DAY_KEY=$DAY_KEY" >> "$GITHUB_ENV"
          echo "Resolved DAY_KEY=$DAY_KEY"

      - name: Install root dependencies
        if: env.SKIP_BUILD != 'true'
        run: npm ci --no-audit --no-fund

      - name: Install engine dependencies
        if: env.SKIP_BUILD != 'true'
        working-directory: engine-v1
        run: npm ci --no-audit --no-fund

      # Truth is checkpointed BEFORE any Value/snapshot gate. A later Value
      # failure must never discard provider-verified LIVE/FT changes collected
      # by this run (2026-08-07 regression: the runner saw truth, then Value
      # self-heal failed and the canonical status changes disappeared with it).
      - name: Refresh authoritative intraday truth checkpoint
        if: env.SKIP_BUILD != 'true'
        run: node ./engine-v1/jobs/run-live-status-refresh-day.js "$DAY_KEY" --append-new-fixtures --include-all-open-states

      - name: Persist authoritative intraday truth checkpoint
        if: env.SKIP_BUILD != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git restore --staged . || true

          if [ -d "data/canonical-fixtures/${DAY_KEY}" ]; then
            git add "data/canonical-fixtures/${DAY_KEY}/"
          fi

          STAGED="$(git diff --cached --name-only || true)"
          if [ -n "$STAGED" ]; then
            BAD="$(printf "%s\n" "$STAGED" | grep -Ev "^data/canonical-fixtures/${DAY_KEY}/[^/]+\\.json$" || true)"
            if [ -n "$BAD" ]; then
              echo "ERROR: unexpected intraday truth checkpoint paths:"
              echo "$BAD"
              exit 1
            fi

            node engine-v1/jobs/guard-staged-data-boundary.js \
              --label=intraday-authoritative-truth-checkpoint \
              --dayKey="${DAY_KEY}" \
              --allow="^data/canonical-fixtures/${DAY_KEY}/[^/]+\\.json$"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Persist intraday canonical truth for ${DAY_KEY}"
            bash tools/git-push-rebase-retry.sh
          else
            echo "No authoritative intraday truth changes to checkpoint."
          fi

      # Verified current-day settlement is mutable result truth, not a model
      # rebuild. Persist and publish it before downstream Value/foundation
      # gates can strand an already-known WIN/LOSS/VOID/final score.
      - name: Checkpoint current Value settlement independently
        if: env.SKIP_BUILD != 'true'
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "data/deploy-snapshots/${DAY_KEY}/fixtures.json" ]; then
            node ./engine-v1/jobs/export-verified-final-results-day.js \
              --date="${DAY_KEY}" \
              --write \
              --all-fixtures
          fi

          if [ -f "data/deploy-snapshots/${DAY_KEY}/value.json" ]; then
            node ./engine-v1/jobs/export-verified-final-results-day.js \
              --date="${DAY_KEY}" \
              --write
          fi

          for PLAN_FILE in plan-a2.json plan-b.json plan-b2.json; do
            PLAN_PATH="data/value-plans/${DAY_KEY}/${PLAN_FILE}"

            if [ -f "$PLAN_PATH" ]; then
              node ./engine-v1/jobs/export-verified-final-results-day.js \
                --date="${DAY_KEY}" \
                --write \
                --value-path="$PLAN_PATH"
            fi
          done

          if [ ! -f "data/value-comparison/${DAY_KEY}.json" ]; then
            echo "No Value comparison for ${DAY_KEY}; no settlement checkpoint required."
            exit 0
          fi

          node ./engine-v1/jobs/build-value-plan-comparison-day.js \
            --date="${DAY_KEY}" \
            --write

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git restore --staged . || true

          test -d "data/final-results/${DAY_KEY}" && \
            git add "data/final-results/${DAY_KEY}/"

          test -f "data/final-result-conflicts/${DAY_KEY}.json" && \
            git add "data/final-result-conflicts/${DAY_KEY}.json"

          git add "data/value-comparison/${DAY_KEY}.json"

          STAGED="$(git diff --cached --name-only || true)"

          if [ -n "$STAGED" ]; then
            node engine-v1/jobs/guard-staged-data-boundary.js \
              --label=current-value-settlement-checkpoint \
              --dayKey="${DAY_KEY}" \
              --allow="^(data/final-results/${DAY_KEY}/|data/final-result-conflicts/${DAY_KEY}\.json$|data/value-comparison/${DAY_KEY}\.json$)"
          fi

          if git diff --cached --quiet; then
            echo "No current Value settlement changes to commit."
            exit 0
          fi

          git commit -m "Persist current Value settlement checkpoint for ${DAY_KEY}"
          bash tools/git-push-rebase-retry.sh

          VALUE_SETTLEMENT_PUBLISHED_REF="$(git rev-parse HEAD)"
          echo "VALUE_SETTLEMENT_PUBLISHED_REF=${VALUE_SETTLEMENT_PUBLISHED_REF}" >> "$GITHUB_ENV"
          echo "VALUE_SETTLEMENT_PUSHED=true" >> "$GITHUB_ENV"

      - name: Promote current Value settlement comparison
        if: env.SKIP_BUILD != 'true' && env.VALUE_SETTLEMENT_PUSHED == 'true'
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          node tools/sync-public-value-comparison.mjs \
            "${DAY_KEY}" \
            "${VALUE_SETTLEMENT_PUBLISHED_REF}"

      - name: Run intraday snapshot refresh
        if: env.SKIP_BUILD != 'true'
        run: node ./engine-v1/jobs/run-intraday-snapshot-refresh.js "$DAY_KEY" --chunks=0 --chunk-size=12 --days-back=1 --days-forward=14 --no-rebuild-details

      # Public score/status truth is committed and promoted before any Value
      # self-heal or settlement gate. A Value failure can no longer strand an
      # already-observed LIVE/FT/non-played transition inside the runner.
      - name: Commit independent LIVE/FT snapshot checkpoint
        if: env.SKIP_BUILD != 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore --staged . || true

          CANONICAL_STATUS_FILES="$(git diff --name-only --diff-filter=M -- "data/canonical-fixtures/${DAY_KEY}/" || true)"
          if [ -n "$CANONICAL_STATUS_FILES" ]; then
            while IFS= read -r canonical_file; do
              [ -n "$canonical_file" ] && git add -- "$canonical_file"
            done <<< "$CANONICAL_STATUS_FILES"
          fi

          test -d "data/deploy-snapshots/${DAY_KEY}" && git add "data/deploy-snapshots/${DAY_KEY}/"
          test -e "data/deploy-snapshots/latest.json" && git add "data/deploy-snapshots/latest.json"

          MATERIAL="$(
            node - <<'NODE'
          const fs = require("fs");
          const { execFileSync } = require("child_process");

          const day = process.env.DAY_KEY;
          const fixtureFile = `data/deploy-snapshots/${day}/fixtures.json`;
          const manifestFile = `data/deploy-snapshots/${day}/manifest.json`;

          function readHead(file) {
            try {
              return JSON.parse(
                execFileSync("git", ["show", `HEAD:${file}`], {
                  encoding: "utf8"
                })
              );
            } catch {
              return null;
            }
          }

          function readFile(file) {
            try {
              return JSON.parse(fs.readFileSync(file, "utf8"));
            } catch {
              return null;
            }
          }

          function rowsOf(payload) {
            if (Array.isArray(payload)) return payload;
            for (const key of ["fixtures", "matches", "items"]) {
              if (Array.isArray(payload?.[key])) return payload[key];
            }
            return [];
          }

          function idOf(row) {
            return String(
              row?.canonicalId ||
              row?.matchId ||
              row?.id ||
              row?.fixtureId ||
              ""
            ).trim();
          }

          function preLike(row) {
            return /\b(PRE|SCHEDULED|STATUS_SCHEDULED|NOT_STARTED)\b/u.test(
              [row?.status, row?.statusType, row?.rawStatus, row?.phase]
                .map(value => String(value || "").toUpperCase())
                .join(" ")
            );
          }

          function score(row, primary, fallback) {
            const value = row?.[primary] ?? row?.[fallback] ?? null;
            if (value === null && preLike(row)) return 0;
            const numeric = Number(value);
            return Number.isFinite(numeric) ? numeric : value;
          }

          function projection(payload) {
            return rowsOf(payload)
              .map(row => ({
                matchId: idOf(row),
                status: row?.status ?? null,
                statusType: row?.statusType ?? null,
                rawStatus: row?.rawStatus ?? null,
                phase: row?.phase ?? null,
                minute: row?.minute ?? null,
                scoreHome: score(row, "scoreHome", "homeScore"),
                scoreAway: score(row, "scoreAway", "awayScore"),
                live: row?.live ?? null,
                isLive: row?.isLive ?? null,
                staleLive: row?.staleLive ?? null,
                kickoffUtc:
                  row?.kickoffUtc ??
                  row?.date ??
                  row?.startTime ??
                  row?.startUtc ??
                  null
              }))
              .filter(row => row.matchId)
              .sort((left, right) => left.matchId.localeCompare(right.matchId));
          }

          function publicationUniverseProjection(payload) {
            const publication = payload?.publicationUniverse || {};

            function ids(values) {
              return [
                ...new Set(
                  (Array.isArray(values) ? values : [])
                    .map(value => String(value || "").trim())
                    .filter(Boolean)
                )
              ].sort();
            }

            return {
              mode: String(publication.mode || ""),
              currentFixtureCount: Number(publication.currentFixtureCount ?? 0),
              publishedFixtureCount: Number(publication.publishedFixtureCount ?? 0),
              deferredFixtureCount: Number(publication.deferredFixtureCount ?? 0),
              deferredFixtureIds: ids(publication.deferredFixtureIds),
              authoritativelyRemovedFixtureCount:
                Number(publication.authoritativelyRemovedFixtureCount ?? 0),
              authoritativelyRemovedFixtureIds:
                ids(publication.authoritativelyRemovedFixtureIds),
              legacyPrunedFixtureCount:
                Number(publication.legacyPrunedFixtureCount ?? 0),
              legacyPrunedFixtureIds:
                ids(publication.legacyPrunedFixtureIds)
            };
          }

          const fixtureMaterial =
            JSON.stringify(projection(readHead(fixtureFile))) !==
            JSON.stringify(projection(readFile(fixtureFile)));

          const publicationUniverseMaterial =
            JSON.stringify(
              publicationUniverseProjection(readHead(manifestFile))
            ) !==
            JSON.stringify(
              publicationUniverseProjection(readFile(manifestFile))
            );

          const staged = execFileSync(
            "git",
            ["diff", "--cached", "--name-only"],
            { encoding: "utf8" }
          )
            .split(/\r?\n/u)
            .map(value => value.trim())
            .filter(Boolean);

          const canonicalMaterial = staged.some(file =>
            file.startsWith(`data/canonical-fixtures/${day}/`)
          );
          const detailMaterial = staged.some(file =>
            file.startsWith(`data/deploy-snapshots/${day}/details/`)
          );

          process.stdout.write(
            fixtureMaterial ||
            publicationUniverseMaterial ||
            canonicalMaterial ||
            detailMaterial
              ? "true"
              : "false"
          );
          NODE
          )"

          if [ "$MATERIAL" != "true" ]; then
            echo "No material LIVE/FT/non-played snapshot change."
            git restore --staged -- "data/deploy-snapshots/${DAY_KEY}" "data/deploy-snapshots/latest.json" 2>/dev/null || true
            git restore -- "data/deploy-snapshots/${DAY_KEY}" "data/deploy-snapshots/latest.json" 2>/dev/null || true
            exit 0
          fi

          STAGED="$(git diff --cached --name-only || true)"
          if [ -n "$STAGED" ]; then
            node engine-v1/jobs/guard-staged-data-boundary.js --label=intraday-public-truth-checkpoint --dayKey="${DAY_KEY}" --allow="^(data/canonical-fixtures/${DAY_KEY}/[^/]+\\.json$|data/deploy-snapshots/latest\\.json$|data/deploy-snapshots/${DAY_KEY}/)"
          fi

          if git diff --cached --quiet; then
            echo "No LIVE/FT checkpoint files to commit."
            exit 0
          fi

          git commit -m "Publish intraday score/status truth for ${DAY_KEY}"
          bash tools/git-push-rebase-retry.sh

          TRUTH_PUBLISHED_REF="$(git rev-parse HEAD)"
          echo "TRUTH_PUBLISHED_REF=${TRUTH_PUBLISHED_REF}" >> "$GITHUB_ENV"
          echo "TRUTH_SNAPSHOT_PUSHED=true" >> "$GITHUB_ENV"

      - name: Promote independent LIVE/FT public checkpoint
        if: env.SKIP_BUILD != 'true' && env.TRUTH_SNAPSHOT_PUSHED == 'true'
        continue-on-error: true
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          bash tools/sync-public-snapshot.sh "${DAY_KEY}" "${TRUTH_PUBLISHED_REF}"

      - name: Self-heal stale or missing value artifacts
        if: env.SKIP_BUILD != 'true'
        shell: bash
        run: |
          set -euo pipefail

          node ./engine-v1/jobs/verify-artifact-freshness-day.js --date="$DAY_KEY"

          if node - <<'NODE'
          const fs = require("fs");

          const day = process.env.DAY_KEY;

          const files = {
            freshness: `data/deploy-snapshots/${day}/freshness-report.json`,
            manifest: `data/deploy-snapshots/${day}/manifest.json`,
            fixtures: `data/deploy-snapshots/${day}/fixtures.json`,
            oddsSnapshot: `data/deploy-snapshots/${day}/odds.json`,
            localValue: `data/value/${day}.json`,
            snapshotValue: `data/deploy-snapshots/${day}/value.json`,
            planBAudit: `data/value-plans/${day}/plan-b-audit.json`,
            planB2Audit: `data/value-plans/${day}/plan-b2-audit.json`
          };

          function readJsonSafe(file) {
            try {
              if (!fs.existsSync(file)) return null;
              return JSON.parse(fs.readFileSync(file, "utf8"));
            } catch {
              return null;
            }
          }

          function isValidValueArtifact(payload) {
            return Boolean(
              payload &&
              typeof payload === "object" &&
              payload.ok !== false &&
              Array.isArray(payload.picks) &&
              String(payload.source || "") !== "missing_local_value_file"
            );
          }

          const report = readJsonSafe(files.freshness) || {};
          const manifest = readJsonSafe(files.manifest);
          const fixtures = readJsonSafe(files.fixtures);
          const oddsSnapshot = readJsonSafe(files.oddsSnapshot);
          const localValue = readJsonSafe(files.localValue);
          const snapshotValue = readJsonSafe(files.snapshotValue);
          const planBAudit = readJsonSafe(files.planBAudit);
          const planB2Audit = readJsonSafe(files.planB2Audit);

          const valueKinds = new Set([
            "snapshot_value",
            "snapshot_value_audit",
            "plan_b",
            "plan_b_audit",
            "value_plan_comparison"
          ]);

          const staleValueArtifacts = Array.isArray(
            report.staleDerivedArtifacts
          )
            ? report.staleDerivedArtifacts.filter(entry =>
                valueKinds.has(String(entry?.kind || ""))
              )
            : [];

          const valueBaselineIssues = [];

          if (!isValidValueArtifact(localValue)) {
            valueBaselineIssues.push({
              kind: "local_value_missing_or_invalid",
              artifact: files.localValue,
              source: localValue?.source || null
            });
          }

          if (!isValidValueArtifact(snapshotValue)) {
            valueBaselineIssues.push({
              kind: "snapshot_value_missing_or_invalid",
              artifact: files.snapshotValue,
              source: snapshotValue?.source || null
            });
          }

          if (manifest?.valueGate?.ok !== true) {
            valueBaselineIssues.push({
              kind: "manifest_value_gate_failed",
              artifact: files.manifest,
              valueGate: manifest?.valueGate || null
            });
          }

          const oddsAssessmentRows = (Array.isArray(oddsSnapshot?.matches)
            ? oddsSnapshot.matches
            : []
          ).filter(row =>
            row?.aiAssessment?.markets && Object.keys(row.aiAssessment.markets).length > 0
          ).length;

          for (const [plan, audit, artifact] of [
            ["B", planBAudit, files.planBAudit],
            ["B2", planB2Audit, files.planB2Audit]
          ]) {
            const auditAssessmentRows = Number(audit?.membership?.assessmentRows ?? 0);
            const joinedMatches = Number(audit?.membership?.joinedMatches ?? 0);

            if (
              oddsAssessmentRows > auditAssessmentRows ||
              (oddsAssessmentRows > 0 && joinedMatches <= 0)
            ) {
              valueBaselineIssues.push({
                kind: "persistent_model_assessment_input_advanced",
                plan,
                artifact,
                oddsAssessmentRows,
                auditAssessmentRows,
                joinedMatches
              });
            }
          }

          const fixtureCount = Number(
            fixtures?.count ??
            manifest?.counts?.fixtures ??
            0
          );

          const shouldRefresh =
            fixtureCount > 0 &&
            (
              staleValueArtifacts.length > 0 ||
              valueBaselineIssues.length > 0
            );

          console.log(JSON.stringify({
            fixtureCount,
            staleValueArtifactCount: staleValueArtifacts.length,
            staleValueArtifacts: staleValueArtifacts.map(entry => ({
              kind: entry.kind,
              artifact: entry.artifact,
              staleReason: entry.staleReason
            })),
            valueBaselineIssueCount: valueBaselineIssues.length,
            valueBaselineIssues,
            shouldRefresh
          }, null, 2));

          process.exit(shouldRefresh ? 0 : 1);
          NODE
          then
            echo "Value artifacts are stale, missing, or invalid — running canonical-only targeted refresh."
            node ./engine-v1/jobs/refresh-value-artifacts-day.js --date="$DAY_KEY"
          else
            echo "No publishable fixture-backed Value repair is required — skipping targeted refresh."
          fi

      - name: Enforce Value Plans B/B2 assessment input
        if: env.SKIP_BUILD != 'true'
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require("fs");
          const day = process.env.DAY_KEY;

          const plans = [
            {
              label: "B",
              planId: "plan-b",
              outputMode: "plan-b-observation",
              planFile: `data/value-plans/${day}/plan-b.json`,
              auditFile: `data/value-plans/${day}/plan-b-audit.json`
            },
            {
              label: "B2",
              planId: "plan-b2",
              outputMode: "plan-b2-observation",
              planFile: `data/value-plans/${day}/plan-b2.json`,
              auditFile: `data/value-plans/${day}/plan-b2-audit.json`
            }
          ];

          for (const spec of plans) {
            if (!fs.existsSync(spec.planFile)) {
              throw new Error(`Plan ${spec.label} observation missing: ${spec.planFile}`);
            }

            if (!fs.existsSync(spec.auditFile)) {
              throw new Error(`Plan ${spec.label} assessment audit missing: ${spec.auditFile}`);
            }

            const plan = JSON.parse(fs.readFileSync(spec.planFile, "utf8"));
            const audit = JSON.parse(fs.readFileSync(spec.auditFile, "utf8"));

            const membership = audit?.membership || {};
            const auditSource = audit?.sourceContract || {};
            const planSource = plan?.sourceContract || {};
            const auditRecovery = audit?.recoveryContract || {};
            const planRecovery = plan?.recoveryContract || {};

            const canonicalFixtures = Number(
              membership.canonicalFixtures ??
              membership.fixtureUniverse?.count ??
              membership.evaluatedFixtureCount ??
              0
            );

            const assessmentRows = Number(membership.assessmentRows ?? 0);
            const joinedMatches = Number(membership.joinedMatches ?? 0);

            const auditUniverse =
              membership.fixtureUniverse ??
              auditSource.fixtureUniverse ??
              {};

            const planUniverse = planSource.fixtureUniverse ?? {};

            const explicitZeroPickRecovery =
              plan?.ok === true &&
              audit?.ok === true &&
              plan?.date === day &&
              audit?.date === day &&
              plan?.planId === spec.planId &&
              audit?.planId === spec.planId &&
              plan?.outputMode === spec.outputMode &&
              audit?.outputMode === spec.outputMode &&
              plan?.source === "historical_missing_observation_recovery_sentinel" &&
              audit?.source === "historical_missing_observation_recovery_sentinel" &&
              Number(plan?.count) === 0 &&
              Array.isArray(plan?.picks) &&
              plan.picks.length === 0 &&
              planSource.recoveryObservation === true &&
              auditSource.recoveryObservation === true &&
              planSource.retrospectiveModelOutputUsed === false &&
              auditSource.retrospectiveModelOutputUsed === false &&
              planRecovery.authenticPayloadRecovered === false &&
              auditRecovery.authenticPayloadRecovered === false &&
              planRecovery.retrospectivePredictionGeneration === false &&
              auditRecovery.retrospectivePredictionGeneration === false &&
              planRecovery.inventedHistoricalPicks === false &&
              auditRecovery.inventedHistoricalPicks === false &&
              Number(membership.outputPicks ?? 0) === 0 &&
              Number(membership.outputValidPicks ?? 0) === 0 &&
              Number(membership.outputOrphanPicks ?? 0) === 0 &&
              Number(membership.outputAmbiguousPicks ?? 0) === 0 &&
              canonicalFixtures > 0 &&
              Number(planUniverse.count ?? -1) === canonicalFixtures &&
              Number(auditUniverse.count ?? -1) === canonicalFixtures &&
              typeof planUniverse.hash === "string" &&
              planUniverse.hash.length > 0 &&
              planUniverse.hash === auditUniverse.hash;

            console.log(JSON.stringify({
              plan: spec.label,
              canonicalFixtures,
              assessmentRows,
              joinedMatches,
              explicitZeroPickRecovery
            }));

            if (explicitZeroPickRecovery) {
              if (assessmentRows !== 0 || joinedMatches !== 0) {
                throw new Error(
                  `Plan ${spec.label} recovery sentinel must not claim assessment/join rows`
                );
              }

              console.log(
                `Plan ${spec.label}: accepted explicit zero-pick recovery sentinel; retrospective model output remains forbidden.`
              );
              continue;
            }

            if (canonicalFixtures > 0 && assessmentRows <= 0) {
              throw new Error(
                `Plan ${spec.label} has ${canonicalFixtures} fixtures but zero aiAssessment rows`
              );
            }

            if (assessmentRows > 0 && joinedMatches <= 0) {
              throw new Error(
                `Plan ${spec.label} has aiAssessment rows but zero canonical identity joins`
              );
            }
          }
          NODE

      # Persist the diagnostic even when a prior intraday step failed. This is
      # intentionally health-only; broken/partial snapshot artifacts are never
      # staged by this failure path.
      - name: Persist intraday failure System Health
        if: failure() && env.SKIP_BUILD != 'true'
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -u
          node ./engine-v1/jobs/build-foundation-integrity-report.js --date="$DAY_KEY" || true
          node ./engine-v1/jobs/build-day-report.js --date="$DAY_KEY" || true
          node ./engine-v1/jobs/build-system-health-alerts-day.js --date="$DAY_KEY" || true
          git restore --staged . || true
          test -f "data/foundation-integrity/${DAY_KEY}.json" && git add "data/foundation-integrity/${DAY_KEY}.json"
          test -f "data/foundation-integrity/latest.json" && git add "data/foundation-integrity/latest.json"
          test -f "data/build-reports/${DAY_KEY}.json" && git add "data/build-reports/${DAY_KEY}.json"
          test -f "data/system-health/${DAY_KEY}.json" && git add "data/system-health/${DAY_KEY}.json"
          test -f "data/system-health/latest.json" && git add "data/system-health/latest.json"

          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Record intraday System Health failure for ${DAY_KEY}"
            bash tools/git-push-rebase-retry.sh || true
          fi

          node ./engine-v1/jobs/sync-system-health-github-issue.js --date="$DAY_KEY" || true

      # Intraday re-exports the snapshot, which would leave the committed
      # invariant report stale vs manifest.generatedAt — refresh it so the
      # nightly Invariant gate never trips on an intraday manifest.
      - name: Refresh and enforce snapshot invariant report
        if: env.SKIP_BUILD != 'true'
        shell: bash
        run: |
          set -euo pipefail
          node ./engine-v1/jobs/run-snapshot-invariant-check.js "$DAY_KEY"
          node ./engine-v1/jobs/run-snapshot-invariant-check.js "$DAY_KEY" --gate
          node ./engine-v1/jobs/check-value-artifact-gate.js --date="$DAY_KEY"

      - name: Snapshot verification
        if: env.SKIP_BUILD != 'true'
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require("fs");

          const day = process.env.DAY_KEY;
          const manifestFile = `data/deploy-snapshots/${day}/manifest.json`;
          const fixturesFile = `data/deploy-snapshots/${day}/fixtures.json`;
          const valueFile = `data/deploy-snapshots/${day}/value.json`;
          const invariantFile = `data/deploy-snapshots/${day}/invariant-report.json`;
          const detailsDir = `data/deploy-snapshots/${day}/details`;

          for (const file of [manifestFile, fixturesFile, valueFile, invariantFile]) {
            if (!fs.existsSync(file)) {
              throw new Error(`missing required snapshot file: ${file}`);
            }
          }

          if (!fs.existsSync(detailsDir)) {
            throw new Error(`missing details dir: ${detailsDir}`);
          }

          const manifest = JSON.parse(fs.readFileSync(manifestFile, "utf8"));
          const fixtures = JSON.parse(fs.readFileSync(fixturesFile, "utf8"));
          const value = JSON.parse(fs.readFileSync(valueFile, "utf8"));
          const invariant = JSON.parse(fs.readFileSync(invariantFile, "utf8"));
          const details = fs.readdirSync(detailsDir).filter(f => f.endsWith(".json"));

          console.log(JSON.stringify({
            date: manifest.date,
            generatedAt: manifest.generatedAt,
            hash: manifest.hash,
            fixturesSource: manifest.fixturesSource,
            counts: manifest.counts,
            coverage: manifest.coverage,
            fixturesCount: fixtures.count,
            valueCount: value.count,
            valuePicks: Array.isArray(value.picks) ? value.picks.length : null,
            detailsFiles: details.length,
            invariantOk: invariant.ok,
            invariantValueSafe: invariant.valueSafe,
            invariantBlocked: Array.isArray(invariant.blocked) ? invariant.blocked.length : null
          }, null, 2));

          if (manifest.date !== day) {
            throw new Error(`manifest date mismatch: expected ${day}, got ${manifest.date}`);
          }

          if (!Number.isFinite(Number(fixtures.count)) || Number(fixtures.count) <= 0) {
            throw new Error("snapshot has zero fixtures");
          }

          if (!details.length) {
            throw new Error("snapshot has zero detail files");
          }

          if (invariant.ok !== true) {
            throw new Error("snapshot invariant report is not ok");
          }

          if (invariant.valueSafe === false) {
            throw new Error("snapshot invariant report marks value unsafe");
          }

          if (Array.isArray(invariant.blocked) && invariant.blocked.length > 0) {
            throw new Error(`snapshot invariant report has ${invariant.blocked.length} blocked issue(s)`);
          }
          NODE

      - name: Refresh value plan comparison settlement
        if: env.SKIP_BUILD != 'true'
        shell: bash
        run: |
          set -euo pipefail

          # Cross-source verified FT truth for the WHOLE fixture universe, not
          # just value picks. This strengthens the FT-confirmation layer for
          # every match and never touches value settlement (which stays strictly
          # picks-scoped in the calls below). Runs first so the picks' own
          # final-results already exist when settlement reads them.
          if [ -f "data/deploy-snapshots/${DAY_KEY}/fixtures.json" ]; then
            node ./engine-v1/jobs/export-verified-final-results-day.js --date="$DAY_KEY" --write --all-fixtures
          else
            echo "No fixtures snapshot for ${DAY_KEY}; skipping all-fixtures final-result export."
          fi

          if [ -f "data/deploy-snapshots/${DAY_KEY}/value.json" ]; then
            node ./engine-v1/jobs/export-verified-final-results-day.js --date="$DAY_KEY" --write
          else
            echo "No production value file for ${DAY_KEY}; skipping Plan A final-result export."
          fi

          for PLAN_FILE in plan-a2.json plan-b.json plan-b2.json; do
            PLAN_PATH="data/value-plans/${DAY_KEY}/${PLAN_FILE}"

            if [ -f "$PLAN_PATH" ]; then
              node ./engine-v1/jobs/export-verified-final-results-day.js                 --date="$DAY_KEY"                 --write                 --value-path="$PLAN_PATH"
            else
              echo "No ${PLAN_FILE} for ${DAY_KEY}; skipping its final-result export."
            fi
          done

          if [ -f "data/value-comparison/${DAY_KEY}.json" ]; then
            node ./engine-v1/jobs/build-value-plan-comparison-day.js --date="$DAY_KEY" --write
          else
            echo "No value comparison artifact for ${DAY_KEY}; skipping settlement comparison rebuild."
          fi

      - name: Refresh and enforce intraday foundation health
        if: env.SKIP_BUILD != 'true'
        shell: bash
        run: |
          set -euo pipefail
          node ./engine-v1/jobs/build-foundation-integrity-report.js --date="$DAY_KEY" --gate
          node ./engine-v1/jobs/build-day-report.js --date="$DAY_KEY"

      - name: Configure git author
        if: env.SKIP_BUILD != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Stage allowed generated files only
        if: env.SKIP_BUILD != 'true'
        shell: bash
        run: |
          set -euo pipefail

          # Intraday refresh may persist status/score updates only for canonical
          # files that were already tracked for the selected day. New acquisition
          # files, other days, coverage reports and ingest state remain excluded.
          CANONICAL_STATUS_PATCH="${RUNNER_TEMP}/intraday-canonical-status-${DAY_KEY}.patch"

          git diff --binary --diff-filter=M -- \
            "data/canonical-fixtures/${DAY_KEY}/" \
            > "$CANONICAL_STATUS_PATCH"

          git restore -- data/canonical-fixtures data/coverage-reports data/ingest-state data/fixtures.json data/fixtures.json.bak 2>/dev/null || true
          git clean -fd -- data/canonical-fixtures data/coverage-reports data/ingest-state 2>/dev/null || true

          if [ -s "$CANONICAL_STATUS_PATCH" ]; then
            git apply --whitespace=nowarn "$CANONICAL_STATUS_PATCH"
          fi

          CANONICAL_STATUS_FILES="$(git diff --name-only --diff-filter=M -- "data/canonical-fixtures/${DAY_KEY}/" || true)"

          if [ -n "$CANONICAL_STATUS_FILES" ]; then
            while IFS= read -r canonical_file; do
              [ -n "$canonical_file" ] && git add -- "$canonical_file"
            done <<< "$CANONICAL_STATUS_FILES"
          fi

          test -e "data/deploy-snapshots/${DAY_KEY}/fixtures.json" && git add "data/deploy-snapshots/${DAY_KEY}/fixtures.json"
          test -e "data/deploy-snapshots/${DAY_KEY}/manifest.json" && git add "data/deploy-snapshots/${DAY_KEY}/manifest.json"
          test -e "data/deploy-snapshots/${DAY_KEY}/value.json" && git add "data/deploy-snapshots/${DAY_KEY}/value.json"
          if [ -f "data/deploy-snapshots/${DAY_KEY}/value-audit.json" ]; then git add "data/deploy-snapshots/${DAY_KEY}/value-audit.json"; fi
          if [ -f "data/value/${DAY_KEY}.json" ]; then git add "data/value/${DAY_KEY}.json"; fi
          if [ -f "data/value/_audit/${DAY_KEY}.json" ]; then git add "data/value/_audit/${DAY_KEY}.json"; fi
          if [ -d "data/value-plans/${DAY_KEY}" ]; then git add "data/value-plans/${DAY_KEY}/"; fi
          node ./engine-v1/jobs/build-system-health-alerts-day.js --date="${DAY_KEY}"

          test -e "data/deploy-snapshots/${DAY_KEY}/invariant-report.json" && git add "data/deploy-snapshots/${DAY_KEY}/invariant-report.json"
          # Freshness + build reports refreshed by run-intraday-snapshot-refresh.js
          # so they describe THIS re-exported manifest, not the earlier daily one.
          if [ -f "data/deploy-snapshots/${DAY_KEY}/freshness-report.json" ]; then git add "data/deploy-snapshots/${DAY_KEY}/freshness-report.json"; fi
          if [ -f "data/build-reports/${DAY_KEY}.json" ]; then git add "data/build-reports/${DAY_KEY}.json"; fi
          if [ -f "data/foundation-integrity/${DAY_KEY}.json" ]; then git add "data/foundation-integrity/${DAY_KEY}.json"; fi
          if [ -f "data/foundation-integrity/latest.json" ]; then git add "data/foundation-integrity/latest.json"; fi
          if [ -f "data/system-health/${DAY_KEY}.json" ]; then git add "data/system-health/${DAY_KEY}.json"; fi
          if [ -f "data/system-health/latest.json" ]; then git add "data/system-health/latest.json"; fi
          test -d "data/deploy-snapshots/${DAY_KEY}/details" && git add "data/deploy-snapshots/${DAY_KEY}/details"
          test -e "data/deploy-snapshots/latest.json" && git add "data/deploy-snapshots/latest.json"

          test -d "data/final-results/${DAY_KEY}" && git add "data/final-results/${DAY_KEY}/"
          test -f "data/final-result-conflicts/${DAY_KEY}.json" && git add "data/final-result-conflicts/${DAY_KEY}.json"
          test -e "data/value-comparison/${DAY_KEY}.json" && git add "data/value-comparison/${DAY_KEY}.json"

          STAGED="$(git diff --cached --name-only || true)"
          echo "Staged files:"
          printf "%s\n" "$STAGED"

          if [ -n "$STAGED" ]; then
            node engine-v1/jobs/guard-staged-data-boundary.js \
              --label=intraday-deploy-snapshot-refresh \
              --dayKey="${DAY_KEY}" \
              --allow="^(data/canonical-fixtures/${DAY_KEY}/[^/]+\.json$|data/deploy-snapshots/latest\.json$|data/deploy-snapshots/${DAY_KEY}/|data/build-reports/${DAY_KEY}\.json$|data/foundation-integrity/${DAY_KEY}\.json$|data/foundation-integrity/latest\.json$|data/system-health/${DAY_KEY}\.json$|data/system-health/latest\.json$|data/value/${DAY_KEY}\.json$|data/value/_audit/${DAY_KEY}\.json$|data/value-plans/${DAY_KEY}/|data/final-results/${DAY_KEY}/|data/final-result-conflicts/${DAY_KEY}\.json$|data/value-comparison/${DAY_KEY}\.json$)"

            BAD="$(printf "%s\n" "$STAGED" | grep -Ev '^(data/canonical-fixtures/|data/deploy-snapshots/|data/build-reports/|data/foundation-integrity/|data/system-health/|data/value/|data/value-plans/|data/final-results/|data/final-result-conflicts/|data/value-comparison/)' || true)"
            if [ -n "$BAD" ]; then
              echo "ERROR: unexpected staged files:"
              echo "$BAD"
              exit 1
            fi
          fi

      - name: Sync System Health GitHub issue
        if: env.SKIP_BUILD != 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node ./engine-v1/jobs/sync-system-health-github-issue.js --date="$DAY_KEY"

      - name: Detect material intraday snapshot changes
        if: env.SKIP_BUILD != 'true'
        shell: bash
        run: |
          set -euo pipefail

          node - <<'NODE'
          const fs = require("fs");
          const { execFileSync } = require("child_process");

          const day = process.env.DAY_KEY;
          const file = `data/deploy-snapshots/${day}/fixtures.json`;

          function readJsonFromHead(path) {
            try {
              return JSON.parse(execFileSync("git", ["show", `HEAD:${path}`], { encoding: "utf8" }));
            } catch {
              return null;
            }
          }

          function readJsonFile(path) {
            if (!fs.existsSync(path)) return null;
            return JSON.parse(fs.readFileSync(path, "utf8"));
          }

          function rowsOf(payload) {
            if (!payload) return [];
            if (Array.isArray(payload)) return payload;
            if (Array.isArray(payload.matches)) return payload.matches;
            if (Array.isArray(payload.fixtures)) return payload.fixtures;
            if (Array.isArray(payload.items)) return payload.items;
            return [];
          }

          function idOf(row) {
            return String(row?.matchId ?? row?.id ?? row?.fixtureId ?? "").trim();
          }

          function isPreLike(row) {
            const statusText = [
              row?.status,
              row?.statusType,
              row?.rawStatus,
              row?.phase
            ]
              .map(value => String(value || "").toUpperCase())
              .join(" ");

            return /\b(PRE|SCHEDULED|STATUS_SCHEDULED|NOT_STARTED)\b/.test(statusText);
          }

          function materialScore(row, primaryField, fallbackField) {
            const value = row?.[primaryField] ?? row?.[fallbackField] ?? null;

            // Scheduled rows may be represented as either null-null or 0-0.
            // Neither representation is a real score/status change.
            if (value === null && isPreLike(row)) {
              return 0;
            }

            const numeric = Number(value);
            return Number.isFinite(numeric) ? numeric : value;
          }

          function material(row) {
            return {
              matchId: idOf(row),
              status: row?.status ?? null,
              statusType: row?.statusType ?? null,
              rawStatus: row?.rawStatus ?? null,
              phase: row?.phase ?? null,
              minute: row?.minute ?? null,
              scoreHome: materialScore(row, "scoreHome", "homeScore"),
              scoreAway: materialScore(row, "scoreAway", "awayScore"),
              live: row?.live ?? null,
              isLive: row?.isLive ?? null,
              staleLive: row?.staleLive ?? null,
              kickoffUtc: row?.kickoffUtc ?? row?.date ?? row?.startTime ?? row?.startUtc ?? null
            };
          }

          function normalize(payload) {
            const map = new Map();
            for (const row of rowsOf(payload)) {
              const id = idOf(row);
              if (id) map.set(id, material(row));
            }
            return [...map.entries()].sort(([a], [b]) => a.localeCompare(b));
          }

          const before = readJsonFromHead(file);
          const after = readJsonFile(file);

          const beforeNorm = normalize(before);
          const afterNorm = normalize(after);
          const materialChanged = JSON.stringify(beforeNorm) !== JSON.stringify(afterNorm);

          console.log(JSON.stringify({
            file,
            beforeRows: beforeNorm.length,
            afterRows: afterNorm.length,
            materialChanged
          }, null, 2));

          if (!materialChanged) {
            console.log("No material score/status/minute changes. Restoring staged deploy snapshot files to avoid timestamp-only commit.");
            execFileSync("git", ["restore", "--staged", "--", "data/deploy-snapshots"], { stdio: "inherit" });
            execFileSync("git", ["restore", "--", "data/deploy-snapshots"], { stdio: "inherit" });
            // build-reports/<day>.json lives outside deploy-snapshots; its only
            // change on an unchanged snapshot is a fresh generatedAt, so restore
            // it too or the commit-needed check below trips on a timestamp-only diff.
            // Guarded: a brand-new day may have no HEAD build-report to restore to.
            try {
              execFileSync("git", ["restore", "--staged", "--", `data/build-reports/${day}.json`], { stdio: "inherit" });
              execFileSync("git", ["restore", "--", `data/build-reports/${day}.json`], { stdio: "inherit" });
            } catch (e) {
              console.log(`build-reports restore skipped: ${e.message}`);
            }
          }

          const comparisonFile = `data/value-comparison/${day}.json`;

          function readJsonFromHeadOrNull(path) {
            try {
              return JSON.parse(execFileSync("git", ["show", `HEAD:${path}`], { encoding: "utf8" }));
            } catch {
              return null;
            }
          }

          function stripNonMaterialComparisonFields(value) {
            if (!value || typeof value !== "object") return value;
            const copy = JSON.parse(JSON.stringify(value));
            delete copy.generatedAt;
            return copy;
          }

          const comparisonBefore = readJsonFromHeadOrNull(comparisonFile);
          const comparisonAfter = readJsonFile(comparisonFile);

          if (comparisonBefore && comparisonAfter) {
            const beforeMaterial = stripNonMaterialComparisonFields(comparisonBefore);
            const afterMaterial = stripNonMaterialComparisonFields(comparisonAfter);
            const comparisonMaterialChanged = JSON.stringify(beforeMaterial) !== JSON.stringify(afterMaterial);

            console.log(JSON.stringify({
              comparisonFile,
              comparisonMaterialChanged
            }, null, 2));

            if (!comparisonMaterialChanged) {
              console.log("Only value-comparison generatedAt changed. Restoring comparison file to avoid timestamp-only commit.");
              execFileSync("git", ["restore", "--staged", "--", comparisonFile], { stdio: "inherit" });
              execFileSync("git", ["restore", "--", comparisonFile], { stdio: "inherit" });
            }
          }

          let commitNeeded = materialChanged;
          if (!commitNeeded) {
            try {
              execFileSync("git", ["diff", "--cached", "--quiet"], { stdio: "ignore" });
              commitNeeded = false;
            } catch {
              commitNeeded = true;
            }
          }

          const stagedFiles = execFileSync(
            "git",
            ["diff", "--cached", "--name-only"],
            { encoding: "utf8" }
          )
            .split(/\r?\n/)
            .map(value => value.trim())
            .filter(Boolean);

          const canonicalStatusChanged =
            stagedFiles.some(filePath =>
              filePath.startsWith(
                `data/canonical-fixtures/${day}/`
              ) &&
              filePath.endsWith(".json")
            );

          const finalCommitNeeded =
            commitNeeded || canonicalStatusChanged;

          console.log(JSON.stringify({
            materialChanged,
            canonicalStatusChanged,
            commitNeeded: finalCommitNeeded
          }, null, 2));

          fs.appendFileSync(
            process.env.GITHUB_ENV,
            `INTRADAY_COMMIT_NEEDED=${finalCommitNeeded ? "true" : "false"}\n`
          );
          NODE

      - name: Commit and push snapshot changes
        if: env.SKIP_BUILD != 'true' && env.INTRADAY_COMMIT_NEEDED == 'true'
        shell: bash
        run: |
          set -euo pipefail

          if git diff --cached --quiet; then
            echo "No intraday snapshot changes to commit."
            exit 0
          fi

          git commit -m "Intraday refresh deploy snapshot for ${DAY_KEY}"
          bash tools/git-push-rebase-retry.sh
          PUBLISHED_REF="$(git rev-parse HEAD)"
          echo "PUBLISHED_REF=${PUBLISHED_REF}" >> "$GITHUB_ENV"
          echo "INTRADAY_SNAPSHOT_PUSHED=true" >> "$GITHUB_ENV"

      - name: Promote and verify public runtime snapshot
        if: env.SKIP_BUILD != 'true' && env.INTRADAY_SNAPSHOT_PUSHED == 'true'
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          bash tools/sync-public-snapshot.sh "${DAY_KEY}" "${PUBLISHED_REF}"

      - name: Automatic Render redeploy disabled by deploy-budget firewall
        if: ${{ false }}
        shell: bash
        env:
          RENDER_ENGINE_DEPLOY_HOOK_URL: ${{ secrets.RENDER_ENGINE_DEPLOY_HOOK_URL }}
          RENDER_UI_DEPLOY_HOOK_URL: ${{ secrets.RENDER_UI_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail

          if [ -n "${RENDER_ENGINE_DEPLOY_HOOK_URL:-}" ]; then
            echo "Triggering Render engine redeploy..."
            curl -fsS -X POST "${RENDER_ENGINE_DEPLOY_HOOK_URL}"
          else
            echo "RENDER_ENGINE_DEPLOY_HOOK_URL is not configured; skipping engine redeploy trigger."
          fi

          if [ -n "${RENDER_UI_DEPLOY_HOOK_URL:-}" ]; then
            echo "Triggering Render UI redeploy..."
            curl -fsS -X POST "${RENDER_UI_DEPLOY_HOOK_URL}"
          else
            echo "RENDER_UI_DEPLOY_HOOK_URL is not configured; skipping UI redeploy trigger."
          fi
