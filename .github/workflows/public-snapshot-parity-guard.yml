name: Public snapshot parity regression
on:
  pull_request:
    paths:
      - .github/workflows/intraday-deploy-snapshot-refresh.yml
      - .github/workflows/public-snapshot-parity-guard.yml
      - tools/public-snapshot-parity*
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            tools
            engine-v1
            .github
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: node --test tools/public-snapshot-parity.test.mjs
