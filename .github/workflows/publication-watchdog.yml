name: Publication rollover watchdog

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publication-watchdog.yml"
      - "tools/git-push-rebase-retry.sh"
      - "data/deploy-snapshots/latest.json"
      - "data/deploy-snapshots/*/manifest.json"
  schedule:
    # Lightweight all-day convergence/recovery check. If publication is healthy
    # this exits quickly; if it is missing, the existing full Daily contract is
    # dispatched for Europe/Athens TODAY. Half-hour cadence bounds a stuck day
    # without turning the watchdog itself into a data writer.
    - cron: "17,47 * * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: ai-matchlab-publication-watchdog
  cancel-in-progress: false

jobs:
  publication-watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout current main
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Inspect publication state
        id: state
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          CALENDAR_DAY="$(TZ=Europe/Athens date +%F)"
          NEXT_DAY="$(TZ=Europe/Athens date -d 'tomorrow' +%F)"
          EVENT_NAME="${GITHUB_EVENT_NAME}"
          HEAD_REF="$(git rev-parse HEAD)"

          echo "CALENDAR_DAY=${CALENDAR_DAY}"
          echo "NEXT_DAY=${NEXT_DAY}"
          echo "EVENT_NAME=${EVENT_NAME}"
          echo "HEAD_REF=${HEAD_REF}"

          LATEST_DAY="$(
            node -e '
              const fs=require("fs");
              try {
                const x=JSON.parse(fs.readFileSync("data/deploy-snapshots/latest.json","utf8"));
                process.stdout.write(String(x?.date || ""));
              } catch {}
            '
          )"

          echo "LATEST_DAY=${LATEST_DAY}"

          # Only current-day or next-day atomic publication is valid. Anything
          # older is stale; anything beyond tomorrow is an invalid future pointer
          # and must go through the same complete fail-closed recovery path.
          if [[ -n "${LATEST_DAY}" && "${LATEST_DAY}" < "${CALENDAR_DAY}" ]]; then
            echo "Git publication is stale: latest=${LATEST_DAY}, Athens today=${CALENDAR_DAY}."
          elif [[ -n "${LATEST_DAY}" && "${LATEST_DAY}" > "${NEXT_DAY}" ]]; then
            echo "Git publication is beyond the allowed next-day horizon: latest=${LATEST_DAY}, allowedMax=${NEXT_DAY}."
          elif [[ -n "${LATEST_DAY}" ]]; then
            TARGET_DAY="${LATEST_DAY}"
            MANIFEST="data/deploy-snapshots/${TARGET_DAY}/manifest.json"

            if [[ -f "${MANIFEST}" ]]; then
              set +e
              EXPECTED_HASH="$(
                DAY_KEY="${TARGET_DAY}" node --input-type=module -e '
                  import fs from "node:fs";
                  import { validateDeploySnapshotManifest } from "./engine-v1/core/deploy-snapshot-release-contract.js";
                  const day=process.env.DAY_KEY;
                  const latest=JSON.parse(fs.readFileSync("data/deploy-snapshots/latest.json","utf8"));
                  const manifest=JSON.parse(fs.readFileSync(`data/deploy-snapshots/${day}/manifest.json`,"utf8"));
                  const check=validateDeploySnapshotManifest(manifest,day);
                  if(!check.ok){
                    console.error(JSON.stringify({reason:"manifest_invalid",errors:check.errors}));
                    process.exit(2);
                  }
                  if(latest?.date!==day || latest?.hash!==manifest?.hash){
                    console.error(JSON.stringify({
                      reason:"latest_manifest_binding_mismatch",
                      latestDate:latest?.date,
                      latestHash:latest?.hash,
                      manifestHash:manifest?.hash
                    }));
                    process.exit(3);
                  }
                  process.stdout.write(String(manifest.hash));
                '
              )"
              VALIDATION_RC=$?
              set -e

              if [[ "${VALIDATION_RC}" -eq 0 && -n "${EXPECTED_HASH}" ]]; then
                PUBLIC_STATE="$(
                  curl -fsS --connect-timeout 10 --max-time 30 \
                    "https://ai-matchlab-engine.onrender.com/deploy-snapshot/latest" \
                    2>/dev/null || true
                )"

                PUBLIC_BINDING="$(
                  printf '%s' "${PUBLIC_STATE}" |
                    DAY_KEY="${TARGET_DAY}" EXPECTED_HASH="${EXPECTED_HASH}" node -e '
                      let raw="";
                      process.stdin.on("data",c=>raw+=c);
                      process.stdin.on("end",()=>{
                        try{
                          const x=JSON.parse(raw);
                          const ok=x?.date===process.env.DAY_KEY && x?.hash===process.env.EXPECTED_HASH;
                          process.stdout.write(ok?"match":"mismatch");
                        }catch{
                          process.stdout.write("mismatch");
                        }
                      });
                    '
                )"

                echo "TARGET_DAY=${TARGET_DAY}"
                echo "EXPECTED_HASH=${EXPECTED_HASH}"
                echo "PUBLIC_BINDING=${PUBLIC_BINDING}"

                if [[ "${PUBLIC_BINDING}" == "match" ]]; then
                  ATHENS_HOUR="$(TZ=Europe/Athens date +%H)"
                  ATHENS_MINUTE="$(TZ=Europe/Athens date +%M)"
                  ATHENS_TOTAL_MINUTES=$((10#$ATHENS_HOUR * 60 + 10#$ATHENS_MINUTE))

                  # GitHub scheduled Daily events are not guaranteed delivery.
                  # Once two normal evening opportunities have passed, a
                  # scheduled watchdog run becomes the fail-safe prepublication
                  # launcher for TOMORROW. It never builds publication artifacts
                  # itself; it only dispatches the complete fail-closed Daily.
                  #
                  # 19:30-20:59 Athens leaves ample wall-clock budget before
                  # midnight while preserving the normal Daily schedule as the
                  # primary mechanism.
                  if [[
                    ( "${EVENT_NAME}" == "schedule" || "${EVENT_NAME}" == "push" ) &&
                    "${TARGET_DAY}" == "${CALENDAR_DAY}" &&
                    "${ATHENS_TOTAL_MINUTES}" -ge 1170 &&
                    "${ATHENS_TOTAL_MINUTES}" -le 1259
                  ]]; then
                    echo "Current-day publication is healthy but next-day prepublication is still absent."
                    echo "Checking Daily activity before controlled next-day fallback."

                    # A Daily candidate can be registered at the same minute as
                    # this watchdog. Give GitHub Actions time to expose it before
                    # deciding to dispatch another run.
                    sleep 45

                    RUNS_FILE="$RUNNER_TEMP/daily-runs-prepublication.json"
                    API_URL="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/daily-deploy-snapshot.yml/runs?branch=main&per_page=20"

                    curl -fsSL \
                      -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                      -H "Accept: application/vnd.github+json" \
                      -H "X-GitHub-Api-Version: 2022-11-28" \
                      -o "${RUNS_FILE}" \
                      "${API_URL}"

                    PREPUBLISH_DECISION="$(
                      node -e '
                        const fs=require("fs");
                        const payload=JSON.parse(
                          fs.readFileSync(process.argv[1],"utf8")
                        );

                        const runs=
                          Array.isArray(payload?.workflow_runs)
                            ? payload.workflow_runs
                            : [];

                        const active=runs.filter(
                          r =>
                            String(r?.status || "").toLowerCase()
                              !== "completed"
                        );

                        if(active.length){
                          process.stdout.write("active");
                          process.exit(0);
                        }

                        const recentNonFailed=runs.filter(r => {
                          if(
                            String(r?.status || "").toLowerCase()
                              !== "completed"
                          ){
                            return false;
                          }

                          if(
                            String(r?.conclusion || "").toLowerCase()
                              === "failure"
                          ){
                            return false;
                          }

                          const t=Date.parse(
                            String(r?.created_at || "")
                          );

                          return (
                            Number.isFinite(t) &&
                            Date.now()-t < 35*60*1000
                          );
                        });

                        if(recentNonFailed.length){
                          process.stdout.write("cooldown");
                          process.exit(0);
                        }

                        process.stdout.write("dispatch");
                      ' "${RUNS_FILE}"
                    )"

                    echo "PREPUBLICATION_DECISION=${PREPUBLISH_DECISION}"

                    case "${PREPUBLISH_DECISION}" in
                      active|cooldown)
                        echo "MODE=prepublish_wait" >> "$GITHUB_ENV"
                        echo "mode=prepublish_wait" >> "$GITHUB_OUTPUT"
                        echo "Daily activity already exists; watchdog will not duplicate it."
                        ;;
                      dispatch)
                        echo "MODE=dispatch" >> "$GITHUB_ENV"
                        echo "mode=dispatch" >> "$GITHUB_OUTPUT"
                        echo "dayKey=${NEXT_DAY}" >> "$GITHUB_OUTPUT"
                        echo "No usable Daily activity detected; controlled TOMORROW dispatch required."
                        ;;
                      *)
                        echo "ERROR: unknown prepublication decision: ${PREPUBLISH_DECISION}" >&2
                        exit 1
                        ;;
                    esac

                    exit 0
                  fi

                  echo "MODE=healthy" >> "$GITHUB_ENV"
                  echo "mode=healthy" >> "$GITHUB_OUTPUT"
                  echo "Git and public engine are converged for ${TARGET_DAY}."
                  exit 0
                fi

                echo "MODE=sync" >> "$GITHUB_ENV"
                echo "mode=sync" >> "$GITHUB_OUTPUT"
                echo "dayKey=${TARGET_DAY}" >> "$GITHUB_OUTPUT"
                echo "ref=${HEAD_REF}" >> "$GITHUB_OUTPUT"
                echo "hash=${EXPECTED_HASH}" >> "$GITHUB_OUTPUT"
                echo "Git publication is valid but public engine is stale; exact-ref sync required."
                exit 0
              fi

              echo "Latest/manifest binding is invalid; full current-day recovery required."
            else
              echo "Latest points to ${TARGET_DAY} but ${MANIFEST} is missing; full current-day recovery required."
            fi
          else
            echo "Latest publication pointer is missing or unreadable; full current-day recovery required."
          fi

          # Missing/stale/invalid Git publication must go through the complete
          # fail-closed Daily gates for TODAY. The watchdog never manufactures
          # fixtures, Value, manifest, or latest.json itself.
          RECOVERY_DAY="${CALENDAR_DAY}"
          echo "Repository publication for ${RECOVERY_DAY} is missing or incomplete."

          RUNS_FILE="$RUNNER_TEMP/daily-runs.json"
          API_URL="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/daily-deploy-snapshot.yml/runs?branch=main&per_page=20"

          curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o "${RUNS_FILE}" \
            "${API_URL}"

          DECISION="$(
            node -e '
              const fs=require("fs");
              const payload=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
              const runs=Array.isArray(payload?.workflow_runs)?payload.workflow_runs:[];
              const active=runs.filter(r=>String(r?.status||"").toLowerCase()!=="completed");
              if(active.length){process.stdout.write("active");process.exit(0);}
              const manual=runs
                .filter(r=>r?.event==="workflow_dispatch")
                .sort((a,b)=>String(b?.created_at||"").localeCompare(String(a?.created_at||"")));
              if(manual.length){
                const t=Date.parse(String(manual[0]?.created_at||""));
                if(Number.isFinite(t) && Date.now()-t < 20*60*1000){
                  process.stdout.write("cooldown");
                  process.exit(0);
                }
              }
              process.stdout.write("dispatch");
            ' "${RUNS_FILE}"
          )"

          echo "RECOVERY_DECISION=${DECISION}"

          case "${DECISION}" in
            active|cooldown)
              echo "MODE=wait" >> "$GITHUB_ENV"
              echo "mode=wait" >> "$GITHUB_OUTPUT"
              ;;
            dispatch)
              echo "MODE=dispatch" >> "$GITHUB_ENV"
              echo "mode=dispatch" >> "$GITHUB_OUTPUT"
              echo "dayKey=${RECOVERY_DAY}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "ERROR: unknown recovery decision: ${DECISION}" >&2
              exit 1
              ;;
          esac

      - name: Converge public engine to existing immutable Git publication
        if: steps.state.outputs.mode == 'sync'
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          bash tools/sync-public-snapshot.sh \
            "${{ steps.state.outputs.dayKey }}" \
            "${{ steps.state.outputs.ref }}"

      - name: Dispatch controlled Daily publication/recovery
        if: steps.state.outputs.mode == 'dispatch'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DAY_KEY: ${{ steps.state.outputs.dayKey }}
        run: |
          set -euo pipefail

          PAYLOAD="$(
            DAY_KEY="${DAY_KEY}" node -e '
              process.stdout.write(JSON.stringify({
                ref:"main",
                inputs:{
                  dayKey:process.env.DAY_KEY,
                  triggerRender:"false"
                }
              }));
            '
          )"

          curl -fsS \
            -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/daily-deploy-snapshot.yml/dispatches" \
            --data "${PAYLOAD}"

          echo "CONTROLLED_DAILY_RECOVERY_DISPATCHED=true"
          echo "CONTROLLED_DAILY_RECOVERY_DAY=${DAY_KEY}"

      - name: Watchdog summary
        if: always()
        shell: bash
        run: |
          echo "PUBLICATION_WATCHDOG_MODE=${MODE:-unknown}"
          echo "Athens day: $(TZ=Europe/Athens date +%F)"
