name: Odds refresh

# Autonomous bookmaker-odds capture. Runs hourly but self-gates to the real
# policy (every 8h, plus hourly within 4h before a kickoff) and commits the odds
# snapshot ONLY when it materially changes — so deploys stay few (free plan).
# Render redeploy is intentionally NOT triggered here; it stays manual.

on:
  workflow_dispatch:
    inputs:
      dayKey:
        description: "Day key, YYYY-MM-DD. Empty = Europe/Athens today."
        required: false
        default: ""
      force:
        description: "Force a scrape even if not due."
        required: false
        default: "false"
  schedule:
    - cron: "27 * * * *"   # hourly; the job decides whether a scrape is actually due

permissions:
  contents: write
  actions: read

# Admission stays outside the shared writer queue so frequent Odds ticks cannot
# replace a pending Daily publication. The real writer still uses the global
# lock, preserving serialization over deploy-snapshots/{day}/odds.json.
jobs:
  admission:
    runs-on: ubuntu-latest
    outputs:
      allow_writer: ${{ steps.daily-priority.outputs.allow_writer }}
    steps:
      - name: Protect Daily writer priority
        id: daily-priority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API_URL="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/270329104/runs?branch=main&per_page=20"
          RESPONSE_FILE="$RUNNER_TEMP/daily-writer-priority.json"

          if ! curl -fsSL \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o "$RESPONSE_FILE" \
            "$API_URL"; then
            echo "Daily writer lookup failed; failing closed and skipping lower-priority writer."
            echo "allow_writer=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ACTIVE_COUNT="$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1], encoding="utf-8")); print(sum(1 for r in d.get("workflow_runs", []) if str(r.get("status", "")).lower() != "completed"))' "$RESPONSE_FILE" 2>/dev/null || true)"

          if ! [[ "$ACTIVE_COUNT" =~ ^[0-9]+$ ]]; then
            echo "Daily writer response could not be parsed; failing closed."
            echo "allow_writer=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$ACTIVE_COUNT" -gt 0 ]; then
            echo "Daily publication is queued/in progress; lower-priority writer will not enter the shared queue."
            echo "allow_writer=false" >> "$GITHUB_OUTPUT"
          else
            echo "No active Daily publication; lower-priority writer may enter the shared queue."
            echo "allow_writer=true" >> "$GITHUB_OUTPUT"
          fi

  refresh-odds:
    needs: admission
    if: needs.admission.outputs.allow_writer == 'true'
    concurrency:
      group: ai-matchlab-data-writer
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Resolve day key + Athens guard
        id: day
        shell: bash
        env:
          INPUT_DAY_KEY: ${{ inputs.dayKey }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          ATHENS_HOUR_NUM=$((10#$(TZ=Europe/Athens date +%H)))
          if [ "$EVENT_NAME" = "schedule" ] && { [ "$ATHENS_HOUR_NUM" -lt 7 ] || [ "$ATHENS_HOUR_NUM" -gt 23 ]; }; then
            echo "Outside 07:00-23:59 Europe/Athens; skipping."
            echo "SKIP=true" >> "$GITHUB_ENV"
            exit 0
          fi
          DAY_KEY="$(printf "%s" "${INPUT_DAY_KEY:-}" | grep -Eo '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -n1 || true)"
          [ -z "$DAY_KEY" ] && DAY_KEY="$(TZ=Europe/Athens date +%F)"
          echo "SKIP=false" >> "$GITHUB_ENV"
          echo "DAY_KEY=$DAY_KEY" >> "$GITHUB_ENV"

      - name: Install dependencies
        if: env.SKIP != 'true'
        run: npm ci --no-audit --no-fund

      - name: Run gated odds refresh
        if: env.SKIP != 'true'
        shell: bash
        run: |
          set -euo pipefail
          FORCE_FLAG=""
          [ "${{ inputs.force }}" = "true" ] && FORCE_FLAG="--force"
          node ./engine-v1/jobs/run-odds-refresh.js "$DAY_KEY" $FORCE_FLAG | tee odds-refresh-result.json

      - name: Trigger Render multi-odds prefetch
        if: env.SKIP != 'true'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -s -X POST \
            "https://ai-matchlab-engine.onrender.com/api/refresh-multi-odds" \
            -H "X-Cron-Secret: $CRON_SECRET" || true

      - name: Commit odds snapshot if changed
        if: env.SKIP != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore --staged . || true

          ODDS_FILE="data/deploy-snapshots/${DAY_KEY}/odds.json"
          FIXTURES_FILE="data/deploy-snapshots/${DAY_KEY}/fixtures-all.json"
          [ -f "$ODDS_FILE" ] && git add "$ODDS_FILE"
          [ -f "$FIXTURES_FILE" ] && git add "$FIXTURES_FILE"

          node engine-v1/jobs/guard-staged-data-boundary.js \
            --label=odds-refresh \
            --dayKey="${DAY_KEY}" \
            --allow="^(data/deploy-snapshots/${DAY_KEY}/(odds\.json|fixtures-all\.json)$)"

          if git diff --cached --quiet; then
            echo "No odds/fixtures changes to commit."
          else
            git commit -m "Refresh odds + fixtures snapshot for ${DAY_KEY}"
            bash tools/git-push-rebase-retry.sh
          fi
