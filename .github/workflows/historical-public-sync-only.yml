name: Historical public snapshot sync-only closure

on:
  pull_request:
    paths:
      - ".github/workflows/historical-public-sync-only.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/historical-public-sync-only.yml"
  workflow_dispatch:
    inputs:
      dayKey:
        description: "Historical day YYYY-MM-DD; defaults to Athens D-2"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  verify-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ai-matchlab-data-writer
      queue: max
      cancel-in-progress: false
    steps:
      - name: Checkout exact immutable source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          filter: blob:none

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Test parity fail-closed contract
        run: node --test tools/check-historical-public-snapshot-parity.test.mjs

      - name: Select historical day and immutable source
        id: select
        shell: bash
        env:
          SELECTED_DAY: ${{ inputs.dayKey }}
        run: |
          set -euo pipefail
          DAY="${SELECTED_DAY:-$(TZ=Europe/Athens date -d '2 days ago' +%F)}"
          [[ "$DAY" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || exit 2
          [[ -f "data/deploy-snapshots/$DAY/manifest.json" ]] || exit 2
          echo "day=$DAY" >> "$GITHUB_OUTPUT"
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Reconcile immutable public snapshot without rebuilding data
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DAY: ${{ steps.select.outputs.day }}
          REF: ${{ steps.select.outputs.ref }}
        run: |
          set -euo pipefail
          node tools/public-snapshot-parity.mjs "$DAY" "$REF"
          DAY="$DAY" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {publicParityVerdict} from './tools/check-historical-public-snapshot-parity.mjs';
          const day=process.env.DAY;
          const manifest=JSON.parse(fs.readFileSync(`data/deploy-snapshots/${day}/manifest.json`,'utf8'));
          const verdict=await publicParityVerdict(day,manifest);
          console.log('HISTORICAL_PUBLIC_SYNC_ONLY='+JSON.stringify({day,verdict,hash:manifest.hash}));
          if(verdict!=='VERIFIED')process.exitCode=1;
          NODE
