name: P0 details foundation self-heal fix

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/p0-details-foundation-self-heal-fix.yml"

permissions:
  contents: write

concurrency:
  group: ai-matchlab-data-writer
  cancel-in-progress: false

env:
  EXPECTED_PARENT: "2fcad243e1af06ca26823134f0ae862e53f76c4e"

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify patch base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test -z "$(git status --porcelain)"
          echo "Patch base verified: $EXPECTED_PARENT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      - name: Install engine dependencies
        working-directory: engine-v1
        run: npm ci --no-audit --no-fund

      - name: Apply exact anchored self-heal patch
        shell: bash
        run: |
          set -euo pipefail
          python tools/p0-details-foundation-self-heal-fix.py

      - name: Syntax checks
        shell: bash
        run: |
          set -euo pipefail
          node --check engine-v1/jobs/rebuild-indexes-for-season.js
          node --check engine-v1/jobs/run-daily-cycle.js
          node --check engine-v1/tests/details-history-index-self-heal.test.js
          node --check engine-v1/tests/daily-details-foundation-order.test.js
          git diff --check

      - name: Targeted regression
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            engine-v1/tests/details-history-index-self-heal.test.js \
            engine-v1/tests/daily-details-foundation-order.test.js \
            engine-v1/tests/rebuild-indexes-for-season.test.js \
            engine-v1/tests/foundation-integrity-report.test.js \
            engine-v1/tests/foundation-system-health.test.js

      - name: Full engine regression
        shell: bash
        run: |
          set -euo pipefail
          node --test engine-v1/tests/*.test.js

      - name: Verify exact write set
        shell: bash
        run: |
          set -euo pipefail
          { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u > /tmp/changed.txt
          cat > /tmp/expected.txt <<'EOF'
          engine-v1/jobs/rebuild-indexes-for-season.js
          engine-v1/jobs/run-daily-cycle.js
          engine-v1/tests/daily-details-foundation-order.test.js
          engine-v1/tests/details-history-index-self-heal.test.js
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt

      - name: Commit permanent self-heal fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            engine-v1/jobs/rebuild-indexes-for-season.js \
            engine-v1/jobs/run-daily-cycle.js \
            engine-v1/tests/daily-details-foundation-order.test.js \
            engine-v1/tests/details-history-index-self-heal.test.js
          git diff --cached --check
          git commit -m "Self-heal details history index foundation"
          git push origin HEAD:main
