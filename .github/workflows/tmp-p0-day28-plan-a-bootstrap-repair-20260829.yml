name: P0 Day28 Plan A bootstrap repair

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-p0-day28-plan-a-bootstrap-repair-20260829.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-matchlab-data-writer
  cancel-in-progress: false

jobs:
  repair-and-publish-day28:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DAY_KEY: "2026-08-28"
      EXPECTED_PREVIOUS_LATEST: "2026-08-27"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Sync latest main after writer lock
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin main
          git checkout -B main origin/main
          test -z "$(git status --porcelain)"
          echo "SOURCE_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      - name: Install engine dependencies
        working-directory: engine-v1
        run: npm ci --no-audit --no-fund

      - name: Fail-closed unpublished Day28 precondition
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from "node:fs";
          const day = process.env.DAY_KEY;
          const expected = process.env.EXPECTED_PREVIOUS_LATEST;
          const latest = JSON.parse(fs.readFileSync("data/deploy-snapshots/latest.json", "utf8"));
          if (latest?.date === day) {
            throw new Error(`day28_already_published_refuse_recovery_mutation:${day}`);
          }
          if (latest?.date !== expected) {
            throw new Error(`unexpected_latest:${latest?.date || "missing"}:expected:${expected}`);
          }
          console.log(`UNPUBLISHED_DAY28_RECOVERY_PRECONDITION=PASS latest=${latest.date}`);
          NODE

      - name: Rebuild complete pre-Value Day28 snapshot
        shell: bash
        run: |
          set -euo pipefail
          node ./engine-v1/jobs/build-details-day.js "$DAY_KEY" --rebuild
          node ./engine-v1/jobs/export-deploy-snapshot-day.js "$DAY_KEY" \
            --no-update-latest \
            --replace-details \
            --no-build-missing-details \
            --fail-on-missing-details

      - name: Bootstrap missing Plan A exactly once from first production build
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from "node:fs";
          import { buildValueDay } from "./engine-v1/core/build-value-day.js";
          import {
            ensurePlanAObservationDay,
            readPlanAObservationDay
          } from "./engine-v1/value/plan-a-observation.js";

          const day = process.env.DAY_KEY;
          const latest = JSON.parse(fs.readFileSync("data/deploy-snapshots/latest.json", "utf8"));
          if (latest?.date !== process.env.EXPECTED_PREVIOUS_LATEST) {
            throw new Error("plan_a_bootstrap_requires_unpublished_day28");
          }

          const before = readPlanAObservationDay(day);
          const existsBefore = fs.existsSync(before.file);
          if (existsBefore && before.ok !== true) {
            throw new Error(`invalid_existing_plan_a_observation:${before.reason || "unknown"}`);
          }

          if (!existsBefore) {
            const production = await buildValueDay(day, { rebuild: true });
            if (!production || production.ok === false || !Array.isArray(production.picks)) {
              throw new Error("first_plan_a_production_build_failed");
            }

            const frozen = ensurePlanAObservationDay(day, production, {
              sourcePath: `data/value/${day}.json`,
              provenance: {
                kind: "one_shot_unpublished_day28_recovery_first_freeze",
                note: "Day28 was never published. Freeze the first production Plan A build once; subsequent refreshes must preserve it immutably."
              }
            });

            if (frozen?.ok !== true || frozen?.created !== true || frozen?.conflict === true) {
              throw new Error(`plan_a_first_freeze_failed:${frozen?.reason || "unknown"}`);
            }
          }

          const after = readPlanAObservationDay(day);
          if (after?.ok !== true || !fs.existsSync(after.file)) {
            throw new Error(`plan_a_freeze_validation_failed:${after?.reason || "unknown"}`);
          }

          console.log("PLAN_A_FIRST_FREEZE=PASS " + JSON.stringify({
            count: Number(after?.payload?.count || 0),
            observationSignature: after?.payload?.observationSignature || null
          }));
          NODE

      - name: Bootstrap missing A2 B2 observations exactly once
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import {
            buildValueA2B2Day,
            readFrozenAdjustedValueObservations
          } from "./engine-v1/jobs/build-value-a2-b2-day.js";

          const day = process.env.DAY_KEY;
          const before = readFrozenAdjustedValueObservations(day);
          const hasA2 = Boolean(before?.A2);
          const hasB2 = Boolean(before?.B2);
          if (hasA2 !== hasB2) {
            throw new Error("partial_adjusted_observation_state_refused");
          }

          if (!hasA2 && !hasB2) {
            const result = await buildValueA2B2Day(day, {
              calendarDay: "2026-08-27"
            });
            if (result?.ok !== true || result?.freezeObservations !== false) {
              throw new Error(`adjusted_observation_bootstrap_failed:${result?.reason || "unknown"}`);
            }
          }

          const after = readFrozenAdjustedValueObservations(day);
          if (!after?.A2 || !after?.B2) {
            throw new Error("adjusted_observation_freeze_validation_failed");
          }
          console.log("A2_B2_FIRST_FREEZE=PASS");
          NODE

      - name: Refresh official Day28 Value artifacts
        shell: bash
        run: |
          set -euo pipefail
          node ./engine-v1/jobs/refresh-value-artifacts-day.js \
            --date="$DAY_KEY" \
            --no-update-latest

      - name: Synchronize Details and diagnostics
        shell: bash
        run: |
          set -euo pipefail
          node ./engine-v1/jobs/build-details-day.js "$DAY_KEY" --rebuild
          node ./engine-v1/jobs/export-deploy-snapshot-day.js "$DAY_KEY" \
            --no-update-latest \
            --replace-details \
            --no-build-missing-details \
            --fail-on-missing-details
          node ./engine-v1/jobs/verify-details-value-mirror-day.js --date="$DAY_KEY" --gate
          node ./engine-v1/jobs/build-value-comparison-cumulative.js --write
          node ./engine-v1/jobs/run-snapshot-invariant-check.js "$DAY_KEY" || true

      - name: Freshness self-heal and gate
        shell: bash
        run: |
          set -euo pipefail
          if ! node ./engine-v1/jobs/verify-artifact-freshness-day.js --date="$DAY_KEY" --gate; then
            node ./engine-v1/jobs/build-details-day.js "$DAY_KEY" --rebuild
            node ./engine-v1/jobs/export-deploy-snapshot-day.js "$DAY_KEY" \
              --no-update-latest \
              --replace-details \
              --no-build-missing-details \
              --fail-on-missing-details
            node ./engine-v1/jobs/refresh-value-artifacts-day.js --date="$DAY_KEY" --no-update-latest
            node ./engine-v1/jobs/verify-details-value-mirror-day.js --date="$DAY_KEY" --gate
            node ./engine-v1/jobs/build-value-comparison-cumulative.js --write
            node ./engine-v1/jobs/run-snapshot-invariant-check.js "$DAY_KEY" || true
          fi
          node ./engine-v1/jobs/verify-artifact-freshness-day.js --date="$DAY_KEY" --gate

      - name: Foundation and hard prepublish gates
        shell: bash
        run: |
          set -euo pipefail
          node ./engine-v1/jobs/build-foundation-integrity-report.js --date="$DAY_KEY" --gate
          node ./engine-v1/jobs/run-snapshot-invariant-check.js "$DAY_KEY" --gate
          node ./engine-v1/jobs/check-value-artifact-gate.js --date="$DAY_KEY"
          node ./engine-v1/jobs/build-day-report.js --date="$DAY_KEY"
          node ./engine-v1/jobs/build-system-health-alerts-day.js --date="$DAY_KEY"
          node ./engine-v1/jobs/verify-daily-publish-contract.js --date="$DAY_KEY" --prepublish --gate

      - name: Promote Day28 latest and verify final contract
        shell: bash
        run: |
          set -euo pipefail
          node ./engine-v1/jobs/promote-deploy-snapshot-latest-day.js --date="$DAY_KEY"
          node ./engine-v1/jobs/verify-daily-publish-contract.js --date="$DAY_KEY" --gate

      - name: Stage exact Day28 publication outputs
        shell: bash
        run: |
          set -euo pipefail
          git restore --staged . || true
          git add "data/deploy-snapshots/latest.json"
          git add "data/deploy-snapshots/${DAY_KEY}/"
          test -f "data/build-reports/${DAY_KEY}.json" && git add "data/build-reports/${DAY_KEY}.json" || true
          test -f "data/foundation-integrity/${DAY_KEY}.json" && git add "data/foundation-integrity/${DAY_KEY}.json" || true
          test -f "data/foundation-integrity/latest.json" && git add "data/foundation-integrity/latest.json" || true
          test -f "data/system-health/${DAY_KEY}.json" && git add "data/system-health/${DAY_KEY}.json" || true
          test -f "data/system-health/latest.json" && git add "data/system-health/latest.json" || true
          test -f "data/value/${DAY_KEY}.json" && git add "data/value/${DAY_KEY}.json" || true
          test -f "data/value/_audit/${DAY_KEY}.json" && git add "data/value/_audit/${DAY_KEY}.json" || true
          test -d "data/value-plans/${DAY_KEY}" && git add "data/value-plans/${DAY_KEY}/" || true
          test -f "data/value-comparison/${DAY_KEY}.json" && git add "data/value-comparison/${DAY_KEY}.json" || true
          test -f "data/value-comparison/cumulative.json" && git add "data/value-comparison/cumulative.json" || true
          test -f "data/plan-c-shadow/${DAY_KEY}.json" && git add "data/plan-c-shadow/${DAY_KEY}.json" || true
          test -f "data/plan-c-shadow/_audit/${DAY_KEY}.json" && git add "data/plan-c-shadow/_audit/${DAY_KEY}.json" || true

          node ./engine-v1/jobs/guard-staged-data-boundary.js \
            --label=day28-plan-a-bootstrap-repair \
            --dayKey="$DAY_KEY" \
            --allow="^(data/deploy-snapshots/latest\\.json$|data/deploy-snapshots/${DAY_KEY}/|data/build-reports/${DAY_KEY}\\.json$|data/foundation-integrity/${DAY_KEY}\\.json$|data/foundation-integrity/latest\\.json$|data/system-health/${DAY_KEY}\\.json$|data/system-health/latest\\.json$|data/value/${DAY_KEY}\\.json$|data/value/_audit/${DAY_KEY}\\.json$|data/value-plans/${DAY_KEY}/|data/value-comparison/${DAY_KEY}\\.json$|data/value-comparison/cumulative\\.json$|data/plan-c-shadow/${DAY_KEY}\\.json$|data/plan-c-shadow/_audit/${DAY_KEY}\\.json$)"
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"

      - name: Commit and race-safe push Day28
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          PARENT="$(git rev-parse HEAD)"
          git commit -m "Recovery: Publish Day28 with frozen Value observations"
          CANDIDATE="$(git rev-parse HEAD)"
          git fetch origin main
          REMOTE="$(git rev-parse origin/main)"
          if [ "$REMOTE" != "$PARENT" ]; then
            echo "DAY28_PUBLICATION_PUSH_RACE=STOP"
            exit 1
          fi
          git push origin HEAD:main
          echo "PUBLISHED_REF=$CANDIDATE" >> "$GITHUB_ENV"
          echo "DAY28_PUBLICATION_PUSH=PASS ref=$CANDIDATE"

      - name: Promote and verify public engine Day28
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          bash tools/sync-public-snapshot.sh "$DAY_KEY" "$PUBLISHED_REF"

      - name: Final Day28 evidence
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require("fs");
          const day = process.env.DAY_KEY;
          const latest = JSON.parse(fs.readFileSync("data/deploy-snapshots/latest.json", "utf8"));
          const manifest = JSON.parse(fs.readFileSync(`data/deploy-snapshots/${day}/manifest.json`, "utf8"));
          const planA = JSON.parse(fs.readFileSync(`data/value-plans/${day}/plan-a.json`, "utf8"));
          const planA2 = JSON.parse(fs.readFileSync(`data/value-plans/${day}/plan-a2.json`, "utf8"));
          const planB2 = JSON.parse(fs.readFileSync(`data/value-plans/${day}/plan-b2.json`, "utf8"));
          if (latest?.date !== day || manifest?.date !== day || planA?.immutable !== true || !planA2 || !planB2) {
            throw new Error("day28_final_evidence_mismatch");
          }
          console.log("DAY28_RECOVERY=CLOSED " + JSON.stringify({
            publishedRef: process.env.PUBLISHED_REF,
            latestDate: latest.date,
            latestHash: latest.hash,
            manifestHash: manifest.hash,
            counts: manifest.counts,
            planAImmutable: planA.immutable === true,
            planACount: Number(planA.count || 0),
            planA2Count: Number(planA2.count || 0),
            planB2Count: Number(planB2.count || 0)
          }));
          NODE
