name: P0 Stage20 96 legacy standings evidence source and gate proof
on:
  pull_request:
    paths:
      - "tools/audit-stage20-league-standings-custody.mjs"
      - "tools/audit-stage20-league-standings-custody.test.mjs"
      - ".github/workflows/p0-stage20-league-standings-custody.yml"
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/audit-stage20-league-standings-custody.mjs
            tools/audit-stage20-league-standings-custody.test.mjs
            tools/audit-daily954-stage20-history.mjs
            engine-v1/storage/standings-memory-db.js
            engine-v1/core/daily-resume-stage20-admission.mjs
            engine-v1/core/daily-resume-stage20-journal-admission.mjs
            engine-v1/core/season-closure-contract.js
            .github/workflows/p0-stage20-league-standings-custody.yml
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Source-verified accumulated results and negative tests
        run: |
          node --check tools/audit-stage20-league-standings-custody.mjs
          node --check tools/audit-stage20-league-standings-custody.test.mjs
          node --test --test-reporter=tap tools/audit-stage20-league-standings-custody.test.mjs
      - uses: actions/download-artifact@v4
        with:
          name: history-recovery-45137286904-1
          run-id: 45137286904
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/stage20-original
      - name: Inspect 96 actual standings evidence payloads and trusted model gate
        shell: bash
        run: |
          set -euo pipefail
          node tools/audit-stage20-league-standings-custody.mjs \
            "$RUNNER_TEMP/stage20-original" "$GITHUB_WORKSPACE" \
            > "$RUNNER_TEMP/results-memory-custody.jsonl"
          cat "$RUNNER_TEMP/results-memory-custody.jsonl"
          node --input-type=module - "$RUNNER_TEMP/results-memory-custody.jsonl" <<'NODE'
          import fs from "node:fs";
          import assert from "node:assert/strict";
          const raw=fs.readFileSync(process.argv[2],"utf8").trim();
          assert.ok(raw.startsWith("STAGE20_LEAGUE_STANDINGS_CUSTODY="));
          const r=JSON.parse(raw.slice(raw.indexOf("=")+1));
          assert.equal(r.files,96);
          assert.equal(r.allLeagueMemoryFiles,99);
          assert.equal(r.rootFilesNeedingSeparateWriterProof,3);
          assert.equal(r.validPayloads,96);
          assert.equal(r.invalidPaths,0);
          assert.equal(r.invalidShape,0);
          assert.equal(r.writer.trustedStandingsGateRequired,true);
          assert.equal(r.writer.productionModelTruthFromLegacyMemory,false);
          assert.equal(r.exactStandingsLegacyBytesRequired,true);
          assert.equal(r.omissionAuthorized,false);
          assert.equal(r.productionStandingsTruthIndependentlyVerified,false);
          assert.equal(r.productionWrites,0);
          NODE
      - name: No production mutation or Stage20 omitted baseline
        run: |
          git diff --exit-code HEAD -- data/ .github/workflows/daily-deploy-snapshot.yml
          echo "STANDINGS_LEGACY_SOURCE_BOUND_GATE_RETAINED_NO_RESUME_NO_PUBLISH"
