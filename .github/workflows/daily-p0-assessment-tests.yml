name: Daily P0 assessment regression tests

on:
  pull_request:
    paths:
      - "engine-v1/core/merge-certified-odds-assessments.js"
      - "engine-v1/jobs/export-odds-snapshot-day.js"
      - "engine-v1/jobs/run-odds-refresh.js"
      - "engine-v1/jobs/daily-p0-certified-odds-merge.test.js"
      - ".github/workflows/daily-p0-assessment-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install root dependencies
        run: npm ci --no-audit --no-fund
      - name: Install engine dependencies
        run: npm ci --prefix engine-v1 --no-audit --no-fund
      - name: Verify modified JavaScript syntax
        run: |
          node --check engine-v1/core/merge-certified-odds-assessments.js
          node --check engine-v1/jobs/export-odds-snapshot-day.js
          node --check engine-v1/jobs/run-odds-refresh.js
          node --check engine-v1/jobs/daily-p0-certified-odds-merge.test.js
      - name: Run focused regression against real repository modules
        run: node --test --test-reporter=tap engine-v1/jobs/daily-p0-certified-odds-merge.test.js engine-v1/jobs/run-odds-refresh.test.js
      - name: Full engine test suite
        run: |
          find engine-v1 -type f -name '*.test.js' -not -path '*/node_modules/*' -print0 |
            xargs -0 -r node --test --test-reporter=tap > /tmp/engine-suite.tap
          tail -n 30 /tmp/engine-suite.tap
