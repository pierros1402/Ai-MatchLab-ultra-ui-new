name: Intraday first-publication regression
on:
  pull_request:
    paths:
      - 'engine-v1/**'
      - 'workers/**'
      - 'tools/**'
      - '.github/**'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - 'engine-v1/**'
      - 'workers/**'
      - 'tools/**'
      - '.github/**'
      - 'package.json'
      - 'package-lock.json'
permissions:
  contents: read
jobs:
  bootstrap-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            engine-v1
            workers
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: >-
          node --test
          engine-v1/tests/intraday-bootstrap-artifact-presence.test.js
          engine-v1/tests/intraday-authoritative-detail-sweep.test.js
          engine-v1/jobs/intraday-publication-universe.test.js
          engine-v1/tests/intraday-snapshot-invariant-gate.test.js
          engine-v1/jobs/prepare-intraday-runtime-release.test.js
          engine-v1/jobs/system-health-runtime-sync.v32.test.js
