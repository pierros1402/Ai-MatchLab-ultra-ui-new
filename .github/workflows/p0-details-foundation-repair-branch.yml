name: P0 details foundation repair branch

on:
  push:
    branches:
      - work/p0-details-foundation-bootstrap-20260811
    paths:
      - ".github/workflows/p0-details-foundation-repair-branch.yml"

permissions:
  contents: write

concurrency:
  group: p0-details-foundation-repair-branch
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: work/p0-details-foundation-bootstrap-20260811
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      - name: Install engine dependencies
        working-directory: engine-v1
        run: npm ci --no-audit --no-fund

      - name: Apply exact Value accounting patch
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require("fs");
          const file = "engine-v1/core/build-value-day.js";
          let source = fs.readFileSync(file, "utf8").replace(/\r\n/g, "\n");

          const anchor = `  for (const m of sourceMatches) {\n    if (!isPlayable(m)) { auditRejections.push({ matchId: auditIdOf(m), reason: "not_playable" }); continue; }\n    if (rebuild) continue; // eligible under rebuild semantics`;
          const replacement = `  for (const m of sourceMatches) {\n    // Non-playable fixtures are terminally accounted exactly once in the\n    // evaluation loop below. The pre-audit pass owns only predicates that the\n    // evaluation loop intentionally skips without emitting a rejection.\n    if (!isPlayable(m)) { continue; }\n    if (rebuild) continue; // eligible under rebuild semantics`;

          const first = source.indexOf(anchor);
          const last = source.lastIndexOf(anchor);
          if (first < 0 || first !== last) {
            throw new Error("value_accounting_anchor_count_not_one");
          }

          source = source.slice(0, first) + replacement + source.slice(first + anchor.length);
          fs.writeFileSync(file, source, "utf8");
          NODE

      - name: Validate syntax and targeted regression
        shell: bash
        run: |
          set -euo pipefail
          node --check engine-v1/core/build-value-day.js
          node --check engine-v1/tests/value-evaluation-accounting-nonplayed.test.js
          node --check engine-v1/jobs/ensure-details-history-index-foundation-day.js
          node --check engine-v1/jobs/run-daily-cycle.js
          node --test \
            engine-v1/tests/value-evaluation-accounting-nonplayed.test.js \
            engine-v1/tests/non-played-state-contract.test.js \
            engine-v1/tests/value-contract-hardening.test.js \
            engine-v1/tests/details-history-index-foundation-self-heal.test.js \
            engine-v1/tests/daily-details-foundation-order.test.js \
            engine-v1/tests/rebuild-indexes-for-season.test.js

      - name: Verify patch scope
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          CHANGED="$(git diff --name-only)"
          test "$CHANGED" = "engine-v1/core/build-value-day.js"
          git diff --check

      - name: Commit validated production patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine-v1/core/build-value-day.js
          git commit -m "Fix non-played Value evaluation accounting"
          git push origin HEAD:work/p0-details-foundation-bootstrap-20260811
