name: Historical verified FT snapshot watchdog

on:
  # Exercise the real read-only public parity check immediately after rollout.
  push:
    branches: [main]
    paths:
      - '.github/workflows/historical-ft-snapshot-watchdog.yml'
  pull_request:
    paths:
      - '.github/workflows/historical-ft-snapshot-watchdog.yml'
      - 'tools/check-historical-ft-snapshot-drift.mjs'
      - 'tools/check-historical-ft-snapshot-drift.test.mjs'
      - 'tools/check-historical-public-snapshot-parity.mjs'
      - 'tools/check-historical-public-snapshot-parity.test.mjs'
  workflow_run:
    workflows:
      - "Historical FT public closure verification"
    types: [completed]
    branches: [main]
  workflow_dispatch:
  schedule:
    # Watch the most recent two Athens calendar days without rebuilding the full Daily.
    # Intraday already has the exclusive data-writer admission and release parity gates.
    - cron: "17 */2 * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: ai-matchlab-historical-ft-watchdog
  # Supersede obsolete PR checks; retain non-cancelling production monitoring.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  inspect-and-dispatch:
    # A successful closure check does not require a new writer. Failed
    # read-only closure checks enter the existing guarded repair lane.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout immutable starting point
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            tools
            data/final-results
            data/deploy-snapshots

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Verify watchdog regression controls
        run: node --test tools/check-historical-ft-snapshot-drift.test.mjs tools/check-historical-public-snapshot-parity.test.mjs

      - name: Compare verified prior FT with published snapshots
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          TODAY="$(TZ=Europe/Athens date +%F)"
          node tools/check-historical-ft-snapshot-drift.mjs "$TODAY" >> "$GITHUB_OUTPUT"

      - name: Compare prior-day public mirror with immutable manifests
        if: github.event_name != 'pull_request' && steps.inspect.outputs.target_day == ''
        id: public
        shell: bash
        run: |
          set -euo pipefail
          TODAY="$(TZ=Europe/Athens date +%F)"
          node tools/check-historical-public-snapshot-parity.mjs "$TODAY" >> "$GITHUB_OUTPUT"

      - name: Request existing guarded intraday reconciliation
        if: github.event_name != 'pull_request' && (steps.inspect.outputs.target_day != '' || steps.public.outputs.target_day != '')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_DAY: ${{ steps.inspect.outputs.target_day || steps.public.outputs.target_day }}
        run: |
          set -euo pipefail
          case "$TARGET_DAY" in
            ????-??-??) ;;
            *) echo "Invalid target day" >&2; exit 1 ;;
          esac
          echo "Requesting guarded intraday verified-FT reconciliation for $TARGET_DAY"
          gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/intraday-deploy-snapshot-refresh.yml/dispatches" \
            -f ref=main -f "inputs[dayKey]=$TARGET_DAY"
