name: Published final status convergence

on:
  workflow_run:
    workflows: [Daily deploy snapshot]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      applyClosedDays:
        description: "Manual gated application; requires independent repository authorization."
        required: true
        type: boolean
        default: false
permissions:
  contents: write
  actions: read

jobs:
  admission:
    runs-on: ubuntu-latest
    outputs:
      allow: ${{ steps.priority.outputs.allow }}
    steps:
      - name: Leave active Daily publication priority without queueing repair ticks
        id: priority
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FILE="$RUNNER_TEMP/daily-priority.json"
          curl -fsS -H "Authorization: Bearer $GITHUB_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/daily-deploy-snapshot.yml/runs?branch=main&per_page=20" -o "$FILE"
          ALLOW="$(node -e 'const x=require(process.argv[1]);if(!Array.isArray(x.workflow_runs))process.exit(1);process.stdout.write(x.workflow_runs.some(r=>r.status!=="completed")?"false":"true")' "$FILE")"
          echo "allow=$ALLOW" >> "$GITHUB_OUTPUT"
  converge-closed-days:
    needs: admission
    if: >-
      needs.admission.outputs.allow == 'true' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.applyClosedDays == true &&
      vars.V35_FINAL_STATUS_APPLY_AUTHORIZED == 'true'
    concurrency:
      group: ai-matchlab-data-writer
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          fetch-tags: false
          filter: blob:none
      - name: Load complete history of the selected branch only
        run: node tools/fetch-selected-history.mjs
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Verify terminal-only publication rules
        run: >-
          node --test
          engine-v1/jobs/refresh-published-final-status-day.test.js
          engine-v1/jobs/sync-deploy-snapshot-release.test.js
          engine-v1/core/build-match-intelligence-context.test.js
          engine-v1/value/daily-plan-a-checkpoint.test.js
          engine-v1/tests/history-protection-watchdog.test.js
          engine-v1/tests/publication-runtime-contract.test.js
      - name: Refresh existing closed-day snapshots from verified canonical finals
        run: node engine-v1/jobs/refresh-published-final-status-day.js --days-back=7 --apply
      - name: Persist only validated dated snapshots
        shell: bash
        run: |
          set -euo pipefail
          git restore --staged .
          IFS=',' read -ra DAYS <<< "${FINAL_STATUS_CHANGED_DAYS:-}"
          for day in "${DAYS[@]}"; do
            [ -z "$day" ] && continue
            [[ "$day" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || exit 1
            git add "data/deploy-snapshots/$day/"
          done
          # Never stage canonical truth, predictions, histories or latest.json.
          if ! git diff --cached --quiet; then
            DAYS_RE="${FINAL_STATUS_CHANGED_DAYS//,/|}"
            node engine-v1/jobs/guard-staged-data-boundary.js --label=closed-day-final-status --allow="^data/deploy-snapshots/(${DAYS_RE})/"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Converge published closed-day status to verified final truth'
            bash tools/git-push-rebase-retry.sh
          fi
          echo "FINAL_STATUS_REF=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Converge public dated releases and verify their exact hashes
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          FAILED=0
          IFS=',' read -ra DAYS <<< "${FINAL_STATUS_AVAILABLE_DAYS:-}"
          for day in "${DAYS[@]}"; do
            [ -z "$day" ] && continue
            EXPECTED="$(node -p "JSON.parse(require('fs').readFileSync('data/deploy-snapshots/${day}/manifest.json','utf8')).hash")"
            PUBLIC="$(curl -fsS --connect-timeout 10 --max-time 25 "https://ai-matchlab-engine.onrender.com/deploy-snapshot?date=${day}" 2>/dev/null || true)"
            if printf '%s' "$PUBLIC" | EXPECTED="$EXPECTED" node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>{try{const x=JSON.parse(s);process.exit(x.ok===true&&x.manifest?.hash===process.env.EXPECTED?0:1)}catch{process.exit(1)}})'; then
              echo "Dated release $day already matches $EXPECTED"
            elif ! bash tools/sync-public-snapshot.sh "$day" "$FINAL_STATUS_REF"; then
              echo "ERROR: dated release $day did not converge"
              FAILED=1
            fi
          done
          if node -e 'const x=require(process.env.RUNNER_TEMP+"/final-status-refresh.json");process.exit(x.reports.some(r=>r.error)?0:1)'; then
            echo 'ERROR: at least one dated refresh failed its truth/immutability contract'
            FAILED=1
          fi
          exit "$FAILED"
      - name: Preserve exact repair decisions and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-final-status-${{ github.run_id }}
          path: ${{ runner.temp }}/final-status-refresh.json
          if-no-files-found: warn
          retention-days: 90
