name: TMP Value coverage post-fix audit 20260914

on:
  push:
    branches:
      - audit/20260914-value-coverage-postfix
  workflow_dispatch:

permissions:
  contents: read

jobs:
  value-coverage-postfix-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Verify exact audited base
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(git rev-parse HEAD^)"
          test "$BASE" = "13b799c71ca574fc8e897051a7015e8cba61db9b"
          echo "AUDITED_BASE=$BASE"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm --prefix engine-v1 ci --no-audit --no-fund

      - name: Rebuild Value coverage evidence in runner only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/value-coverage-postfix
          node ./engine-v1/jobs/build-value-coverage-report-day.js 2026-09-14
          cp data/value/_coverage-reports/2026-09-14.json /tmp/value-coverage-postfix/value-coverage-2026-09-14.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = '/tmp/value-coverage-postfix/value-coverage-2026-09-14.json';
          const r = JSON.parse(fs.readFileSync(file, 'utf8'));
          const total = Number(r?.counts?.totalRows || 0);
          const returned = Number(r?.counts?.valueReturned || 0);
          const nulls = Number(r?.counts?.valueNull || 0);
          const out = {
            schema: 'ai-matchlab.value-coverage-postfix-audit.v1',
            ok: r?.ok === true && total > 0 && returned + nulls === total && Number(r?.counts?.valueFailed || 0) === 0,
            auditedBase: '13b799c71ca574fc8e897051a7015e8cba61db9b',
            dayKey: r?.dayKey || null,
            source: r?.source || null,
            counts: r?.counts || null,
            coverageRate: total > 0 ? returned / total : null,
            nullByReason: r?.breakdown?.nullByReason || {},
            nullByClass: r?.breakdown?.nullByClass || {},
            nullByLeague: r?.breakdown?.nullByLeague || {},
            unknownMinimumSampleRows: (r?.rows || []).filter(x => x?.nullClass === 'unknown_minimum_sample_null').map(x => ({
              matchId: x.matchId,
              leagueSlug: x.leagueSlug,
              homeTeam: x.homeTeam,
              awayTeam: x.awayTeam,
              minimumSample: x.minimumSample
            }))
          };
          fs.writeFileSync('/tmp/value-coverage-postfix/summary.json', JSON.stringify(out, null, 2) + '\n');
          console.log(JSON.stringify(out, null, 2));
          if (!out.ok) process.exit(1);
          NODE

      - name: Remove runner-only generated evidence and prove checkout clean
        shell: bash
        run: |
          set -euo pipefail
          rm -f data/value/_coverage-reports/2026-09-14.json
          rmdir data/value/_coverage-reports 2>/dev/null || true
          rmdir data/value 2>/dev/null || true
          if [ -n "$(git status --porcelain)" ]; then
            echo "ERROR: read-only audit changed checkout"
            git status --short
            exit 1
          fi
          echo "READ_ONLY_CHECKOUT_CLEAN=true"

      - name: Upload post-fix coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: value-coverage-postfix-audit-20260914
          path: /tmp/value-coverage-postfix/
          if-no-files-found: warn
          retention-days: 14
