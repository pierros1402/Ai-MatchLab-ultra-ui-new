name: TMP provider scope classification validation 20260914

on:
  push:
    branches:
      - fix/20260914-provider-scope-classification-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-scope-classification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated patch branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install engine dependencies
        working-directory: engine-v1
        run: npm ci --no-audit --no-fund

      - name: Syntax checks
        run: |
          node --check engine-v1/core/flashscore-competition-identity.js
          node --check engine-v1/tests/flashscore-competition-scope-policy.test.js
          git diff --check 36870d57fa27d113bab5f6de44228dabbc8a9d28..HEAD

      - name: Run scope and routing tests
        run: |
          node --test \
            engine-v1/tests/flashscore-competition-scope-policy.test.js \
            engine-v1/tests/flashscore-adapter-competition-routing.test.js

      - name: Verify all declared exact provider paths still resolve
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { knownLeaguePaths, resolveSlugFromPath } from './engine-v1/odds/flashscore-league-map.js';
          import { resolveFlashscoreCompetitionIdentity } from './engine-v1/core/flashscore-competition-identity.js';

          const paths = knownLeaguePaths();
          const failures = [];
          for (const leaguePath of paths) {
            const expectedSlug = resolveSlugFromPath(leaguePath);
            if (!expectedSlug) continue;
            const result = resolveFlashscoreCompetitionIdentity({ leaguePath, leagueName: 'mapped-provider-path' });
            if (result?.status !== 'resolved' || result?.canonicalSlug !== expectedSlug) {
              failures.push({ leaguePath, expectedSlug, result });
            }
          }
          if (failures.length) throw new Error(`Mapped path regressions: ${JSON.stringify(failures.slice(0,20))}`);
          console.log(JSON.stringify({ok:true, mappedPathsChecked:paths.length, failures:0}, null, 2));
          NODE

      - name: Verify exact 52-case scope matrix
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { resolveFlashscoreCompetitionIdentity } from './engine-v1/core/flashscore-competition-identity.js';

          const expectedCandidatePaths = new Set([
            '/football/asia/asean-club-championship/',
            '/football/bhutan/premier-league/',
            '/football/bolivia/copa-simon-bolivar/',
            '/football/costa-rica/primera-division/',
            '/football/dominican-republic/ldf/',
            '/football/el-salvador/primera-division/',
            '/football/guatemala/liga-nacional/',
            '/football/honduras/liga-nacional/',
            '/football/iraq/stars-league/',
            '/football/panama/lpf/',
            '/football/paraguay/copa-de-primera/',
            '/football/paraguay/division-intermedia/',
            '/football/singapore/premier-league/',
            '/football/sri-lanka/super-league/'
          ]);

          const r = JSON.parse(fs.readFileSync('data/coverage-readiness/2026-09-14.json','utf8'));
          const rows = r?.activeCompetitionCompleteness?.providerCandidates || [];
          if (rows.length !== 52) throw new Error(`Expected baseline candidate set of 52, got ${rows.length}`);

          const classified = rows.map(x => {
            const result = resolveFlashscoreCompetitionIdentity({
              country: x.providerCountry || '',
              leagueName: x.providerName || '',
              leaguePath: x.providerPath || '',
              providerCompetitionId: x.providerCompetitionId || null
            });
            return {
              path: x.providerPath || '',
              name: x.providerName || '',
              country: x.providerCountry || '',
              status: result?.status || null,
              reasonCode: result?.reasonCode || null,
              canonicalSlug: result?.canonicalSlug || null
            };
          });

          const excluded = classified.filter(x => x.status === 'excluded');
          const candidates = classified.filter(x => x.status === 'quarantined');
          const resolved = classified.filter(x => x.status === 'resolved');
          const unexpected = classified.filter(x => !['excluded','quarantined','resolved'].includes(x.status));

          if (excluded.length !== 38) throw new Error(`Expected 38 excluded, got ${excluded.length}`);
          if (candidates.length !== 14) throw new Error(`Expected 14 retained candidates, got ${candidates.length}`);
          if (resolved.length !== 0) throw new Error(`Expected 0 newly resolved rows, got ${resolved.length}`);
          if (unexpected.length !== 0) throw new Error(`Unexpected statuses: ${JSON.stringify(unexpected)}`);

          const actualCandidatePaths = new Set(candidates.map(x => x.path));
          const missing = [...expectedCandidatePaths].filter(x => !actualCandidatePaths.has(x));
          const extra = [...actualCandidatePaths].filter(x => !expectedCandidatePaths.has(x));
          if (missing.length || extra.length) {
            throw new Error(`Retained candidate set mismatch: ${JSON.stringify({missing, extra})}`);
          }

          const reasonCounts = {};
          for (const row of excluded) reasonCounts[row.reasonCode] = (reasonCounts[row.reasonCode] || 0) + 1;
          console.log(JSON.stringify({
            ok: true,
            baselineRows: rows.length,
            excluded: excluded.length,
            retainedCandidates: candidates.length,
            resolved: resolved.length,
            reasonCounts,
            retained: candidates
          }, null, 2));
          NODE

      - name: Prove checkout clean
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --short)"
          echo "PROVIDER_SCOPE_CLASSIFICATION_VALIDATION=PASS"
