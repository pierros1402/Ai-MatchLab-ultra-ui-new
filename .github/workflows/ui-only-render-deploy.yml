name: UI-only Render deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-only-render-deploy
  cancel-in-progress: false

jobs:
  deploy-and-verify-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out exact release
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Trigger Render UI redeploy
        shell: bash
        env:
          RENDER_UI_DEPLOY_HOOK_URL: ${{ secrets.RENDER_UI_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${RENDER_UI_DEPLOY_HOOK_URL:-}" ]; then
            echo "ERROR: RENDER_UI_DEPLOY_HOOK_URL is not configured."
            exit 1
          fi
          curl -fsS -X POST "${RENDER_UI_DEPLOY_HOOK_URL}"

      - name: Verify public UI release
        shell: bash
        run: bash tools/verify-public-ui-release.sh "${GITHUB_SHA}"
