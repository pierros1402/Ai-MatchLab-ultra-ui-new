name: P0 dispatch historical Daily

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/p0-dispatch-historical-daily.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch historical Daily recovery
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DAY_KEY: "2026-09-01"
        run: |
          set -euo pipefail
          RESPONSE_FILE="$RUNNER_TEMP/daily-dispatch-response.txt"
          PAYLOAD="$(printf '{"ref":"main","inputs":{"dayKey":"%s","triggerRender":"false","recoverPlanAObservationSignature":""}}' "$DAY_KEY")"
          HTTP_CODE="$(curl -sS -o "$RESPONSE_FILE" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/270329104/dispatches" \
            --data "$PAYLOAD")"
          cat "$RESPONSE_FILE" || true
          if [ "$HTTP_CODE" != "204" ]; then
            echo "ERROR: Daily workflow dispatch failed with HTTP $HTTP_CODE"
            exit 1
          fi
          echo "Dispatched Daily deploy snapshot for $DAY_KEY"
