name: P3.1 main baseline regression

on:
  push:
    branches:
      - work/p31-atomic-midnight-rollover-20260822

permissions:
  contents: read
  statuses: write

concurrency:
  group: p31-main-baseline-regression
  cancel-in-progress: true

jobs:
  baseline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact main baseline
        uses: actions/checkout@v7
        with:
          ref: c294a8dc55888a57ebbdb5504c9ddb6399e8450a

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      - name: Install engine dependencies
        working-directory: engine-v1
        run: npm ci --no-audit --no-fund

      - name: Full baseline regression with TAP evidence
        shell: bash
        run: |
          set -uo pipefail
          mapfile -t tests < <(find engine-v1/tests -maxdepth 1 -type f -name '*.test.js' -print | sort)
          echo "ENGINE_TEST_FILES=${#tests[@]}"
          set +e
          node --test --test-reporter=tap "${tests[@]}" 2>&1 | tee /tmp/p31-baseline-test.log
          TEST_EXIT=${PIPESTATUS[0]}
          set -e
          echo "TEST_EXIT=${TEST_EXIT}" >> "$GITHUB_ENV"

      - name: Publish baseline counts and failures
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TEST_EXIT="${TEST_EXIT:-99}"
          if [ "$TEST_EXIT" = "0" ]; then STATE=success; else STATE=failure; fi

          post_status() {
            local context="$1"
            PAYLOAD="$(CONTEXT="$context" STATE="$STATE" node -e 'process.stdout.write(JSON.stringify({state:process.env.STATE,context:process.env.CONTEXT,description:"P3.1 main baseline regression evidence"}))')"
            curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -d "$PAYLOAD" >/dev/null
          }

          SUMMARY="$(grep -E '^# (tests|pass|fail|cancelled|skipped|todo) ' /tmp/p31-baseline-test.log | tail -n 6 | tr '\n' ' ' || true)"
          SUMMARY="${SUMMARY:-TEST_EXIT=${TEST_EXIT}}"
          post_status "P3.1 BASELINE SUMMARY ${SUMMARY:0:180}"

          mapfile -t FAILS < <(grep '^not ok ' /tmp/p31-baseline-test.log || true)
          if [ "${#FAILS[@]}" -eq 0 ]; then
            post_status "P3.1 BASELINE FAIL none captured"
          else
            limit=${#FAILS[@]}
            [ "$limit" -gt 8 ] && limit=8
            for ((i=0; i<limit; i++)); do
              line="${FAILS[$i]}"
              post_status "P3.1 BASELINE FAIL$((i+1)) ${line:0:175}"
            done
          fi

      - name: Enforce baseline result
        if: always()
        shell: bash
        run: test "${TEST_EXIT:-99}" = "0"
