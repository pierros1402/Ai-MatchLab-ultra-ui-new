name: P3.1 full engine regression

on:
  push:
    branches:
      - work/p31-atomic-midnight-rollover-20260822

permissions:
  contents: read
  statuses: write

concurrency:
  group: p31-full-engine-regression
  cancel-in-progress: true

jobs:
  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      - name: Install engine dependencies
        working-directory: engine-v1
        run: npm ci --no-audit --no-fund

      - name: Full engine regression
        shell: bash
        run: |
          mapfile -t tests < <(find engine-v1/tests -maxdepth 1 -type f -name '*.test.js' -print | sort)
          echo "ENGINE_TEST_FILES=${#tests[@]}"
          node --test "${tests[@]}"

      - name: Publish machine-readable regression status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          case "$JOB_STATUS" in
            success) STATE=success ;;
            failure) STATE=failure ;;
            cancelled) STATE=error ;;
            *) STATE=error ;;
          esac
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${STATE}\",\"context\":\"P3.1 full engine regression\",\"description\":\"All engine-v1 test files\"}"
