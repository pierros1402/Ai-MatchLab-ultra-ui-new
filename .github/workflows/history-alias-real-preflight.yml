name: History alias real data preflight
on:
  pull_request:
    paths:
      - '.github/workflows/history-alias-real-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm ci --prefix engine-v1
      - name: Read-only repair plan
        run: node engine-v1/jobs/repair-current-history-identity-alias-duplicates.js --report "$RUNNER_TEMP/history-alias-plan.json"
      - name: Verify no tracked changes
        run: git diff --exit-code
      - name: Trace Israeli fixture across authoritative inputs
        run: |
          git grep -l -i -E 'sofa_16034043|cid_isr2_.*kfarsaba.*petah' -- data/history data/league-memory/results data/canonical-fixtures/2026-05-15 data/final-results/2026-05-15 > "$RUNNER_TEMP/israel-source-paths.txt" || test "$?" = 1
          cat "$RUNNER_TEMP/israel-source-paths.txt"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const ids = new Set(['sofa_16034043','cid_isr2_hapoelkfarsaba_maccabipetahtikva_20260515']);
          const paths = fs.readFileSync(process.env.RUNNER_TEMP+'/israel-source-paths.txt','utf8').trim().split('\n').filter(Boolean);
          const hits = [];
          function walk(value, file, location) {
            if (!value || typeof value !== 'object') return;
            if (!Array.isArray(value) && ['id','matchId','canonicalId','fixtureId'].some(k=>ids.has(String(value[k])))) hits.push({file,location,row:value});
            for (const [k,v] of Object.entries(value)) if(v && typeof v === 'object') walk(v,file,location+'/'+k);
          }
          for(const file of paths) walk(JSON.parse(fs.readFileSync(file,'utf8')),file,'');
          fs.writeFileSync(process.env.RUNNER_TEMP+'/israel-source-rows.json',JSON.stringify(hits,null,2));
          console.log(JSON.stringify(hits));
          JS
      - name: Simulate repair and verify fixed point
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {buildCurrentHistoryIdentityAliasRepairPlan as build, applyCurrentHistoryIdentityAliasRepair as apply} from './engine-v1/jobs/repair-current-history-identity-alias-duplicates.js';
          const plan = build();
          assert.equal(plan.ok, true);
          assert.equal(plan.removals.length, plan.rowsToRemove);
          assert.equal(new Set(plan.removals).size, plan.rowsToRemove);
          const result = apply({plan, backupDir: process.env.RUNNER_TEMP + '/history-alias-backup'});
          assert.equal(result.removed, plan.rowsToRemove);
          const after = build();
          assert.equal(after.rowsToRemove, 0);
          assert.equal(after.sourceRows, plan.sourceRows - plan.rowsToRemove);
          console.log(JSON.stringify({before:plan.sourceRows,after:after.sourceRows,removed:result.removed,remaining:after.rowsToRemove}));
          JS
          git diff --name-only
      - name: Rebuild and validate History Index from repaired history
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {ensureHistoryIndexFoundationForDay} from './engine-v1/jobs/rebuild-indexes-for-season.js';
          import {validateHistoryIndexFoundationSync} from './engine-v1/core/derived-history-foundation.js';
          const day = new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Athens',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
          const result = await ensureHistoryIndexFoundationForDay(day);
          assert.equal(result.ok,true,JSON.stringify(result));
          assert.equal(validateHistoryIndexFoundationSync(result.season).ok,true);
          const again = await ensureHistoryIndexFoundationForDay(day);
          assert.equal(again.ok,true);
          assert.equal(again.rebuilt,false);
          console.log(JSON.stringify({day,season:result.season,historyIndexValidated:true,rebuilt:result.rebuilt,fixedPoint:true}));
          JS
      - name: Rebuild H2H from repaired history in isolated checkout
        run: |
          node engine-v1/jobs/rebuild-h2h-foundation-from-current-history.js
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {validateH2HFoundationSync} from './engine-v1/core/derived-history-foundation.js';
          const result = validateH2HFoundationSync();
          assert.equal(result.ok,true,JSON.stringify(result));
          console.log(JSON.stringify({h2hFoundationValidated:true}));
          JS
          git diff --exit-code -- data/canonical-fixtures data/final-results data/league-memory/results
          git diff --name-only > "$RUNNER_TEMP/history-h2h-changed-paths.txt"
          git diff --binary --no-ext-diff -- data/history data/history-index data/h2h data/h2h-foundation > "$RUNNER_TEMP/history-h2h-candidate.patch"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: history-alias-preflight
          path: |
            ${{ runner.temp }}/history-alias-plan.json
            ${{ runner.temp }}/israel-source-paths.txt
            ${{ runner.temp }}/israel-source-rows.json
            ${{ runner.temp }}/history-h2h-changed-paths.txt
            ${{ runner.temp }}/history-h2h-candidate.patch
          if-no-files-found: warn
