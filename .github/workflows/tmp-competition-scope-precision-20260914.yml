name: TMP competition scope precision validation

on:
  push:
    branches:
      - fix/20260914-competition-scope-precision
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install engine dependencies
        working-directory: engine-v1
        run: npm ci --no-audit --no-fund

      - name: Syntax check
        run: |
          node --check engine-v1/core/flashscore-competition-identity.js
          node --check engine-v1/tests/flashscore-competition-scope-exclusions.test.js

      - name: Run focused competition scope regression
        working-directory: engine-v1
        run: |
          node --test \
            tests/flashscore-competition-scope-exclusions.test.js \
            tests/flashscore-adapter-competition-routing.test.js \
            tests/daily-league-admission-followup-contract.test.js

      - name: Require clean validation checkout
        run: |
          test -z "$(git status --short)" || {
            git status --short
            exit 1
          }
