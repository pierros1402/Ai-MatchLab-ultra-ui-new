name: Apply isolated Value observation family patch

on:
  push:
    branches:
      - work/value-observation-freeze-20260822
    paths:
      - .github/workflows/value-observation-family-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/value-observation-freeze-20260822
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Apply exact anchored patch
        run: node tools/apply-value-observation-family-patch.mjs

      - name: Validate patched source
        run: |
          node --check engine-v1/jobs/refresh-value-artifacts-day.js
          node --check engine-v1/jobs/build-value-a2-b2-day.js
          node --check engine-v1/jobs/refresh-model-assessment-coverage-day.js
          node --check engine-v1/tests/adjusted-value-observation-freeze.test.js
          node --check engine-v1/tests/model-assessment-coverage-contract.test.js

      - name: Commit target patch and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/value-observation-family-patch.yml \
            tools/apply-value-observation-family-patch.mjs
          git add \
            engine-v1/jobs/refresh-value-artifacts-day.js \
            .github/workflows/daily-deploy-snapshot.yml
          git diff --cached --check
          git commit -m "Freeze Value observation family and enforce assessment coverage"
          git push origin HEAD:work/value-observation-freeze-20260822
