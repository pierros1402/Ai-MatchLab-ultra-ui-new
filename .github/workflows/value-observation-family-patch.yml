name: Apply isolated Value observation family patch

on:
  push:
    branches:
      - work/value-observation-freeze-20260822
    paths:
      - .github/workflows/value-observation-family-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/value-observation-freeze-20260822
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Apply exact anchored patch
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require("fs");

          function replaceOnce(text, before, after, label) {
            const first = text.indexOf(before);
            const last = text.lastIndexOf(before);
            if (first < 0 || first !== last) {
              throw new Error(`${label}: expected exactly one anchor`);
            }
            return text.slice(0, first) + after + text.slice(first + before.length);
          }

          function replaceSection(text, startMarker, endMarker, replacement, label) {
            const start = text.indexOf(startMarker);
            if (start < 0 || text.indexOf(startMarker, start + 1) >= 0) {
              throw new Error(`${label}: start marker not unique`);
            }
            const end = text.indexOf(endMarker, start);
            if (end < 0) throw new Error(`${label}: end marker missing`);
            return text.slice(0, start) + replacement + text.slice(end);
          }

          const refreshPath = "engine-v1/jobs/refresh-value-artifacts-day.js";
          let refresh = fs.readFileSync(refreshPath, "utf8");

          refresh = replaceOnce(
            refresh,
            'import { buildValueA2B2Day } from "./build-value-a2-b2-day.js";',
            'import {\n  buildValueA2B2Day,\n  shouldFreezeAdjustedValueObservations\n} from "./build-value-a2-b2-day.js";',
            "refresh import"
          );

          const oldPlanB = `  const planB = options.skipPlanB === true
    ? null
    : deriveValueFromOdds(date, {
        freeze: false,
        outputMode: "plan-b-observation"
      });

  const adjustedPlans = await buildValueA2B2Day(date);`;

          const newPlanB = `  const freezeObservationFamily =
    shouldFreezeAdjustedValueObservations(
      date,
      athensDayKey()
    );

  let planB = null;

  if (options.skipPlanB !== true) {
    if (freezeObservationFamily) {
      const frozenPlanB = readJsonSafe(
        resolveDataPath("value-plans", date, "plan-b.json"),
        null
      );
      const frozenPlanBAudit = readJsonSafe(
        resolveDataPath("value-plans", date, "plan-b-audit.json"),
        null
      );
      const frozenPicks = Array.isArray(frozenPlanB?.picks)
        ? frozenPlanB.picks
        : null;
      const frozenCount = Number(frozenPlanB?.count);

      const validFrozenPlanB = Boolean(
        frozenPlanB?.ok === true &&
        String(frozenPlanB?.date || "") === date &&
        String(frozenPlanB?.planId || "") === "plan-b" &&
        String(frozenPlanB?.outputMode || "") === "plan-b-observation" &&
        frozenPicks &&
        Number.isInteger(frozenCount) &&
        frozenCount === frozenPicks.length &&
        frozenPlanBAudit?.ok === true &&
        String(frozenPlanBAudit?.date || "") === date
      );

      if (!validFrozenPlanB) {
        return {
          ok: false,
          mode: "refresh_value_artifacts_after_canonical_change",
          date,
          reason: "missing_or_invalid_frozen_plan_b_observation"
        };
      }

      planB = {
        ...frozenPlanB,
        frozenObservation: true
      };
    } else {
      planB = deriveValueFromOdds(date, {
        freeze: false,
        outputMode: "plan-b-observation"
      });
    }
  }

  const adjustedPlans = await buildValueA2B2Day(date, {
    calendarDay: athensDayKey()
  });`;

          refresh = replaceOnce(
            refresh,
            oldPlanB,
            newPlanB,
            "Plan B observation lifecycle"
          );

          fs.writeFileSync(refreshPath, refresh, "utf8");

          const workflowPath = ".github/workflows/daily-deploy-snapshot.yml";
          let workflow = fs.readFileSync(workflowPath, "utf8");

          const assessmentStart =
            "      # Plan B/B2 consume our aiAssessment layer";
          const assessmentEnd =
            "      - name: Export deploy snapshot";
          const assessmentReplacement = `      # Plan B/B2 consume our model-assessment layer, never bookmaker odds.
      # Every future-day release wave re-evaluates the canonical fixture universe:
      # each upcoming fixture must be either assessed or explicitly classified as
      # evidence-limited. A partial snapshot with merely one assessment row is no
      # longer accepted as sufficient input.
      - name: Refresh canonical model assessment coverage for Value Plans B/B2
        if: env.SKIP_BUILD != 'true'
        run: node ./engine-v1/jobs/refresh-model-assessment-coverage-day.js "$DAY_KEY" --gate

`;

          workflow = replaceSection(
            workflow,
            assessmentStart,
            assessmentEnd,
            assessmentReplacement,
            "assessment refresh step"
          );

          const gateStart =
            "      # A successful build with canonical fixtures but zero model-assessment";
          const gateEnd =
            "      - name: Build cumulative value comparison";
          const gateReplacement = `      # B/B2 publication is valid only when the canonical assessment supplement
      # accounts for every future fixture and every successfully assessed row is
      # visible through the exact canonical identity join used by the plans.
      - name: Enforce Value Plans B/B2 assessment coverage
        if: env.SKIP_BUILD != 'true'
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require("fs");
          const day = process.env.DAY_KEY;
          const coverageFile = \
            \`data/value-plans/\${day}/assessment-coverage.json\`;

          if (!fs.existsSync(coverageFile)) {
            throw new Error(\`assessment coverage report missing: \${coverageFile}\`);
          }

          const coverageReport = JSON.parse(
            fs.readFileSync(coverageFile, "utf8")
          );
          const coverage = coverageReport?.coverage || {};

          if (coverageReport?.ok !== true || coverage?.ok !== true) {
            throw new Error(
              \`model assessment coverage contract failed: \${JSON.stringify(coverage)}\`
            );
          }

          const expectedCanonicalAssessmentRows = Number(
            coverage?.assessmentRowsWritten || 0
          );

          const plans = [
            ["B", \`data/value-plans/\${day}/plan-b-audit.json\`],
            ["B2", \`data/value-plans/\${day}/plan-b2-audit.json\`]
          ];

          for (const [plan, file] of plans) {
            if (!fs.existsSync(file)) {
              throw new Error(\`Plan \${plan} assessment audit missing: \${file}\`);
            }

            const audit = JSON.parse(fs.readFileSync(file, "utf8"));
            const membership = audit?.membership || {};
            const canonicalFixtures = Number(
              membership.canonicalFixtures ??
              membership.fixtureUniverse?.count ??
              membership.evaluatedFixtureCount ??
              0
            );
            const assessmentRows = Number(membership.assessmentRows ?? 0);
            const joinedMatches = Number(membership.joinedMatches ?? 0);

            console.log(JSON.stringify({
              plan,
              canonicalFixtures,
              assessmentRows,
              joinedMatches,
              expectedCanonicalAssessmentRows,
              explicitUnassessable:
                Number(coverage?.insufficientTeamEvidence || 0),
              unexplainedUpcomingFixtures:
                Number(coverage?.unexplainedUpcomingFixtures || 0),
              assessmentInputSource:
                audit?.sourceContract?.assessmentInputSource || null
            }));

            if (assessmentRows < expectedCanonicalAssessmentRows) {
              throw new Error(
                \`Plan \${plan} persisted \${assessmentRows} assessments; canonical supplement built \${expectedCanonicalAssessmentRows}\`
              );
            }

            if (joinedMatches < expectedCanonicalAssessmentRows) {
              throw new Error(
                \`Plan \${plan} joined only \${joinedMatches}/\${expectedCanonicalAssessmentRows} canonical supplement assessments\`
              );
            }
          }
          NODE

`;

          workflow = replaceSection(
            workflow,
            gateStart,
            gateEnd,
            gateReplacement,
            "assessment coverage gate"
          );

          fs.writeFileSync(workflowPath, workflow, "utf8");
          NODE

      - name: Syntax check patched files
        run: |
          node --check engine-v1/jobs/refresh-value-artifacts-day.js
          node --check engine-v1/jobs/refresh-model-assessment-coverage-day.js
          node --check engine-v1/jobs/build-value-a2-b2-day.js

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/value-observation-family-patch.yml
          git add \
            engine-v1/jobs/refresh-value-artifacts-day.js \
            .github/workflows/daily-deploy-snapshot.yml
          git diff --cached --check
          git commit -m "Freeze Value observation family and enforce assessment coverage"
          git push origin HEAD:work/value-observation-freeze-20260822
