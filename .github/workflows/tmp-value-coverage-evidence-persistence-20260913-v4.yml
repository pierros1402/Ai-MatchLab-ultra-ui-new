name: TMP value coverage evidence persistence 20260913 V4

on:
  push:
    branches:
      - fix/20260913-value-coverage-evidence-persistence

permissions:
  contents: write

jobs:
  normalize-and-validate-v4:
    if: github.event.head_commit.message == 'Use whitespace-independent Value evidence formatter'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Normalize formatting with whitespace-independent match
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('engine-v1/jobs/build-league-gap-report-day.js')
          s = p.read_text(encoding='utf-8')
          pattern = re.compile(
              r'  const snapshot = snapshotStateForDay\(date\);\n'
              r'\s*const valueCoverageSourcePath =\n'
              r'\s*`data/value/_coverage-reports/\$\{date\}\.json`;\n'
              r'\s*const valueCoverageReport = readJsonSafe\(\n'
              r'\s*resolveDataPath\("value", "_coverage-reports", `\$\{date\}\.json`\),\n'
              r'\s*null\n'
              r'\s*\);\n'
              r'\s*const valueCoverageEvidence = normalizeValueCoverageEvidence\(\n'
              r'\s*valueCoverageReport,\n'
              r'\s*date,\n'
              r'\s*valueCoverageSourcePath\n'
              r'\s*\);\n'
          )
          matches = pattern.findall(s)
          if len(matches) != 1:
              raise SystemExit(f'format regex count={len(matches)}')
          replacement = (
              "  const snapshot = snapshotStateForDay(date);\n"
              "  const valueCoverageSourcePath =\n"
              "    `data/value/_coverage-reports/${date}.json`;\n"
              "  const valueCoverageReport = readJsonSafe(\n"
              "    resolveDataPath(\"value\", \"_coverage-reports\", `${date}.json`),\n"
              "    null\n"
              "  );\n"
              "  const valueCoverageEvidence = normalizeValueCoverageEvidence(\n"
              "    valueCoverageReport,\n"
              "    date,\n"
              "    valueCoverageSourcePath\n"
              "  );\n"
          )
          p.write_text(pattern.sub(replacement, s, count=1), encoding='utf-8')
          PY
          git diff --check

      - name: Re-run syntax and regression tests
        shell: bash
        run: |
          set -euo pipefail
          node --check engine-v1/core/value-coverage-evidence.js
          node --check engine-v1/jobs/build-league-gap-report-day.js
          node --check engine-v1/tests/value-coverage-evidence-persistence.test.js
          node --test engine-v1/tests/value-coverage-evidence-persistence.test.js
          node --test engine-v1/tests/daily-history-catchup-h2h-scope.test.js

      - name: Commit formatting-only source change
        shell: bash
        run: |
          set -euo pipefail
          CHANGED="$(git status --short | awk '{print $2}' | grep -Ev '^\.github/workflows/' | sort)"
          test "$CHANGED" = "engine-v1/jobs/build-league-gap-report-day.js"
          git add engine-v1/jobs/build-league-gap-report-day.js
          git config user.name "matchlab-repair"
          git config user.email "matchlab-repair@users.noreply.github.com"
          git commit -m "Normalize Value coverage evidence formatting"
          git push origin HEAD:fix/20260913-value-coverage-evidence-persistence
