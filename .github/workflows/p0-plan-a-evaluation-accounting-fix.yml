name: P0 Plan A evaluation accounting fix

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/p0-plan-a-evaluation-accounting-fix.yml"

permissions:
  contents: write

concurrency:
  group: ai-matchlab-data-writer
  cancel-in-progress: false

env:
  EXPECTED_PARENT: "3d7c8ce4002801a7c6994c5b34eebe5fdc2b6b7f"

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify patch base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test -z "$(git status --porcelain)"
          echo "Patch base verified: $EXPECTED_PARENT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      - name: Install engine dependencies
        working-directory: engine-v1
        run: npm ci --no-audit --no-fund

      - name: Apply exact Plan A accounting patch
        shell: bash
        run: |
          set -euo pipefail
          python tools/p0-plan-a-evaluation-accounting-fix.py

      - name: Syntax and targeted regression
        shell: bash
        run: |
          set -euo pipefail
          node --check engine-v1/core/build-value-day.js
          node --check engine-v1/tests/plan-a-evaluation-accounting-exclusivity.test.js
          git diff --check
          node --test \
            engine-v1/tests/plan-a-evaluation-accounting-exclusivity.test.js \
            engine-v1/tests/value-contract-hardening.test.js \
            engine-v1/tests/frozen-value-release-contract.test.js

      - name: Full engine regression
        shell: bash
        run: |
          set -euo pipefail
          node --test engine-v1/tests/*.test.js

      - name: Verify exact write set
        shell: bash
        run: |
          set -euo pipefail
          { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u > /tmp/changed.txt
          cat > /tmp/expected.txt <<'EOF'
          engine-v1/core/build-value-day.js
          engine-v1/tests/plan-a-evaluation-accounting-exclusivity.test.js
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt

      - name: Commit permanent Plan A accounting fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            engine-v1/core/build-value-day.js \
            engine-v1/tests/plan-a-evaluation-accounting-exclusivity.test.js
          git diff --cached --check
          git commit -m "Keep Plan A evaluation outcomes exclusive"
          git push origin HEAD:main
