name: P0 Stage20 independent workflow-run archive proof (synthetic)
on:
  pull_request:
    paths:
      - "tools/admit-stage20-prepost-crossworkflow.mjs"
      - "tools/admit-stage20-prepost-crossworkflow.test.mjs"
      - "tools/test-stage20-prepost-crossrunner.mjs"
      - ".github/workflows/p0-stage20-crossworkflow-proof.yml"
permissions:
  contents: read
  actions: read
jobs:
  independent_consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/admit-stage20-prepost-crossworkflow.mjs
            tools/admit-stage20-prepost-crossworkflow.test.mjs
            tools/test-stage20-prepost-crossrunner.mjs
            engine-v1/core/daily-resume-complete-data-inventory.mjs
            engine-v1/core/daily-resume-prepost-delta-archive.mjs
            engine-v1/core/daily-resume-prepost-isolated-replay.mjs
            engine-v1/core/daily-resume-stage20-admission.mjs
            .github/workflows/p0-stage20-crossworkflow-proof.yml
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Static source syntax and seven metadata admission negatives
        run: |
          node --check tools/admit-stage20-prepost-crossworkflow.mjs
          node --check tools/admit-stage20-prepost-crossworkflow.test.mjs
          node --test --test-reporter=tap tools/admit-stage20-prepost-crossworkflow.test.mjs
      - name: Admit exact completed earlier GitHub workflow run and pinned artifact metadata
        shell: bash
        env:
          GH_SOURCE_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import {inspectPinnedInterworkflowProducer as inspect,PINNED_INTERWORKFLOW_PRODUCER as p}
            from "./tools/admit-stage20-prepost-crossworkflow.mjs";
          const base="https://api.github.com/repos/"+process.env.GITHUB_REPOSITORY;
          async function get(suffix) {
            const res=await fetch(base+suffix,{headers:{
              Authorization:"Bearer "+process.env.GH_SOURCE_READ_TOKEN,
              Accept:"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28"
            }});
            assert.equal(res.ok,true,"github_metadata_fetch_failed:"+res.status);
            return res.json();
          }
          const run=await get("/actions/runs/"+p.runId);
          const artifacts=await get("/actions/runs/"+p.runId+"/artifacts?per_page=100");
          const rows=(artifacts.artifacts||[]).filter(x=>x.name===p.artifactName);
          assert.equal(rows.length,1,"pinned_artifact_not_unique");
          const result=inspect(run,rows[0],new Date().toISOString());
          console.log("STAGE20_CROSSWORKFLOW_METADATA="+JSON.stringify(result));
          assert.equal(result.downloadAdmissible,true,result.reason);
          assert.equal(result.resumeAuthorized,false);
          NODE
      - name: Download historical synthetic archive from DIFFERENT workflow run
        uses: actions/download-artifact@v4
        with:
          name: aiml-prepost-synthetic-45199830395-1
          run-id: 45199830395
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/stage20-crossworkflow
      - name: Independently rebuild source and verify all transported bytes and tombstones
        shell: bash
        run: |
          set -euo pipefail
          node tools/test-stage20-prepost-crossrunner.mjs consume "$RUNNER_TEMP/stage20-crossworkflow"
          git diff --exit-code HEAD -- .github/workflows/daily-deploy-snapshot.yml data/
          echo "INTER_WORKFLOW_SYNTHETIC_ONLY_NO_PRODUCTION_RESUME_NO_PUBLISH"
