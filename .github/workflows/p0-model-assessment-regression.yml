name: P0 model assessment retention validation
on:
  push:
    branches:
      - fix/p0-assessment-snapshot-coverage-20261120
  pull_request:
    paths:
      - engine-v1/jobs/export-odds-snapshot-day.js
      - engine-v1/jobs/export-odds-snapshot-day.test.js
      - engine-v1/jobs/run-odds-refresh.js
      - engine-v1/jobs/run-odds-refresh.test.js
      - engine-v1/jobs/canonical-assessment-supplement.js
      - engine-v1/storage/assessment-read-view.js
      - engine-v1/core/assessment-publication-identity.js
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model-assessment-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax validation
        run: node --check engine-v1/jobs/export-odds-snapshot-day.js && node --check engine-v1/jobs/export-odds-snapshot-day.test.js
      - name: Targeted assessment regression
        run: node --test engine-v1/jobs/export-odds-snapshot-day.test.js engine-v1/jobs/run-odds-refresh.test.js
      - name: Read-only historical assessment identity coverage
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { supplementCanonicalAssessments, readCanonicalFixtureDay } from './engine-v1/jobs/canonical-assessment-supplement.js';
          import { resolveProductionEvidenceFixtureIdReadView } from './engine-v1/core/production-evidence-identity-overlay.js';
          const date = '2026-11-20';
          const at = '2026-11-20T07:02:00Z';
          const emitted = new Set();
          const normalize = id => {
            const r = resolveProductionEvidenceFixtureIdReadView(String(id), { allowUnmanaged: true });
            return String(r?.resolvedFixtureId || id);
          };
          const result = supplementCanonicalAssessments(date, {
            nowMs: Date.parse(at),
            recordFn: id => { emitted.add(normalize(id)); }
          });
          const prior = JSON.parse(fs.readFileSync('data/deploy-snapshots/2026-11-20/odds.json', 'utf8'));
          const have = new Set(prior.matches
            .filter(x => x.aiAssessment?.markets && Object.keys(x.aiAssessment.markets).length)
            .map(x => normalize(x.canonicalId || x.matchId)));
          const canonical = readCanonicalFixtureDay(date);
          const fixture = new Map(canonical.map(x => [normalize(x.canonicalId || x.matchId), x]));
          const required = [...new Set(result.modelEvidenceEligibleFixtureIds.map(normalize))];
          const missing = required.filter(id => !have.has(id));
          console.log(JSON.stringify({
            mode: 'READ_ONLY_HISTORICAL_ELIGIBILITY_SIMULATION_NOT_PREDICTION',
            date, referenceTime: at,
            required: required.length, existingAssessed: have.size,
            missingRequiredAgainstCommittedSnapshot: missing.map(id => ({
              id,
              league: fixture.get(id)?.leagueSlug || null,
              kickoffUtc: fixture.get(id)?.kickoffUtc || null,
              eligibleWasComputedInMemory: emitted.has(id)
            })),
            inMemoryAssessmentsRecordedToDisk: 0,
            productionArtifactsChanged: 0
          }, null, 2));
          NODE
      - name: Full engine regression
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' TESTS < <(find engine-v1 -type f -name '*.test.js' -print0)
          printf 'Engine test files: %s\n' "${#TESTS[@]}"
          test "${#TESTS[@]}" -gt 0
          node --test "${TESTS[@]}"
