name: Daily deploy snapshot

on:
  workflow_dispatch:
    inputs:
      dayKey:
        description: "Day key to build, YYYY-MM-DD. Leave empty for Europe/Athens today."
        required: false
        default: ""
      triggerRender:
        description: "Manual only: trigger Render redeploy after a daily snapshot commit."
        required: false
        default: "false"
      recoverPlanAObservationSignature:
        description: "Exact signed zero-pick Plan A observation to recover after a proven pipeline defect"
        required: false
        default: ""
  schedule:
    # P3.1 atomic-midnight contract: scheduled full publication is PRE-MIDNIGHT
    # only and always targets TOMORROW. UTC candidates cover both Athens DST and
    # standard time; the local guard admits the useful 17:30-22:10 window.
    # A normal early candidate publishes tomorrow once; the 20:45+ candidate is
    # the final refresh. No scheduled full TODAY build is allowed after 00:00.
    - cron: "17 14,15,16,17,18,19,20 * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: ai-matchlab-data-writer
  cancel-in-progress: false

jobs:
  build-and-commit-snapshot:
    runs-on: ubuntu-latest
    # Hard deadline budget. A scheduled run admitted at 22:10 Athens must stop
    # before midnight instead of drifting into the next operational day.
    # Manual incident-recovery runs need enough room for the same exhaustive
    # cycle plus the publication gates; Day29 proved that the cycle alone can
    # legitimately consume almost the entire scheduled budget.
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 180 || 100 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Resolve day key
        id: day
        shell: bash
        env:
          INPUT_DAY_KEY: ${{ inputs.dayKey }}
          INPUT_TRIGGER_RENDER: ${{ inputs.triggerRender }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          RAW_DAY_KEY="${INPUT_DAY_KEY:-}"
          DAY_KEY="$(printf "%s" "$RAW_DAY_KEY" | grep -Eo '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -n 1 || true)"

          ATHENS_HOUR="$(TZ=Europe/Athens date +%H)"
          ATHENS_MINUTE="$(TZ=Europe/Athens date +%M)"
          ATHENS_HOUR_NUM=$((10#$ATHENS_HOUR))
          ATHENS_TOTAL_MINUTES=$((ATHENS_HOUR_NUM * 60 + 10#$ATHENS_MINUTE))

          if [ "$EVENT_NAME" = "schedule" ] && [ -z "$DAY_KEY" ]; then
            # Scheduled publication never builds TODAY after midnight. It only
            # prepares TOMORROW while there is enough wall-clock budget to finish
            # the complete release transaction before 00:00 Europe/Athens.
            if [ "$ATHENS_TOTAL_MINUTES" -lt 1050 ] || [ "$ATHENS_TOTAL_MINUTES" -gt 1330 ]; then
              echo "Skipping scheduled full publication outside 17:30-22:10 Europe/Athens. Athens time: $ATHENS_HOUR:$ATHENS_MINUTE"
              echo "skipBuild=true" >> "$GITHUB_OUTPUT"
              echo "SKIP_BUILD=true" >> "$GITHUB_ENV"
              exit 0
            fi

            DAY_KEY="$(TZ=Europe/Athens date -d 'tomorrow' +%F)"

            # Before the final refresh window, do not repeat a full build after
            # tomorrow has already passed the atomic latest promotion. At/after
            # 20:45 one final refresh is admitted to capture late fixture input.
            LATEST_DAY="$(node -e 'try{const x=require("./data/deploy-snapshots/latest.json");process.stdout.write(String(x.date||""));}catch{}')"
            if [ "$ATHENS_TOTAL_MINUTES" -lt 1245 ] && [ "$LATEST_DAY" = "$DAY_KEY" ]; then
              echo "Tomorrow $DAY_KEY is already atomically published; skipping duplicate early full build."
              echo "skipBuild=true" >> "$GITHUB_OUTPUT"
              echo "SKIP_BUILD=true" >> "$GITHUB_ENV"
              exit 0
            fi

            if [ "$ATHENS_TOTAL_MINUTES" -ge 1245 ]; then
              echo "Final pre-midnight release refresh ($ATHENS_HOUR:$ATHENS_MINUTE Athens) -> TOMORROW $DAY_KEY"
            else
              echo "Pre-midnight release build ($ATHENS_HOUR:$ATHENS_MINUTE Athens) -> TOMORROW $DAY_KEY"
            fi
          fi

          if [ -z "$DAY_KEY" ]; then
            DAY_KEY="$(TZ=Europe/Athens date +%F)"
          fi

          if ! printf "%s" "$DAY_KEY" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "ERROR: invalid DAY_KEY=$DAY_KEY"
            exit 1
          fi

          echo "skipBuild=false" >> "$GITHUB_OUTPUT"
          echo "SKIP_BUILD=false" >> "$GITHUB_ENV"
          echo "dayKey=$DAY_KEY" >> "$GITHUB_OUTPUT"
          echo "DAY_KEY=$DAY_KEY" >> "$GITHUB_ENV"

          # run-daily-cycle finalizes (and now re-settles the value picks of)
          # the previous day. Expose that key so the re-settled yesterday value
          # artifacts can be staged + allow-listed alongside DAY_KEY.
          FINALIZE_DAY_KEY="$(TZ=Europe/Athens date -d "${DAY_KEY} -1 day" +%F)"
          echo "FINALIZE_DAY_KEY=$FINALIZE_DAY_KEY" >> "$GITHUB_ENV"
          echo "Resolved FINALIZE_DAY_KEY=$FINALIZE_DAY_KEY"

          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "${INPUT_TRIGGER_RENDER:-false}" = "true" ]; then
            echo "ALLOW_RENDER_DEPLOY=true" >> "$GITHUB_ENV"
            echo "Render redeploy allowed for this manual daily run."
          elif [ "$EVENT_NAME" = "schedule" ]; then
            # Deploy-budget firewall: scheduled data builds continue to commit
            # canonical and snapshot artifacts, but Render deploys require an
            # explicit manual workflow or triggerRender=true dispatch.
            echo "ALLOW_RENDER_DEPLOY=false" >> "$GITHUB_ENV"
            echo "Render redeploy disabled for scheduled data build."
          else
            echo "ALLOW_RENDER_DEPLOY=false" >> "$GITHUB_ENV"
            echo "Render redeploy disabled for this daily run."
          fi
          echo "Resolved DAY_KEY=$DAY_KEY"

      - name: Install root dependencies
        if: env.SKIP_BUILD != 'true'
        run: npm ci --no-audit --no-fund

      - name: Install engine dependencies
        if: env.SKIP_BUILD != 'true'
        working-directory: engine-v1
        run: npm ci --no-audit --no-fund

      - name: Run rolling fixture acquisition chunks
        if: env.SKIP_BUILD != 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "Daily full-pass fixture acquisition"
          node ./engine-v1/jobs/run-fixture-acquisition-chunk.js "$DAY_KEY" --full-pass --days-back 1 --days-forward 14

          if [ -f "data/coverage-reports/${DAY_KEY}.json" ]; then
            echo "=== Fixture acquisition coverage report ==="
            node -e 'const fs=require("fs"); const day=process.env.DAY_KEY; const file="data/coverage-reports/"+day+".json"; const r=JSON.parse(fs.readFileSync(file,"utf8")); console.log(JSON.stringify({baseDayKey:r.baseDayKey,selectedLeagues:r.selectedLeagues,summary:r.summary,coverage:r.coverage},null,2));'
          else
            echo "WARNING: no fixture acquisition coverage report written for ${DAY_KEY}"
          fi

      - name: Persist rolling identity recovery backlog
        if: env.SKIP_BUILD != 'true'
        run: node ./engine-v1/jobs/build-identity-recovery-window.js "$DAY_KEY" --days-back 1 --days-forward 14

      - name: Confirm two-sided unknown fixture identities independently
        if: env.SKIP_BUILD != 'true'
        env:
          # Independent fixture identity evidence only. The confirmer calls the
          # API-Football /fixtures endpoint and has an explicit odds=false
          # contract; bookmaker prices never enter identity or Value decisions.
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: node ./engine-v1/jobs/confirm-identity-recovery-window.js "$DAY_KEY"

      - name: Promote source-bound identity recovery
        if: env.SKIP_BUILD != 'true'
        run: node ./engine-v1/jobs/promote-identity-recovery-window.js "$DAY_KEY"

      - name: Prune rolling coverage reports
        if: env.SKIP_BUILD != 'true'
        # Canonical fixture truth is permanent append/update-only evidence.
        # The compatibility job may prune coverage reports, never canonical days.
        run: node ./engine-v1/jobs/prune-canonical-fixture-store.js "$DAY_KEY" --days-back 3 --days-forward 30

      - name: Commit canonical fixture acquisition store
        if: env.SKIP_BUILD != 'true'
        shell: bash
        run: |
          git restore --staged . || true

          if [ -d "data/canonical-fixtures" ]; then
            git add data/canonical-fixtures
          fi

          if [ -d "data/coverage-reports" ]; then
            git add data/coverage-reports
          fi

          if [ -d "data/ingest-state" ]; then
            git add data/ingest-state
          fi

          if [ -d "data/competition-admission" ]; then
            git add data/competition-admission
          fi

          if [ -d "data/identity-recovery" ]; then
            git add data/identity-recovery
          fi

          if [ -f "data/identity-decisions/production-identity-extension-ledger.v1.json" ]; then
            git add data/identity-decisions/production-identity-extension-ledger.v1.json
          fi

          # Coverage reports may be pruned, but canonical fixture truth is
          # append/update-only. Veto canonical deletions before the generic
          # deletion-enabled data guard is allowed to run.
          CANONICAL_DELETIONS="$(git diff --cached --name-status --diff-filter=D -- data/canonical-fixtures || true)"
          if [ -n "$CANONICAL_DELETIONS" ]; then
            echo "ERROR: canonical fixture deletion is forbidden:"
            echo "$CANONICAL_DELETIONS"
            exit 1
          fi

          node engine-v1/jobs/guard-staged-data-boundary.js \
            --label=daily-deploy-canonical-store \
            --allow-data-deletions \
            --allow='^(data/canonical-fixtures/|data/coverage-reports/|data/ingest-state/|data/competition-admission/|data/identity-recovery/|data/identity-decisions/production-identity-extension-ledger\.v1\.json$)'
          echo "=== CANONICAL STORE STAGED FILES OUTSIDE ALLOWLIST - SHOULD BE EMPTY ==="
          DISALLOWED="$(git diff --cached --name-only | grep -Ev '^(data/canonical-fixtures/|data/coverage-reports/|data/ingest-state/|data/competition-admission/|data/identity-recovery/|data/identity-decisions/production-identity-extension-ledger\.v1\.json$)' || true)"

          if [ -n "$DISALLOWED" ]; then
            echo "ERROR: disallowed canonical store files staged:"
            echo "$DISALLOWED"
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "No canonical fixture acquisition changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update canonical fixture acquisition store for $DAY_KEY"
            bash tools/git-push-rebase-retry.sh
          fi

      # Settlement of yesterday/recent unresolved Value is independent of the
      # current day's Value build. This checkpoint runs first so a failure in
      # today's build cannot again discard D-1 FT truth or WIN/LOSS settlement.
      - name: Run independent prior Value settlement catch-up
        if: env.SKIP_BUILD != 'true'
        run: node ./engine-v1/jobs/run-prior-value-settlement-catchup.js "$DAY_KEY" --days-back=7

      - name: Persist prior Value settlement checkpoint
        if: env.SKIP_BUILD != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git restore --staged . || true

          ATHENS_TODAY="$(TZ=Europe/Athens date +%F)"
          # The prior settlement catch-up is intentionally anchored to the
          # real Athens operational day even when DAY_KEY targets tomorrow.
          # Stage the exact same D-1..D-7 producer window.
          for back in 1 2 3 4 5 6 7; do
            k="$(TZ=Europe/Athens date -d "${ATHENS_TODAY} -${back} day" +%F)"
            test -d "data/canonical-fixtures/$k" && git add "data/canonical-fixtures/$k/"
            test -d "data/final-results/$k" && git add "data/final-results/$k/"
            test -f "data/final-result-conflicts/$k.json" && git add "data/final-result-conflicts/$k.json"
            test -f "data/value-comparison/$k.json" && git add "data/value-comparison/$k.json"
            test -f "data/system-health/$k.json" && git add "data/system-health/$k.json"
          done

          test -f "data/value-comparison/cumulative.json" && git add "data/value-comparison/cumulative.json"
          test -f "data/system-health/${ATHENS_TODAY}.json" && git add "data/system-health/${ATHENS_TODAY}.json"
          test -f "data/system-health/latest.json" && git add "data/system-health/latest.json"

          STAGED="$(git diff --cached --name-only || true)"

          PRIOR_SETTLEMENT_DAYS="$(
            printf "%s\n" "$STAGED" |
              sed -n -E 's#^data/value-comparison/([0-9]{4}-[0-9]{2}-[0-9]{2})\.json$#\1#p' |
              sort -u |
              paste -sd, -
          )"

          if [ -n "$STAGED" ]; then
            BAD="$(printf "%s\n" "$STAGED" | grep -Ev '^(data/canonical-fixtures/[0-9]{4}-[0-9]{2}-[0-9]{2}/|data/final-results/[0-9]{4}-[0-9]{2}-[0-9]{2}/|data/final-result-conflicts/[0-9]{4}-[0-9]{2}-[0-9]{2}\.json$|data/value-comparison/([0-9]{4}-[0-9]{2}-[0-9]{2}\.json|cumulative\.json)$|data/system-health/([0-9]{4}-[0-9]{2}-[0-9]{2}\.json|latest\.json)$)' || true)"
            if [ -n "$BAD" ]; then
              echo "ERROR: unexpected prior-settlement checkpoint paths:"
              echo "$BAD"
              exit 1
            fi

            node engine-v1/jobs/guard-staged-data-boundary.js \
              --label=daily-prior-value-settlement-checkpoint \
              --allow='^(data/canonical-fixtures/[0-9]{4}-[0-9]{2}-[0-9]{2}/|data/final-results/[0-9]{4}-[0-9]{2}-[0-9]{2}/|data/final-result-conflicts/[0-9]{4}-[0-9]{2}-[0-9]{2}\.json$|data/value-comparison/([0-9]{4}-[0-9]{2}-[0-9]{2}\.json|cumulative\.json)$|data/system-health/([0-9]{4}-[0-9]{2}-[0-9]{2}\.json|latest\.json)$)'

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Persist prior Value settlement checkpoint for ${ATHENS_TODAY}"
            bash tools/git-push-rebase-retry.sh

            if [ -n "$PRIOR_SETTLEMENT_DAYS" ]; then
              echo "PRIOR_SETTLEMENT_DAYS=${PRIOR_SETTLEMENT_DAYS}" >> "$GITHUB_ENV"
              echo "PRIOR_SETTLEMENT_REF=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
            fi
          else
            echo "No prior Value settlement checkpoint changes to commit."
          fi

      - name: Promote prior Value settlement comparisons
        if: env.SKIP_BUILD != 'true' && env.PRIOR_SETTLEMENT_DAYS != ''
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          IFS=',' read -ra DAYS <<< "${PRIOR_SETTLEMENT_DAYS}"

          for k in "${DAYS[@]}"; do
            [ -z "$k" ] && continue
            echo "Promoting settled Value comparison for ${k} at ${PRIOR_SETTLEMENT_REF}"
            node tools/sync-public-value-comparison.mjs "$k" "${PRIOR_SETTLEMENT_REF}"
          done


      - name: Run daily cycle
        if: env.SKIP_BUILD != 'true'
        env:
          # Transfermarkt blocks the GitHub Actions IP range; the team-news
          # absences acquisition inside the cycle fetches TM through the proxy.
          TM_PROXY_URL: ${{ secrets.TM_PROXY_URL }}
          # Per-bookmaker odds (multi-odds έΗΤ consensus middle line + EU/Asian/
          # Betfair right panels). Free tier; without it fetchMultiBookmakerOdds
          # returns no_key and every day's multi-odds file stays empty.
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          # odds-api.io adapter (D0 + D+1..D+6 opening prefetch, replaces the
          # dead OddsPortal scraper). Free tier ~100 req/h; the adapter caps
          # itself at 80 requests per cycle run. Without the key it skips.
          ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
        run: node ./engine-v1/jobs/run-daily-cycle.js "$DAY_KEY"

      - name: Run team geo enrichment
        if: env.SKIP_BUILD != 'true'
        run: node ./engine-v1/jobs/run-team-geo-enrichment-day.js "$DAY_KEY" --min-coverage=80 --limit=40 --delay-ms=900 --row-timeout-ms=16000

      - name: Rebuild details after geo
        if: env.SKIP_BUILD != 'true'
        run: node ./engine-v1/jobs/build-details-day.js "$DAY_KEY" --rebuild

      - name: Refresh final authoritative live status
        if: env.SKIP_BUILD != 'true'
        run: node ./engine-v1/jobs/run-live-status-refresh-day.js "$DAY_KEY"

      - name: Rebuild details after final live refresh
        if: env.SKIP_BUILD != 'true'
        run: node ./engine-v1/jobs/build-details-day.js "$DAY_KEY" --rebuild

      # Plan B/B2 consume our aiAssessment layer, never bookmaker odds. Actions
      # runners do not retain data/odds-memory between jobs, so a day without a
      # committed assessed odds snapshot must be primed inside the daily build
      # itself. This also makes the evening D+1 pre-build self-contained.
      - name: Ensure persistent model assessment input for Value Plans B/B2
        if: env.SKIP_BUILD != 'true'
        shell: bash
        run: |
          set -euo pipefail

          if node - <<'NODE'
          const fs = require("fs");
          const day = process.env.DAY_KEY;
          const file = `data/deploy-snapshots/${day}/odds.json`;

          let payload = null;
          try {
            payload = JSON.parse(fs.readFileSync(file, "utf8"));
          } catch {
            payload = null;
          }

          const matches = Array.isArray(payload?.matches) ? payload.matches : [];
          const assessmentRows = matches.filter(row =>
            row?.aiAssessment?.markets && Object.keys(row.aiAssessment.markets).length > 0
          ).length;

          console.log(JSON.stringify({ file, matches: matches.length, assessmentRows }, null, 2));
          process.exit(assessmentRows > 0 ? 1 : 0);
          NODE
          then
            echo "Persistent aiAssessment input is missing; priming ${DAY_KEY}."
            node ./engine-v1/jobs/run-odds-refresh.js "$DAY_KEY" --force
          else
            echo "Persistent aiAssessment input already exists; no extra opening refresh required."
          fi

      - name: Refresh official ClubElo shadow snapshot
        if: env.SKIP_BUILD != 'true'
        continue-on-error: true
        run: >-
          node ./engine-v1/jobs/refresh-clubelo-shadow-registry.js
          "$DAY_KEY"
          --registry data/plan-c-shadow/frozen/i2b-20260825/IDENTITY_REGISTRY.json
          --timeout-ms 30000

      - name: Generate, settle and build Plan C shadow feed
        if: env.SKIP_BUILD != 'true'
        shell: bash
        run: |
          set -euo pipefail

          PREDICTION_ROOT="data/plan-c-shadow/frozen/i2b-20260825"
          SETTLEMENT_FILE="data/plan-c-shadow/settlement/latest.json"
          # Preserve real milliseconds. Truncating to .000Z can make this value
          # appear earlier than the ClubElo snapshot retrieved in the same second.
          PREDICTION_CREATED_AT="$(node -e 'process.stdout.write(new Date().toISOString())')"

          # Append-only prediction freeze. Exact project name + league identity
          # and federation-verified ClubElo are mandatory; stale Elo adds no new
          # predictions but never changes official plans.
          node ./engine-v1/jobs/generate-plan-c-shadow-predictions.js \
            "$DAY_KEY" \
            --prediction-root "$PREDICTION_ROOT" \
            --prediction-created-at "$PREDICTION_CREATED_AT" \
            --days-forward 14 \
            --max-snapshot-age-days 30

          # Canonical FT truth settles frozen rows monotonically. The report is
          # deterministic and contains no run timestamp; its audit is separate.
          node ./engine-v1/jobs/settle-plan-c-shadow.js \
            "$DAY_KEY" \
            --prediction-root "$PREDICTION_ROOT" \
            --output "$SETTLEMENT_FILE"

          node ./engine-v1/jobs/build-plan-c-shadow-day.js \
            "$DAY_KEY" \
            --prediction-root "$PREDICTION_ROOT" \
            --settlement-report "$SETTLEMENT_FILE"

      - name: Export deploy snapshot
        if: env.SKIP_BUILD != 'true'
        run: node ./engine-v1/jobs/export-deploy-snapshot-day.js "$DAY_KEY" --no-update-latest

      - name: Refresh value artifacts after final canonical snapshot
        if: env.SKIP_BUILD != 'true'
        shell: bash
        run: |
          set -euo pipefail

          REFRESH_OUTPUT="$(mktemp)"
          trap 'rm -f "$REFRESH_OUTPUT"' EXIT

          set +e
          node ./engine-v1/jobs/refresh-value-artifacts-day.js --date="$DAY_KEY" --no-update-latest | tee "$REFRESH_OUTPUT"
          REFRESH_STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$REFRESH_STATUS" -ne 0 ]; then
            FULL_EXPORT_REQUIRED=false

            if grep -q '"reason": "snapshot_fixtures_missing_canonical_rows_full_export_required"' "$REFRESH_OUTPUT"; then
              FULL_EXPORT_REQUIRED=true
            fi

            if [ "$FULL_EXPORT_REQUIRED" != "true" ]; then
              echo "Value refresh failed for a reason that is not safely self-healable."
              exit "$REFRESH_STATUS"
            fi

            echo "Canonical fixture coverage changed after the first export."
            echo "Rebuilding all details and the complete deploy snapshot before retrying Value."

            node ./engine-v1/jobs/build-details-day.js "$DAY_KEY" --rebuild
            node ./engine-v1/jobs/export-deploy-snapshot-day.js "$DAY_KEY" --no-update-latest
            node ./engine-v1/jobs/refresh-value-artifacts-day.js --date="$DAY_KEY" --no-update-latest
          fi

      # Immutable Plan A observations stay immutable by default. This narrow
      # recovery path exists only for a signed zero-pick observation that was
      # frozen by a proven pipeline defect (the 2026-08-08 season rollover
      # incident). The old signed observation + audit are archived before the
      # replacement is created, and a positive v2.3 candidate is mandatory.
      - name: Recover explicitly signed defective Plan A zero freeze
        if: env.SKIP_BUILD != 'true'
        shell: bash
        env:
          PLAN_A_RECOVERY_SIGNATURE: ${{ inputs.recoverPlanAObservationSignature }}
        run: |
          set -euo pipefail

          SIGNATURE="${PLAN_A_RECOVERY_SIGNATURE:-}"
          if [ -z "$SIGNATURE" ]; then
            echo "No Plan A zero-freeze recovery requested."
            exit 0
          fi

          if ! printf "%s" "$SIGNATURE" | grep -Eq '^[a-f0-9]{64}$'; then
            echo "ERROR: invalid Plan A recovery signature."
            exit 1
          fi

          node ./engine-v1/jobs/recover-plan-a-zero-freeze-day.js \
            --date="$DAY_KEY" \
            --expected-signature="$SIGNATURE"

      # The public Details layer must be built only after the final Plan A
      # publication authority for this run is known. This covers both the normal
      # first immutable freeze and the explicit signed zero-freeze recovery path.
      - name: Synchronize Details with Plan A publication authority
        if: env.SKIP_BUILD != 'true'
        run: node ./engine-v1/jobs/build-details-day.js "$DAY_KEY" --rebuild

      - name: Re-export deploy snapshot from synchronized Details
        if: env.SKIP_BUILD != 'true'
        run: node ./engine-v1/jobs/export-deploy-snapshot-day.js "$DAY_KEY" --no-update-latest --replace-details --no-build-missing-details --fail-on-missing-details

      - name: Details Value mirror gate after Plan A freeze
        if: env.SKIP_BUILD != 'true'
        run: node ./engine-v1/jobs/verify-details-value-mirror-day.js --date="$DAY_KEY" --gate

      # A successful build with canonical fixtures but zero model-assessment
      # input is a pipeline failure, not a legitimate "0 picks" result. Fail
      # closed so the public UI can never silently publish that state again.
      # Normal Plan B/B2 observations must prove real aiAssessment input.
      # A strictly identified recovery sentinel records that the authentic
      # observation was unavailable and forbids retrospective prediction.
      - name: Enforce Value Plans B/B2 assessment input
        if: env.SKIP_BUILD != 'true'
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require("fs");
          const day = process.env.DAY_KEY;

          const plans = [
            {
              label: "B",
              planId: "plan-b",
              outputMode: "plan-b-observation",
              planFile: `data/value-plans/${day}/plan-b.json`,
              auditFile: `data/value-plans/${day}/plan-b-audit.json`
            },
            {
              label: "B2",
              planId: "plan-b2",
              outputMode: "plan-b2-observation",
              planFile: `data/value-plans/${day}/plan-b2.json`,
              auditFile: `data/value-plans/${day}/plan-b2-audit.json`
            }
          ];

          for (const spec of plans) {
            if (!fs.existsSync(spec.planFile)) {
              throw new Error(`Plan ${spec.label} observation missing: ${spec.planFile}`);
            }

            if (!fs.existsSync(spec.auditFile)) {
              throw new Error(`Plan ${spec.label} assessment audit missing: ${spec.auditFile}`);
            }

            const plan = JSON.parse(fs.readFileSync(spec.planFile, "utf8"));
            const audit = JSON.parse(fs.readFileSync(spec.auditFile, "utf8"));

            const membership = audit?.membership || {};
            const auditSource = audit?.sourceContract || {};
            const planSource = plan?.sourceContract || {};
            const auditRecovery = audit?.recoveryContract || {};
            const planRecovery = plan?.recoveryContract || {};

            const canonicalFixtures = Number(
              membership.canonicalFixtures ??
              membership.fixtureUniverse?.count ??
              membership.evaluatedFixtureCount ??
              0
            );

            const assessmentRows = Number(membership.assessmentRows ?? 0);
            const joinedMatches = Number(membership.joinedMatches ?? 0);

            const auditUniverse =
              membership.fixtureUniverse ??
              auditSource.fixtureUniverse ??
              {};

            const planUniverse = planSource.fixtureUniverse ?? {};

            const explicitZeroPickRecovery =
              plan?.ok === true &&
              audit?.ok === true &&
              plan?.date === day &&
              audit?.date === day &&
              plan?.planId === spec.planId &&
              audit?.planId === spec.planId &&
              plan?.outputMode === spec.outputMode &&
              audit?.outputMode === spec.outputMode &&
              plan?.source === "historical_missing_observation_recovery_sentinel" &&
              audit?.source === "historical_missing_observation_recovery_sentinel" &&
              Number(plan?.count) === 0 &&
              Array.isArray(plan?.picks) &&
              plan.picks.length === 0 &&
              planSource.recoveryObservation === true &&
              auditSource.recoveryObservation === true &&
              planSource.retrospectiveModelOutputUsed === false &&
              auditSource.retrospectiveModelOutputUsed === false &&
              planRecovery.authenticPayloadRecovered === false &&
              auditRecovery.authenticPayloadRecovered === false &&
              planRecovery.retrospectivePredictionGeneration === false &&
              auditRecovery.retrospectivePredictionGeneration === false &&
              planRecovery.inventedHistoricalPicks === false &&
              auditRecovery.inventedHistoricalPicks === false &&
              Number(membership.outputPicks ?? 0) === 0 &&
              Number(membership.outputValidPicks ?? 0) === 0 &&
              Number(membership.outputOrphanPicks ?? 0) === 0 &&
              Number(membership.outputAmbiguousPicks ?? 0) === 0 &&
              canonicalFixtures > 0 &&
              Number(planUniverse.count ?? -1) === canonicalFixtures &&
              Number(auditUniverse.count ?? -1) === canonicalFixtures &&
              typeof planUniverse.hash === "string" &&
              planUniverse.hash.length > 0 &&
              planUniverse.hash === auditUniverse.hash;

            console.log(JSON.stringify({
              plan: spec.label,
              canonicalFixtures,
              assessmentRows,
              joinedMatches,
              explicitZeroPickRecovery
            }));

            if (explicitZeroPickRecovery) {
              if (assessmentRows !== 0 || joinedMatches !== 0) {
                throw new Error(
                  `Plan ${spec.label} recovery sentinel must not claim assessment/join rows`
                );
              }

              console.log(
                `Plan ${spec.label}: accepted explicit zero-pick recovery sentinel; retrospective model output remains forbidden.`
              );
              continue;
            }

            if (canonicalFixtures > 0 && assessmentRows <= 0) {
              throw new Error(
                `Plan ${spec.label} has ${canonicalFixtures} fixtures but zero aiAssessment rows`
              );
            }

            if (assessmentRows > 0 && joinedMatches <= 0) {
              throw new Error(
                `Plan ${spec.label} has aiAssessment rows but zero canonical identity joins`
              );
            }
          }
          NODE

      - name: Build cumulative value comparison
        if: env.SKIP_BUILD != 'true'
        run: node ./engine-v1/jobs/build-value-comparison-cumulative.js --write

      # Re-run AFTER the final export so the committed report describes THIS
      # manifest έΑΦ the in-cycle run predates the geo rebuild + re-export above
      # and was permanently stale vs manifest.generatedAt (audit P1). Auto-fixes
      # it applies to detail files are staged with the day dir. Never blocks
      # here; the pre-publish "Invariant gate" below is the hard stop.
      - name: Refresh snapshot invariant report
        if: env.SKIP_BUILD != 'true'
        continue-on-error: true
        run: node ./engine-v1/jobs/run-snapshot-invariant-check.js "$DAY_KEY"

      - name: Snapshot fixture coverage floor
        if: env.SKIP_BUILD != 'true'
        continue-on-error: true
        shell: bash
        run: |
          node ./engine-v1/jobs/verify-deploy-snapshot-fixture-coverage-floor-file.js --date="$DAY_KEY" --min-fixtures=20 --min-leagues=5 --use-manifest-min-targets --output "data/football-truth/_diagnostics/deploy-snapshot-fixture-coverage-floor/${DAY_KEY}.deploy-snapshot-fixture-coverage-floor.json"

      - name: Snapshot verification
        if: env.SKIP_BUILD != 'true'
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require("fs");

          const day = process.env.DAY_KEY;
          const manifestFile = `data/deploy-snapshots/${day}/manifest.json`;
          const valueFile = `data/deploy-snapshots/${day}/value.json`;
          const detailsDir = `data/deploy-snapshots/${day}/details`;

          if (!fs.existsSync(manifestFile)) {
            throw new Error(`missing manifest: ${manifestFile}`);
          }

          const manifest = JSON.parse(fs.readFileSync(manifestFile, "utf8"));
          const value = fs.existsSync(valueFile) ? JSON.parse(fs.readFileSync(valueFile, "utf8")) : null;
          const details = fs.existsSync(detailsDir) ? fs.readdirSync(detailsDir).filter(f => f.endsWith(".json")) : [];

          console.log(JSON.stringify({
            date: manifest.date,
            hash: manifest.hash,
            counts: manifest.counts,
            coverage: manifest.coverage,
            valueCount: value ? value.count : 0,
            valuePicks: value && Array.isArray(value.picks) ? value.picks.length : 0,
            detailsFiles: details.length,
            warnings: [
              !value ? "value.json missing έΑΦ low-fixture day (WC/tournament week?)" : null,
              !details.length ? "zero detail files έΑΦ low-fixture day (WC/tournament week?)" : null
            ].filter(Boolean)
          }, null, 2));

          if (manifest.date !== day) {
            throw new Error(`manifest date mismatch: expected ${day}, got ${manifest.date}`);
          }

          if (!details.length) {
            console.warn("WARNING: snapshot has zero detail files έΑΦ continuing (low-fixture day)");
          }
          NODE

      - name: Configure git author
        if: env.SKIP_BUILD != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # TRUTH FIRST, UNGATED: history, standings, team-geo, team-news,
      # multi-odds, provider discovery/registry and coverage-readiness are
      # harvested truth έΑΦ they commit
      # unconditionally BEFORE any publish gate. A gate failure must only ever
      # stop the snapshot publish, never discard collected truth (2026-07-07
      # Gap B lesson: a verify step that skipped the commit threw away every
      # harvested result roughly every second night).
      - name: Persist truth artifacts (ungated)
        if: env.SKIP_BUILD != 'true'
        shell: bash
        run: |
          git restore --staged . || true

          if compgen -G "data/team-geo/*.json" > /dev/null; then
            git add data/team-geo/*.json
          fi

          # Per-bookmaker openings, incl. prefetched future-day (D+1..D+6) lines,
          # so the frozen opening exists on match day. Runs on a US-IP runner
          # (OddsPortal geo-blocks GR). Output was previously never committed.
          if compgen -G "data/multi-odds/*.json" > /dev/null; then
            git add data/multi-odds/*.json
          fi

          for team_news_file in \
            "data/team-news/_worksets/${DAY_KEY}.json" \
            "data/team-news/_research-tasks/${DAY_KEY}.json" \
            "data/team-news/_research-results/${DAY_KEY}.json" \
            "data/team-news/_research-review/${DAY_KEY}.json" \
            "data/team-news/_reports/${DAY_KEY}.json" \
            "data/team-news/_reports/${DAY_KEY}.transfermarkt.json"
          do
            if [ -f "$team_news_file" ]; then
              git add -f "$team_news_file"
            fi
          done

          # run-daily-cycle appends the finalized previous day into
          # data/history/<season>.json (appendFinalizedDayToHistory). This was
          # never committed, so every day's finalized matches were appended on
          # the runner and discarded έΑΦ the committed season history froze at
          # its last manual commit and the form indexes were built stale.
          if compgen -G "data/history/????-????.json" > /dev/null; then
            git add data/history/????-????.json
          fi

          # Derived store report (build-history-report.js) έΑΦ regenerated by the
          # cycle right after the history append so it always mirrors the store.
          if compgen -G "data/history/????-????.report.json" > /dev/null; then
            git add data/history/????-????.report.json
          fi

          # Persist the exact derived foundations produced by run-daily-cycle.
          # Their source history is committed in this same truth checkpoint,
          # so the next runner validates the same state that passed publication.
          if [ -d "data/history-index" ]; then
            git add data/history-index
          fi
          if [ -d "data/h2h" ]; then
            git add data/h2h
          fi
          if [ -f "data/h2h-foundation/current.json" ]; then
            git add data/h2h-foundation/current.json
          fi
          if [ -d "data/model-priors" ]; then
            git add data/model-priors
          fi

          # buildStandingsDay rebuilds data/standings/<slug>.json on the runner
          # every night, but nothing staged them έΑΦ the committed store froze
          # (last real commit 2026-05-03) and Render served months-old tables
          # on /standings while details were built from runner-fresh ones.
          if compgen -G "data/standings/*.json" > /dev/null; then
            git add data/standings/*.json
          fi

          # run-daily-cycle writes the league gap report (BROKEN/lost tracking)
          # to data/coverage-readiness/<day>.json. It was generated on the
          # runner and discarded, so multi-day readiness could not be audited.
          if [ -f "data/coverage-readiness/${DAY_KEY}.json" ]; then
            git add "data/coverage-readiness/${DAY_KEY}.json"
          fi

          # Provider-wide discovery is the independent denominator for the
          # active-competition completeness gate. Persist both the exact-day
          # observation and its longitudinal identity registry; otherwise a
          # failed publish would discard the evidence that explained the gap.
          if [ -f "data/competition-discovery/${DAY_KEY}.json" ]; then
            git add "data/competition-discovery/${DAY_KEY}.json"
          fi

          if [ -f "data/provider-competition-registry/flashscore.json" ]; then
            git add "data/provider-competition-registry/flashscore.json"
          fi

          # Canonical FT upgrades written DURING the cycle (finalize live
          # refresh + results-truth sweeps, incl. the D-2..D-7 catch-up). The
          # canonical acquisition commit runs BEFORE the cycle, so these
          # upgrades were regenerated on the runner every night and discarded
          # (2026-07-07 logs: the same 55 rows of 07-05 and 86 rows of 07-04
          # re-upgraded nightly; Keflavik's swept FT never reached origin).
          if [ -d "data/canonical-fixtures" ]; then
            git add data/canonical-fixtures
          fi

          node engine-v1/jobs/guard-staged-data-boundary.js \
            --label=daily-deploy-truth \
            --dayKey="${DAY_KEY}" \
            --allow="^(data/team-geo/[^/]+\.json$|data/multi-odds/[0-9]{4}-[0-9]{2}-[0-9]{2}\.json$|data/team-news/(_worksets|_research-tasks|_research-results|_research-review|_reports)/${DAY_KEY}(\.transfermarkt)?\.json$|data/history/[0-9]{4}-[0-9]{4}(\.report)?\.json$|data/history-index/|data/h2h/|data/h2h-foundation/|data/model-priors/|data/coverage-readiness/${DAY_KEY}\.json$|data/competition-discovery/${DAY_KEY}\.json$|data/provider-competition-registry/flashscore\.json$|data/standings/[^/]+\.json$|data/canonical-fixtures/)"

          echo "=== TRUTH STAGED FILES OUTSIDE ALLOWLIST - SHOULD BE EMPTY ==="
          DISALLOWED="$(git diff --cached --name-only | grep -Ev '^(data/team-geo/|data/multi-odds/|data/team-news/(_worksets|_research-tasks|_research-results|_research-review|_reports)/|data/history/[0-9]{4}-[0-9]{4}(\.report)?\.json$|data/history-index/|data/h2h/|data/h2h-foundation/|data/model-priors/|data/coverage-readiness/|data/competition-discovery/|data/provider-competition-registry/|data/standings/|data/canonical-fixtures/)' || true)"

          if [ -n "$DISALLOWED" ]; then
            echo "ERROR: disallowed truth files staged:"
            echo "$DISALLOWED"
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "No truth artifact changes to commit."
          else
            git commit -m "Persist daily truth artifacts for ${DAY_KEY}"
            bash tools/git-push-rebase-retry.sh
          fi

      # PUBLISH GATE 1 έΑΦ freshness: the snapshot must not be older than the
      # canonical/expected/coverage inputs it was built from (2026-07-07:
      # manifest 05:33Z shipped while uefa.champions canonical landed 07:31Z έΑΦ
      # 10 CL qualifiers existed in the store but not in the UI). One
      # self-heal attempt re-exports; then the gate is hard. Truth is already
      # committed above, so failing here only stops the snapshot publish.
      - name: Artifact freshness gate (self-heal, pre-publish)
        if: env.SKIP_BUILD != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! node ./engine-v1/jobs/verify-artifact-freshness-day.js --date="$DAY_KEY" --gate; then
            echo "Snapshot stale against upstream inputs; rebuilding details, re-exporting, and refreshing Value artifacts."
            node ./engine-v1/jobs/build-details-day.js "$DAY_KEY" --rebuild
            node ./engine-v1/jobs/export-deploy-snapshot-day.js "$DAY_KEY" --no-update-latest --replace-details --no-build-missing-details --fail-on-missing-details
            node ./engine-v1/jobs/refresh-value-artifacts-day.js --date="$DAY_KEY" --no-update-latest
            node ./engine-v1/jobs/verify-details-value-mirror-day.js --date="$DAY_KEY" --gate
            node ./engine-v1/jobs/build-value-comparison-cumulative.js --write
            node ./engine-v1/jobs/run-snapshot-invariant-check.js "$DAY_KEY" || true
          fi
          node ./engine-v1/jobs/verify-artifact-freshness-day.js --date="$DAY_KEY" --gate

      # PUBLISH GATE 2 έΑΦ invariants: blocked issues (duplicate canonicalId,
      # value-count mismatches, stale report vs manifest) stop the snapshot
      # BEFORE it is committed. Previously post-commit only, which shipped the
      # broken snapshot and merely turned the run red.
      # SEMANTIC DETAILS PREFLIGHT — freshness may be green while Details
      # are semantically stale. Never mutate model foundations at this stage.
      - name: Details foundation semantic preflight (self-heal, pre-publish)
        if: env.SKIP_BUILD != 'true'
        shell: bash
        run: |
          set -euo pipefail
          node ./engine-v1/jobs/build-foundation-integrity-report.js --date="$DAY_KEY"

          if node -e 'const fs=require("fs"); const p="data/foundation-integrity/"+process.env.DAY_KEY+".json"; const r=JSON.parse(fs.readFileSync(p,"utf8")); process.exit(r.publicationReady===true?0:1)'; then
            echo "Details foundation already publication-ready."
          else
            if ! node -e 'const fs=require("fs"); const p="data/foundation-integrity/"+process.env.DAY_KEY+".json"; const r=JSON.parse(fs.readFileSync(p,"utf8")); process.exit(r.modelReady===true?0:1)'; then
              echo "Model foundation is not ready; refusing late foundation mutation."
              node ./engine-v1/jobs/build-foundation-integrity-report.js --date="$DAY_KEY" --gate
            fi

            echo "Model foundation is ready but Details semantic binding failed; rebuilding Details and downstream artifacts."
            node ./engine-v1/jobs/build-details-day.js "$DAY_KEY" --rebuild
            node ./engine-v1/jobs/export-deploy-snapshot-day.js "$DAY_KEY" --no-update-latest --replace-details --no-build-missing-details --fail-on-missing-details
            node ./engine-v1/jobs/refresh-value-artifacts-day.js --date="$DAY_KEY" --no-update-latest
            node ./engine-v1/jobs/verify-details-value-mirror-day.js --date="$DAY_KEY" --gate
            node ./engine-v1/jobs/build-value-comparison-cumulative.js --write
            node ./engine-v1/jobs/run-snapshot-invariant-check.js "$DAY_KEY" || true
            node ./engine-v1/jobs/verify-artifact-freshness-day.js --date="$DAY_KEY" --gate
            node ./engine-v1/jobs/build-foundation-integrity-report.js --date="$DAY_KEY" --gate
          fi

      - name: Invariant gate (pre-publish)
        if: env.SKIP_BUILD != 'true'
        shell: bash
        run: node ./engine-v1/jobs/run-snapshot-invariant-check.js "$DAY_KEY" --gate

      # PUBLISH GATE 3 έΑΦ value artifact: value.json with
      # source=missing_local_value_file while fixtures exist is a
      # value-pipeline failure dressed up as "no picks today" (2026-07-02
      # outage mode). It must not ship.
      - name: Value artifact gate (pre-publish)
        if: env.SKIP_BUILD != 'true'
        shell: bash
        run: node engine-v1/jobs/check-value-artifact-gate.js --date="${DAY_KEY}"

      # FOUNDATION GATE — the final details/model inputs must still be bound
      # to the current clean history, standings, H2H and derived fingerprints.
      # This runs after freshness/invariant/value refresh and before any report
      # can claim the day is publishable.
      - name: Foundation integrity gate (pre-publish)
        if: env.SKIP_BUILD != 'true'
        shell: bash
        run: node ./engine-v1/jobs/build-foundation-integrity-report.js --date="$DAY_KEY" --gate

      # Autonomy scoreboard: one self-describing report per day rolling up
      # universe parity, acquisition, freshness, invariants, value and
      # settlement into a single clean/not-clean verdict. Consecutive clean
      # days are the Definition-of-Done streak for the autonomous mechanism.
      - name: Preserve foundation integrity diagnostics
        if: failure() && env.SKIP_BUILD != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: foundation-integrity-${{ env.DAY_KEY }}
          path: |
            data/foundation-integrity/${{ env.DAY_KEY }}.json
            data/foundation-integrity/latest.json
          if-no-files-found: warn
          retention-days: 14

      - name: Build day report
        if: env.SKIP_BUILD != 'true'
        run: node ./engine-v1/jobs/build-day-report.js --date="$DAY_KEY"

      - name: Build system health alert artifact
        if: env.SKIP_BUILD != 'true'
        run: node ./engine-v1/jobs/build-system-health-alerts-day.js --date="$DAY_KEY"

      # All release artifacts must be green while deploy-snapshots/latest.json
      # still points at the previously published day. This is the publication
      # transaction boundary: no live pointer moves before this contract passes.
      - name: Complete daily prepublish contract gate
        if: env.SKIP_BUILD != 'true'
        run: node ./engine-v1/jobs/verify-daily-publish-contract.js --date="$DAY_KEY" --prepublish --gate

      - name: Promote deploy snapshot latest after prepublish gates
        if: env.SKIP_BUILD != 'true'
        run: node ./engine-v1/jobs/promote-deploy-snapshot-latest-day.js --date="$DAY_KEY"

      # FINAL PUBLISH CONTRACT έΑΦ no snapshot commit is allowed unless every
      # mandatory artifact exists, parses, belongs to DAY_KEY, is fresh, is
      # invariant-safe, and latest.json points to this exact manifest.
      - name: Complete daily publish contract gate
        if: env.SKIP_BUILD != 'true'
        run: node ./engine-v1/jobs/verify-daily-publish-contract.js --date="$DAY_KEY" --gate

      - name: Sync System Health GitHub issue
        if: env.SKIP_BUILD != 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node ./engine-v1/jobs/sync-system-health-github-issue.js --date="$DAY_KEY"

      - name: Stage allowed snapshot files only
        if: env.SKIP_BUILD != 'true'
        shell: bash
        run: |
          git restore --staged . || true

          git add data/deploy-snapshots/latest.json
          git add "data/deploy-snapshots/${DAY_KEY}/"

          if [ -f "data/build-reports/${DAY_KEY}.json" ]; then
            git add "data/build-reports/${DAY_KEY}.json"
          fi

          if [ -f "data/foundation-integrity/${DAY_KEY}.json" ]; then
            git add "data/foundation-integrity/${DAY_KEY}.json"
          fi

          if [ -f "data/foundation-integrity/latest.json" ]; then
            git add "data/foundation-integrity/latest.json"
          fi

          if [ -f "data/system-health/${DAY_KEY}.json" ]; then
            git add "data/system-health/${DAY_KEY}.json"
          fi

          if [ -f "data/system-health/latest.json" ]; then
            git add "data/system-health/latest.json"
          fi

          if [ -f "data/value/${DAY_KEY}.json" ]; then
            git add "data/value/${DAY_KEY}.json"
          fi

          if [ -f "data/value/_audit/${DAY_KEY}.json" ]; then
            git add "data/value/_audit/${DAY_KEY}.json"
          fi

          if [ -f "data/plan-c-shadow/${DAY_KEY}.json" ]; then
            git add "data/plan-c-shadow/${DAY_KEY}.json"
          fi

          if [ -f "data/plan-c-shadow/_audit/${DAY_KEY}.json" ]; then
            git add "data/plan-c-shadow/_audit/${DAY_KEY}.json"
          fi

          if [ -d "data/plan-c-shadow/frozen/i2b-20260825" ]; then
            git add "data/plan-c-shadow/frozen/i2b-20260825/"
          fi

          if [ -d "data/plan-c-shadow/clubelo-snapshots" ]; then
            git add "data/plan-c-shadow/clubelo-snapshots/"
          fi

          if [ -f "data/plan-c-shadow/clubelo-refresh/_audit/${DAY_KEY}.json" ]; then
            git add "data/plan-c-shadow/clubelo-refresh/_audit/${DAY_KEY}.json"
          fi

          if [ -f "data/plan-c-shadow/generation/_audit/${DAY_KEY}.json" ]; then
            git add "data/plan-c-shadow/generation/_audit/${DAY_KEY}.json"
          fi

          if [ -f "data/plan-c-shadow/settlement/latest.json" ]; then
            git add "data/plan-c-shadow/settlement/latest.json"
          fi

          if [ -f "data/plan-c-shadow/settlement/_audit/${DAY_KEY}.json" ]; then
            git add "data/plan-c-shadow/settlement/_audit/${DAY_KEY}.json"
          fi

          if [ -d "data/value-plans/${DAY_KEY}" ]; then
            git add "data/value-plans/${DAY_KEY}/"
          fi

          if [ -f "data/value-comparison/${DAY_KEY}.json" ]; then
            git add "data/value-comparison/${DAY_KEY}.json"
          fi

          # Re-settled value picks + re-exported snapshots for RECENT days
          # (D-1..D-7): run-daily-cycle's finalize resettle covers yesterday
          # and the history catch-up now re-settles any recent day whose
          # truth arrived late (Keflavik case: the 07-06 final only reached
          # the truth store via 07-07's harvest). Without staging these the
          # WIN/LOSS would regenerate on the runner every night and be
          # discarded, leaving the committed export permanently UNRESOLVED.
          RECENT_KEYS=""
          for back in 1 2 3 4 5 6 7; do
            RECENT_KEYS="$RECENT_KEYS $(TZ=Europe/Athens date -d "${DAY_KEY} -${back} day" +%F)"
          done
          echo "Recent settlement window:${RECENT_KEYS}"

          for k in ${RECENT_KEYS}; do
            if [ -d "data/deploy-snapshots/$k" ]; then
              git add "data/deploy-snapshots/$k/"
            fi
            if [ -d "data/value-plans/$k" ]; then
              git add "data/value-plans/$k/"
            fi
            if [ -f "data/value-comparison/$k.json" ]; then
              git add "data/value-comparison/$k.json"
            fi
            if [ -d "data/final-results/$k" ]; then
              git add "data/final-results/$k/"
            fi
            if [ -f "data/final-result-conflicts/$k.json" ]; then
              git add "data/final-result-conflicts/$k.json"
            fi
          done

          if [ -d "data/final-results/${DAY_KEY}" ]; then
            git add "data/final-results/${DAY_KEY}/"
          fi
          if [ -f "data/final-result-conflicts/${DAY_KEY}.json" ]; then
            git add "data/final-result-conflicts/${DAY_KEY}.json"
          fi

          if [ -f "data/value-comparison/cumulative.json" ]; then
            git add "data/value-comparison/cumulative.json"
          fi

          RECENT_ALT="$(echo ${RECENT_KEYS} | tr ' ' '|')"
          RECENT_CSV="$(echo ${RECENT_KEYS} | tr ' ' ',')"

          node engine-v1/jobs/guard-staged-data-boundary.js \
            --label=daily-deploy-snapshot \
            --dayKey="${DAY_KEY}" \
            --extra-days="${RECENT_CSV}" \
            --allow="^(data/deploy-snapshots/latest\.json$|data/deploy-snapshots/(${DAY_KEY}|${RECENT_ALT})/|data/build-reports/${DAY_KEY}\.json$|data/foundation-integrity/${DAY_KEY}\.json$|data/foundation-integrity/latest\.json$|data/system-health/${DAY_KEY}\.json$|data/system-health/latest\.json$|data/value/${DAY_KEY}\.json$|data/value/_audit/${DAY_KEY}\.json$|data/plan-c-shadow/${DAY_KEY}\.json$|data/plan-c-shadow/_audit/${DAY_KEY}\.json$|data/plan-c-shadow/frozen/i2b-20260825/|data/plan-c-shadow/clubelo-snapshots/|data/plan-c-shadow/clubelo-refresh/_audit/${DAY_KEY}\.json$|data/plan-c-shadow/generation/_audit/${DAY_KEY}\.json$|data/plan-c-shadow/settlement/latest\.json$|data/plan-c-shadow/settlement/_audit/${DAY_KEY}\.json$|data/value-plans/(${DAY_KEY}|${RECENT_ALT})/|data/value-comparison/(${DAY_KEY}|${RECENT_ALT})\.json$|data/value-comparison/cumulative\.json$|data/final-results/(${DAY_KEY}|${RECENT_ALT})/|data/final-result-conflicts/(${DAY_KEY}|${RECENT_ALT})\.json$)"

          echo "=== STAGED FILES OUTSIDE ALLOWLIST - SHOULD BE EMPTY ==="
          DISALLOWED="$(git diff --cached --name-only | grep -Ev '^(data/deploy-snapshots/|data/build-reports/|data/foundation-integrity/|data/system-health/|data/value/|data/plan-c-shadow/|data/value-plans/|data/value-comparison/|data/final-results/|data/final-result-conflicts/)' || true)"

          if [ -n "$DISALLOWED" ]; then
            echo "ERROR: disallowed files staged:"
            echo "$DISALLOWED"
            exit 1
          fi

          echo "=== STAGED COUNT ==="
          git diff --cached --name-only | wc -l

      - name: Commit and push snapshot
        if: env.SKIP_BUILD != 'true'
        shell: bash
        run: |
          set -euo pipefail

          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
            echo "DAILY_SNAPSHOT_COMMITTED=false" >> "$GITHUB_ENV"
            exit 0
          fi

          git commit -m "Auto refresh deploy snapshot for ${DAY_KEY}"
          bash tools/git-push-rebase-retry.sh
          PUBLISHED_REF="$(git rev-parse HEAD)"
          echo "PUBLISHED_REF=${PUBLISHED_REF}" >> "$GITHUB_ENV"
          echo "DAILY_SNAPSHOT_COMMITTED=true" >> "$GITHUB_ENV"
          echo "Published immutable snapshot ref ${PUBLISHED_REF}"

      - name: Promote and verify public runtime snapshots
        if: env.SKIP_BUILD != 'true' && env.DAILY_SNAPSHOT_COMMITTED == 'true'
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          # Publication is complete only after the engine child process promotes
          # the exact commit-pinned release and the public snapshot endpoint
          # returns the same manifest hash. A failed sync fails the workflow.
          # Promote the release day first. A prior-day synchronization problem
          # must never strand the newly published operational day behind yesterday.
          bash tools/sync-public-snapshot.sh "${DAY_KEY}" "${PUBLISHED_REF}"
          # FINALIZE_DAY_KEY is a closed-day settlement publication.
          # Keep the strict historical snapshot manifest gate intact;
          # only refresh the authoritative four-plan comparison mirror.
          node tools/sync-public-value-comparison.mjs "${FINALIZE_DAY_KEY}" "${PUBLISHED_REF}"

      - name: Data publication requires no UI deploy
        if: env.SKIP_BUILD != 'true' && env.DAILY_SNAPSHOT_COMMITTED == 'true' && env.ALLOW_RENDER_DEPLOY != 'true'
        run: |
          echo "Snapshot publication completed through the engine release contract."
          echo "The static UI uses Europe/Athens as its day authority and does not require a data-only redeploy."

      - name: Trigger and verify optional manual Render redeploy
        if: env.SKIP_BUILD != 'true' && env.DAILY_SNAPSHOT_COMMITTED == 'true' && env.ALLOW_RENDER_DEPLOY == 'true'
        shell: bash
        env:
          RENDER_ENGINE_DEPLOY_HOOK_URL: ${{ secrets.RENDER_ENGINE_DEPLOY_HOOK_URL }}
          RENDER_UI_DEPLOY_HOOK_URL: ${{ secrets.RENDER_UI_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail

          if [ -z "${RENDER_ENGINE_DEPLOY_HOOK_URL:-}" ] || [ -z "${RENDER_UI_DEPLOY_HOOK_URL:-}" ]; then
            echo "ERROR: both Render deploy hooks are required for triggerRender=true."
            exit 1
          fi

          curl -fsS -X POST "${RENDER_ENGINE_DEPLOY_HOOK_URL}"
          curl -fsS -X POST "${RENDER_UI_DEPLOY_HOOK_URL}"
          bash tools/wait-for-render-engine-release.sh "${PUBLISHED_REF}"
          bash tools/verify-public-ui-release.sh "${PUBLISHED_REF}"
