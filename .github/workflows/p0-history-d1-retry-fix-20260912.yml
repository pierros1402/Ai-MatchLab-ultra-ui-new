name: P0 history D-1 retry fix

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/p0-history-d1-retry-fix-20260912.yml"

permissions:
  contents: write

concurrency:
  group: ai-matchlab-data-writer
  cancel-in-progress: false

jobs:
  patch-history-d1-retry:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout current main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Verify exact source baseline and apply D-1 retry patch
        shell: bash
        run: |
          set -euo pipefail

          RUN_FILE="engine-v1/jobs/run-daily-cycle.js"
          TEST_FILE="engine-v1/tests/daily-history-catchup-h2h-scope.test.js"

          RUN_BLOB="$(git hash-object "${RUN_FILE}")"
          TEST_BLOB="$(git hash-object "${TEST_FILE}")"

          echo "RUN_BLOB=${RUN_BLOB}"
          echo "TEST_BLOB=${TEST_BLOB}"

          test "${RUN_BLOB}" = "01e9854f85bfbbdb8a78a4b4af85a92ac582b01c"
          test "${TEST_BLOB}" = "9fb5e950e8a4e69c39ba2ad693952d0291a341f1"

          node <<'NODE'
          const fs = require("fs");

          const runFile = "engine-v1/jobs/run-daily-cycle.js";
          const testFile = "engine-v1/tests/daily-history-catchup-h2h-scope.test.js";

          const oldLoop = "    for (let back = 2; back <= 7; back++) {";
          const newLoop = "    for (let back = 1; back <= 7; back++) {";

          let source = fs.readFileSync(runFile, "utf8");
          const oldCount = source.split(oldLoop).length - 1;
          const newCountBefore = source.split(newLoop).length - 1;

          if (oldCount !== 1 || newCountBefore !== 0) {
            throw new Error(
              `history catch-up loop baseline mismatch: old=${oldCount} new=${newCountBefore}`
            );
          }

          source = source.replace(oldLoop, newLoop);
          fs.writeFileSync(runFile, source, "utf8");

          let testSource = fs.readFileSync(testFile, "utf8");
          const marker =
            'test("history catch-up retries D-1 through D-7", () => {';

          if (testSource.includes(marker)) {
            throw new Error("D-1 regression test already exists");
          }

          testSource += `

          test("history catch-up retries D-1 through D-7", () => {
            const loopIndex = source.indexOf(
              "    for (let back = 1; back <= 7; back++) {"
            );
            const oldLoopIndex = source.indexOf(
              "    for (let back = 2; back <= 7; back++) {"
            );
            const dayShiftIndex = source.indexOf(
              "const day = shiftDay(dayKey, -back);",
              loopIndex
            );

            assert.ok(
              loopIndex >= 0,
              "history catch-up must retry yesterday (D-1)"
            );
            assert.equal(
              oldLoopIndex,
              -1,
              "D-2-only catch-up loop must not remain"
            );
            assert.ok(
              dayShiftIndex > loopIndex,
              "catch-up day must still be derived from the loop offset"
            );
          });
          `;

          fs.writeFileSync(testFile, testSource, "utf8");
          NODE

      - name: Validate syntax and targeted regression
        shell: bash
        run: |
          set -euo pipefail
          node --check engine-v1/jobs/run-daily-cycle.js
          node --check engine-v1/tests/daily-history-catchup-h2h-scope.test.js
          node --test engine-v1/tests/daily-history-catchup-h2h-scope.test.js

      - name: Verify exact write set
        shell: bash
        run: |
          set -euo pipefail

          node - <<'NODE'
          const fs = require("fs");
          const source = fs.readFileSync(
            "engine-v1/jobs/run-daily-cycle.js",
            "utf8"
          );
          const oldLoop =
            "    for (let back = 2; back <= 7; back++) {";
          const newLoop =
            "    for (let back = 1; back <= 7; back++) {";

          if (source.split(oldLoop).length - 1 !== 0) {
            throw new Error("old D-2-only loop still exists");
          }

          if (source.split(newLoop).length - 1 !== 1) {
            throw new Error("expected exactly one D-1 catch-up loop");
          }
          NODE

          git diff --check

          CHANGED="$(git diff --name-only | sort)"
          EXPECTED="$(printf '%s\n' \
            'engine-v1/jobs/run-daily-cycle.js' \
            'engine-v1/tests/daily-history-catchup-h2h-scope.test.js' \
            | sort)"

          if [ "${CHANGED}" != "${EXPECTED}" ]; then
            echo "ERROR: unexpected pre-cleanup write set"
            echo "Actual:"
            printf '%s\n' "${CHANGED}"
            echo "Expected:"
            printf '%s\n' "${EXPECTED}"
            exit 1
          fi

      - name: Commit tested patch and self-remove workflow
        shell: bash
        run: |
          set -euo pipefail

          WORKFLOW=".github/workflows/p0-history-d1-retry-fix-20260912.yml"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add engine-v1/jobs/run-daily-cycle.js
          git add engine-v1/tests/daily-history-catchup-h2h-scope.test.js
          git rm "${WORKFLOW}"

          STAGED="$(git diff --cached --name-only | sort)"
          EXPECTED="$(printf '%s\n' \
            '.github/workflows/p0-history-d1-retry-fix-20260912.yml' \
            'engine-v1/jobs/run-daily-cycle.js' \
            'engine-v1/tests/daily-history-catchup-h2h-scope.test.js' \
            | sort)"

          if [ "${STAGED}" != "${EXPECTED}" ]; then
            echo "ERROR: unexpected staged write set"
            echo "Actual:"
            printf '%s\n' "${STAGED}"
            echo "Expected:"
            printf '%s\n' "${EXPECTED}"
            exit 1
          fi

          git diff --cached --check
          git commit -m "Retry D-1 history catch-up in daily cycle"
          bash tools/git-push-rebase-retry.sh
