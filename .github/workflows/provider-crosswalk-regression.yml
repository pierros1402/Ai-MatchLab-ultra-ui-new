name: Provider crosswalk regression
on:
  pull_request:
    paths:
      - 'engine-v1/core/provider-team-crosswalk*'
      - '.github/workflows/provider-crosswalk-regression.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check engine-v1/core/provider-team-crosswalk.js
      - run: node --test engine-v1/core/provider-team-crosswalk.test.js
