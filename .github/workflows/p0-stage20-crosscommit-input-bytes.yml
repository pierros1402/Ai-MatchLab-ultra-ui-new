name: P0 Stage20 cross-commit declared data input proof (isolated)
on:
  pull_request:
    paths:
      - "engine-v1/core/daily-resume-crosscommit-input-bytes.mjs"
      - "engine-v1/core/daily-resume-crosscommit-input-bytes.test.mjs"
      - ".github/workflows/p0-stage20-crosscommit-input-bytes.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            engine-v1/core/daily-resume-crosscommit-input-bytes.mjs
            engine-v1/core/daily-resume-crosscommit-input-bytes.test.mjs
            engine-v1/core/daily-resume-crosscommit-nondata-proof.mjs
            .github/workflows/p0-stage20-crosscommit-input-bytes.yml
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Syntax and producer/consumer byte-identity regression
        run: |
          node --check engine-v1/core/daily-resume-crosscommit-input-bytes.mjs
          node --check engine-v1/core/daily-resume-crosscommit-input-bytes.test.mjs
          node --test --test-reporter=tap engine-v1/core/daily-resume-crosscommit-input-bytes.test.mjs
      - name: Ensure no production change
        run: |
          git diff --exit-code HEAD -- .github/workflows/daily-deploy-snapshot.yml data/
          echo "EXACT_DECLARED_INPUT_BYTES_ONLY__COMPLETE_INPUTS_UNPROVEN__RESUME_OFF"
