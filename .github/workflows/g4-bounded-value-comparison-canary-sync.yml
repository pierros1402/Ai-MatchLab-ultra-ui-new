name: G4 bounded Value comparison canary sync

on:
  workflow_dispatch:
    inputs:
      dayKey:
        description: "Exact YYYY-MM-DD comparison day"
        required: true
        type: string
      ref:
        description: "Exact immutable 40-character commit containing the canary artifact"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: g4-bounded-value-comparison-canary-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout workflow revision
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate bounded inputs
        shell: bash
        env:
          DAY_KEY: ${{ inputs.dayKey }}
          IMMUTABLE_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          printf "%s" "${DAY_KEY}" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
          printf "%s" "${IMMUTABLE_REF}" | grep -Eq '^[0-9a-f]{40}$'

      - name: Promote exact commit-pinned Value comparison
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "${CRON_SECRET:-}"
          node tools/sync-public-value-comparison.mjs \
            "${{ inputs.dayKey }}" \
            "${{ inputs.ref }}"
