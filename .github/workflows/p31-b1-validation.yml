name: P3.1 B1 isolated validation

on:
  push:
    branches:
      - work/p31-b1-mirror-validator-20260822

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Syntax
        run: |
          node --check engine-v1/jobs/audit-history-semantic-integrity.js
          node --check engine-v1/jobs/build-foundation-integrity-report.js
          node --check engine-v1/jobs/audit-history-semantic-integrity.test.js
          node --check engine-v1/tests/foundation-integrity-report.test.js

      - name: Targeted tests
        run: node --test engine-v1/jobs/audit-history-semantic-integrity.test.js engine-v1/tests/foundation-integrity-report.test.js

      - name: Real current-data history semantic gate
        run: |
          node --input-type=module <<'NODE'
          import { buildSemanticHistoryAudit } from './engine-v1/jobs/audit-history-semantic-integrity.js';
          const r = buildSemanticHistoryAudit();
          const s = {
            ok: r.ok,
            clean: r.clean,
            issueCounts: r.issueCounts,
            mirrorConflictCount: r.resultsMemory?.mirrorConflictCount,
            multiSideMatchIdCount: r.resultsMemory?.multiSideMatchIdCount,
            issues: r.issues
          };
          console.log(JSON.stringify(s, null, 2));
          if (r.resultsMemory?.mirrorConflictCount !== 0) process.exit(21);
          if (Number(r.issueCounts?.error || 0) !== 0) process.exit(22);
          if (r.ok !== true) process.exit(23);
          NODE

      - name: Foundation warning/error classification gate
        run: |
          node --input-type=module <<'NODE'
          import { buildFoundationIntegrityReport } from './engine-v1/jobs/build-foundation-integrity-report.js';
          const r = buildFoundationIntegrityReport('2026-08-22');
          console.log(JSON.stringify({
            historySemantic: r.components?.historySemantic,
            modelReady: r.modelReady,
            publicationReady: r.publicationReady,
            blocked: r.blocked,
            warnings: r.warnings
          }, null, 2));
          if (r.components?.historySemantic?.ok !== true) process.exit(31);
          if (r.blocked?.some(x => x.component === 'historySemantic')) process.exit(32);
          if (!r.warnings?.some(x => x.component === 'historySemantic')) process.exit(33);
          NODE

      - name: Publish validation status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = "success" ]; then STATE=success; else STATE=failure; fi
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${STATE}\",\"context\":\"P3.1 B1 validation\",\"description\":\"targeted + real current-data history gate\"}" >/dev/null
