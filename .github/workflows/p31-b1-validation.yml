name: P3.1 B1 isolated validation

on:
  push:
    branches:
      - work/p31-b1-validation-20260822

permissions:
  contents: read
  statuses: write

concurrency:
  group: p31-b1-isolated-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      - name: Install engine dependencies
        working-directory: engine-v1
        run: npm ci --no-audit --no-fund

      - name: Syntax checks
        id: syntax
        continue-on-error: true
        run: |
          node --check engine-v1/jobs/build-foundation-integrity-report.js
          node --check engine-v1/tests/foundation-integrity-report.test.js
          node --check assets/js/live/operational-day.js
          node --check engine-v1/tests/ui-atomic-operational-day.test.js

      - name: Foundation classification contracts
        id: foundation
        continue-on-error: true
        run: node --test --test-reporter=tap engine-v1/tests/foundation-integrity-report.test.js

      - name: Atomic rollover contracts
        id: rollover
        continue-on-error: true
        run: |
          node --test --test-reporter=tap \
            engine-v1/tests/ui-atomic-operational-day.test.js \
            engine-v1/tests/publication-runtime-contract.test.js

      - name: Daily publication contracts
        id: daily
        continue-on-error: true
        run: |
          node --test --test-reporter=tap \
            engine-v1/tests/daily-publish-contract.test.js \
            engine-v1/tests/daily-details-foundation-order.test.js

      - name: Operational foundation observation
        id: observation
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node ./engine-v1/jobs/build-foundation-integrity-report.js --date=2026-08-22
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('data/foundation-integrity/2026-08-22.json', 'utf8'));
          console.log(JSON.stringify({
            modelReady: report.modelReady === true,
            publicationReady: report.publicationReady === true,
            blocked: report.blocked || [],
            warnings: report.warnings || [],
            detailsOk: report.components?.details?.ok === true,
            historySafety: report.components?.historySemantic?.detail?.publicationSafety || null,
          }, null, 2));
          NODE

      - name: Publish per-gate statuses
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SYNTAX: ${{ steps.syntax.outcome }}
          FOUNDATION: ${{ steps.foundation.outcome }}
          ROLLOVER: ${{ steps.rollover.outcome }}
          DAILY: ${{ steps.daily.outcome }}
          OBSERVATION: ${{ steps.observation.outcome }}
        run: |
          set -euo pipefail
          post_status() {
            local context="$1"
            local outcome="$2"
            local state=failure
            [ "$outcome" = "success" ] && state=success
            local payload
            payload="$(CONTEXT="$context" STATE="$state" OUTCOME="$outcome" node -e 'process.stdout.write(JSON.stringify({state:process.env.STATE,context:process.env.CONTEXT,description:"outcome="+process.env.OUTCOME}))')"
            curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -d "$payload" >/dev/null
          }
          post_status "P3.1 B1 syntax" "$SYNTAX"
          post_status "P3.1 B1 foundation contracts" "$FOUNDATION"
          post_status "P3.1 B1 rollover contracts" "$ROLLOVER"
          post_status "P3.1 B1 daily contracts" "$DAILY"
          post_status "P3.1 B1 operational observation" "$OBSERVATION"

      - name: Enforce targeted result
        if: always()
        shell: bash
        env:
          SYNTAX: ${{ steps.syntax.outcome }}
          FOUNDATION: ${{ steps.foundation.outcome }}
          ROLLOVER: ${{ steps.rollover.outcome }}
          DAILY: ${{ steps.daily.outcome }}
          OBSERVATION: ${{ steps.observation.outcome }}
        run: |
          test "$SYNTAX" = success
          test "$FOUNDATION" = success
          test "$ROLLOVER" = success
          test "$DAILY" = success
          test "$OBSERVATION" = success
