name: TMP history propagation audit current 2026-09-13

on:
  push:
    branches:
      - audit/20260913-history-propagation-current-main-v2

permissions:
  contents: read

jobs:
  audit-history-propagation-current:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify exact source baseline
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BASE="b4abcdd47da8164df94f76aa7612d711c984c087"
          ACTUAL_PARENT="$(git rev-parse HEAD^)"
          test "$ACTUAL_PARENT" = "$EXPECTED_BASE"
          CHANGED="$(git diff --name-only "$EXPECTED_BASE"..HEAD)"
          test "$CHANGED" = ".github/workflows/tmp-history-propagation-audit-current-20260913.yml"
          echo "HISTORY_AUDIT_BASE_VERIFIED=$EXPECTED_BASE"

      - name: Audit history store and report row parity
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const history = JSON.parse(fs.readFileSync('data/history/2026-2027.json', 'utf8'));
          const report = JSON.parse(fs.readFileSync('data/history/2026-2027.report.json', 'utf8'));
          const quarantine = JSON.parse(fs.readFileSync('data/competition-routing-quarantine/2026-09-12/manifest.json', 'utf8'));

          const expectedCounts = {
            '2026-09-09': 76,
            '2026-09-10': 86,
            '2026-09-11': 185,
          };
          const unresolvedExpectedAbsent = new Set([
            'cid_chi2_sanfelipe_sanluis_20260909',
            'cid_kos2_ferizaj_istogu_20260911',
            'cid_fro1_abargir_toftir_20260911',
          ]);

          const days = Array.isArray(history?.days) ? history.days : [];
          const dayMap = new Map(days.map((day) => [String(day?.dayKey || ''), day]));
          const errors = [];
          const perDay = {};
          const recentIds = new Set();

          for (const [dayKey, expected] of Object.entries(expectedCounts)) {
            const day = dayMap.get(dayKey);
            const rows = Array.isArray(day?.rows) ? day.rows : [];
            const ids = rows.map((row) => String(row?.id || '')).filter(Boolean);
            const seen = new Set();
            const duplicateIds = [];
            for (const id of ids) {
              if (seen.has(id)) duplicateIds.push(id);
              seen.add(id);
              recentIds.add(id);
            }
            const reportRows = Number(report?.byDay?.[dayKey] ?? -1);
            perDay[dayKey] = { historyRows: rows.length, reportRows, duplicateIds: [...new Set(duplicateIds)] };
            if (rows.length !== expected) errors.push(`${dayKey}: history ${rows.length} != expected ${expected}`);
            if (reportRows !== expected) errors.push(`${dayKey}: report ${reportRows} != expected ${expected}`);
            if (duplicateIds.length) errors.push(`${dayKey}: duplicate ids ${[...new Set(duplicateIds)].join(',')}`);
          }

          const quarantinedIds = new Set();
          for (const candidate of Array.isArray(quarantine?.candidates) ? quarantine.candidates : []) {
            const id = String(candidate?.canonicalId || candidate?.matchId || candidate?.id || '').trim();
            if (id) quarantinedIds.add(id);
          }
          for (const row of Array.isArray(quarantine?.finalResultRemovals) ? quarantine.finalResultRemovals : []) {
            const id = String(row?.canonicalId || row?.matchId || row?.id || '').trim();
            if (id) quarantinedIds.add(id);
          }

          const quarantineHits = [...quarantinedIds].filter((id) => recentIds.has(id)).sort();
          const unresolvedHits = [...unresolvedExpectedAbsent].filter((id) => recentIds.has(id)).sort();

          if (quarantineHits.length) errors.push(`quarantined ids present in history: ${quarantineHits.join(',')}`);
          if (unresolvedHits.length) errors.push(`unresolved ids present in history: ${unresolvedHits.join(',')}`);
          if (report?.to !== '2026-09-11') errors.push(`report.to=${report?.to}`);
          if (report?.lastCompletedDay !== '2026-09-11') errors.push(`lastCompletedDay=${report?.lastCompletedDay}`);
          if (Number(report?.totalMatches) !== 4196) errors.push(`totalMatches=${report?.totalMatches}`);

          const summary = {
            ok: errors.length === 0,
            historySeason: history?.season || null,
            reportGeneratedAt: report?.generatedAt || null,
            reportTo: report?.to || null,
            lastCompletedDay: report?.lastCompletedDay || null,
            totalMatches: report?.totalMatches ?? null,
            perDay,
            quarantinedIdCountChecked: quarantinedIds.size,
            quarantineHits,
            unresolvedExpectedAbsent: [...unresolvedExpectedAbsent],
            unresolvedHits,
            errors,
          };
          console.log(JSON.stringify(summary, null, 2));
          if (!summary.ok) process.exit(1);
          NODE

      - name: Prove checkout stayed read-only
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          echo "READ_ONLY_HISTORY_AUDIT=PASS"
