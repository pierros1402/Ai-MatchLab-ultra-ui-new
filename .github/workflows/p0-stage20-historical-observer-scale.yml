name: P0 Stage20 historical 9083-file observation scale test (isolated)
on:
  pull_request:
    paths:
      - ".github/workflows/p0-stage20-historical-observer-scale.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  real_archive_scale:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/audit-daily954-stage20-history.mjs
            engine-v1/jobs/observe-stage20-data-inventory.mjs
            engine-v1/core/daily-resume-complete-data-inventory.mjs
            engine-v1/core/daily-resume-stage20-admission.mjs
            .github/workflows/p0-stage20-historical-observer-scale.yml
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Download original failed Daily #954 immutable recovery artifact
        uses: actions/download-artifact@v4
        with:
          name: history-recovery-45137286904-1
          run-id: 45137286904
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/daily954-observer-input
      - name: Exact-byte verify source archive BEFORE any scratch test
        shell: bash
        run: |
          set -euo pipefail
          node tools/audit-daily954-stage20-history.mjs "$RUNNER_TEMP/daily954-observer-input" \
            > "$RUNNER_TEMP/original-evidence-summary.jsonl"
          node --input-type=module - "$RUNNER_TEMP/original-evidence-summary.jsonl" <<'NODE'
          import fs from "node:fs";
          import assert from "node:assert/strict";
          const x=fs.readFileSync(process.argv[2],"utf8").trim();
          assert.ok(x.startsWith("DAILY954_STAGE20_HISTORICAL_INVENTORY="));
          const p=JSON.parse(x.slice(x.indexOf("=")+1));
          assert.equal(p.files,9083);
          assert.equal(p.bytes,428113899);
          assert.equal(p.manifestSha256,"12c19ca0c9c97aca10c25fe62f3184ceaa02d87b5e9d66fa4340e0d5589ce1c0");
          console.log("STAGE20_ORIGINAL_ARCHIVE_VERIFIED="+JSON.stringify({
            runId:p.runId,files:p.files,bytes:p.bytes,manifestSha256:p.manifestSha256
          }));
          NODE
      - name: Materialize verified ORIGINAL bytes into completely separate scratch Git root
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/aiml-stage20-scale-scratch"
          mkdir "$ROOT"
          cd "$ROOT"
          git init -q --initial-branch=main
          git config user.name "Isolated Observer CI"
          git config user.email "ci@example.invalid"
          printf 'synthetic repository root only\n' > README.md
          git add README.md
          git commit -qm "isolated baseline marker"
          test -d "$RUNNER_TEMP/daily954-observer-input/data"
          cp -a "$RUNNER_TEMP/daily954-observer-input/data" "$ROOT/data"
          test -d "$ROOT/data/value"
      - name: Benchmark exact real 9083-file PRE inventory without re-running Daily
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/aiml-stage20-scale-scratch"
          timeout 300 node "$GITHUB_WORKSPACE/engine-v1/jobs/observe-stage20-data-inventory.mjs" pre 2026-11-23 \
            > "$RUNNER_TEMP/observer-pre-summary.jsonl"
          node --input-type=module - "$RUNNER_TEMP/observer-pre-summary.jsonl" <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const pre=JSON.parse(fs.readFileSync(process.argv[2],"utf8").trim().split("STAGE20_BOUNDARY_OBSERVATION=")[1]);
          assert.equal(pre.phase,"pre");
          assert.equal(pre.fileCount,9083);
          assert.equal(pre.totalBytes,428113899);
          assert.equal(pre.resumeAuthorized,false);
          assert.equal(pre.publicationAuthorized,false);
          console.log("STAGE20_REAL_ARCHIVE_PRE_OBSERVED="+JSON.stringify({
            files:pre.fileCount,bytes:pre.totalBytes,sha256:pre.manifestSha256
          }));
          NODE
      - name: Add ONE synthetic canary in scratch only, preserving all 9083 original bytes
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/aiml-stage20-scale-scratch"
          test ! -e "$ROOT/data/value/observer-benchmark-canary.json"
          printf '{"syntheticCanary":true}\n' > "$ROOT/data/value/observer-benchmark-canary.json"
      - name: Benchmark real-size POST inventory and exact delta, reject side effects
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/aiml-stage20-scale-scratch"
          timeout 300 node "$GITHUB_WORKSPACE/engine-v1/jobs/observe-stage20-data-inventory.mjs" post 2026-11-23 \
            > "$RUNNER_TEMP/observer-post-summary.jsonl"
          node --input-type=module - "$RUNNER_TEMP/observer-post-summary.jsonl" <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const post=JSON.parse(fs.readFileSync(process.argv[2],"utf8").trim().split("STAGE20_BOUNDARY_OBSERVATION=")[1]);
          const delta=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/aiml-stage20-delta.json","utf8"));
          assert.equal(post.phase,"post");
          assert.equal(post.beforeFiles,9083);
          assert.equal(post.afterFiles,9084);
          assert.deepEqual([post.added,post.modified,post.deleted],[1,0,0]);
          assert.equal(delta.changes.length,1);
          assert.equal(delta.changes[0].path,"data/value/observer-benchmark-canary.json");
          assert.equal(post.resumeAuthorized,false);
          assert.equal(post.publicationAuthorized,false);
          console.log("STAGE20_REAL_ARCHIVE_POST_OBSERVED="+JSON.stringify({
            files:post.afterFiles,added:post.added,modified:post.modified,deleted:post.deleted,
            beforeSha256:post.beforeSha256,afterSha256:post.afterSha256
          }));
          NODE
      - name: No changes to producer, workflow or production data
        run: |
          git diff --exit-code HEAD -- .github/workflows/daily-deploy-snapshot.yml data/
          echo "HISTORICAL_SCALE_READ_ONLY_NO_DAILY_NO_CAPTURE_NO_RESUME_NO_PUBLISH"
