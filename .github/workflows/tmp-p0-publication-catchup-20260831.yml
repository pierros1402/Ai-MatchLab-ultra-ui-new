name: P0 publication catch-up 29 30 31

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-p0-publication-catchup-20260831.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  recover-historical-plan-a:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: ai-matchlab-data-writer
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Sync latest main after writer lock
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin main
          git checkout -B main origin/main
          test -z "$(git status --porcelain)"
          echo "MAIN_HEAD=$(git rev-parse HEAD)"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Recover Day29 and Day30 Plan A from pre-event Git snapshots
        shell: bash
        run: |
          set -euo pipefail

          recover_day() {
            local DAY="$1"
            local SOURCE_REF="$2"
            local BOUNDARY_UTC="$3"
            local WORKTREE="/tmp/aiml-pre-event-${DAY}"
            local OUT="/tmp/${DAY}-plan-a-candidate.json"
            local AUDIT="/tmp/${DAY}-plan-a-candidate-audit.json"

            if [ -f "data/value-plans/${DAY}/plan-a.json" ]; then
              echo "PLAN_A_ALREADY_PRESENT day=${DAY}"
              node --input-type=module - "$DAY" <<'NODE'
import { readPlanAObservationDay } from "./engine-v1/value/plan-a-observation.js";
const day = process.argv[2];
const read = readPlanAObservationDay(day);
console.log(JSON.stringify({ day, ok: read.ok, count: read?.payload?.count ?? null, signature: read?.payload?.observationSignature ?? null }, null, 2));
if (!read.ok) process.exit(1);
NODE
              return 0
            fi

            git merge-base --is-ancestor "$SOURCE_REF" origin/main
            local SOURCE_AT
            SOURCE_AT="$(git show -s --format=%cI "$SOURCE_REF")"
            node - "$SOURCE_AT" "$BOUNDARY_UTC" <<'NODE'
const sourceAt = Date.parse(process.argv[2]);
const boundary = Date.parse(process.argv[3]);
if (!Number.isFinite(sourceAt) || !Number.isFinite(boundary) || !(sourceAt < boundary)) {
  console.error(JSON.stringify({ sourceAt: process.argv[2], boundaryUtc: process.argv[3], preEvent: false }, null, 2));
  process.exit(1);
}
console.log(JSON.stringify({ sourceAt: process.argv[2], boundaryUtc: process.argv[3], preEvent: true }, null, 2));
NODE

            rm -rf "$WORKTREE" "$OUT" "$AUDIT"
            git worktree add --detach "$WORKTREE" "$SOURCE_REF"

            pushd "$WORKTREE" >/dev/null
            npm ci --no-audit --no-fund
            (cd engine-v1 && npm ci --no-audit --no-fund)

            DAY_KEY="$DAY" OUT_PATH="$OUT" AUDIT_PATH="$AUDIT" node --input-type=module <<'NODE'
import fs from "node:fs";
import { buildValueDay } from "./engine-v1/core/build-value-day.js";

const day = process.env.DAY_KEY;
const outputPath = process.env.OUT_PATH;
const auditPath = process.env.AUDIT_PATH;
const result = await buildValueDay(day, {
  rebuild: true,
  outputPath,
  auditPath
});
const payload = JSON.parse(fs.readFileSync(outputPath, "utf8"));
const picks = Array.isArray(payload?.picks) ? payload.picks : [];
console.log(JSON.stringify({
  day,
  buildOk: result?.ok !== false,
  source: payload?.source || null,
  count: picks.length,
  outputPath
}, null, 2));
if (payload?.date !== day || !Array.isArray(payload?.picks)) process.exit(1);
NODE

            TRACKED_MUTATIONS="$(git status --porcelain --untracked-files=no)"
            if [ -n "$TRACKED_MUTATIONS" ]; then
              echo "ERROR: historical replay mutated tracked source tree"
              echo "$TRACKED_MUTATIONS"
              exit 1
            fi
            popd >/dev/null

            SOURCE_REF="$SOURCE_REF" SOURCE_AT="$SOURCE_AT" BOUNDARY_UTC="$BOUNDARY_UTC" DAY_KEY="$DAY" OUT_PATH="$OUT" node --input-type=module <<'NODE'
import fs from "node:fs";
import {
  ensurePlanAObservationDay,
  readPlanAObservationDay
} from "./engine-v1/value/plan-a-observation.js";

const day = process.env.DAY_KEY;
const sourcePayload = JSON.parse(fs.readFileSync(process.env.OUT_PATH, "utf8"));
const frozen = ensurePlanAObservationDay(day, sourcePayload, {
  sourcePath: `git:${process.env.SOURCE_REF}:pre-event-replay:${day}`,
  provenance: {
    kind: "historical_pre_event_git_replay_recovery",
    recoveryReason: "missing_historical_plan_a_observation",
    sourceCommit: process.env.SOURCE_REF,
    sourceCommitAt: process.env.SOURCE_AT,
    operationalDayBoundaryUtc: process.env.BOUNDARY_UTC,
    sourceCommitPrecedesOperationalDay: true,
    replayReadOnly: true,
    hindsightInputAllowed: false
  }
});
console.log(JSON.stringify({ day, frozen }, null, 2));
if (frozen?.ok !== true || frozen?.conflict === true) process.exit(1);

const read = readPlanAObservationDay(day);
console.log(JSON.stringify({
  day,
  readOk: read.ok,
  count: read?.payload?.count ?? null,
  signature: read?.payload?.observationSignature ?? null
}, null, 2));
if (!read.ok) process.exit(1);
NODE

            git worktree remove --force "$WORKTREE"
          }

          # Europe/Athens operational day boundaries during EEST (UTC+3):
          # 2026-08-29 00:00 Athens = 2026-08-28 21:00Z
          # 2026-08-30 00:00 Athens = 2026-08-29 21:00Z
          recover_day "2026-08-29" "4e91995bb893ab20043d13cdf15d2c358a3d7178" "2026-08-28T21:00:00Z"
          recover_day "2026-08-30" "5f0518678570cf763236c2a96f727d00a1122f8c" "2026-08-29T21:00:00Z"

      - name: Validate and stage only recovered immutable observations
        shell: bash
        run: |
          set -euo pipefail
          git restore --staged . || true

          for DAY in 2026-08-29 2026-08-30; do
            test -f "data/value-plans/${DAY}/plan-a.json"
            test -f "data/value-plans/${DAY}/plan-a-audit.json"
            git add "data/value-plans/${DAY}/plan-a.json" "data/value-plans/${DAY}/plan-a-audit.json"
          done

          STAGED="$(git diff --cached --name-only)"
          printf '%s\n' "$STAGED"
          BAD="$(printf '%s\n' "$STAGED" | grep -Ev '^data/value-plans/2026-08-(29|30)/plan-a(-audit)?\.json$' || true)"
          if [ -n "$BAD" ]; then
            echo "ERROR: unexpected recovery paths staged"
            echo "$BAD"
            exit 1
          fi
          git diff --cached --check

      - name: Commit and push immutable Plan A recovery checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --cached --quiet; then
            echo "No Plan A recovery changes required."
          else
            git commit -m "P0: Recover historical Plan A from pre-event Git replay"
            bash tools/git-push-rebase-retry.sh
          fi

  publish-day29:
    needs: recover-historical-plan-a
    runs-on: ubuntu-latest
    timeout-minutes: 220
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Dispatch and verify Day29
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          WORKFLOW="daily-deploy-snapshot.yml"
          BEFORE="$(gh run list --workflow "$WORKFLOW" --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
          gh workflow run "$WORKFLOW" --ref main -f dayKey=2026-08-29 -f triggerRender=false
          RUN_ID=""
          for attempt in $(seq 1 60); do
            sleep 2
            CANDIDATE="$(gh run list --workflow "$WORKFLOW" --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
            if [ -n "$CANDIDATE" ] && [ "$CANDIDATE" != "0" ] && [ "$CANDIDATE" != "$BEFORE" ]; then RUN_ID="$CANDIDATE"; break; fi
          done
          test -n "$RUN_ID"
          echo "DAY29_RUN_ID=$RUN_ID"
          gh run watch "$RUN_ID" --exit-status --interval 15
          git fetch origin main
          DAY="$(git show origin/main:data/deploy-snapshots/latest.json | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>process.stdout.write(String(JSON.parse(s).date||"")))')"
          echo "LATEST_AFTER_DAY29=$DAY"
          test "$DAY" = "2026-08-29"

  publish-day30:
    needs: publish-day29
    runs-on: ubuntu-latest
    timeout-minutes: 220
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Dispatch and verify Day30
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          WORKFLOW="daily-deploy-snapshot.yml"
          BEFORE="$(gh run list --workflow "$WORKFLOW" --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
          gh workflow run "$WORKFLOW" --ref main -f dayKey=2026-08-30 -f triggerRender=false
          RUN_ID=""
          for attempt in $(seq 1 60); do
            sleep 2
            CANDIDATE="$(gh run list --workflow "$WORKFLOW" --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
            if [ -n "$CANDIDATE" ] && [ "$CANDIDATE" != "0" ] && [ "$CANDIDATE" != "$BEFORE" ]; then RUN_ID="$CANDIDATE"; break; fi
          done
          test -n "$RUN_ID"
          echo "DAY30_RUN_ID=$RUN_ID"
          gh run watch "$RUN_ID" --exit-status --interval 15
          git fetch origin main
          DAY="$(git show origin/main:data/deploy-snapshots/latest.json | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>process.stdout.write(String(JSON.parse(s).date||"")))')"
          echo "LATEST_AFTER_DAY30=$DAY"
          test "$DAY" = "2026-08-30"

  publish-day31:
    needs: publish-day30
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Dispatch and verify Day31 with final Render redeploy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          WORKFLOW="daily-deploy-snapshot.yml"
          BEFORE="$(gh run list --workflow "$WORKFLOW" --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
          gh workflow run "$WORKFLOW" --ref main -f dayKey=2026-08-31 -f triggerRender=true
          RUN_ID=""
          for attempt in $(seq 1 60); do
            sleep 2
            CANDIDATE="$(gh run list --workflow "$WORKFLOW" --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
            if [ -n "$CANDIDATE" ] && [ "$CANDIDATE" != "0" ] && [ "$CANDIDATE" != "$BEFORE" ]; then RUN_ID="$CANDIDATE"; break; fi
          done
          test -n "$RUN_ID"
          echo "DAY31_RUN_ID=$RUN_ID"
          gh run watch "$RUN_ID" --exit-status --interval 15
          git fetch origin main
          DAY="$(git show origin/main:data/deploy-snapshots/latest.json | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>process.stdout.write(String(JSON.parse(s).date||"")))')"
          echo "LATEST_AFTER_DAY31=$DAY"
          test "$DAY" = "2026-08-31"

      - name: Verify public Engine and UI reached Day31
        shell: bash
        run: |
          set -euo pipefail
          ENGINE_URL="https://ai-matchlab-engine.onrender.com"
          UI_URL="https://ai-matchlab-ultra-ui-new.onrender.com"

          for attempt in $(seq 1 30); do
            echo "PUBLIC_VERIFY attempt=$attempt"
            UI_DAY="$(curl -fsS --max-time 30 "$UI_URL/data/deploy-snapshots/latest.json" 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{try{process.stdout.write(String(JSON.parse(s).date||""))}catch{}})' || true)"
            ENGINE_DAY="$(curl -fsS --max-time 30 "$ENGINE_URL/fixtures-runtime?mode=today&date=2026-08-31" 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{try{const x=JSON.parse(s);process.stdout.write(String(x.date||x.dayKey||x.snapshotDate||""))}catch{}})' || true)"
            echo "PUBLIC_UI_DAY=$UI_DAY PUBLIC_ENGINE_DAY=$ENGINE_DAY"
            if [ "$UI_DAY" = "2026-08-31" ] && [ "$ENGINE_DAY" = "2026-08-31" ]; then
              echo "P0_PUBLICATION_CATCHUP_29_30_31=PASS"
              exit 0
            fi
            sleep 20
          done

          echo "ERROR: public Engine/UI did not converge to 2026-08-31"
          exit 1
