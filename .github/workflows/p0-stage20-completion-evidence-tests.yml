name: P0 Stage20 completion evidence admission (isolated)
on:
  pull_request:
    paths:
      - "engine-v1/core/daily-resume-stage20-completion-evidence.mjs"
      - "engine-v1/core/daily-resume-stage20-completion-evidence.test.mjs"
      - ".github/workflows/p0-stage20-completion-evidence-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            engine-v1/core
            .github/workflows/p0-stage20-completion-evidence-tests.yml
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate syntax and completion evidence gate
        run: |
          node --check engine-v1/core/daily-resume-stage20-completion-evidence.mjs
          node --check engine-v1/core/daily-resume-stage20-completion-evidence.test.mjs
          node --test --test-reporter=tap engine-v1/core/daily-resume-stage20-completion-evidence.test.mjs
      - name: Keep Daily publication unchanged
        run: |
          git diff --exit-code HEAD -- .github/workflows/daily-deploy-snapshot.yml data/
          echo "EVIDENCE_ONLY_NO_STAGE_SKIP_NO_PRODUCTION_PUBLICATION"
