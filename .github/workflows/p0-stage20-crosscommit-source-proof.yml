name: P0 Stage20 cross-commit non-data source proof (isolated)
on:
  pull_request:
    paths:
      - "engine-v1/core/daily-resume-crosscommit-nondata-proof.mjs"
      - "engine-v1/core/daily-resume-crosscommit-nondata-proof.test.mjs"
      - ".github/workflows/p0-stage20-crosscommit-source-proof.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            engine-v1/core/daily-resume-crosscommit-nondata-proof.mjs
            engine-v1/core/daily-resume-crosscommit-nondata-proof.test.mjs
            .github/workflows/p0-stage20-crosscommit-source-proof.yml
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Source syntax validation
        run: |
          node --check engine-v1/core/daily-resume-crosscommit-nondata-proof.mjs
          node --check engine-v1/core/daily-resume-crosscommit-nondata-proof.test.mjs
      - name: Prove safe non-data-only cross-commit evidence and negative gates
        run: node --test --test-reporter=tap engine-v1/core/daily-resume-crosscommit-nondata-proof.test.mjs
      - name: Do not authorize resume, stage skipping or publication
        run: |
          git diff --exit-code HEAD -- .github/workflows/daily-deploy-snapshot.yml data/
          echo "NONDATA_SOURCE_EQUALITY_ONLY__DATA_INPUTS_UNPROVEN__RESUME_OFF"
