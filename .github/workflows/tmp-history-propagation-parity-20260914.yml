name: TMP history propagation parity 20260914

on:
  push:
    branches:
      - audit/20260914-history-propagation-parity

permissions:
  contents: read

jobs:
  history-parity-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact audit branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Verify exact base and run read-only parity audit
        shell: bash
        run: |
          set -euo pipefail
          BASE="b07d67b7fbe213d124f25752c6e576dec6d25343"
          PARENT="$(git rev-parse HEAD^)"
          test "$PARENT" = "$BASE"

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { buildHistoryDayFromTruth } from './engine-v1/jobs/append-finalized-day-to-history.js';

          const days = ['2026-09-09','2026-09-10','2026-09-11','2026-09-12'];
          const history = JSON.parse(fs.readFileSync('data/history/2026-2027.json','utf8'));
          const historyDays = new Map((history.days || []).map(d => [d.dayKey, d]));
          let failed = false;
          const out = [];

          for (const dayKey of days) {
            const build = buildHistoryDayFromTruth(dayKey);
            const stored = historyDays.get(dayKey) || null;
            const builtIds = new Set((build.rows || []).map(r => String(r.id || '')));
            const storedIds = new Set((stored?.rows || []).map(r => String(r.id || '')));
            const missingFromStored = [...builtIds].filter(id => !storedIds.has(id)).sort();
            const extraInStored = [...storedIds].filter(id => !builtIds.has(id)).sort();
            const exactIdParity = missingFromStored.length === 0 && extraInStored.length === 0;
            const exactCountParity = Number(stored?.rows?.length || 0) === Number(build.rows?.length || 0);
            const ok = build.ok === true && Boolean(stored) && exactIdParity && exactCountParity;
            if (!ok) failed = true;
            out.push({
              dayKey,
              ok,
              buildOk: build.ok,
              buildReason: build.reason || null,
              canonicalFixtureCount: build.canonicalFixtureCount,
              canonicalPlayedFinalCount: build.canonicalPlayedFinalCount,
              verifiedFinalCount: build.verifiedFinalCount,
              acceptedRows: build.acceptedRows,
              storedRows: stored?.rows?.length ?? null,
              exactCountParity,
              exactIdParity,
              missingFromStored,
              extraInStored,
              errors: build.errors || []
            });
          }

          console.log(JSON.stringify({
            schema: 'ai-matchlab.history-propagation-parity-audit.v1',
            baseSha: 'b07d67b7fbe213d124f25752c6e576dec6d25343',
            ok: !failed,
            days: out
          }, null, 2));

          if (failed) process.exit(1);
          NODE

      - name: Require clean read-only checkout
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          echo "READ_ONLY_HISTORY_PARITY_AUDIT=PASS"
