name: H2H semantic duplicate evidence regression
on:
  pull_request:
    paths:
      - 'engine-v1/jobs/rebuild-h2h-index-from-identity-resolved-history.js'
      - 'engine-v1/jobs/rebuild-h2h-index-from-identity-resolved-history.test.js'
      - '.github/workflows/h2h-semantic-duplicate-evidence-regression.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm ci --prefix engine-v1
      - run: node --check engine-v1/jobs/rebuild-h2h-index-from-identity-resolved-history.js
      - run: node --check engine-v1/jobs/rebuild-h2h-index-from-identity-resolved-history.test.js
      - run: node --test --test-reporter=tap engine-v1/jobs/rebuild-h2h-index-from-identity-resolved-history.test.js
      - run: git diff --exit-code
