name: P0 Stage20 three root league-memory source custody
on:
  pull_request:
    paths:
      - "tools/audit-stage20-league-root-custody.mjs"
      - "tools/audit-stage20-league-root-custody.test.mjs"
      - ".github/workflows/p0-stage20-league-root-custody.yml"
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/audit-stage20-league-root-custody.mjs
            tools/audit-stage20-league-root-custody.test.mjs
            tools/audit-daily954-stage20-history.mjs
            engine-v1/storage/league-memory-db.js
            engine-v1/storage/source-memory-db.js
            engine-v1/source-discovery/standings-researcher.js
            engine-v1/core/daily-resume-stage20-admission.mjs
            engine-v1/core/daily-resume-stage20-journal-admission.mjs
            engine-v1/core/season-closure-contract.js
            .github/workflows/p0-stage20-league-root-custody.yml
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Exact source syntax and negative tests
        run: |
          node --check tools/audit-stage20-league-root-custody.mjs
          node --check tools/audit-stage20-league-root-custody.test.mjs
          node --test --test-reporter=tap tools/audit-stage20-league-root-custody.test.mjs
      - uses: actions/download-artifact@v4
        with:
          name: history-recovery-45137286904-1
          run-id: 45137286904
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/stage20-original
      - name: Real source-bound root-level memory identity and SHA audit
        shell: bash
        run: |
          set -euo pipefail
          node tools/audit-stage20-league-root-custody.mjs \
            "$RUNNER_TEMP/stage20-original" "$GITHUB_WORKSPACE" \
            > "$RUNNER_TEMP/league-root-audit.jsonl"
          cat "$RUNNER_TEMP/league-root-audit.jsonl"
          node --input-type=module - "$RUNNER_TEMP/league-root-audit.jsonl" <<'NODE'
          import fs from "node:fs";
          import assert from "node:assert/strict";
          const raw=fs.readFileSync(process.argv[2],"utf8").trim();
          assert.ok(raw.startsWith("STAGE20_LEAGUE_ROOT_CUSTODY="));
          const a=JSON.parse(raw.slice(raw.indexOf("=")+1));
          assert.equal(a.files.length,3);
          assert.equal(a.counts.invalid,0);
          assert.equal(a.counts.sourceMapped,3);
          assert.equal(a.counts.unmapped,0);
          assert.equal(a.sourceAuthorityComplete,true);
          assert.equal(a.allRootFilesVerified,true);
          assert.equal(a.omissionAuthorized,false);
          assert.equal(a.resumeAuthorized,false);
          assert.equal(a.productionWrites,0);
          NODE
      - name: Protect all production code, data and publication gates
        run: |
          git diff --exit-code HEAD -- data/ .github/workflows/daily-deploy-snapshot.yml
          echo "ROOT_LEAGUE_SOURCE_DIAGNOSTIC_ONLY_NO_OMISSION_NO_RESUME"
