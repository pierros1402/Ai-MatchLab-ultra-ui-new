name: P0 canonical runtime truth firewall V3

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/p0-canonical-runtime-truth-firewall-v3.yml"

permissions:
  contents: write

concurrency:
  group: ai-matchlab-data-writer
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify clean base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain)"
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix engine-v1
      - name: Apply canonical truth firewall
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/p0-canonical-runtime-truth-firewall-patch.py
      - name: Validate targeted and full engine regression
        shell: bash
        run: |
          set -euo pipefail
          node --check engine-v1/core/day-fixture-universe.js
          node --check engine-v1/tests/day-fixture-universe-canonical-truth-firewall.test.js
          node --test engine-v1/tests/day-fixture-universe-canonical-truth-firewall.test.js engine-v1/tests/non-played-state-contract.test.js engine-v1/tests/intraday-snapshot-invariant-gate.test.js
          node --test engine-v1/tests/*.test.js
          git diff --check
          mapfile -t changed < <(git status --porcelain | sed -E 's/^.. //')
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fx 'engine-v1/core/day-fixture-universe.js'
          printf '%s\n' "${changed[@]}" | grep -Fx 'engine-v1/tests/day-fixture-universe-canonical-truth-firewall.test.js'
      - name: Commit permanent canonical truth firewall
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add engine-v1/core/day-fixture-universe.js engine-v1/tests/day-fixture-universe-canonical-truth-firewall.test.js
          git diff --cached --check
          git commit -m 'Protect canonical match truth from runtime overlay'
          git pull --rebase origin main
          git push origin HEAD:main
