name: One-shot trigger Day29 bootstrap

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-trigger-day29-bootstrap-20260829.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Day29 current publication bootstrap
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run tmp-day29-current-publication-bootstrap-20260829.yml --repo pierros1402/Ai-MatchLab-ultra-ui-new --ref main
          echo "DAY29_BOOTSTRAP_DISPATCH=PASS"
