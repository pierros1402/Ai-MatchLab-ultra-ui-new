name: P0-02 apply D-1 targeted status and manifest repair

on:
  push:
    branches:
      - work/p0-production-day-closure-20260811
    paths:
      - ".github/workflows/p0-02-apply-d1-targeted-status-manifest-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/p0-production-day-closure-20260811
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm ci --no-audit --no-fund --prefix engine-v1

      - name: Capture current frozen gate then restore exporter mutations
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import { exportDeploySnapshotDay } from './engine-v1/jobs/export-deploy-snapshot-day.js';
          const day = '2026-08-10';
          const valueFile = `data/deploy-snapshots/${day}/value.json`;
          const manifestFile = `data/deploy-snapshots/${day}/manifest.json`;
          const before = fs.readFileSync(valueFile);
          const beforeSha = crypto.createHash('sha256').update(before).digest('hex');
          await exportDeploySnapshotDay(day, { preserveDetails: true, preserveValue: true });
          const after = fs.readFileSync(valueFile);
          const afterSha = crypto.createHash('sha256').update(after).digest('hex');
          if (beforeSha !== afterSha) throw new Error('frozen_value_bytes_changed');
          const manifest = JSON.parse(fs.readFileSync(manifestFile, 'utf8'));
          const gate = manifest?.valueGate;
          if (manifest?.counts?.valuePicks !== 7 || gate?.ok !== true || gate?.mode !== 'frozen_snapshot') throw new Error('captured_gate_invalid');
          if (gate?.valueFreshAgainstCanonical !== false || gate?.frozenIdentityBound !== true || gate?.frozenReleaseSafe !== true) throw new Error('captured_gate_semantics_invalid');
          if (Number(gate?.orphanPickCount || 0) !== 0 || Number(gate?.missingMatchIdPickCount || 0) !== 0) throw new Error('captured_gate_membership_invalid');
          fs.writeFileSync('/tmp/p0-02-frozen-gate.json', JSON.stringify(gate, null, 2) + '\n');
          fs.writeFileSync('/tmp/p0-02-frozen-value.sha256', beforeSha + '\n');
          console.log('FROZEN_VALUE_SHA256=' + beforeSha);
          console.log('FROZEN_GATE=' + JSON.stringify(gate));
          NODE
          git restore --source=HEAD -- data/deploy-snapshots/2026-08-10 data/deploy-snapshots/latest.json
          test -z "$(git status --porcelain)"

      - name: Apply exact authoritative status-coherence repair and manifest rebind
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import {
            canonicalFileBytes,
            canonicalFileSha256,
            computeDeploySnapshotManifestHash,
            validateDeploySnapshotManifest
          } from './engine-v1/core/deploy-snapshot-release-contract.js';
          import { synchronizeDetailStatusState } from './engine-v1/core/detail-status-sync.js';
          import { evaluateFrozenValueFixtureBinding } from './engine-v1/core/frozen-value-release-contract.js';
          import { checkValueArtifactGate } from './engine-v1/jobs/check-value-artifact-gate.js';
          import { runSnapshotInvariantCheck } from './engine-v1/jobs/run-snapshot-invariant-check.js';

          const day = '2026-08-10';
          const cid = 'cid_ecu1_delfin_orense_20260810';
          const root = `data/deploy-snapshots/${day}`;
          const fixturesFile = `${root}/fixtures.json`;
          const detailFile = `${root}/details/${cid}.json`;
          const manifestFile = `${root}/manifest.json`;
          const latestFile = 'data/deploy-snapshots/latest.json';
          const valueFile = `${root}/value.json`;
          const auditFile = `${root}/value-audit.json`;
          const canonicalFile = `data/canonical-fixtures/${day}/ecu.1.json`;

          const frozenBytes = fs.readFileSync(valueFile);
          const frozenRawSha = crypto.createHash('sha256').update(frozenBytes).digest('hex');
          const expectedFrozenSha = fs.readFileSync('/tmp/p0-02-frozen-value.sha256', 'utf8').trim();
          if (frozenRawSha !== expectedFrozenSha) throw new Error('frozen_value_not_immutable');
          const value = JSON.parse(frozenBytes);
          if (value.count !== 7 || value.picks?.length !== 7) throw new Error('frozen_value_not_7');

          const canonicalArtifact = JSON.parse(fs.readFileSync(canonicalFile, 'utf8'));
          const canonical = canonicalArtifact.fixtures?.find(row => row?.canonicalId === cid);
          if (!canonical) throw new Error('authoritative_canonical_match_missing');
          if (canonical.status !== 'FT' || canonical.rawStatus !== 'STATUS_FULL_TIME' || canonical.scoreHome !== 1 || canonical.scoreAway !== 1) {
            throw new Error('authoritative_canonical_truth_unexpected:' + JSON.stringify({ status: canonical.status, rawStatus: canonical.rawStatus, scoreHome: canonical.scoreHome, scoreAway: canonical.scoreAway }));
          }
          if (canonical?.statusCoherenceRepair?.reason !== 'verified_final_exact_provider_terminal_evidence') throw new Error('canonical_status_repair_evidence_missing');
          if (canonical?.statusCoherenceRepair?.previous?.rawStatus !== 'STATUS_SCHEDULED') throw new Error('canonical_status_repair_previous_state_unexpected');
          if (canonical?.statusCoherenceRepair?.correctedTo?.rawStatus !== 'STATUS_FULL_TIME') throw new Error('canonical_status_repair_target_unexpected');

          const fixturesArtifact = JSON.parse(fs.readFileSync(fixturesFile, 'utf8'));
          const fixture = fixturesArtifact.fixtures?.find(row => row?.canonicalId === cid);
          if (!fixture) throw new Error('snapshot_fixture_missing');
          if (fixture.status !== 'FT' || fixture.rawStatus !== 'STATUS_SCHEDULED' || fixture.scoreHome !== 1 || fixture.scoreAway !== 1) {
            throw new Error('snapshot_fixture_precondition_changed:' + JSON.stringify({ status: fixture.status, rawStatus: fixture.rawStatus, scoreHome: fixture.scoreHome, scoreAway: fixture.scoreAway }));
          }

          // Propagate only the already-approved canonical terminal-status truth.
          for (const key of ['status', 'rawStatus', 'minute', 'scoreHome', 'scoreAway', 'statusType', 'operationalState']) {
            if (Object.prototype.hasOwnProperty.call(canonical, key)) fixture[key] = canonical[key];
          }
          if (canonical.authoritativeTerminalWriteback) {
            fixture.authoritativeTerminalWriteback = structuredClone(canonical.authoritativeTerminalWriteback);
          }
          fixture.statusCoherenceRepair = structuredClone(canonical.statusCoherenceRepair);
          fs.writeFileSync(fixturesFile, JSON.stringify(fixturesArtifact, null, 2) + '\n');

          const detail = JSON.parse(fs.readFileSync(detailFile, 'utf8'));
          if (detail?.basic?.status !== 'FT' || detail?.basic?.rawStatus !== 'STATUS_SCHEDULED' || detail?.basic?.scoreHome !== 1 || detail?.basic?.scoreAway !== 1) {
            throw new Error('snapshot_detail_precondition_changed');
          }
          const detailSync = synchronizeDetailStatusState(detail, fixture, {
            patchedAt: canonical.statusCoherenceRepair.repairedAt
          });
          if (!detailSync.ok || detailSync.changed !== true) throw new Error('detail_status_sync_failed:' + JSON.stringify(detailSync));
          if (detail.basic.rawStatus !== 'STATUS_FULL_TIME') throw new Error('detail_raw_status_not_repaired');
          const signature = JSON.parse(detail.meta.signature);
          if (signature.rawStatus !== 'STATUS_FULL_TIME') throw new Error('detail_signature_raw_status_not_repaired');
          fs.writeFileSync(detailFile, JSON.stringify(detail, null, 2) + '\n');

          const manifest = JSON.parse(fs.readFileSync(manifestFile, 'utf8'));
          const latest = JSON.parse(fs.readFileSync(latestFile, 'utf8'));
          const capturedGate = JSON.parse(fs.readFileSync('/tmp/p0-02-frozen-gate.json', 'utf8'));

          const binding = evaluateFrozenValueFixtureBinding({
            preserveSnapshotValueBytes: true,
            dayKey: day,
            valueArtifact: value,
            fixtures: fixturesArtifact.fixtures
          });
          if (binding.releaseSafe !== true || binding.orphanPickCount !== 0 || binding.missingMatchIdPickCount !== 0) throw new Error('repaired_fixture_value_binding_failed');

          manifest.counts.valuePicks = value.count;
          manifest.fileHashes['fixtures.json'] = canonicalFileSha256(fixturesFile);
          manifest.fileHashes['value.json'] = canonicalFileSha256(valueFile);
          manifest.fileHashes['value-audit.json'] = canonicalFileSha256(auditFile);

          const detailRow = manifest.details?.find(row => row?.file === `${cid}.json`);
          if (!detailRow) throw new Error('manifest_detail_row_missing');
          detailRow.sha256 = canonicalFileSha256(detailFile);
          detailRow.bytes = canonicalFileBytes(detailFile);
          detailRow.mb = Number((detailRow.bytes / 1024 / 1024).toFixed(2));

          manifest.valueGate = {
            ...capturedGate,
            fixtures: fixturesArtifact.count,
            valuePicks: value.count,
            valueSource: String(value.source || 'canonical_fixtures'),
            mode: 'frozen_snapshot',
            frozenIdentityBound: binding.frozenIdentityBound,
            frozenReleaseSafe: binding.releaseSafe,
            frozenPickCount: binding.frozenPickCount,
            orphanPickCount: binding.orphanPickCount,
            orphanPickIds: binding.orphanPickIds,
            missingMatchIdPickCount: binding.missingMatchIdPickCount,
            missingMatchIdPickIndexes: binding.missingMatchIdPickIndexes,
            dayBound: binding.dayBound,
            canonicalSourceBound: binding.canonicalSourceBound,
            ok: true
          };
          manifest.hash = computeDeploySnapshotManifestHash(manifest);
          fs.writeFileSync(manifestFile, JSON.stringify(manifest, null, 2) + '\n');
          latest.hash = manifest.hash;
          fs.writeFileSync(latestFile, JSON.stringify(latest, null, 2) + '\n');

          // Verify every manifest byte/hash binding against the exact retained files.
          for (const [name, file] of [['fixtures.json', fixturesFile], ['value.json', valueFile], ['value-audit.json', auditFile]]) {
            if (canonicalFileSha256(file) !== manifest.fileHashes[name]) throw new Error(`top_hash_mismatch:${name}`);
          }
          if (manifest.details?.length !== 80 || manifest.counts.details !== 80) throw new Error('manifest_details_count_not_80');
          for (const row of manifest.details) {
            const file = path.join(root, 'details', row.file);
            if (!fs.existsSync(file)) throw new Error(`detail_missing:${row.file}`);
            if (canonicalFileSha256(file) !== row.sha256) throw new Error(`detail_hash_mismatch:${row.file}`);
            if (canonicalFileBytes(file) !== Number(row.bytes)) throw new Error(`detail_bytes_mismatch:${row.file}`);
          }

          const release = validateDeploySnapshotManifest(manifest, day);
          if (!release.ok) throw new Error('release_contract_failed:' + JSON.stringify(release.errors));
          const gate = checkValueArtifactGate(day);
          if (!gate.ok) throw new Error('value_artifact_gate_failed:' + String(gate.reason || 'unknown'));
          const invariant = await runSnapshotInvariantCheck(day);
          if (!invariant.ok || !invariant.valueSafe) throw new Error('snapshot_invariant_failed:' + JSON.stringify(invariant.blocked || []));

          console.log('TARGETED_REPAIR=' + JSON.stringify({
            cid,
            frozenValueRawSha256: frozenRawSha,
            fixtureRawStatus: fixture.rawStatus,
            detailRawStatus: detail.basic.rawStatus,
            detailSignatureRawStatus: signature.rawStatus,
            manifestHash: manifest.hash,
            valueGate: manifest.valueGate,
            release: { ok: release.ok, errors: release.errors },
            artifactGate: { ok: gate.ok, reason: gate.reason || null },
            invariant: { ok: invariant.ok, valueSafe: invariant.valueSafe, blocked: invariant.blocked || [] }
          }, null, 2));
          NODE

          # The invariant report is execution evidence only; restore it so this
          # repair carries no timestamp-only report churn.
          git restore --source=HEAD -- data/deploy-snapshots/2026-08-10/invariant-report.json

      - name: Enforce exact four-file boundary and frozen Value byte identity
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t CHANGED < <(git diff --name-only | sort)
          printf 'CHANGED=%s\n' "${CHANGED[*]}"
          test "${#CHANGED[@]}" -eq 4
          printf '%s\n' "${CHANGED[@]}" | grep -Fx 'data/deploy-snapshots/2026-08-10/fixtures.json'
          printf '%s\n' "${CHANGED[@]}" | grep -Fx 'data/deploy-snapshots/2026-08-10/details/cid_ecu1_delfin_orense_20260810.json'
          printf '%s\n' "${CHANGED[@]}" | grep -Fx 'data/deploy-snapshots/2026-08-10/manifest.json'
          printf '%s\n' "${CHANGED[@]}" | grep -Fx 'data/deploy-snapshots/latest.json'
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const bytes = fs.readFileSync('data/deploy-snapshots/2026-08-10/value.json');
          const actual = crypto.createHash('sha256').update(bytes).digest('hex');
          const expected = fs.readFileSync('/tmp/p0-02-frozen-value.sha256', 'utf8').trim();
          console.log('FINAL_FROZEN_VALUE_SHA256=' + actual);
          if (actual !== expected) throw new Error('frozen_value_changed_at_final_boundary');
          NODE

      - name: Commit targeted D-1 repair to draft branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/deploy-snapshots/2026-08-10/fixtures.json \
            data/deploy-snapshots/2026-08-10/details/cid_ecu1_delfin_orense_20260810.json \
            data/deploy-snapshots/2026-08-10/manifest.json \
            data/deploy-snapshots/latest.json
          test "$(git diff --cached --name-only | wc -l)" -eq 4
          git commit -m "Repair frozen 2026-08-10 snapshot status binding"
          git push origin HEAD:work/p0-production-day-closure-20260811
