name: Engine-only Render deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-only-render-deploy
  cancel-in-progress: false

jobs:
  deploy-and-verify-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out exact release
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Trigger Render engine redeploy
        shell: bash
        env:
          RENDER_ENGINE_DEPLOY_HOOK_URL: ${{ secrets.RENDER_ENGINE_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${RENDER_ENGINE_DEPLOY_HOOK_URL:-}" ]; then
            echo "ERROR: RENDER_ENGINE_DEPLOY_HOOK_URL is not configured."
            exit 1
          fi
          curl -fsS -X POST "${RENDER_ENGINE_DEPLOY_HOOK_URL}"

      - name: Verify public engine release
        shell: bash
        run: bash tools/wait-for-render-engine-release.sh "${GITHUB_SHA}"
