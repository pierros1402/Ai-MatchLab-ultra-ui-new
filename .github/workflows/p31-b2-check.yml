name: P3.1 B2 contract validation

on:
  push:
    branches:
      - work/p31-b2-check-20260822

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm ci --no-audit --no-fund
      - working-directory: engine-v1
        run: npm ci --no-audit --no-fund
      - name: Run P3.1 permanence contracts
        id: contracts
        continue-on-error: true
        run: |
          node --check engine-v1/tests/midnight-release-deadline-contract.test.js
          node --test --test-reporter=tap \
            engine-v1/tests/midnight-release-deadline-contract.test.js \
            engine-v1/tests/ui-atomic-operational-day.test.js \
            engine-v1/tests/foundation-integrity-report.test.js \
            engine-v1/tests/daily-publish-contract.test.js \
            engine-v1/tests/daily-details-foundation-order.test.js
      - name: Publish result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.contracts.outcome }}
        run: |
          set -euo pipefail
          state=failure; [ "$OUTCOME" = success ] && state=success
          payload="$(STATE="$state" OUTCOME="$OUTCOME" node -e 'process.stdout.write(JSON.stringify({state:process.env.STATE,context:"P3.1 B2 permanence contracts",description:"outcome="+process.env.OUTCOME}))')"
          curl --fail-with-body --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload" >/dev/null
      - name: Enforce result
        if: always()
        env:
          OUTCOME: ${{ steps.contracts.outcome }}
        run: test "$OUTCOME" = success
