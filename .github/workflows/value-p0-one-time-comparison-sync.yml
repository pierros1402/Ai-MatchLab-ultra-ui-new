name: Value P0 one-time comparison sync

on:
  workflow_dispatch:
    inputs:
      sourceRef:
        description: "Immutable 40-hex source ref"
        required: true

permissions:
  contents: read

jobs:
  sync-comparisons:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out immutable source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sourceRef }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Sync Value comparisons
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SOURCE_REF: ${{ inputs.sourceRef }}
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "ERROR: CRON_SECRET unavailable."
            exit 1
          fi

          if ! printf "%s" "$SOURCE_REF" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "ERROR: immutable source ref required."
            exit 1
          fi

          node tools/sync-public-value-comparison.mjs \
            "2026-08-23" \
            "$SOURCE_REF"

          node tools/sync-public-value-comparison.mjs \
            "2026-08-24" \
            "$SOURCE_REF"