name: P3.1 B1 baseline full regression

on:
  push:
    branches:
      - work/p31-b1-baseline-validation-20260822

permissions:
  contents: read
  statuses: write

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm ci --no-audit --no-fund
      - working-directory: engine-v1
        run: npm ci --no-audit --no-fund
      - name: Full baseline engine suite
        id: suite
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          mapfile -t tests < <(find engine-v1/tests -maxdepth 1 -type f -name '*.test.js' -print | sort)
          set +e
          node --test --test-reporter=tap "${tests[@]}" 2>&1 | tee /tmp/full.tap
          code=${PIPESTATUS[0]}
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Publish baseline evidence
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          post() {
            local context="$1" state="$2"
            local payload
            payload="$(CONTEXT="$context" STATE="$state" node -e 'process.stdout.write(JSON.stringify({state:process.env.STATE,context:process.env.CONTEXT,description:"P3.1 baseline full regression"}))')"
            curl --fail-with-body --silent --show-error -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -d "$payload" >/dev/null
          }
          code="${{ steps.suite.outputs.code }}"
          state=failure; [ "$code" = "0" ] && state=success
          summary="$(grep -E '^# (tests|pass|fail|cancelled|skipped|todo) ' /tmp/full.tap | tail -n 6 | tr '\n' ' ' || true)"
          post "P31 BASE FULL ${summary:0:190}" "$state"
          mapfile -t fails < <(grep '^not ok ' /tmp/full.tap || true)
          if [ "${#fails[@]}" -eq 0 ]; then
            post "P31 BASE FAIL none" success
          else
            limit=${#fails[@]}; [ "$limit" -gt 10 ] && limit=10
            for ((i=0;i<limit;i++)); do post "P31 BASE FAIL$((i+1)) ${fails[$i]:0:180}" failure; done
          fi
