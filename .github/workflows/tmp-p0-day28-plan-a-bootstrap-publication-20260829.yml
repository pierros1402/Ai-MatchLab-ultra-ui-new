name: P0 Day28 Plan A bootstrap and publication

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-p0-day28-plan-a-bootstrap-publication-20260829.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-matchlab-data-writer
  cancel-in-progress: false

jobs:
  recover-day28:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DAY_KEY: "2026-08-28"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Sync latest main after writer lock
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin main
          git checkout -B main origin/main
          test -z "$(git status --porcelain)"
          echo "SOURCE_HEAD=$(git rev-parse HEAD)"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      - name: Install engine dependencies
        working-directory: engine-v1
        run: npm ci --no-audit --no-fund

      - name: Validate recovery-only preconditions
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from "node:fs";
          const day = process.env.DAY_KEY;
          const latest = JSON.parse(fs.readFileSync("data/deploy-snapshots/latest.json", "utf8"));
          const observation = `data/value-plans/${day}/plan-a.json`;
          if (latest?.date === day) {
            console.log(`Day ${day} is already published; no recovery mutation required.`);
            process.exit(78);
          }
          if (String(latest?.date || "") > day) {
            throw new Error(`latest_ahead_of_recovery_day:${latest?.date}`);
          }
          if (fs.existsSync(observation)) {
            throw new Error(`plan_a_observation_already_exists_refuse_rebootstrap:${observation}`);
          }
          const odds = JSON.parse(fs.readFileSync(`data/deploy-snapshots/${day}/odds.json`, "utf8"));
          if (Number(odds?.assessmentRows || 0) <= 0) {
            throw new Error("missing_day28_assessment_rows");
          }
          console.log(JSON.stringify({ latest: latest?.date, planAObservation: false, assessmentRows: odds.assessmentRows }));
          NODE

      - name: Rebuild Day28 Details and pre-Value snapshot
        shell: bash
        run: |
          set -euo pipefail
          node ./engine-v1/jobs/build-details-day.js "$DAY_KEY" --rebuild
          node ./engine-v1/jobs/export-deploy-snapshot-day.js "$DAY_KEY" \
            --no-update-latest \
            --replace-details \
            --no-build-missing-details \
            --fail-on-missing-details

      - name: Freeze missing Plan A exactly once
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from "node:fs";
          import { buildValueDay } from "./engine-v1/core/build-value-day.js";
          import {
            ensurePlanAObservationDay,
            readPlanAObservationDay
          } from "./engine-v1/value/plan-a-observation.js";

          const day = process.env.DAY_KEY;
          const observationPath = `data/value-plans/${day}/plan-a.json`;
          if (fs.existsSync(observationPath)) {
            throw new Error("plan_a_observation_appeared_before_freeze_refuse_overwrite");
          }

          const candidate = await buildValueDay(day, { rebuild: true });
          if (candidate?.ok === false) {
            throw new Error("plan_a_candidate_build_failed");
          }

          const freeze = ensurePlanAObservationDay(day, candidate, {
            sourcePath: `data/value/${day}.json`,
            provenance: {
              kind: "p0_unpublished_day_recovery_first_freeze",
              recoveryReason: "day28_never_published_before_plan_a_freeze",
              deploySnapshotUsedAsFinalTruth: false
            }
          });

          if (freeze?.ok !== true || freeze?.created !== true || freeze?.preservedExisting === true) {
            throw new Error(`plan_a_first_freeze_failed:${JSON.stringify(freeze)}`);
          }

          const readBack = readPlanAObservationDay(day);
          if (readBack?.ok !== true || readBack?.payload?.immutable !== true) {
            throw new Error("plan_a_first_freeze_readback_failed");
          }

          console.log("PLAN_A_RECOVERY_FREEZE=" + JSON.stringify({
            created: freeze.created,
            immutable: readBack.payload.immutable,
            count: freeze.count,
            signature: freeze.observationSignature
          }));
          NODE

      - name: Bootstrap missing A2 B2 observations exactly once
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import {
            buildValueA2B2Day,
            readFrozenAdjustedValueObservations
          } from "./engine-v1/jobs/build-value-a2-b2-day.js";

          const day = process.env.DAY_KEY;
          const before = readFrozenAdjustedValueObservations(day);
          const hasA2 = Boolean(before?.A2);
          const hasB2 = Boolean(before?.B2);
          if (hasA2 !== hasB2) {
            throw new Error("partial_adjusted_observation_state_refused");
          }
          if (!hasA2 && !hasB2) {
            const result = await buildValueA2B2Day(day, { calendarDay: "2026-08-27" });
            if (result?.ok !== true || result?.freezeObservations !== false) {
              throw new Error(`adjusted_observation_bootstrap_failed:${JSON.stringify(result)}`);
            }
          }
          const after = readFrozenAdjustedValueObservations(day);
          if (!after?.A2 || !after?.B2) {
            throw new Error("adjusted_observation_freeze_validation_failed");
          }
          console.log("A2_B2_READY=" + JSON.stringify({
            a2Count: Number(after.A2?.count || 0),
            b2Count: Number(after.B2?.count || 0)
          }));
          NODE

      - name: Refresh official Value artifacts
        shell: bash
        run: |
          set -euo pipefail
          node ./engine-v1/jobs/refresh-value-artifacts-day.js --date="$DAY_KEY" --no-update-latest

      - name: Rebuild downstream mirror and diagnostics
        shell: bash
        run: |
          set -euo pipefail
          node ./engine-v1/jobs/build-details-day.js "$DAY_KEY" --rebuild
          node ./engine-v1/jobs/export-deploy-snapshot-day.js "$DAY_KEY" \
            --no-update-latest \
            --replace-details \
            --no-build-missing-details \
            --fail-on-missing-details
          node ./engine-v1/jobs/refresh-value-artifacts-day.js --date="$DAY_KEY" --no-update-latest
          node ./engine-v1/jobs/verify-details-value-mirror-day.js --date="$DAY_KEY" --gate
          node ./engine-v1/jobs/build-value-comparison-cumulative.js --write

      - name: Hard prepublish gates
        shell: bash
        run: |
          set -euo pipefail
          node ./engine-v1/jobs/run-snapshot-invariant-check.js "$DAY_KEY" --gate
          node ./engine-v1/jobs/verify-artifact-freshness-day.js --date="$DAY_KEY" --gate
          node ./engine-v1/jobs/check-value-artifact-gate.js --date="$DAY_KEY"
          node ./engine-v1/jobs/build-foundation-integrity-report.js --date="$DAY_KEY" --gate
          node ./engine-v1/jobs/build-day-report.js --date="$DAY_KEY"
          node ./engine-v1/jobs/build-system-health-alerts-day.js --date="$DAY_KEY"
          node ./engine-v1/jobs/verify-daily-publish-contract.js --date="$DAY_KEY" --prepublish --gate

      - name: Promote Day28 atomically
        shell: bash
        run: |
          set -euo pipefail
          node ./engine-v1/jobs/promote-deploy-snapshot-latest-day.js --date="$DAY_KEY"
          node ./engine-v1/jobs/verify-daily-publish-contract.js --date="$DAY_KEY" --gate
          node - <<'NODE'
          const fs = require("fs");
          const latest = JSON.parse(fs.readFileSync("data/deploy-snapshots/latest.json", "utf8"));
          if (latest?.date !== process.env.DAY_KEY) throw new Error(`latest_not_promoted:${latest?.date}`);
          console.log("DAY28_ATOMIC_PROMOTION_OK=" + latest.date);
          NODE

      - name: Stage exact recovery outputs
        shell: bash
        run: |
          set -euo pipefail
          git restore --staged . || true
          git add "data/deploy-snapshots/latest.json"
          git add "data/deploy-snapshots/${DAY_KEY}/"
          test -f "data/value/${DAY_KEY}.json" && git add "data/value/${DAY_KEY}.json"
          test -f "data/value/_audit/${DAY_KEY}.json" && git add "data/value/_audit/${DAY_KEY}.json"
          test -d "data/value-plans/${DAY_KEY}" && git add "data/value-plans/${DAY_KEY}/"
          test -f "data/value-comparison/${DAY_KEY}.json" && git add "data/value-comparison/${DAY_KEY}.json"
          test -f "data/value-comparison/cumulative.json" && git add "data/value-comparison/cumulative.json"
          test -f "data/build-reports/${DAY_KEY}.json" && git add "data/build-reports/${DAY_KEY}.json"
          test -f "data/foundation-integrity/${DAY_KEY}.json" && git add "data/foundation-integrity/${DAY_KEY}.json"
          test -f "data/foundation-integrity/latest.json" && git add "data/foundation-integrity/latest.json"
          test -f "data/system-health/${DAY_KEY}.json" && git add "data/system-health/${DAY_KEY}.json"
          test -f "data/system-health/latest.json" && git add "data/system-health/latest.json"

          node ./engine-v1/jobs/guard-staged-data-boundary.js \
            --label=day28-plan-a-bootstrap-publication \
            --dayKey="$DAY_KEY" \
            --allow="^(data/deploy-snapshots/latest\\.json$|data/deploy-snapshots/${DAY_KEY}/|data/value/${DAY_KEY}\\.json$|data/value/_audit/${DAY_KEY}\\.json$|data/value-plans/${DAY_KEY}/|data/value-comparison/${DAY_KEY}\\.json$|data/value-comparison/cumulative\\.json$|data/build-reports/${DAY_KEY}\\.json$|data/foundation-integrity/${DAY_KEY}\\.json$|data/foundation-integrity/latest\\.json$|data/system-health/${DAY_KEY}\\.json$|data/system-health/latest\\.json$)"
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          echo "=== EXACT STAGED OUTPUTS ==="
          git diff --cached --name-only

      - name: Commit and race-safe push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Recovery: Freeze Plan A and publish Day28"

          # Ephemeral runner only: discard non-authorized generated leftovers so a
          # remote fast-forward/rebase can never be blocked by unrelated outputs.
          git reset --hard HEAD
          git clean -fd
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD^)" ]; then
            git rebase origin/main
          fi
          git push origin HEAD:main

      - name: Verify committed atomic pointer
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          LATEST_DAY="$(git show origin/main:data/deploy-snapshots/latest.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).date||""))')"
          test "$LATEST_DAY" = "$DAY_KEY"
          echo "DAY28_PUBLICATION_RECOVERY=PASS"
          echo "LATEST_DAY=$LATEST_DAY"
