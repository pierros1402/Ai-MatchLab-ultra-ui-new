name: TMP Day28 Rennes PSG production identity recovery

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-day28-rennes-psg-production-recovery.yml

permissions:
  contents: write

concurrency:
  group: ai-matchlab-data-writer
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact main head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Build exact seven-day identity recovery
        shell: bash
        run: |
          set -euo pipefail
          node engine-v1/jobs/build-identity-recovery-window.js 2026-08-28 --days-back 7 --days-forward 14

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const artifact = JSON.parse(fs.readFileSync('data/identity-recovery/2026-08-28.json', 'utf8'));
          const retained = 'cid_fra1_staderennais_parissaintgermain_20260823';
          const suppressed = 'cid_fra1_rennes_psg_20260823';
          const expectedKey = [retained, suppressed].sort().join('|');
          const auto = artifact.targetDays.flatMap(day =>
            (day.recoveryLeagueReports || []).flatMap(report =>
              (report.autoPromotable || []).map(candidate => ({
                dayKey: day.dayKey,
                leagueSlug: report.leagueSlug,
                candidate,
                key: [candidate?.left?.canonicalId, candidate?.right?.canonicalId].sort().join('|'),
              }))
            )
          );
          if (auto.length !== 1) throw new Error(`UNEXPECTED_AUTO_PROMOTABLE_COUNT:${auto.length}`);
          const target = auto[0];
          if (target.key !== expectedKey) throw new Error(`UNEXPECTED_AUTO_PROMOTABLE:${target.key}`);
          if (target.dayKey !== '2026-08-23' || target.leagueSlug !== 'fra.1') {
            throw new Error(`WRONG_TARGET_SCOPE:${target.dayKey}:${target.leagueSlug}`);
          }
          if (target.candidate.recoveryStatus !== 'AUTO_PROMOTABLE_LINEAGE') {
            throw new Error(`WRONG_RECOVERY_STATUS:${target.candidate.recoveryStatus}`);
          }
          console.log('DAY23_RENNES_PSG_EXACT_AUTO_PROMOTION_GATE=PASS');
          NODE

      - name: Promote exact Rennes PSG lineage
        shell: bash
        run: |
          set -euo pipefail
          node engine-v1/jobs/promote-identity-recovery-window.js 2026-08-28 > /tmp/day28-identity-promotion.json
          cat /tmp/day28-identity-promotion.json

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const result = JSON.parse(fs.readFileSync('/tmp/day28-identity-promotion.json', 'utf8'));
          const retained = 'cid_fra1_staderennais_parissaintgermain_20260823';
          const suppressed = 'cid_fra1_rennes_psg_20260823';
          const expectedKey = [retained, suppressed].sort().join('|');
          if (result.changed !== true) throw new Error('PROMOTION_DID_NOT_CHANGE_LEDGER');
          if ((result.promoted || []).length !== 1) throw new Error(`PROMOTED_COUNT:${result.promoted?.length || 0}`);
          const promoted = result.promoted[0];
          if (promoted.key !== expectedKey) throw new Error(`WRONG_PROMOTED_KEY:${promoted.key}`);
          if (promoted.fixtureRetentionDecisionId !== 'p0xfix_1fc9e07be94b1bef2548') {
            throw new Error(`WRONG_FIXTURE_DECISION_ID:${promoted.fixtureRetentionDecisionId}`);
          }
          if ((promoted.newTeamBindingDecisionIds || []).length !== 0) {
            throw new Error('NEW_TEAM_BINDINGS_FORBIDDEN');
          }
          if ((result.blocked || []).length !== 0) throw new Error(`BLOCKED_COUNT:${result.blocked.length}`);
          if (result.validationStatus !== 'PASS_PRODUCTION_IDENTITY_EXTENSION') {
            throw new Error(`VALIDATION_STATUS:${result.validationStatus}`);
          }
          if (result.finalLedgerSha256 !== 'e723c5236277b0989a58bb50e27831aa37fc17308c1ba7fcdb9c40143ba6fc25') {
            throw new Error(`UNEXPECTED_LEDGER_HASH:${result.finalLedgerSha256}`);
          }
          const counts = result.validationCounts || {};
          if (counts.promotedTeamBindings !== 37 || counts.fixtureLineageDecisions !== 26 || counts.suppressedFixtureAliases !== 26) {
            throw new Error(`UNEXPECTED_COUNTS:${JSON.stringify(counts)}`);
          }
          console.log('DAY23_RENNES_PSG_PRODUCTION_PROMOTION=PASS');
          NODE

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const ledger = JSON.parse(fs.readFileSync('data/identity-decisions/production-identity-extension-ledger.v1.json', 'utf8'));
          const matches = (ledger.fixtureLineageDecisions || []).filter(row =>
            row.retainedRepositoryFixtureId === 'cid_fra1_staderennais_parissaintgermain_20260823'
          );
          if (matches.length !== 1) throw new Error(`LEDGER_TARGET_COUNT:${matches.length}`);
          const row = matches[0];
          if (row.promotionBasis !== 'TWO_PROVIDER_EXISTING_VALIDATED_EXTENSION_IDENTITIES') {
            throw new Error(`WRONG_PROMOTION_BASIS:${row.promotionBasis}`);
          }
          if (JSON.stringify(row.suppressedRepositoryFixtureIds) !== JSON.stringify(['cid_fra1_rennes_psg_20260823'])) {
            throw new Error(`WRONG_SUPPRESSED_IDS:${JSON.stringify(row.suppressedRepositoryFixtureIds)}`);
          }
          if ((ledger.teamBindings || []).length !== 37) throw new Error(`TEAM_BINDING_COUNT:${ledger.teamBindings?.length || 0}`);
          console.log('DAY23_RENNES_PSG_LEDGER_CONTENT=PASS');
          NODE

      - name: Commit only exact identity recovery paths
        shell: bash
        run: |
          set -euo pipefail
          git restore --staged . || true

          git add data/identity-recovery/2026-08-28.json
          git add data/identity-recovery/2026-08-28.promotion.json
          git add data/identity-decisions/production-identity-extension-ledger.v1.json

          STAGED="$(git diff --cached --name-only | sort)"
          EXPECTED="$(printf '%s\n' \
            'data/identity-decisions/production-identity-extension-ledger.v1.json' \
            'data/identity-recovery/2026-08-28.json' \
            'data/identity-recovery/2026-08-28.promotion.json' | sort)"
          printf 'STAGED_PATHS=\n%s\n' "$STAGED"
          if [ "$STAGED" != "$EXPECTED" ]; then
            echo 'ERROR: staged paths differ from exact recovery allowlist'
            printf 'EXPECTED=\n%s\n' "$EXPECTED"
            exit 1
          fi

          UNSTAGED="$(git diff --name-only | grep -v '^$' || true)"
          UNTRACKED="$(git ls-files --others --exclude-standard || true)"
          if [ -n "$UNSTAGED" ] || [ -n "$UNTRACKED" ]; then
            echo 'ERROR: unexpected unstaged/untracked recovery side effects'
            echo "$UNSTAGED"
            echo "$UNTRACKED"
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Promote Rennes PSG fixture identity lineage'

          PARENT="$(git rev-parse HEAD^)"
          REMOTE="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          echo "PARENT=$PARENT"
          echo "REMOTE_BEFORE_PUSH=$REMOTE"
          if [ "$REMOTE" != "$PARENT" ]; then
            echo 'ERROR: remote main moved during controlled identity recovery'
            exit 1
          fi

          git push origin HEAD:main
          echo "RECOVERY_COMMIT=$(git rev-parse HEAD)"
          echo 'DAY23_RENNES_PSG_IDENTITY_RECOVERY_COMMIT=PASS'
