name: P0 Stage20 complete baseline+delta isolated reconstruction tests
on:
  pull_request:
    paths:
      - "engine-v1/core/daily-resume-prepost-isolated-replay.mjs"
      - "engine-v1/core/daily-resume-prepost-isolated-replay.test.mjs"
      - ".github/workflows/p0-stage20-full-tree-replay.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            engine-v1/core/daily-resume-prepost-isolated-replay.mjs
            engine-v1/core/daily-resume-prepost-isolated-replay.test.mjs
            engine-v1/core/daily-resume-complete-data-inventory.mjs
            engine-v1/core/daily-resume-prepost-delta-archive.mjs
            engine-v1/core/daily-resume-stage20-admission.mjs
            .github/workflows/p0-stage20-full-tree-replay.yml
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check source syntax
        run: |
          node --check engine-v1/core/daily-resume-prepost-isolated-replay.mjs
          node --check engine-v1/core/daily-resume-prepost-isolated-replay.test.mjs
      - name: Exact full source baseline and final tree replay with ignored, deletes, tamper negatives
        run: node --test --test-reporter=tap engine-v1/core/daily-resume-prepost-isolated-replay.test.mjs
      - name: No production data or resume changes
        run: |
          git diff --exit-code HEAD -- data/ .github/workflows/daily-deploy-snapshot.yml
          echo "STAGE20_FULL_REPLAY_IN_ISOLATED_SCRATCH_ONLY_NO_PUBLISH_NO_RESUME"
