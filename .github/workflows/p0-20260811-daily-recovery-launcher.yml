name: P0 2026-08-11 daily recovery launcher

# retrigger-after-canonical-nonplayed-fix: 9d44217321d89a2518b5e71cbe642eef4d8a624e
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/p0-20260811-daily-recovery-launcher.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch fresh 2026-08-11 daily run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "main"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/daily-deploy-snapshot.yml/dispatches" \
            -d '{"ref":"main","inputs":{"dayKey":"2026-08-11","triggerRender":"true","recoverPlanAObservationSignature":""}}'
          echo "Dispatched daily-deploy-snapshot.yml for 2026-08-11 on main with triggerRender=true"
