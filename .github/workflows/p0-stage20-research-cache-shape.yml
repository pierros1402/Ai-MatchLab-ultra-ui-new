name: P0 Stage20 original research cache structural audit (read-only)
on:
  pull_request:
    paths:
      - "tools/audit-stage20-research-cache-shape.mjs"
      - "tools/audit-stage20-research-cache-shape.test.mjs"
      - ".github/workflows/p0-stage20-research-cache-shape.yml"
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/audit-stage20-research-cache-shape.mjs
            tools/audit-stage20-research-cache-shape.test.mjs
            tools/audit-daily954-stage20-history.mjs
            engine-v1/core/daily-resume-stage20-admission.mjs
            engine-v1/core/daily-resume-stage20-journal-admission.mjs
            engine-v1/core/season-closure-contract.js
            .github/workflows/p0-stage20-research-cache-shape.yml
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Exact syntax and seven structural audit negatives
        run: |
          node --check tools/audit-stage20-research-cache-shape.mjs
          node --check tools/audit-stage20-research-cache-shape.test.mjs
          node --test --test-reporter=tap tools/audit-stage20-research-cache-shape.test.mjs
      - uses: actions/download-artifact@v4
        with:
          name: history-recovery-45137286904-1
          run-id: 45137286904
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/stage20-research-source
      - name: Prove original archive and summarize all 349 research cache records
        shell: bash
        run: |
          set -euo pipefail
          node tools/audit-stage20-research-cache-shape.mjs "$RUNNER_TEMP/stage20-research-source" \
            > "$RUNNER_TEMP/stage20-research-cache-summary.jsonl"
          cat "$RUNNER_TEMP/stage20-research-cache-summary.jsonl"
          node --input-type=module - "$RUNNER_TEMP/stage20-research-cache-summary.jsonl" <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const raw=fs.readFileSync(process.argv[2],"utf8").trim();
          assert.ok(raw.startsWith("STAGE20_RESEARCH_CACHE_SHAPE="));
          const r=JSON.parse(raw.slice(raw.indexOf("=")+1));
          assert.equal(r.researchCacheFiles,349);
          assert.equal(r.validJson+r.invalidJson+r.binaryOrUnsupported,349);
          assert.equal(r.sourceWriterIdentified,false);
          assert.equal(r.reconstructibleProven,false);
          assert.equal(r.omissionAuthorized,false);
          assert.equal(r.resumeAuthorized,false);
          assert.equal(r.productionWrites,0);
          NODE
      - name: Read-only and no production changes
        run: |
          git diff --exit-code HEAD -- data/ .github/workflows/daily-deploy-snapshot.yml
          echo "RESEARCH_CACHE_SHAPE_ONLY_NO_REPLAY_NO_CAPTURE_NO_PUBLISH"
