name: TMP history foundation sync audit 2026-09-13

on:
  push:
    branches:
      - audit/20260913-history-foundation-sync

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact audit branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Validate derived history foundations
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {
            validateHistoryIndexFoundationSync,
            validateH2HFoundationSync,
            validateModelPriorsFoundationSync
          } from './engine-v1/core/derived-history-foundation.js';

          const season = '2026-2027';
          const historyIndex = validateHistoryIndexFoundationSync(season);
          const h2h = validateH2HFoundationSync();
          const modelPriors = validateModelPriorsFoundationSync(season);

          const compact = (result) => ({
            ok: result?.ok === true,
            reason: result?.reason || null,
            generatedAt: result?.artifact?.generatedAt || null,
            artifactType: result?.artifact?.artifactType || null,
            sourceSha256: result?.artifact?.source?.sha256 || null,
            outputsSha256: result?.artifact?.outputs?.sha256 || null,
            foundationFingerprint: result?.artifact?.foundationFingerprint || null,
            currentSourceSha256: result?.current?.source?.sha256 || null,
            currentOutputsSha256: result?.current?.outputs?.sha256 || null,
            currentFoundationFingerprint: result?.current?.foundationFingerprint || null
          });

          const report = {
            audit: 'history-foundation-sync-20260913',
            season,
            historyIndex: compact(historyIndex),
            h2h: compact(h2h),
            modelPriors: compact(modelPriors)
          };

          console.log(JSON.stringify(report, null, 2));

          if (!historyIndex.ok || !h2h.ok || !modelPriors.ok) {
            process.exitCode = 1;
          }
          NODE

      - name: Prove checkout clean
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
