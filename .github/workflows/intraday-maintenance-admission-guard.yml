name: Intraday maintenance admission regression
on:
  pull_request:
    paths:
      - '.github/workflows/intraday-deploy-snapshot-refresh.yml'
      - '.github/workflows/intraday-maintenance-admission-guard.yml'
      - 'tools/intraday-priority-admission.test.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admission-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            .github/workflows/intraday-deploy-snapshot-refresh.yml
            tools/intraday-priority-admission.test.js
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Run isolated admission regression
        run: node --test tools/intraday-priority-admission.test.js
