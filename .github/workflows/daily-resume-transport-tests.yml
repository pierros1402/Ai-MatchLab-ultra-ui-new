name: P0 Daily cross-run resume transport (isolated)

on:
  pull_request:
    paths:
      - "engine-v1/core/daily-resume-transport.mjs"
      - "engine-v1/core/daily-resume-transport.test.mjs"
      - "tools/test-daily-resume-cross-run.mjs"
      - ".github/workflows/daily-resume-transport-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Syntax and isolated negative regression
        run: |
          node --check engine-v1/core/daily-resume-transport.mjs
          node --check engine-v1/core/daily-resume-transport.test.mjs
          node --check tools/test-daily-resume-cross-run.mjs
          node --test --test-reporter=tap engine-v1/core/daily-resume-transport.test.mjs
      - name: Confirm no production workflow or data was mutated
        run: git diff --exit-code HEAD -- .github/workflows/daily-deploy-snapshot.yml data/

  produce:
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Create source-bound archive on producer runner
        env:
          PACKAGE_PATH: ${{ runner.temp }}/aiml-resume-cross-run-package
        run: node tools/test-daily-resume-cross-run.mjs producer "$PACKAGE_PATH"
      - uses: actions/upload-artifact@v4
        with:
          name: aiml-resume-synthetic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aiml-resume-cross-run-package/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  consume:
    runs-on: ubuntu-latest
    needs: produce
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/download-artifact@v4
        with:
          name: aiml-resume-synthetic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aiml-resume-cross-run-downloaded
      - name: Revalidate archive and stage in a second runner
        env:
          PACKAGE_PATH: ${{ runner.temp }}/aiml-resume-cross-run-downloaded
        run: node tools/test-daily-resume-cross-run.mjs consumer "$PACKAGE_PATH"
