name: TMP verified final canonical convergence

on:
  workflow_dispatch:
  push:
    branches:
      - fix/20260915-verified-final-canonical-convergence
    paths:
      - .github/workflows/tmp-verified-final-canonical-convergence-20260915.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          (cd engine-v1 && npm ci --no-audit --no-fund)

      - name: Run isolated convergence transaction
        shell: bash
        run: bash tools/tmp-verified-final-canonical-convergence-20260915.sh

      - name: Upload release evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: verified-final-canonical-convergence-release-20260915
          path: /tmp/release-evidence.json
          if-no-files-found: error
