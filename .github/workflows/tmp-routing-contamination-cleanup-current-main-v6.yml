name: TMP routing contamination cleanup current-main V6

on:
  push:
    branches:
      - fix/20260912-routing-contamination-cleanup-v3
    paths:
      - ".github/workflows/tmp-routing-contamination-cleanup-current-main-v6.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tmp-routing-contamination-cleanup-current-main-v6
  cancel-in-progress: false

env:
  EXPECTED_BASE: "f7ca6382b800d537561e4633302a66589c226c73"
  HELPER_SOURCE_COMMIT: "9d270dffc27e44c7325aa358dd5bbe6c813c6039"
  HELPER_SOURCE_BRANCH: "fix/20260912-routing-contamination-cleanup-v2"
  HELPER_SOURCE_PATH: "tools/tmp-routing-contamination-cleanup-20260912.mjs"
  OLD_HELPER_BASE: "4a7d448dfa827d392983764057423841b2b737fe"
  V6_WORKFLOW: ".github/workflows/tmp-routing-contamination-cleanup-current-main-v6.yml"
  RELEASE_BRANCH: "release/20260912-routing-contamination-cleanup-v3"

jobs:
  repair-validate-v6:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout isolated repair branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify exact current-main baseline and temporary-only branch delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_BASE"
          test -z "$(git status --porcelain)"
          ACTUAL="$(git diff --name-only "$EXPECTED_BASE"..HEAD | sort)"
          test "$ACTUAL" = "$V6_WORKFLOW"
          echo "REPAIR_BASE_VERIFIED=$EXPECTED_BASE"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          (cd engine-v1 && npm ci --no-audit --no-fund)

      - name: Load and harden exact validated helper in runner temp only
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$HELPER_SOURCE_BRANCH:refs/remotes/origin/helper-source-v6"
          git merge-base --is-ancestor "$HELPER_SOURCE_COMMIT" refs/remotes/origin/helper-source-v6
          git show "$HELPER_SOURCE_COMMIT:$HELPER_SOURCE_PATH" > "$RUNNER_TEMP/routing-cleanup-helper.mjs"
          sha256sum "$RUNNER_TEMP/routing-cleanup-helper.mjs"

          python - <<'PY'
          from pathlib import Path
          import os

          p = Path(os.environ['RUNNER_TEMP']) / 'routing-cleanup-helper.mjs'
          s = p.read_text(encoding='utf-8')

          old_base = f'const BASE_SHA = "{os.environ["OLD_HELPER_BASE"]}";'
          new_base = f'const BASE_SHA = "{os.environ["EXPECTED_BASE"]}";'
          if s.count(old_base) != 1:
              raise SystemExit(f'helper base anchor count != 1: {s.count(old_base)}')
          s = s.replace(old_base, new_base, 1)

          old = '''function assertExactCounts(actual, expected, label) {
            const actualJson = JSON.stringify(actual);
            const expectedJson = JSON.stringify(expected);
            if (actualJson !== expectedJson) {
              fail(`${label}_mismatch`, { actual, expected });
            }
          }
          '''
          new = '''function normalizeForComparison(value) {
            if (Array.isArray(value)) return value.map(normalizeForComparison);
            if (value && typeof value === "object") {
              return Object.fromEntries(
                Object.keys(value).sort().map(key => [key, normalizeForComparison(value[key])])
              );
            }
            return value;
          }

          function assertExactCounts(actual, expected, label) {
            const actualJson = JSON.stringify(normalizeForComparison(actual));
            const expectedJson = JSON.stringify(normalizeForComparison(expected));
            if (actualJson !== expectedJson) {
              fail(`${label}_mismatch`, { actual, expected });
            }
          }
          '''
          if s.count(old) != 1:
              raise SystemExit(f'assertExactCounts anchor count != 1: {s.count(old)}')
          s = s.replace(old, new, 1)

          start_token = '  document.routingContaminationRepair = {'
          end_token = '  writeJson(entry.file, document);'
          start_index = s.find(start_token)
          end_index = s.find(end_token, start_index + len(start_token)) if start_index >= 0 else -1
          if start_index < 0 or end_index < 0:
              raise SystemExit(f'canonical metadata delimiters missing: start={start_index} end={end_index}')
          if s.find(start_token, start_index + len(start_token)) >= 0:
              raise SystemExit('canonical metadata start delimiter is not unique')
          s = s[:start_index] + s[end_index:]

          p.write_text(s, encoding='utf-8', newline='\n')
          PY

          node --check "$RUNNER_TEMP/routing-cleanup-helper.mjs"
          grep -q 'normalizeForComparison' "$RUNNER_TEMP/routing-cleanup-helper.mjs"
          if grep -q 'routingContaminationRepair' "$RUNNER_TEMP/routing-cleanup-helper.mjs"; then
            echo 'ERROR: helper still injects canonical repair metadata'
            exit 1
          fi
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Capture immutable and newer autonomous state hashes
        shell: bash
        run: |
          set -euo pipefail
          {
            for day in 2026-09-10 2026-09-11 2026-09-12; do
              for file in \
                "data/deploy-snapshots/${day}/value.json" \
                "data/deploy-snapshots/${day}/value-audit.json" \
                "data/value/${day}.json" \
                "data/value/_audit/${day}.json"; do
                [ -f "$file" ] && sha256sum "$file"
              done
              if [ -d "data/value-plans/${day}" ]; then
                find "data/value-plans/${day}" -maxdepth 1 -type f -name '*.json' -print0 | sort -z | xargs -0 -r sha256sum
              fi
            done
          } | sort > "$RUNNER_TEMP/protected-value.before"

          {
            sha256sum data/value-comparison/2026-09-10.json data/value-comparison/2026-09-11.json data/value-comparison/cumulative.json
            for day in 2026-09-05 2026-09-06 2026-09-07 2026-09-08 2026-09-09 2026-09-10 2026-09-11; do
              file="data/final-result-conflicts/${day}.json"
              [ -f "$file" ] && sha256sum "$file"
            done
          } | sort > "$RUNNER_TEMP/newer-autonomous.before"

          for day in 2026-09-10 2026-09-11 2026-09-12; do
            file="data/deploy-snapshots/${day}/fixtures-all.json"
            [ -f "$file" ] && sha256sum "$file"
          done | sort > "$RUNNER_TEMP/fixtures-all.before"

      - name: Apply quarantine-first active truth cleanup
        shell: bash
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/routing-cleanup-helper.mjs"

      - name: Re-export historical snapshots without retrospective Details rebuild
        shell: bash
        run: |
          set -euo pipefail
          node ./engine-v1/jobs/export-deploy-snapshot-day.js 2026-09-10 --no-update-latest --preserve-value --preserve-details --no-build-missing-details --fail-on-missing-details
          node ./engine-v1/jobs/export-deploy-snapshot-day.js 2026-09-11 --no-update-latest --preserve-value --preserve-details --no-build-missing-details --fail-on-missing-details

      - name: Rebuild current-day source Details from clean current canonical truth
        shell: bash
        run: |
          set -euo pipefail
          node ./engine-v1/jobs/build-details-day.js 2026-09-12 --rebuild

      - name: Re-export current day from rebuilt Details and frozen Plan A authority
        shell: bash
        run: |
          set -euo pipefail
          node ./engine-v1/jobs/export-deploy-snapshot-day.js 2026-09-12 \
            --update-latest \
            --replace-details \
            --no-build-missing-details \
            --fail-on-missing-details

      - name: Refresh current-day derived Value comparison only
        shell: bash
        run: |
          set -euo pipefail
          node ./engine-v1/jobs/build-value-plan-comparison-day.js --date=2026-09-12 --write

      - name: Refresh and gate snapshot invariants
        shell: bash
        run: |
          set -euo pipefail
          for day in 2026-09-10 2026-09-11 2026-09-12; do
            node ./engine-v1/jobs/run-snapshot-invariant-check.js "$day"
            node ./engine-v1/jobs/run-snapshot-invariant-check.js "$day" --gate
          done

      - name: Refresh historical freshness reports without gating legacy debt
        shell: bash
        run: |
          set -euo pipefail
          node ./engine-v1/jobs/verify-artifact-freshness-day.js --date=2026-09-10
          node ./engine-v1/jobs/verify-artifact-freshness-day.js --date=2026-09-11

      - name: Require current-day strict publication gates green
        shell: bash
        run: |
          set -euo pipefail
          node ./engine-v1/jobs/verify-artifact-freshness-day.js --date=2026-09-12 --gate
          node ./engine-v1/jobs/verify-details-value-mirror-day.js --date=2026-09-12 --gate
          node ./engine-v1/jobs/check-value-artifact-gate.js --date=2026-09-12
          node ./engine-v1/jobs/verify-daily-publish-contract.js --date=2026-09-12 --gate

      - name: Verify immutable and newer autonomous bytes remain unchanged
        shell: bash
        run: |
          set -euo pipefail
          {
            for day in 2026-09-10 2026-09-11 2026-09-12; do
              for file in \
                "data/deploy-snapshots/${day}/value.json" \
                "data/deploy-snapshots/${day}/value-audit.json" \
                "data/value/${day}.json" \
                "data/value/_audit/${day}.json"; do
                [ -f "$file" ] && sha256sum "$file"
              done
              if [ -d "data/value-plans/${day}" ]; then
                find "data/value-plans/${day}" -maxdepth 1 -type f -name '*.json' -print0 | sort -z | xargs -0 -r sha256sum
              fi
            done
          } | sort > "$RUNNER_TEMP/protected-value.after"
          diff -u "$RUNNER_TEMP/protected-value.before" "$RUNNER_TEMP/protected-value.after"

          {
            sha256sum data/value-comparison/2026-09-10.json data/value-comparison/2026-09-11.json data/value-comparison/cumulative.json
            for day in 2026-09-05 2026-09-06 2026-09-07 2026-09-08 2026-09-09 2026-09-10 2026-09-11; do
              file="data/final-result-conflicts/${day}.json"
              [ -f "$file" ] && sha256sum "$file"
            done
          } | sort > "$RUNNER_TEMP/newer-autonomous.after"
          diff -u "$RUNNER_TEMP/newer-autonomous.before" "$RUNNER_TEMP/newer-autonomous.after"

          for day in 2026-09-10 2026-09-11 2026-09-12; do
            file="data/deploy-snapshots/${day}/fixtures-all.json"
            [ -f "$file" ] && sha256sum "$file"
          done | sort > "$RUNNER_TEMP/fixtures-all.after"
          diff -u "$RUNNER_TEMP/fixtures-all.before" "$RUNNER_TEMP/fixtures-all.after"

          echo "PROTECTED_VALUE_UNCHANGED=true"
          echo "NEWER_AUTONOMOUS_STATE_UNCHANGED=true"
          echo "FIXTURES_ALL_UNCHANGED=true"

      - name: Verify contamination removal quarantine and publication parity
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const qFile = 'data/competition-routing-quarantine/2026-09-12/manifest.json';
          const q = JSON.parse(fs.readFileSync(qFile,'utf8'));
          if (q?.ok !== true || q?.summary?.candidateCount !== 69) throw new Error('quarantine contract failed');
          const ids = q.candidates.map(row => String(row.canonicalId));
          const idSet = new Set(ids);
          if (idSet.size !== 69) throw new Error('candidate identity set mismatch');
          const sha256 = file => crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          for (const row of q.archiveRecords) {
            if (!fs.existsSync(row.archivePath)) throw new Error(`archive missing: ${row.archivePath}`);
            if (sha256(row.archivePath) !== row.sha256) throw new Error(`archive hash mismatch: ${row.archivePath}`);
          }
          for (const candidate of q.candidates) {
            const finalFile = `data/final-results/${candidate.day}/${candidate.canonicalId}.json`;
            if (fs.existsSync(finalFile)) throw new Error(`active contaminated final result remains: ${finalFile}`);
          }
          for (const day of ['2026-09-10','2026-09-11','2026-09-12']) {
            const root = `data/deploy-snapshots/${day}`;
            const fixturesDoc = JSON.parse(fs.readFileSync(`${root}/fixtures.json`,'utf8'));
            const fixtures = Array.isArray(fixturesDoc.fixtures) ? fixturesDoc.fixtures : [];
            const fixtureIds = new Set(fixtures.map(row => String(row.canonicalId || row.matchId || '').trim()).filter(Boolean));
            for (const id of idSet) {
              if (fixtureIds.has(id)) throw new Error(`contaminated fixture still published: ${day}:${id}`);
              if (fs.existsSync(`${root}/details/${id}.json`)) throw new Error(`contaminated detail still published: ${day}:${id}`);
            }
          }
          const latest = JSON.parse(fs.readFileSync('data/deploy-snapshots/latest.json','utf8'));
          const manifest = JSON.parse(fs.readFileSync('data/deploy-snapshots/2026-09-12/manifest.json','utf8'));
          if (latest.date !== '2026-09-12') throw new Error(`latest date drift: ${latest.date}`);
          if (latest.hash !== manifest.hash) throw new Error('latest hash mismatch vs repaired manifest');
          console.log(JSON.stringify({ok:true,candidateCount:ids.length,latestDate:latest.date,manifestHash:manifest.hash,fixtures:manifest?.counts?.fixtures,details:manifest?.counts?.details,valuePicks:manifest?.counts?.valuePicks},null,2));
          NODE

      - name: Run routing and history regression tests
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            engine-v1/tests/flashscore-adapter-competition-routing.test.js \
            engine-v1/tests/daily-history-catchup-h2h-scope.test.js

      - name: Remove transient source Details before release tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf data/details/2026-09-12
          if git status --short -- data/details/2026-09-12 | grep -q .; then
            echo "ERROR: source Details would alter repository state"
            git status --short -- data/details/2026-09-12
            exit 1
          fi
          echo "TRANSIENT_SOURCE_DETAILS_NOT_PERSISTED=true"

      - name: Verify current main has not moved during validation
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main-v6
          ACTUAL_MAIN="$(git rev-parse refs/remotes/origin/main-v6)"
          test "$ACTUAL_MAIN" = "$EXPECTED_BASE"
          echo "REMOTE_MAIN_STILL_PINNED=$ACTUAL_MAIN"

      - name: Build clean data-only release commit with exact main parent
        shell: bash
        run: |
          set -euo pipefail

          rm -f "$V6_WORKFLOW"
          git add -A data "$V6_WORKFLOW"
          git diff --cached --check

          CHANGED="$(git diff --cached --name-only "$EXPECTED_BASE" | sort)"
          BAD="$(printf '%s\n' "$CHANGED" | grep -Ev '^(data/canonical-fixtures/2026-09-(10|11|12|13)/(eng\.1|pol\.2|fifa\.world)\.json$|data/final-results/2026-09-(10|11)/|data/deploy-snapshots/(latest\.json$|2026-09-(10|11|12)/)|data/multi-odds/2026-09-(10|11|12|13)\.json$|data/competition-routing-quarantine/2026-09-12/|data/value-comparison/2026-09-12\.json$)' || true)"
          if [ -n "$BAD" ]; then
            echo "ERROR: unexpected release write-set"
            printf '%s\n' "$BAD"
            exit 1
          fi
          if printf '%s\n' "$CHANGED" | grep -q '^\.github/'; then
            echo "ERROR: temporary workflow leaked into release tree"
            exit 1
          fi

          TREE="$(git write-tree)"
          export GIT_AUTHOR_NAME='matchlab-repair'
          export GIT_AUTHOR_EMAIL='matchlab-repair@users.noreply.github.com'
          export GIT_COMMITTER_NAME='matchlab-repair'
          export GIT_COMMITTER_EMAIL='matchlab-repair@users.noreply.github.com'
          CLEAN_COMMIT="$(printf '%s\n' 'Quarantine residual competition routing contamination' | git commit-tree "$TREE" -p "$EXPECTED_BASE")"

          test "$(git rev-parse "$CLEAN_COMMIT^")" = "$EXPECTED_BASE"
          test "$(git rev-parse "$CLEAN_COMMIT^{tree}")" = "$TREE"
          test -z "$(git diff --name-only "$EXPECTED_BASE" "$CLEAN_COMMIT" | grep -Ev '^data/' || true)"

          printf '%s\n' "$CLEAN_COMMIT" > "$RUNNER_TEMP/clean-release-commit.txt"
          printf '%s\n' "$TREE" > "$RUNNER_TEMP/clean-release-tree.txt"
          printf '%s\n' "$CHANGED" > "$RUNNER_TEMP/clean-release-paths.txt"
          echo "CLEAN_RELEASE_COMMIT=$CLEAN_COMMIT"
          echo "CLEAN_RELEASE_TREE=$TREE"

      - name: Push clean commit to release branch only
        shell: bash
        run: |
          set -euo pipefail
          CLEAN_COMMIT="$(cat "$RUNNER_TEMP/clean-release-commit.txt")"
          git push origin "$CLEAN_COMMIT:refs/heads/$RELEASE_BRANCH"
          echo "RELEASE_BRANCH_PUSHED=$RELEASE_BRANCH"
          echo "MAIN_NOT_UPDATED_BY_WORKFLOW=true"

      - name: Upload V6 release evidence
        uses: actions/upload-artifact@v4
        with:
          name: routing-contamination-cleanup-v6-release-evidence
          path: |
            ${{ runner.temp }}/clean-release-commit.txt
            ${{ runner.temp }}/clean-release-tree.txt
            ${{ runner.temp }}/clean-release-paths.txt
            ${{ runner.temp }}/protected-value.before
            ${{ runner.temp }}/protected-value.after
            ${{ runner.temp }}/newer-autonomous.before
            ${{ runner.temp }}/newer-autonomous.after
            ${{ runner.temp }}/fixtures-all.before
            ${{ runner.temp }}/fixtures-all.after
          if-no-files-found: error
          retention-days: 14
