name: P0 daily canonical guard diagnostic

on:
  push:
    branches:
      - work/p0-daily-canonical-guard-diag-20260811
    paths:
      - .github/workflows/p0-daily-canonical-guard-diagnostic.yml

permissions:
  contents: read

concurrency:
  group: ai-matchlab-data-writer
  cancel-in-progress: false

jobs:
  reproduce-canonical-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DAY_KEY: "2026-08-11"
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install engine dependencies
        working-directory: engine-v1
        run: npm ci --no-audit --no-fund

      - name: Reproduce rolling canonical acquisition
        shell: bash
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          set -euo pipefail
          node ./engine-v1/jobs/run-fixture-acquisition-chunk.js "$DAY_KEY" --full-pass --days-back 1 --days-forward 14
          node ./engine-v1/jobs/build-identity-recovery-window.js "$DAY_KEY" --days-back 1 --days-forward 14
          node ./engine-v1/jobs/confirm-identity-recovery-window.js "$DAY_KEY"
          node ./engine-v1/jobs/promote-identity-recovery-window.js "$DAY_KEY"
          node ./engine-v1/jobs/prune-canonical-fixture-store.js "$DAY_KEY" --days-back 3 --days-forward 30

      - name: Stage exact daily step-12 scope and capture guard
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          git restore --staged . || true
          test ! -d data/canonical-fixtures || git add data/canonical-fixtures
          test ! -d data/coverage-reports || git add data/coverage-reports
          test ! -d data/ingest-state || git add data/ingest-state
          test ! -d data/competition-admission || git add data/competition-admission
          test ! -d data/identity-recovery || git add data/identity-recovery
          test ! -f data/identity-decisions/production-identity-extension-ledger.v1.json || git add data/identity-decisions/production-identity-extension-ledger.v1.json

          git diff --cached --name-status > staged-name-status.txt
          git diff --cached --name-only > staged-paths.txt

          CANONICAL_DELETIONS="$(git diff --cached --name-status --diff-filter=D -- data/canonical-fixtures || true)"
          printf '%s\n' "$CANONICAL_DELETIONS" > canonical-deletions.txt

          set +e
          node engine-v1/jobs/guard-staged-data-boundary.js \
            --label=daily-deploy-canonical-store-diagnostic \
            --allow-data-deletions \
            --allow='^(data/canonical-fixtures/|data/coverage-reports/|data/ingest-state/|data/competition-admission/|data/identity-recovery/|data/identity-decisions/production-identity-extension-ledger\.v1\.json$)' \
            > guard-output.json 2>&1
          GUARD_EXIT=$?
          set -e
          printf '%s\n' "$GUARD_EXIT" > guard-exit.txt
          cat guard-output.json
          echo "GUARD_EXIT=$GUARD_EXIT"

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-daily-canonical-guard-diagnostic-20260811
          if-no-files-found: error
          path: |
            guard-output.json
            guard-exit.txt
            staged-name-status.txt
            staged-paths.txt
            canonical-deletions.txt
