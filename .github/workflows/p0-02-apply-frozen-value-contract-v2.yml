name: P0-02 apply frozen Value contract v2

on:
  push:
    branches:
      - work/p0-production-day-closure-20260811
    paths:
      - ".github/workflows/p0-02-apply-frozen-value-contract-v2.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/p0-production-day-closure-20260811
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm ci --no-audit --no-fund --prefix engine-v1

      - name: Apply semantic frozen Value patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          import hashlib
          import re

          def sub_once(path, pattern, replacement, label, flags=0):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"ANCHOR_COUNT_MISMATCH:{label}:{path}:{count}")
              p.write_text(updated, encoding="utf-8", newline="\n")

          helper = Path("engine-v1/core/frozen-value-release-contract.js")
          helper_test = Path("engine-v1/tests/frozen-value-release-contract.test.js")
          if helper.exists() or helper_test.exists():
              raise SystemExit("FROZEN_VALUE_HELPER_ALREADY_EXISTS")

          helper.write_text(dedent('''\
          function clean(value) {
            return String(value ?? "").trim();
          }

          function fixtureIdentitySet(fixtures) {
            const ids = new Set();
            for (const fixture of Array.isArray(fixtures) ? fixtures : []) {
              for (const value of [
                fixture?.canonicalId,
                fixture?.matchId,
                fixture?.providerMatchId,
                fixture?.sourceMatchId,
                fixture?.sourceId,
                fixture?.matchKey
              ]) {
                const id = clean(value);
                if (id) ids.add(id);
              }
            }
            return ids;
          }

          export function evaluateFrozenValueFixtureBinding({
            preserveSnapshotValueBytes = false,
            dayKey = "",
            valueArtifact = null,
            fixtures = []
          } = {}) {
            if (preserveSnapshotValueBytes !== true) {
              return Object.freeze({
                mode: "current_value",
                frozenIdentityBound: false,
                releaseSafe: false,
                frozenPickCount: 0,
                orphanPickCount: 0,
                orphanPickIds: Object.freeze([]),
                missingMatchIdPickCount: 0,
                missingMatchIdPickIndexes: Object.freeze([]),
                dayBound: false,
                canonicalSourceBound: false
              });
            }

            const picks = Array.isArray(valueArtifact?.picks) ? valueArtifact.picks : [];
            const fixtureIds = fixtureIdentitySet(fixtures);
            const orphanPickIds = [];
            const missingMatchIdPickIndexes = [];

            for (let index = 0; index < picks.length; index += 1) {
              const matchId = clean(picks[index]?.matchId);
              if (!matchId) {
                missingMatchIdPickIndexes.push(index);
                continue;
              }
              if (!fixtureIds.has(matchId)) orphanPickIds.push(matchId);
            }

            const expectedDay = clean(dayKey);
            const artifactDay = clean(valueArtifact?.date);
            const dayBound = Boolean(expectedDay) && artifactDay === expectedDay;
            const canonicalSourceBound = clean(valueArtifact?.source) === "canonical_fixtures";
            const coherentCount = Number.isInteger(valueArtifact?.count) &&
              valueArtifact.count >= 0 && valueArtifact.count === picks.length;
            const frozenIdentityBound = Boolean(
              valueArtifact && typeof valueArtifact === "object" &&
              coherentCount && dayBound && canonicalSourceBound &&
              missingMatchIdPickIndexes.length === 0 && orphanPickIds.length === 0
            );

            return Object.freeze({
              mode: "frozen_snapshot",
              frozenIdentityBound,
              releaseSafe: frozenIdentityBound,
              frozenPickCount: picks.length,
              orphanPickCount: orphanPickIds.length,
              orphanPickIds: Object.freeze([...orphanPickIds]),
              missingMatchIdPickCount: missingMatchIdPickIndexes.length,
              missingMatchIdPickIndexes: Object.freeze([...missingMatchIdPickIndexes]),
              dayBound,
              canonicalSourceBound
            });
          }

          export function isFrozenValueGateReleaseSafe(gate) {
            return Boolean(
              gate && typeof gate === "object" &&
              gate.mode === "frozen_snapshot" &&
              gate.frozenIdentityBound === true &&
              gate.frozenReleaseSafe === true &&
              Number(gate.orphanPickCount || 0) === 0 &&
              Number(gate.missingMatchIdPickCount || 0) === 0
            );
          }
          '''), encoding="utf-8", newline="\n")

          helper_test.write_text(dedent('''\
          import test from "node:test";
          import assert from "node:assert/strict";
          import {
            evaluateFrozenValueFixtureBinding,
            isFrozenValueGateReleaseSafe
          } from "../core/frozen-value-release-contract.js";

          const fixtures = [{
            canonicalId: "cid_test_home_away_20990817",
            matchId: "provider-17"
          }];

          test("frozen Value is release-safe only when every pick is same-day identity-bound", () => {
            const binding = evaluateFrozenValueFixtureBinding({
              preserveSnapshotValueBytes: true,
              dayKey: "2099-08-17",
              valueArtifact: {
                date: "2099-08-17",
                source: "canonical_fixtures",
                count: 2,
                picks: [
                  { matchId: "cid_test_home_away_20990817", market: "1X2" },
                  { matchId: "cid_test_home_away_20990817", market: "BTTS" }
                ]
              },
              fixtures
            });
            assert.equal(binding.mode, "frozen_snapshot");
            assert.equal(binding.frozenIdentityBound, true);
            assert.equal(binding.releaseSafe, true);
            assert.equal(binding.orphanPickCount, 0);
            assert.equal(binding.missingMatchIdPickCount, 0);
          });

          test("orphan frozen pick fails closed", () => {
            const binding = evaluateFrozenValueFixtureBinding({
              preserveSnapshotValueBytes: true,
              dayKey: "2099-08-17",
              valueArtifact: {
                date: "2099-08-17",
                source: "canonical_fixtures",
                count: 1,
                picks: [{ matchId: "cid_orphan_20990817" }]
              },
              fixtures
            });
            assert.equal(binding.releaseSafe, false);
            assert.deepEqual(binding.orphanPickIds, ["cid_orphan_20990817"]);
          });

          test("wrong-day, missing-id, or non-canonical frozen artifacts fail closed", () => {
            const cases = [
              { date: "2099-08-16", source: "canonical_fixtures", count: 0, picks: [] },
              { date: "2099-08-17", source: "legacy_value", count: 0, picks: [] },
              { date: "2099-08-17", source: "canonical_fixtures", count: 1, picks: [{}] }
            ];
            for (const valueArtifact of cases) {
              const binding = evaluateFrozenValueFixtureBinding({
                preserveSnapshotValueBytes: true,
                dayKey: "2099-08-17",
                valueArtifact,
                fixtures
              });
              assert.equal(binding.releaseSafe, false);
            }
          });

          test("frozen gate waiver requires explicit complete binding evidence", () => {
            const green = {
              mode: "frozen_snapshot",
              frozenIdentityBound: true,
              frozenReleaseSafe: true,
              orphanPickCount: 0,
              missingMatchIdPickCount: 0
            };
            assert.equal(isFrozenValueGateReleaseSafe(green), true);
            assert.equal(isFrozenValueGateReleaseSafe({ ...green, orphanPickCount: 1 }), false);
            assert.equal(isFrozenValueGateReleaseSafe({ ...green, mode: "current_value" }), false);
          });
          '''), encoding="utf-8", newline="\n")

          sub_once(
            "engine-v1/jobs/export-deploy-snapshot-day.js",
            r'import \{\s*synchronizeDetailStatusState\s*\} from "\.\./core/detail-status-sync\.js";\n',
            'import {\n  synchronizeDetailStatusState\n} from "../core/detail-status-sync.js";\nimport {\n  evaluateFrozenValueFixtureBinding\n} from "../core/frozen-value-release-contract.js";\n',
            "exporter_import",
            re.S,
          )

          sub_once(
            "engine-v1/jobs/export-deploy-snapshot-day.js",
            r'  const valueFreshAgainstCanonical = \(latestCanonicalAt === null \|\| valueArtifactAt === null\)\s*\? null\s*: valueArtifactAt >= latestCanonicalAt;\s*\n\s*const manifest = \{',
            dedent('''\
              const valueFreshAgainstCanonical = (latestCanonicalAt === null || valueArtifactAt === null)
                ? null
                : valueArtifactAt >= latestCanonicalAt;

              // Historical Plan A is immutable after freeze. Later canonical status/FT
              // timestamps may advance, but a stale timestamp is waivable only when an
              // explicitly preserved artifact is exact-identity bound to this day's
              // canonical fixture universe with zero orphan or missing-id picks.
              const frozenValueBinding = evaluateFrozenValueFixtureBinding({
                preserveSnapshotValueBytes,
                dayKey,
                valueArtifact: persistedValueOut,
                fixtures
              });

              const manifest = {'''),
            "exporter_frozen_binding",
            re.S,
          )

          sub_once(
            "engine-v1/jobs/export-deploy-snapshot-day.js",
            r'    valueGate: \{\s*fixtures: fixturesOut\.count,.*?\n    \},\n    fixturesByLeague,',
            dedent('''\
                valueGate: {
                  fixtures: fixturesOut.count,
                  valuePicks: persistedValueOut.count,
                  valueSource: String(persistedValueOut?.source || "local_value_file"),
                  latestCanonicalUpdatedAt: latestCanonicalAt === null ? null : new Date(latestCanonicalAt).toISOString(),
                  valueArtifactAt: valueArtifactAt === null ? null : new Date(valueArtifactAt).toISOString(),
                  valueFreshAgainstCanonical,
                  mode: frozenValueBinding.mode,
                  frozenIdentityBound: frozenValueBinding.frozenIdentityBound,
                  frozenReleaseSafe: frozenValueBinding.releaseSafe,
                  frozenPickCount: frozenValueBinding.frozenPickCount,
                  orphanPickCount: frozenValueBinding.orphanPickCount,
                  orphanPickIds: frozenValueBinding.orphanPickIds,
                  missingMatchIdPickCount: frozenValueBinding.missingMatchIdPickCount,
                  missingMatchIdPickIndexes: frozenValueBinding.missingMatchIdPickIndexes,
                  dayBound: frozenValueBinding.dayBound,
                  canonicalSourceBound: frozenValueBinding.canonicalSourceBound,
                  ok: !(fixturesOut.count > 0 && String(persistedValueOut?.source || "") === "missing_local_value_file") && (
                    valueFreshAgainstCanonical !== false || frozenValueBinding.releaseSafe === true
                  )
                },
                fixturesByLeague,'''),
            "exporter_value_gate",
            re.S,
          )

          sub_once(
            "engine-v1/jobs/check-value-artifact-gate.js",
            r'import \{ resolveDataPath \} from "\.\./storage/data-root\.js";\n',
            'import { resolveDataPath } from "../storage/data-root.js";\nimport { isFrozenValueGateReleaseSafe } from "../core/frozen-value-release-contract.js";\n',
            "gate_import",
          )
          sub_once(
            "engine-v1/jobs/check-value-artifact-gate.js",
            r'  if \(gate\?\.valueFreshAgainstCanonical === false\) \{\s*return \{ ok: false, code: 2, reason: "value_artifact_stale_against_canonical", gate \};\s*\}',
            dedent('''\
              const frozenReleaseSafe = isFrozenValueGateReleaseSafe(gate);

              if (gate?.valueFreshAgainstCanonical === false && !frozenReleaseSafe) {
                return { ok: false, code: 2, reason: "value_artifact_stale_against_canonical", gate };
              }'''),
            "gate_stale_policy",
            re.S,
          )

          sub_once(
            "engine-v1/tests/daily-publish-contract.test.js",
            r'import \{\s*verifyDailyPublishContract\s*\} from "\.\./jobs/verify-daily-publish-contract\.js";\n',
            'import {\n  verifyDailyPublishContract\n} from "../jobs/verify-daily-publish-contract.js";\nimport {\n  computeDeploySnapshotManifestHash\n} from "../core/deploy-snapshot-release-contract.js";\n',
            "publish_test_import",
            re.S,
          )
          sub_once(
            "engine-v1/tests/daily-publish-contract.test.js",
            r'  const manifestHash = "strict-contract-test-hash";\n',
            '',
            "publish_test_placeholder_hash",
          )
          sub_once(
            "engine-v1/tests/daily-publish-contract.test.js",
            r'  writeJson\(\s*path\.join\(snapshotRoot, "manifest\.json"\),\s*\{\s*date: dayKey,\s*generatedAt,\s*hash: manifestHash\s*\}\s*\);',
            dedent('''\
              const manifest = {
                ok: true,
                date: dayKey,
                generatedAt,
                counts: { fixtures: 0, valuePicks: 0, details: 0 },
                details: [],
                valueGate: {
                  fixtures: 0,
                  valuePicks: 0,
                  valueSource: "canonical_fixtures",
                  valueFreshAgainstCanonical: true,
                  ok: true
                }
              };
              manifest.hash = computeDeploySnapshotManifestHash(manifest);
              writeJson(path.join(snapshotRoot, "manifest.json"), manifest);'''),
            "publish_test_manifest",
            re.S,
          )
          sub_once(
            "engine-v1/tests/daily-publish-contract.test.js",
            r'(resolve\("deploy-snapshots", "latest\.json"\),\s*\{\s*date: dayKey,\s*hash:) manifestHash',
            r'\1 manifest.hash',
            "publish_test_latest_hash",
            re.S,
          )

          exporter_bytes = Path("engine-v1/jobs/export-deploy-snapshot-day.js").read_bytes().replace(b"\r\n", b"\n")
          exporter_sha = hashlib.sha256(exporter_bytes).hexdigest()
          sub_once(
            "engine-v1/jobs/p0c-p4-family-adapter-contract.js",
            r'(deploySnapshotExporter: Object\.freeze\(\{\s*path: "engine-v1/jobs/export-deploy-snapshot-day\.js",\s*sha256:\s*")[0-9a-f]{64}("\s*,)',
            lambda m: m.group(1) + exporter_sha + m.group(2),
            "p0c_exporter_pin",
            re.S,
          )
          print(f"FINAL_EXPORTER_SHA256={exporter_sha}")
          PY

      - name: Syntax and targeted tests
        shell: bash
        run: |
          set -euo pipefail
          node --check engine-v1/core/frozen-value-release-contract.js
          node --check engine-v1/jobs/export-deploy-snapshot-day.js
          node --check engine-v1/jobs/check-value-artifact-gate.js
          node --test \
            engine-v1/tests/frozen-value-release-contract.test.js \
            engine-v1/tests/export-deploy-snapshot-preservation.test.js \
            engine-v1/tests/daily-publish-contract.test.js \
            engine-v1/jobs/verify-daily-publish-contract.test.js \
            engine-v1/jobs/p0c-p4-family-adapter-contract.test.js

      - name: Commit only validated branch changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            engine-v1/core/frozen-value-release-contract.js \
            engine-v1/jobs/export-deploy-snapshot-day.js \
            engine-v1/jobs/check-value-artifact-gate.js \
            engine-v1/jobs/p0c-p4-family-adapter-contract.js \
            engine-v1/tests/frozen-value-release-contract.test.js \
            engine-v1/tests/daily-publish-contract.test.js
          test -n "$(git diff --cached --name-only)"
          git commit -m "Harden frozen Value release contract"
          git push origin HEAD:work/p0-production-day-closure-20260811
