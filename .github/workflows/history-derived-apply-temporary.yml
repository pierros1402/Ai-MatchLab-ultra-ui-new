name: Apply verified History derived foundation candidate
on:
  push:
    branches:
      - recovery/history-derived-apply-20261127
    paths:
      - '.github/workflows/history-derived-apply-temporary.yml'
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/recovery/history-derived-apply-20261127'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_DAY: '2026-11-27'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/history-derived-apply-20261127
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm ci --prefix engine-v1
      - name: Rebuild verified derived foundations
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {ensureHistoryIndexFoundationForDay} from './engine-v1/jobs/rebuild-indexes-for-season.js';
          import {validateHistoryIndexFoundationSync,validateH2HFoundationSync} from './engine-v1/core/derived-history-foundation.js';
          import {rebuildH2HFoundationFromCurrentHistory} from './engine-v1/jobs/rebuild-h2h-foundation-from-current-history.js';
          const day=process.env.TARGET_DAY;
          const index=await ensureHistoryIndexFoundationForDay(day);
          assert.equal(index.ok,true,JSON.stringify(index));
          if(!validateH2HFoundationSync().ok) rebuildH2HFoundationFromCurrentHistory();
          assert.equal(validateHistoryIndexFoundationSync(index.season).ok,true);
          assert.equal(validateH2HFoundationSync().ok,true);
          const again=await ensureHistoryIndexFoundationForDay(day);
          assert.equal(again.ok,true);
          assert.equal(again.rebuilt,false);
          console.log(JSON.stringify({indexRebuilt:index.rebuilt,season:index.season,indexFixedPoint:true,h2hReady:true}));
          JS
          git diff --exit-code -- data/history data/canonical-fixtures data/final-results data/league-memory/results data/value-plans data/value-comparison
          git add -A -- data/history-index data/h2h data/h2h-foundation
          git diff --cached --check
          git diff --cached --name-only > "$RUNNER_TEMP/derived-paths.txt"
          git diff --cached --binary --no-ext-diff > "$RUNNER_TEMP/derived-candidate.patch"
          test -z "$(git diff --name-only)"
      - name: Validate Details against the candidate
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {buildDetailsDay} from './engine-v1/jobs/build-details-day.js';
          import {validateHistoryIndexFoundationSync,validateH2HFoundationSync} from './engine-v1/core/derived-history-foundation.js';
          import {resolveSeasonFromDay} from './engine-v1/jobs/rebuild-indexes-for-season.js';
          const day=process.env.TARGET_DAY;
          const result=await buildDetailsDay(day,{rebuild:true});
          assert.equal(result.ok,true,JSON.stringify(result));
          assert.ok(result.total>0);
          assert.equal(result.built,result.total);
          assert.equal(result.skipped,0);
          assert.equal(validateHistoryIndexFoundationSync(resolveSeasonFromDay(day)).ok,true);
          assert.equal(validateH2HFoundationSync().ok,true);
          console.log(JSON.stringify({detailsBuilt:result.built,total:result.total,skipped:result.skipped}));
          JS
          git diff HEAD --exit-code -- data/history data/canonical-fixtures data/final-results data/league-memory/results data/value-plans data/value-comparison
          git diff --exit-code -- data/history-index data/h2h data/h2h-foundation
      - name: Commit only staged derived foundation artifacts to recovery branch
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --cached --name-only | awk '!/^data\/(history-index|h2h|h2h-foundation)\// { bad=1 } END { exit bad }'
          if git diff --cached --quiet; then echo 'No derived changes required'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Apply validated History Index and H2H foundation recovery'
          git push origin HEAD:refs/heads/recovery/history-derived-apply-20261127
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: derived-application-evidence
          path: |
            ${{ runner.temp }}/derived-paths.txt
            ${{ runner.temp }}/derived-candidate.patch
          if-no-files-found: warn
