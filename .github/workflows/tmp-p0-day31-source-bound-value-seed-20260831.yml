name: P0 Day31 source-bound Value seed and publication

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-p0-day31-source-bound-value-seed-20260831.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  seed-and-dispatch-day31:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: ai-matchlab-data-writer
      cancel-in-progress: false
    outputs:
      daily_run_id: ${{ steps.dispatch.outputs.daily_run_id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Sync latest main after writer lock
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin main
          git checkout -B main origin/main
          test -z "$(git status --porcelain)"

          LATEST_DAY="$(node -e 'const x=require("./data/deploy-snapshots/latest.json");process.stdout.write(String(x.date||""))')"
          test "$LATEST_DAY" = "2026-08-30"
          test ! -f data/value-plans/2026-08-31/plan-a.json

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm ci --no-audit --no-fund --prefix engine-v1

      - name: Rebuild Day31 source foundations and snapshot
        env:
          TM_PROXY_URL: ${{ secrets.TM_PROXY_URL }}
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          node ./engine-v1/jobs/run-prior-value-settlement-catchup.js 2026-08-31 --days-back=7
          node ./engine-v1/jobs/run-daily-cycle.js 2026-08-31
          node ./engine-v1/jobs/sync-canonical-fixtures-to-json-db-day.js 2026-08-31
          node ./engine-v1/jobs/build-details-day.js 2026-08-31 --rebuild
          node ./engine-v1/jobs/run-live-status-refresh-day.js 2026-08-31 --include-all-open-states
          node ./engine-v1/jobs/build-details-day.js 2026-08-31 --rebuild
          node ./engine-v1/jobs/export-deploy-snapshot-day.js 2026-08-31 --no-update-latest

      - name: Persist Day31 model assessment input
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          node ./engine-v1/jobs/run-odds-refresh.js 2026-08-31 --force
          node - <<'NODE'
          const fs = require("fs");
          const file = "data/deploy-snapshots/2026-08-31/odds.json";
          const payload = JSON.parse(fs.readFileSync(file, "utf8"));
          const rows = Array.isArray(payload?.matches) ? payload.matches : [];
          const assessmentRows = rows.filter(row =>
            row?.aiAssessment?.markets &&
            Object.keys(row.aiAssessment.markets).length > 0
          ).length;
          console.log(JSON.stringify({ matches: rows.length, assessmentRows }, null, 2));
          if (assessmentRows <= 0) process.exit(1);
          NODE

      - name: Bootstrap missing Day31 adjusted observations
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import {
            buildValueA2B2Day,
            readFrozenAdjustedValueObservations
          } from "./engine-v1/jobs/build-value-a2-b2-day.js";

          const day = "2026-08-31";
          const before = readFrozenAdjustedValueObservations(day);
          if (Boolean(before?.A2) !== Boolean(before?.B2)) {
            throw new Error("partial_adjusted_observation_state_refused");
          }
          if (!before?.A2 && !before?.B2) {
            const result = await buildValueA2B2Day(day, {
              calendarDay: "2026-08-30"
            });
            console.log(JSON.stringify({
              ok: result?.ok === true,
              freezeObservations: result?.freezeObservations,
              a2Count: Number(result?.plans?.A2?.count || 0),
              b2Count: Number(result?.plans?.B2?.count || 0)
            }, null, 2));
            if (result?.ok !== true || result?.freezeObservations !== false) {
              throw new Error("day31_adjusted_observation_bootstrap_failed");
            }
          }
          const after = readFrozenAdjustedValueObservations(day);
          if (!after?.A2 || !after?.B2) {
            throw new Error("day31_adjusted_observation_validation_failed");
          }
          NODE

      - name: Commit Day31 adjusted source checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git restore --staged . || true

          test -d data/canonical-fixtures && git add data/canonical-fixtures
          test -d data/history && git add data/history
          test -d data/history-index && git add data/history-index
          test -d data/h2h && git add data/h2h
          test -f data/h2h-foundation/current.json && git add data/h2h-foundation/current.json
          test -d data/model-priors && git add data/model-priors
          test -d data/standings && git add data/standings
          test -f data/coverage-readiness/2026-08-31.json && git add data/coverage-readiness/2026-08-31.json
          test -f data/competition-discovery/2026-08-31.json && git add data/competition-discovery/2026-08-31.json
          test -f data/provider-competition-registry/flashscore.json && git add data/provider-competition-registry/flashscore.json
          test -f data/deploy-snapshots/2026-08-31/odds.json && git add data/deploy-snapshots/2026-08-31/odds.json
          git add data/value-plans/2026-08-31/plan-a2.json
          git add data/value-plans/2026-08-31/plan-a2-audit.json
          git add data/value-plans/2026-08-31/plan-b2.json
          git add data/value-plans/2026-08-31/plan-b2-audit.json
          test -d data/final-results && git add data/final-results
          test -d data/final-result-conflicts && git add data/final-result-conflicts
          test -d data/value-comparison && git add data/value-comparison
          test -d data/system-health && git add data/system-health

          ALLOW='^(data/canonical-fixtures/|data/history/|data/history-index/|data/h2h/|data/h2h-foundation/current\.json$|data/model-priors/|data/standings/|data/coverage-readiness/2026-08-31\.json$|data/competition-discovery/2026-08-31\.json$|data/provider-competition-registry/flashscore\.json$|data/deploy-snapshots/2026-08-31/odds\.json$|data/value-plans/2026-08-31/(plan-a2|plan-a2-audit|plan-b2|plan-b2-audit)\.json$|data/final-results/|data/final-result-conflicts/|data/value-comparison/|data/system-health/)'
          STAGED="$(git diff --cached --name-only || true)"
          BAD="$(printf '%s\n' "$STAGED" | grep -Ev "$ALLOW" || true)"
          test -z "$BAD"
          node engine-v1/jobs/guard-staged-data-boundary.js \
            --label=day31-adjusted-source-checkpoint \
            --allow="$ALLOW"
          git diff --cached --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "P0: Seed Day31 adjusted observations from current foundations"
          bash tools/git-push-rebase-retry.sh

      - name: Replay Day31 Plan A and B from exact adjusted checkpoint
        shell: bash
        run: |
          set -euo pipefail
          DAY="2026-08-31"
          SOURCE_REF="$(git rev-parse HEAD)"
          WORKTREE="/tmp/aiml-day31-adjusted-cohort-replay"
          PLAN_A="/tmp/aiml-day31-plan-a-candidate.json"
          PLAN_A_AUDIT="/tmp/aiml-day31-plan-a-candidate-audit.json"
          PLAN_B="/tmp/aiml-day31-plan-b-candidate.json"
          PLAN_B_AUDIT="/tmp/aiml-day31-plan-b-candidate-audit.json"

          test "$(git show -s --format=%s "$SOURCE_REF")" = \
            "P0: Seed Day31 adjusted observations from current foundations"
          rm -f "$PLAN_A" "$PLAN_A_AUDIT" "$PLAN_B" "$PLAN_B_AUDIT"
          git worktree add --detach "$WORKTREE" "$SOURCE_REF"

          pushd "$WORKTREE" >/dev/null
          DAY_KEY="$DAY" PLAN_A_PATH="$PLAN_A" PLAN_A_AUDIT_PATH="$PLAN_A_AUDIT" \
            node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { buildValueDay } from "./engine-v1/core/build-value-day.js";
          const result = await buildValueDay(process.env.DAY_KEY, {
            rebuild: true,
            outputPath: process.env.PLAN_A_PATH,
            auditPath: process.env.PLAN_A_AUDIT_PATH
          });
          const plan = JSON.parse(fs.readFileSync(process.env.PLAN_A_PATH, "utf8"));
          const audit = JSON.parse(fs.readFileSync(process.env.PLAN_A_AUDIT_PATH, "utf8"));
          console.log(JSON.stringify({
            ok: result?.ok !== false,
            plan: "A",
            count: plan?.count,
            fixtureUniverse: audit?.fixtureUniverse
          }, null, 2));
          if (result?.ok === false || plan?.date !== process.env.DAY_KEY) process.exit(1);
          NODE

          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { deriveValueFromOdds } from "./engine-v1/jobs/derive-value-from-odds.js";
          const day = "2026-08-31";
          const plan = deriveValueFromOdds(day, {
            freeze: false,
            outputMode: "plan-b-observation"
          });
          const audit = JSON.parse(fs.readFileSync(`data/value-plans/${day}/plan-b-audit.json`, "utf8"));
          fs.copyFileSync(`data/value-plans/${day}/plan-b.json`, "/tmp/aiml-day31-plan-b-candidate.json");
          fs.copyFileSync(`data/value-plans/${day}/plan-b-audit.json`, "/tmp/aiml-day31-plan-b-candidate-audit.json");
          console.log(JSON.stringify({
            ok: plan?.ok === true,
            plan: "B",
            count: plan?.count,
            fixtureUniverse: audit?.membership?.fixtureUniverse
          }, null, 2));
          if (plan?.ok !== true || plan?.date !== day) process.exit(1);
          NODE
          popd >/dev/null
          git worktree remove --force "$WORKTREE"

          SOURCE_REF="$SOURCE_REF" \
          PLAN_A="$PLAN_A" PLAN_A_AUDIT="$PLAN_A_AUDIT" \
          PLAN_B="$PLAN_B" PLAN_B_AUDIT="$PLAN_B_AUDIT" \
            node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { assertValueFixtureUniverseParity } from "./engine-v1/core/value-fixture-universe.js";
          const read = file => JSON.parse(fs.readFileSync(file, "utf8"));
          const aAudit = read(process.env.PLAN_A_AUDIT);
          const b = read(process.env.PLAN_B);
          const bAudit = read(process.env.PLAN_B_AUDIT);
          const a2Audit = read("data/value-plans/2026-08-31/plan-a2-audit.json");
          const b2Audit = read("data/value-plans/2026-08-31/plan-b2-audit.json");
          const cohort = aAudit.fixtureUniverse;
          assertValueFixtureUniverseParity(cohort, a2Audit.fixtureUniverse);
          assertValueFixtureUniverseParity(cohort, b.sourceContract?.fixtureUniverse);
          assertValueFixtureUniverseParity(cohort, bAudit.membership?.fixtureUniverse);
          assertValueFixtureUniverseParity(cohort, b2Audit.membership?.fixtureUniverse);
          console.log(JSON.stringify({
            ok: true,
            count: cohort.count,
            hash: cohort.hash,
            sourceRef: process.env.SOURCE_REF
          }, null, 2));
          NODE

          node ./engine-v1/jobs/bootstrap-historical-plan-a-observation-day.js \
            --date="$DAY" \
            --plan-a-candidate="$PLAN_A" \
            --plan-a-audit="$PLAN_A_AUDIT" \
            --plan-b-candidate="$PLAN_B" \
            --plan-b-audit="$PLAN_B_AUDIT" \
            --source-ref="$SOURCE_REF"

      - name: Commit Day31 immutable source-bound seed
        shell: bash
        run: |
          set -euo pipefail
          git restore --staged . || true
          git add data/value-plans/2026-08-31/plan-a.json
          git add data/value-plans/2026-08-31/plan-a-audit.json
          git add data/value-plans/2026-08-31/plan-a2.json
          git add data/value-plans/2026-08-31/plan-a2-audit.json
          git add data/value-plans/2026-08-31/plan-b.json
          git add data/value-plans/2026-08-31/plan-b-audit.json
          git add data/value-plans/2026-08-31/plan-b2.json
          git add data/value-plans/2026-08-31/plan-b2-audit.json

          node engine-v1/jobs/guard-staged-data-boundary.js \
            --label=day31-source-bound-value-seed \
            --allow='^data/value-plans/2026-08-31/(plan-a|plan-a-audit|plan-a2|plan-a2-audit|plan-b|plan-b-audit|plan-b2|plan-b2-audit)\.json$'
          git diff --cached --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "P0: Seed Day31 immutable Value observations from source-bound foundations"
          bash tools/git-push-rebase-retry.sh

      - name: Dispatch full Day31 publication while holding writer order
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          WORKFLOW="daily-deploy-snapshot.yml"
          BEFORE="$(gh run list --workflow "$WORKFLOW" --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
          gh workflow run "$WORKFLOW" --ref main -f dayKey=2026-08-31 -f triggerRender=false

          RUN_ID=""
          for attempt in $(seq 1 30); do
            sleep 2
            CANDIDATE="$(gh run list --workflow "$WORKFLOW" --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
            if [ "$CANDIDATE" != "0" ] && [ "$CANDIDATE" != "$BEFORE" ]; then
              RUN_ID="$CANDIDATE"
              break
            fi
          done
          test -n "$RUN_ID"
          echo "daily_run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "DAY31_RUN_ID=$RUN_ID"

  verify-day31:
    needs: seed-and-dispatch-day31
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Wait for full Day31 publication
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ needs.seed-and-dispatch-day31.outputs.daily_run_id }}
        run: gh run watch "$RUN_ID" --exit-status --interval 15

      - name: Verify atomic Day31 publication on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          LATEST="$(git show origin/main:data/deploy-snapshots/latest.json)"
          DAY="$(printf '%s' "$LATEST" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>process.stdout.write(String(JSON.parse(s).date||"")))')"
          test "$DAY" = "2026-08-31"
          git show origin/main:data/deploy-snapshots/2026-08-31/manifest.json >/tmp/day31-manifest.json
          node - <<'NODE'
          const fs = require("fs");
          const manifest = JSON.parse(fs.readFileSync("/tmp/day31-manifest.json", "utf8"));
          console.log(JSON.stringify({
            date: manifest.date,
            generatedAt: manifest.generatedAt,
            hash: manifest.hash,
            counts: manifest.counts,
            valueGate: manifest.valueGate
          }, null, 2));
          if (manifest.date !== "2026-08-31") process.exit(1);
          NODE
