name: P0 Stage20 full data pre-post inventory tests (isolated)
on:
  pull_request:
    paths:
      - "engine-v1/core/daily-resume-complete-data-inventory.mjs"
      - "engine-v1/core/daily-resume-complete-data-inventory.test.mjs"
      - ".github/workflows/p0-stage20-complete-data-inventory.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            engine-v1/core/daily-resume-complete-data-inventory.mjs
            engine-v1/core/daily-resume-complete-data-inventory.test.mjs
            .github/workflows/p0-stage20-complete-data-inventory.yml
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check exact source syntax
        run: |
          node --check engine-v1/core/daily-resume-complete-data-inventory.mjs
          node --check engine-v1/core/daily-resume-complete-data-inventory.test.mjs
      - name: Prove complete ignored-inclusive pre/post SHA inventory on scratch Git roots
        run: node --test --test-reporter=tap engine-v1/core/daily-resume-complete-data-inventory.test.mjs
      - name: Ensure production workflow, data and latest unaffected
        run: |
          git diff --exit-code HEAD -- .github/workflows/daily-deploy-snapshot.yml data/
          echo "PRE_POST_INVENTORY_READ_ONLY_NO_CAPTURE_NO_RESUME_NO_PUBLISH"
