name: TMP Value coverage provenance audit 2026-09-14

on:
  push:
    branches:
      - audit/20260914-value-coverage-provenance-v1

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify exact pinned base and audit-only branch diff
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BASE="2d33ae4ff4b8207d136c294104fb366f06dc37ff"
          git cat-file -e "${EXPECTED_BASE}^{commit}"
          MERGE_BASE="$(git merge-base HEAD "$EXPECTED_BASE")"
          test "$MERGE_BASE" = "$EXPECTED_BASE"
          CHANGED="$(git diff --name-only "$EXPECTED_BASE" HEAD | sort)"
          ALLOWED="$(printf '%s\n' '.github/workflows/tmp-value-coverage-provenance-audit-20260914.yml' 'tmp/value-coverage-provenance-audit-trigger-20260914.txt' | sort)"
          test "$CHANGED" = "$ALLOWED"
          echo "AUDIT_BASE=$EXPECTED_BASE"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          (cd engine-v1 && npm ci --no-audit --no-fund)

      - name: Build current-day Value coverage report
        shell: bash
        run: |
          set -euo pipefail
          node ./engine-v1/jobs/build-value-coverage-report-day.js 2026-09-14
          test -f data/value/_coverage-reports/2026-09-14.json

      - name: Capture denominator provenance and persistence diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/value-coverage-audit
          cp data/value/_coverage-reports/2026-09-14.json /tmp/value-coverage-audit/value-coverage-2026-09-14.json

          {
            echo "=== git check-ignore ==="
            git check-ignore -v data/value/_coverage-reports/2026-09-14.json || true
            echo
            echo "=== git ls-files ==="
            git ls-files --stage -- data/value/_coverage-reports/2026-09-14.json || true
            echo
            echo "=== git status ==="
            git status --short --ignored -- data/value/_coverage-reports/2026-09-14.json || true
          } | tee /tmp/value-coverage-audit/git-persistence.txt

          node --input-type=module <<'NODE' > /tmp/value-coverage-audit/summary.json
          import fs from 'node:fs';
          const p = JSON.parse(fs.readFileSync('data/value/_coverage-reports/2026-09-14.json','utf8'));
          const playable = Number(p?.source?.playable || 0);
          const returned = Number(p?.counts?.valueReturned || 0);
          const details = Number(p?.counts?.detailsFound || 0);
          const intelligence = Number(p?.counts?.intelligenceOk || 0);
          const out = {
            ok: p?.ok === true,
            dayKey: p?.dayKey,
            generatedAt: p?.generatedAt,
            source: p?.source,
            counts: p?.counts,
            ratios: {
              valueReturnedPctOfPlayable: playable ? returned / playable * 100 : null,
              detailsFoundPctOfPlayable: playable ? details / playable * 100 : null,
              intelligenceOkPctOfPlayable: playable ? intelligence / playable * 100 : null
            },
            nullByReason: p?.breakdown?.nullByReason || {},
            nullByClass: p?.breakdown?.nullByClass || {},
            topNullLeagues: Object.fromEntries(Object.entries(p?.breakdown?.nullByLeague || {}).slice(0,25)),
            topReturnedLeagues: Object.fromEntries(Object.entries(p?.breakdown?.returnedByLeague || {}).slice(0,25))
          };
          console.log(JSON.stringify(out,null,2));
NODE
          cat /tmp/value-coverage-audit/summary.json

      - name: Prove repository unchanged except ignored diagnostic output
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code HEAD -- . ':!data/value/_coverage-reports/2026-09-14.json'
          TRACKED="$(git status --short --untracked-files=no)"
          test -z "$TRACKED"
          echo "TRACKED_WORKTREE_CLEAN=true"

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: value-coverage-provenance-audit-20260914
          path: /tmp/value-coverage-audit/
          if-no-files-found: error
