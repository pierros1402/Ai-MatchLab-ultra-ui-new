name: Source-bound event alias regression
on:
  pull_request:
    paths:
      - 'engine-v1/core/source-bound-history-event-identities*'
      - '.github/workflows/source-bound-event-alias-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm ci --prefix engine-v1
      - run: node --check engine-v1/core/source-bound-history-event-identities.js
      - run: node --test --test-reporter=tap engine-v1/core/source-bound-history-event-identities.test.js
      - run: git diff --exit-code
