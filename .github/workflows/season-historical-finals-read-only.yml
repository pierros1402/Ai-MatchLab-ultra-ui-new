name: Season historical finals reconciliation (read-only)
on:
  pull_request:
    paths:
      - "engine-v1/jobs/audit-verified-final-canonical-day.js"
      - "engine-v1/jobs/audit-verified-finals-range.js"
      - "engine-v1/jobs/report-verified-finals-range.js"
      - "engine-v1/jobs/audit-all-verified-final-provider-identities.js"
      - "engine-v1/jobs/build-historical-identity-adjudication-register.js"
      - "engine-v1/jobs/build-historical-identity-adjudication-register.test.js"
      - ".github/workflows/season-historical-finals-read-only.yml"
permissions:
  contents: read
jobs:
  historical-final-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test historical provider identity and terminal provenance
        run: node --test engine-v1/jobs/audit-all-verified-final-provider-identities.test.js
      - name: Test historical identity resolver and sourceId fallback
        run: node --test engine-v1/jobs/build-historical-identity-adjudication-register.test.js
      - name: Inventory exact canonical alias references without writes
        run: node engine-v1/jobs/inventory-canonical-alias-references.js
      - name: Audit every historical verified-final identity without writes
        run: node engine-v1/jobs/audit-all-verified-final-provider-identities.js
      - name: Build full historical identity adjudication register without writes
        if: always()
        run: |
          node engine-v1/jobs/build-historical-identity-adjudication-register.js > historical-identity-register.json
      - name: Retain exact historical identity and source-bound manifest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-identity-source-bound-${{ github.sha }}
          path: historical-identity-register.json
          if-no-files-found: error
          retention-days: 30
      - name: Reconcile exact historical day window without writes
        if: always()
        run: node engine-v1/jobs/report-verified-finals-range.js 2026-10-27 2026-10-29
