name: Sync existing verified runtime snapshot

on:
  workflow_dispatch:
    inputs:
      dayKey:
        description: Existing snapshot day, YYYY-MM-DD
        required: true
      releaseRef:
        description: Immutable 40-hex commit containing the validated snapshot
        required: true

permissions:
  contents: read

concurrency:
  group: matchlab-existing-runtime-snapshot-sync
  cancel-in-progress: false

jobs:
  sync-verified-existing-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate requested identity
        shell: bash
        env:
          DAY_KEY: ${{ inputs.dayKey }}
          RELEASE_REF: ${{ inputs.releaseRef }}
        run: |
          set -euo pipefail
          [[ "$DAY_KEY" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          [[ "$RELEASE_REF" =~ ^[0-9a-f]{40}$ ]]
      - name: Checkout immutable existing artifacts
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.releaseRef }}
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Validate existing manifest
        env:
          DAY_KEY: ${{ inputs.dayKey }}
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            import {validateDeploySnapshotManifest} from "./engine-v1/core/deploy-snapshot-release-contract.js";
            const day=process.env.DAY_KEY;
            const manifest=JSON.parse(fs.readFileSync(`data/deploy-snapshots/${day}/manifest.json`,"utf8"));
            const result=validateDeploySnapshotManifest(manifest,day);
            if(!result.ok)throw Error(JSON.stringify(result));
            console.log(JSON.stringify({day,hash:manifest.hash,valid:true}));
          '
      - name: Promote existing artifacts without rebuilding models
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DAY_KEY: ${{ inputs.dayKey }}
          RELEASE_REF: ${{ inputs.releaseRef }}
        run: bash tools/sync-public-snapshot.sh "$DAY_KEY" "$RELEASE_REF"
      - name: Verify current engine readiness and stability
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_ENGINE_REF="$(curl -fsS --max-time 30 https://ai-matchlab-engine.onrender.com/release | node --input-type=module -e 'let s="";for await (const c of process.stdin)s+=c;console.log(JSON.parse(s).gitCommit)')"
          [[ "$CURRENT_ENGINE_REF" =~ ^[0-9a-f]{40}$ ]]
          node tools/verify-public-engine-runtime.mjs "$CURRENT_ENGINE_REF"

