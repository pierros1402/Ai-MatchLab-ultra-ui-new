name: One-shot Day28 foundation recovery

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-day28-foundation-recovery-20260828.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-matchlab-data-writer
  cancel-in-progress: false

jobs:
  recover-foundations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DAY_KEY: "2026-08-28"
      SEASON: "2026-2027"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Sync latest main after writer lock
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin main
          git checkout -B main origin/main
          test -z "$(git status --porcelain)"
          echo "SOURCE_HEAD=$(git rev-parse HEAD)"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Validate current foundation state
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import {
            validateHistoryIndexFoundationSync,
            validateModelPriorsFoundationSync,
            validateH2HFoundationSync,
          } from './engine-v1/core/derived-history-foundation.js';
          const season = process.env.SEASON;
          const index = validateHistoryIndexFoundationSync(season);
          const priors = validateModelPriorsFoundationSync(season);
          const h2h = validateH2HFoundationSync();
          console.log('FOUNDATION_BEFORE=' + JSON.stringify({
            historyIndex: { ok: index.ok === true, reason: index.reason || null },
            modelPriors: { ok: priors.ok === true, reason: priors.reason || null },
            h2h: { ok: h2h.ok === true, reason: h2h.reason || null },
          }));
          if (h2h.ok !== true) {
            throw new Error(`unexpected_h2h_foundation_failure:${h2h.reason || 'unknown'}`);
          }
          NODE

      - name: Rebuild official history index foundation
        run: node ./engine-v1/jobs/build-current-season-indexes.js "$SEASON" "$DAY_KEY"

      - name: Rebuild official model priors foundation
        run: node ./engine-v1/jobs/build-model-priors.js "$SEASON"

      - name: Validate rebuilt foundations
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import {
            validateHistoryIndexFoundationSync,
            validateModelPriorsFoundationSync,
            validateH2HFoundationSync,
          } from './engine-v1/core/derived-history-foundation.js';
          const season = process.env.SEASON;
          const index = validateHistoryIndexFoundationSync(season);
          const priors = validateModelPriorsFoundationSync(season);
          const h2h = validateH2HFoundationSync();
          console.log('FOUNDATION_AFTER=' + JSON.stringify({
            historyIndex: { ok: index.ok === true, reason: index.reason || null, fingerprint: index.artifact?.foundationFingerprint || null },
            modelPriors: { ok: priors.ok === true, reason: priors.reason || null, fingerprint: priors.artifact?.foundationFingerprint || null },
            h2h: { ok: h2h.ok === true, reason: h2h.reason || null, fingerprint: h2h.artifact?.foundationFingerprint || null },
          }));
          if (index.ok !== true || priors.ok !== true || h2h.ok !== true) {
            throw new Error('foundation_recovery_validation_failed');
          }
          NODE

      - name: Enforce exact foundation write allowlist
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t CHANGED < <(git status --porcelain=v1 | sed -E 's/^.. //' | sort -u)
          printf 'CHANGED=%s\n' "${CHANGED[*]}"

          ALLOWED=(
            "data/history-index/foundation/${SEASON}.json"
            "data/history-index/league-form/${SEASON}.json"
            "data/history-index/matchups/${SEASON}.json"
            "data/history-index/team-form/${SEASON}.json"
            "data/model-priors/${SEASON}.json"
            "data/model-priors/foundation/${SEASON}.json"
          )
          printf '%s\n' "${ALLOWED[@]}" | sort -u > "$RUNNER_TEMP/allowed.txt"
          printf '%s\n' "${CHANGED[@]}" | sort -u > "$RUNNER_TEMP/changed.txt"

          if ! diff -u "$RUNNER_TEMP/allowed.txt" "$RUNNER_TEMP/changed.txt"; then
            echo "FOUNDATION_WRITE_ALLOWLIST=FAIL"
            exit 1
          fi
          echo "FOUNDATION_WRITE_ALLOWLIST=PASS"

      - name: Commit and fast-forward push foundation recovery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          PATHS=(
            "data/history-index/foundation/${SEASON}.json"
            "data/history-index/league-form/${SEASON}.json"
            "data/history-index/matchups/${SEASON}.json"
            "data/history-index/team-form/${SEASON}.json"
            "data/model-priors/${SEASON}.json"
            "data/model-priors/foundation/${SEASON}.json"
          )
          git add -- "${PATHS[@]}"
          git diff --cached --check
          test -z "$(git status --porcelain=v1 | grep '^??' || true)"

          PARENT="$(git rev-parse HEAD)"
          git commit -m "Refresh Day28 derived history foundations"
          CANDIDATE="$(git rev-parse HEAD)"

          git fetch origin main
          REMOTE="$(git rev-parse origin/main)"
          echo "PARENT=$PARENT"
          echo "CANDIDATE=$CANDIDATE"
          echo "REMOTE=$REMOTE"
          if [ "$REMOTE" != "$PARENT" ]; then
            echo "FOUNDATION_PUSH_RACE=STOP"
            exit 1
          fi

          git push origin HEAD:main
          echo "DAY28_FOUNDATION_RECOVERY=PASS"
