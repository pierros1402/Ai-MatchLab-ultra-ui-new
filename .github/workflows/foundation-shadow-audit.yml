name: Foundation shadow history audit

on:
  push:
    branches:
      - diagnostic/foundation-shadow-audit-final-20260810
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact diagnostic branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify immutable base ancestry
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Base = '750a4cd859fe426ef25dd01cf582799abec3d1e9'
          git merge-base --is-ancestor $Base HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic branch is not descended from the exact failing SHA.' }
          Write-Host "SHADOW_BASE_SHA=$Base"
          Write-Host "SHADOW_HEAD_SHA=$(git rev-parse HEAD)"

      - name: Run read-only current-history audit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force -Path data/history-integrity/shadow | Out-Null
          node --check engine-v1/jobs/shadow-audit-current-history-identity.js *> data/history-integrity/shadow/syntax-console.txt
          $SyntaxRc = $LASTEXITCODE
          "syntaxExitCode=$SyntaxRc" | Set-Content data/history-integrity/shadow/exit-codes.txt
          if ($SyntaxRc -eq 0) {
            node engine-v1/jobs/shadow-audit-current-history-identity.js *> data/history-integrity/shadow/audit-console.txt
            $AuditRc = $LASTEXITCODE
          }
          else {
            $AuditRc = -1
          }
          "auditExitCode=$AuditRc" | Add-Content data/history-integrity/shadow/exit-codes.txt
          Write-Host "SHADOW_SYNTAX_RC=$SyntaxRc"
          Write-Host "SHADOW_AUDIT_RC=$AuditRc"
          exit 0

      - name: Upload shadow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-shadow-history-audit
          path: data/history-integrity/shadow/**
          if-no-files-found: error
          retention-days: 7
