name: TMP list Daily runs 2026-09-13

on:
  push:
    branches:
      - ops/20260913-current-day-publication-recovery
    paths:
      - ".github/workflows/tmp-list-daily-runs-20260913.yml"

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect recent Daily runs
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/daily-deploy-snapshot.yml/runs?branch=main&per_page=10" \
            > "$RUNNER_TEMP/runs.json"

          node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/runs.json','utf8'));
          const rows = (p.workflow_runs || []).map(r => ({
            id:r.id,
            event:r.event,
            status:r.status,
            conclusion:r.conclusion,
            head_sha:r.head_sha,
            created_at:r.created_at,
            updated_at:r.updated_at,
            run_started_at:r.run_started_at,
            html_url:r.html_url
          }));
          console.log(JSON.stringify(rows,null,2));
          NODE
