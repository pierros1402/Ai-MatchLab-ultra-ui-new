name: History archive transport regression
on:
  pull_request:
    paths:
      - .github/workflows/history-archive-transport-guard.yml
      - engine-v1/storage/history-archive-transport*
      - engine-v1/storage/history-preservation.js
      - engine-v1/tests/history-preservation.test.js
      - .github/workflows/history-preservation-canary.yml
permissions:
  contents: read
jobs:
  archive-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          sparse-checkout: |
            engine-v1
            .github
            tools
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: node --check engine-v1/storage/history-preservation.js
      - run: node --test engine-v1/storage/history-archive-transport.test.js engine-v1/tests/history-preservation.test.js engine-v1/tests/history-protection-watchdog.test.js
      - run: git diff --exit-code
