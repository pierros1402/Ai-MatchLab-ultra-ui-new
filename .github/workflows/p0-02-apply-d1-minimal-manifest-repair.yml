name: P0-02 apply D-1 minimal manifest repair

on:
  push:
    branches:
      - work/p0-production-day-closure-20260811
    paths:
      - ".github/workflows/p0-02-apply-d1-minimal-manifest-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/p0-production-day-closure-20260811
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm ci --no-audit --no-fund --prefix engine-v1

      - name: Capture frozen gate from real exporter
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import { exportDeploySnapshotDay } from './engine-v1/jobs/export-deploy-snapshot-day.js';

          const day = '2026-08-10';
          const valueFile = `data/deploy-snapshots/${day}/value.json`;
          const manifestFile = `data/deploy-snapshots/${day}/manifest.json`;
          const before = fs.readFileSync(valueFile);
          const beforeHash = crypto.createHash('sha256').update(before).digest('hex');
          fs.writeFileSync('/tmp/p0-02-frozen-value.sha256', beforeHash + '\n');

          await exportDeploySnapshotDay(day, { preserveDetails: true, preserveValue: true });
          const after = fs.readFileSync(valueFile);
          const afterHash = crypto.createHash('sha256').update(after).digest('hex');
          if (beforeHash !== afterHash) throw new Error('frozen_value_bytes_changed_during_gate_capture');

          const manifest = JSON.parse(fs.readFileSync(manifestFile, 'utf8'));
          const gate = manifest?.valueGate;
          if (manifest?.counts?.valuePicks !== 7) throw new Error('captured_manifest_value_count_not_7');
          if (!gate || gate.ok !== true || gate.mode !== 'frozen_snapshot') throw new Error('captured_frozen_gate_not_green');
          if (gate.valueFreshAgainstCanonical !== false) throw new Error('captured_freshness_truth_hidden');
          if (gate.frozenIdentityBound !== true || gate.frozenReleaseSafe !== true) throw new Error('captured_frozen_binding_not_safe');
          if (Number(gate.orphanPickCount || 0) !== 0 || Number(gate.missingMatchIdPickCount || 0) !== 0) throw new Error('captured_frozen_membership_not_clean');
          fs.writeFileSync('/tmp/p0-02-frozen-gate.json', JSON.stringify(gate, null, 2) + '\n');
          console.log('CAPTURED_FROZEN_GATE=' + JSON.stringify(gate));
          console.log('FROZEN_VALUE_SHA256=' + beforeHash);
          NODE

      - name: Discard broad exporter mutations
        shell: bash
        run: |
          set -euo pipefail
          git restore --source=HEAD -- data/deploy-snapshots/2026-08-10 data/deploy-snapshots/latest.json
          test -z "$(git status --porcelain)"

      - name: Rebind only existing manifest and latest pointer
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import {
            canonicalFileBytes,
            canonicalFileSha256,
            computeDeploySnapshotManifestHash,
            validateDeploySnapshotManifest
          } from './engine-v1/core/deploy-snapshot-release-contract.js';
          import { evaluateFrozenValueFixtureBinding } from './engine-v1/core/frozen-value-release-contract.js';
          import { checkValueArtifactGate } from './engine-v1/jobs/check-value-artifact-gate.js';
          import { runSnapshotInvariantCheck } from './engine-v1/jobs/run-snapshot-invariant-check.js';

          const day = '2026-08-10';
          const root = `data/deploy-snapshots/${day}`;
          const manifestFile = `${root}/manifest.json`;
          const latestFile = 'data/deploy-snapshots/latest.json';
          const valueFile = `${root}/value.json`;
          const fixturesFile = `${root}/fixtures.json`;
          const auditFile = `${root}/value-audit.json`;
          const detailDir = `${root}/details`;

          const originalValueBytes = fs.readFileSync(valueFile);
          const rawHash = crypto.createHash('sha256').update(originalValueBytes).digest('hex');
          const expectedRawHash = fs.readFileSync('/tmp/p0-02-frozen-value.sha256', 'utf8').trim();
          if (rawHash !== expectedRawHash) throw new Error('restored_frozen_value_hash_changed');

          const manifest = JSON.parse(fs.readFileSync(manifestFile, 'utf8'));
          const latest = JSON.parse(fs.readFileSync(latestFile, 'utf8'));
          const value = JSON.parse(originalValueBytes);
          const fixturesArtifact = JSON.parse(fs.readFileSync(fixturesFile, 'utf8'));
          const capturedGate = JSON.parse(fs.readFileSync('/tmp/p0-02-frozen-gate.json', 'utf8'));

          if (value.count !== 7 || value.picks?.length !== 7) throw new Error('restored_frozen_value_not_7');
          if (fixturesArtifact.count !== 80 || fixturesArtifact.fixtures?.length !== 80) throw new Error('restored_fixture_universe_not_80');

          const binding = evaluateFrozenValueFixtureBinding({
            preserveSnapshotValueBytes: true,
            dayKey: day,
            valueArtifact: value,
            fixtures: fixturesArtifact.fixtures
          });
          if (binding.releaseSafe !== true || binding.orphanPickCount !== 0 || binding.missingMatchIdPickCount !== 0) {
            throw new Error('restored_snapshot_identity_binding_failed:' + JSON.stringify(binding));
          }

          manifest.counts.valuePicks = value.count;
          manifest.valueGate = {
            ...capturedGate,
            fixtures: fixturesArtifact.count,
            valuePicks: value.count,
            valueSource: String(value.source || capturedGate.valueSource || 'canonical_fixtures'),
            mode: 'frozen_snapshot',
            frozenIdentityBound: binding.frozenIdentityBound,
            frozenReleaseSafe: binding.releaseSafe,
            frozenPickCount: binding.frozenPickCount,
            orphanPickCount: binding.orphanPickCount,
            orphanPickIds: binding.orphanPickIds,
            missingMatchIdPickCount: binding.missingMatchIdPickCount,
            missingMatchIdPickIndexes: binding.missingMatchIdPickIndexes,
            dayBound: binding.dayBound,
            canonicalSourceBound: binding.canonicalSourceBound,
            ok: true
          };

          // The immutable snapshot artifacts remain untouched. Recompute only the
          // manifest hash because counts.valuePicks is part of the hash payload.
          manifest.hash = computeDeploySnapshotManifestHash(manifest);
          fs.writeFileSync(manifestFile, JSON.stringify(manifest, null, 2) + '\n');
          latest.hash = manifest.hash;
          fs.writeFileSync(latestFile, JSON.stringify(latest, null, 2) + '\n');

          const topFiles = [
            ['fixtures.json', fixturesFile],
            ['value.json', valueFile],
            ['value-audit.json', auditFile]
          ];
          for (const [name, file] of topFiles) {
            const actual = canonicalFileSha256(file);
            const expected = manifest?.fileHashes?.[name];
            if (actual !== expected) throw new Error(`top_file_hash_mismatch:${name}:${actual}:${expected}`);
          }

          const detailRows = Array.isArray(manifest.details) ? manifest.details : [];
          if (detailRows.length !== 80 || manifest.counts.details !== 80) throw new Error('detail_manifest_count_not_80');
          for (const row of detailRows) {
            const file = path.join(detailDir, row.file);
            if (!fs.existsSync(file)) throw new Error(`detail_missing:${row.file}`);
            const actualSha = canonicalFileSha256(file);
            const actualBytes = canonicalFileBytes(file);
            if (actualSha !== row.sha256) throw new Error(`detail_hash_mismatch:${row.file}`);
            if (actualBytes !== Number(row.bytes)) throw new Error(`detail_bytes_mismatch:${row.file}:${actualBytes}:${row.bytes}`);
          }

          const release = validateDeploySnapshotManifest(manifest, day);
          if (release.ok !== true) throw new Error('release_contract_failed:' + JSON.stringify(release.errors));

          const gate = checkValueArtifactGate(day);
          if (gate.ok !== true) throw new Error('value_artifact_gate_failed:' + String(gate.reason || 'unknown'));

          const invariant = await runSnapshotInvariantCheck(day);
          if (invariant.ok !== true || invariant.valueSafe !== true) {
            throw new Error('snapshot_invariant_failed:' + JSON.stringify(invariant.blocked || []));
          }

          console.log('MINIMAL_REPAIR=' + JSON.stringify({
            manifestHash: manifest.hash,
            frozenValueRawSha256: rawHash,
            counts: manifest.counts,
            valueGate: manifest.valueGate,
            release,
            artifactGate: gate,
            invariant: { ok: invariant.ok, valueSafe: invariant.valueSafe, blocked: invariant.blocked || [] }
          }, null, 2));
          NODE

          # Invariant execution writes its report; it is validation evidence only,
          # not part of this minimal poisoned-manifest repair.
          git restore --source=HEAD -- data/deploy-snapshots/2026-08-10/invariant-report.json

      - name: Enforce exact two-file repair boundary
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t CHANGED < <(git diff --name-only | sort)
          printf 'CHANGED=%s\n' "${CHANGED[*]}"
          test "${#CHANGED[@]}" -eq 2
          test "${CHANGED[0]}" = "data/deploy-snapshots/2026-08-10/manifest.json"
          test "${CHANGED[1]}" = "data/deploy-snapshots/latest.json"

          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const value = fs.readFileSync('data/deploy-snapshots/2026-08-10/value.json');
          const sha = crypto.createHash('sha256').update(value).digest('hex');
          const expected = fs.readFileSync('/tmp/p0-02-frozen-value.sha256', 'utf8').trim();
          if (sha !== expected) throw new Error('final_frozen_value_bytes_changed');
          console.log('FINAL_FROZEN_VALUE_SHA256=' + sha);
          NODE

      - name: Commit minimal D-1 repair to draft branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/deploy-snapshots/2026-08-10/manifest.json data/deploy-snapshots/latest.json
          git diff --cached --name-only
          git commit -m "Repair frozen 2026-08-10 snapshot manifest binding"
          git push origin HEAD:work/p0-production-day-closure-20260811
