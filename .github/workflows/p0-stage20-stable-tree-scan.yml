name: P0 Stage20 stable two-pass whole-tree evidence (isolated)
on:
  pull_request:
    paths:
      - "engine-v1/core/daily-resume-stable-data-scan.mjs"
      - "engine-v1/core/daily-resume-stable-data-scan.test.mjs"
      - ".github/workflows/p0-stage20-stable-tree-scan.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            engine-v1/core/daily-resume-stable-data-scan.mjs
            engine-v1/core/daily-resume-stable-data-scan.test.mjs
            engine-v1/core/daily-resume-complete-data-inventory.mjs
            .github/workflows/p0-stage20-stable-tree-scan.yml
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Syntax and seven fail-closed double-read source tests
        run: |
          node --check engine-v1/core/daily-resume-stable-data-scan.mjs
          node --check engine-v1/core/daily-resume-stable-data-scan.test.mjs
          node --test --test-reporter=tap engine-v1/core/daily-resume-stable-data-scan.test.mjs
      - name: No producer mutation or automatic resume
        run: |
          git diff --exit-code HEAD -- .github/workflows/daily-deploy-snapshot.yml data/
          echo "TWO_PASS_STABILITY_NOT_WRITER_LEASE_NO_RESUME_NO_PUBLISH"
