name: P0 Stage20 runtime journal integrity (isolated)
on:
  pull_request:
    paths:
      - "engine-v1/core/daily-resume-stage20-boundary-journal-integrity.mjs"
      - "engine-v1/core/daily-resume-stage20-boundary-journal-integrity.test.mjs"
      - ".github/workflows/p0-stage20-runtime-journal-integrity.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            engine-v1/core
            engine-v1/jobs/observe-daily-runtime-boundaries.mjs
            engine-v1/jobs/run-daily-cycle.js
            .github/workflows/p0-stage20-runtime-journal-integrity.yml
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Syntax and real-source boundary journal regression
        run: |
          node --check engine-v1/core/daily-resume-stage20-boundary-journal-integrity.mjs
          node --check engine-v1/core/daily-resume-stage20-boundary-journal-integrity.test.mjs
          node --test --test-reporter=tap engine-v1/core/daily-resume-stage20-boundary-journal-integrity.test.mjs
      - name: Preserve production and publication contracts
        run: |
          git diff --exit-code HEAD -- .github/workflows/daily-deploy-snapshot.yml data/
          echo "JOURNAL_INTEGRITY_DIAGNOSTIC_ONLY__COMPLETE_CYCLE_NOT_PROVEN__RESUME_OFF"
