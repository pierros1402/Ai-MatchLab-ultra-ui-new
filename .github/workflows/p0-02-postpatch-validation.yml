name: P0-02 post-patch validation

on:
  push:
    branches:
      - work/p0-production-day-closure-20260811
    paths:
      - ".github/workflows/p0-02-postpatch-validation.yml"
      - "engine-v1/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm ci --no-audit --no-fund --prefix engine-v1

      - name: Targeted P0-02 contract suite
        run: |
          set -euo pipefail
          node --test \
            engine-v1/tests/frozen-value-release-contract.test.js \
            engine-v1/tests/export-deploy-snapshot-preservation.test.js \
            engine-v1/tests/daily-publish-contract.test.js \
            engine-v1/jobs/verify-daily-publish-contract.test.js \
            engine-v1/core/deploy-snapshot-release-contract.test.js

      - name: Verify changed exporter P0-C source pin
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re
          actual = hashlib.sha256(Path('engine-v1/jobs/export-deploy-snapshot-day.js').read_bytes().replace(b'\r\n', b'\n')).hexdigest()
          text = Path('engine-v1/jobs/p0c-p4-family-adapter-contract.js').read_text(encoding='utf-8')
          m = re.search(r'deploySnapshotExporter: Object\.freeze\(\{\s*path: "engine-v1/jobs/export-deploy-snapshot-day\.js",\s*sha256:\s*"([0-9a-f]{64})"', text, re.S)
          if not m: raise SystemExit('EXPORTER_PIN_NOT_FOUND')
          print('EXPORTER_SHA256=' + actual)
          print('PINNED_SHA256=' + m.group(1))
          if actual != m.group(1): raise SystemExit('EXPORTER_PIN_MISMATCH')
          PY

      - name: Ephemeral 2026-08-10 frozen snapshot validation
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import { exportDeploySnapshotDay } from './engine-v1/jobs/export-deploy-snapshot-day.js';
          import { runSnapshotInvariantCheck } from './engine-v1/jobs/run-snapshot-invariant-check.js';
          import { validateDeploySnapshotManifest } from './engine-v1/core/deploy-snapshot-release-contract.js';
          import { checkValueArtifactGate } from './engine-v1/jobs/check-value-artifact-gate.js';

          const day = '2026-08-10';
          const valueFile = `data/deploy-snapshots/${day}/value.json`;
          const manifestFile = `data/deploy-snapshots/${day}/manifest.json`;
          const hash = b => crypto.createHash('sha256').update(b).digest('hex');
          const beforeBytes = fs.readFileSync(valueFile);
          const before = JSON.parse(beforeBytes);
          if (before.count !== 7 || before.picks?.length !== 7) throw new Error('unexpected_frozen_baseline');

          await exportDeploySnapshotDay(day, { preserveDetails: true, preserveValue: true });

          const afterBytes = fs.readFileSync(valueFile);
          const after = JSON.parse(afterBytes);
          const manifest = JSON.parse(fs.readFileSync(manifestFile, 'utf8'));
          const invariant = await runSnapshotInvariantCheck(day);
          const release = validateDeploySnapshotManifest(manifest, day);
          const gate = checkValueArtifactGate(day);

          const report = {
            beforeSha256: hash(beforeBytes),
            afterSha256: hash(afterBytes),
            byteIdentical: beforeBytes.equals(afterBytes),
            valueCount: after.count,
            picksLength: after.picks?.length,
            manifestValuePicks: manifest?.counts?.valuePicks,
            valueGate: manifest?.valueGate,
            invariant: { ok: invariant?.ok, valueSafe: invariant?.valueSafe, blocked: invariant?.blocked ?? [] },
            release,
            artifactGate: gate
          };
          console.log('P0_02_D1_POSTPATCH=' + JSON.stringify(report, null, 2));

          if (!report.byteIdentical) throw new Error('frozen_value_bytes_changed');
          if (after.count !== 7 || after.picks?.length !== 7) throw new Error('frozen_value_semantics_changed');
          if (manifest?.counts?.valuePicks !== 7 || manifest?.valueGate?.valuePicks !== 7) throw new Error('manifest_value_count_not_7');
          if (manifest?.valueGate?.valueFreshAgainstCanonical !== false) throw new Error('freshness_truth_was_hidden');
          if (manifest?.valueGate?.mode !== 'frozen_snapshot') throw new Error('frozen_mode_missing');
          if (manifest?.valueGate?.frozenIdentityBound !== true || manifest?.valueGate?.frozenReleaseSafe !== true) throw new Error('frozen_identity_binding_failed');
          if (Number(manifest?.valueGate?.orphanPickCount || 0) !== 0 || Number(manifest?.valueGate?.missingMatchIdPickCount || 0) !== 0) throw new Error('frozen_membership_not_clean');
          if (manifest?.valueGate?.ok !== true) throw new Error('frozen_value_gate_not_green');
          if (invariant?.ok !== true || invariant?.valueSafe !== true) throw new Error('snapshot_invariant_failed');
          if (release?.ok !== true) throw new Error('release_contract_failed:' + JSON.stringify(release?.errors || []));
          if (gate?.ok !== true) throw new Error('value_artifact_gate_failed:' + String(gate?.reason || 'unknown'));
          NODE

      - name: Prove known broad-suite failures are baseline
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="fe916bd00376097f74155717917653742ec3e950"
          set +e
          node --test engine-v1/jobs/p0c-p4-family-adapter-contract.test.js engine-v1/storage/standings-consumer-boundary.test.js > /tmp/branch.tap 2>&1
          BRANCH_RC=$?
          set -e

          git worktree add --detach /tmp/p0-base "$BASE_SHA"
          set +e
          (cd /tmp/p0-base && node --test engine-v1/jobs/p0c-p4-family-adapter-contract.test.js engine-v1/storage/standings-consumer-boundary.test.js) > /tmp/base.tap 2>&1
          BASE_RC=$?
          set -e

          echo "BRANCH_RC=$BRANCH_RC"
          echo "BASE_RC=$BASE_RC"
          echo "=== BRANCH ERRORS ==="
          grep -E 'Error: |ℹ fail |# fail ' /tmp/branch.tap || true
          echo "=== BASE ERRORS ==="
          grep -E 'Error: |ℹ fail |# fail ' /tmp/base.tap || true

          python3 - <<'PY'
          import re
          from pathlib import Path
          def errors(path):
              text = Path(path).read_text(encoding='utf-8', errors='replace')
              return sorted(set(re.findall(r'Error: ([^\r\n]+)', text)))
          branch = errors('/tmp/branch.tap')
          base = errors('/tmp/base.tap')
          print('BRANCH_ERROR_SET=', branch)
          print('BASE_ERROR_SET=', base)
          extras = sorted(set(branch) - set(base))
          if extras:
              raise SystemExit('BRANCH_ONLY_BASELINE_TEST_ERRORS=' + repr(extras))
          PY

      - name: Confirm validation made no repository commit
        if: always()
        run: |
          echo "Validation worktree changes are ephemeral only:"
          git status --short
