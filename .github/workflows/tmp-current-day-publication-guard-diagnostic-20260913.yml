name: TMP current-day publication guard diagnostic 2026-09-13

on:
  push:
    branches:
      - audit/20260913-current-day-publication-guard

permissions:
  contents: read
  actions: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact audit branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Inspect guard state without dispatch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          CALENDAR_DAY="$(TZ=Europe/Athens date +%F)"
          NEXT_DAY="$(TZ=Europe/Athens date -d 'tomorrow' +%F)"
          CURRENT_MANIFEST="data/deploy-snapshots/${CALENDAR_DAY}/manifest.json"
          LATEST_DAY="$(node -e 'try{const x=require("./data/deploy-snapshots/latest.json");process.stdout.write(String(x?.date||""));}catch{}')"

          CURRENT_VALID=false
          if [[ -f "${CURRENT_MANIFEST}" ]]; then
            set +e
            DAY_KEY="${CALENDAR_DAY}" node --input-type=module -e '
              import fs from "node:fs";
              import { validateDeploySnapshotManifest } from "./engine-v1/core/deploy-snapshot-release-contract.js";
              const day=process.env.DAY_KEY;
              const manifest=JSON.parse(fs.readFileSync(`data/deploy-snapshots/${day}/manifest.json`,"utf8"));
              const check=validateDeploySnapshotManifest(manifest,day);
              console.log(JSON.stringify({day,ok:check.ok,errors:check.errors||[],hash:manifest.hash||null}));
              process.exit(check.ok?0:2);
            '
            RC=$?
            set -e
            [[ "$RC" -eq 0 ]] && CURRENT_VALID=true
          fi

          if [[ "${LATEST_DAY}" == "${NEXT_DAY}" ]]; then
            RECOVERY_DAY="${NEXT_DAY}"
            RECOVERY_REASON="current_missing_latest_next_day"
          else
            RECOVERY_DAY="${CALENDAR_DAY}"
            RECOVERY_REASON="current_missing_normal_recovery"
          fi

          RUNS_FILE="$RUNNER_TEMP/daily-runs.json"
          curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o "${RUNS_FILE}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/daily-deploy-snapshot.yml/runs?branch=main&per_page=20"

          CALENDAR_DAY="${CALENDAR_DAY}" NEXT_DAY="${NEXT_DAY}" LATEST_DAY="${LATEST_DAY}" CURRENT_VALID="${CURRENT_VALID}" RECOVERY_DAY="${RECOVERY_DAY}" RECOVERY_REASON="${RECOVERY_REASON}" RUNS_FILE="${RUNS_FILE}" node <<'NODE'
          const fs=require('fs');
          const payload=JSON.parse(fs.readFileSync(process.env.RUNS_FILE,'utf8'));
          const runs=Array.isArray(payload.workflow_runs)?payload.workflow_runs:[];
          const active=runs.some(r=>String(r?.status||'').toLowerCase()!=='completed');
          const recentManual=runs.filter(r=>r?.event==='workflow_dispatch').some(r=>{
            const t=Date.parse(String(r?.created_at||''));
            return Number.isFinite(t) && Date.now()-t < 20*60*1000;
          });
          const decision=active?'active':recentManual?'cooldown':'dispatch';
          console.log(JSON.stringify({
            calendarDay:process.env.CALENDAR_DAY,
            nextDay:process.env.NEXT_DAY,
            latestDay:process.env.LATEST_DAY,
            currentValid:process.env.CURRENT_VALID==='true',
            recoveryDay:process.env.RECOVERY_DAY,
            recoveryReason:process.env.RECOVERY_REASON,
            decision,
            recentRuns:runs.slice(0,10).map(r=>({
              id:r.id,
              event:r.event,
              status:r.status,
              conclusion:r.conclusion,
              created_at:r.created_at,
              updated_at:r.updated_at,
              head_sha:r.head_sha,
              display_title:r.display_title
            }))
          },null,2));
          NODE

      - name: Prove checkout clean
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
