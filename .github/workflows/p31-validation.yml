name: P3.1 isolated validation

on:
  push:
    branches:
      - work/p31-atomic-midnight-rollover-20260822

permissions:
  contents: read
  statuses: write

concurrency:
  group: p31-isolated-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      - name: Install engine dependencies
        working-directory: engine-v1
        run: npm ci --no-audit --no-fund

      - name: Syntax check changed JavaScript
        run: |
          node --check assets/js/live/operational-day.js
          node --check engine-v1/tests/ui-atomic-operational-day.test.js

      - name: P3.1 atomic rollover regression
        run: node --test engine-v1/tests/ui-atomic-operational-day.test.js

      - name: Existing daily contract regressions
        run: |
          node --test \
            engine-v1/tests/daily-autonomous-result-closure.test.js \
            engine-v1/tests/daily-details-foundation-order.test.js \
            engine-v1/tests/daily-publish-contract.test.js \
            engine-v1/tests/daily-snapshot-final-live-refresh.test.js

      - name: Daily workflow test family
        shell: bash
        run: |
          mapfile -t tests < <(find engine-v1/tests -maxdepth 1 -type f -name 'daily-*.test.js' -print | sort)
          printf 'Daily tests (%s):\n' "${#tests[@]}"
          printf '  %s\n' "${tests[@]}"
          node --test "${tests[@]}"

      - name: Publish machine-readable branch validation status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          case "$JOB_STATUS" in
            success) STATE=success ;;
            failure) STATE=failure ;;
            cancelled) STATE=error ;;
            *) STATE=error ;;
          esac
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${STATE}\",\"context\":\"P3.1 isolated validation\",\"description\":\"Atomic rollover + daily contract regression suite\"}"
