name: TMP Daily status audit 2026-09-13

on:
  push:
    branches:
      - audit/20260913-daily-active-status

permissions:
  contents: read
  actions: read

jobs:
  audit-daily-status:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect recent Daily workflow runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${REPO}/actions/workflows/daily-deploy-snapshot.yml/runs?branch=main&per_page=20"
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API}" > /tmp/runs.json

          node <<'NODE'
          const fs = require('fs');
          const x = JSON.parse(fs.readFileSync('/tmp/runs.json','utf8'));
          const runs = Array.isArray(x.workflow_runs) ? x.workflow_runs : [];
          const summary = runs.map(r => ({
            id: r.id,
            status: r.status,
            conclusion: r.conclusion,
            event: r.event,
            created_at: r.created_at,
            updated_at: r.updated_at,
            run_started_at: r.run_started_at,
            head_sha: r.head_sha,
            run_number: r.run_number,
            run_attempt: r.run_attempt,
            html_url: r.html_url
          }));
          console.log('DAILY_RUNS_SUMMARY=' + JSON.stringify(summary));
          const active = summary.filter(r => String(r.status).toLowerCase() !== 'completed');
          console.log('ACTIVE_RUN_IDS=' + active.map(r => r.id).join(','));
          NODE

          ACTIVE_IDS="$(node -e 'const x=require("/tmp/runs.json");process.stdout.write((x.workflow_runs||[]).filter(r=>String(r.status).toLowerCase()!=="completed").map(r=>r.id).join(" "))')"
          for id in ${ACTIVE_IDS}; do
            echo "=== ACTIVE RUN ${id} JOBS ==="
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/actions/runs/${id}/jobs?per_page=100" > "/tmp/jobs-${id}.json"
            RUN_ID="${id}" node <<'NODE'
            const fs = require('fs');
            const id = process.env.RUN_ID;
            const x = JSON.parse(fs.readFileSync(`/tmp/jobs-${id}.json`,'utf8'));
            const jobs = (x.jobs||[]).map(j => ({
              id:j.id,
              name:j.name,
              status:j.status,
              conclusion:j.conclusion,
              started_at:j.started_at,
              completed_at:j.completed_at,
              steps:(j.steps||[]).map(s=>({number:s.number,name:s.name,status:s.status,conclusion:s.conclusion,started_at:s.started_at,completed_at:s.completed_at}))
            }));
            console.log('ACTIVE_RUN_JOBS=' + JSON.stringify({runId:Number(id),jobs}));
            NODE
          done
