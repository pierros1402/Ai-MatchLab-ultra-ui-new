name: P0 Daily worktree delta replay (isolated)

on:
  pull_request:
    paths:
      - "engine-v1/core/daily-resume-worktree-delta.mjs"
      - "engine-v1/core/daily-resume-worktree-delta.test.mjs"
      - ".github/workflows/daily-resume-worktree-delta-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            engine-v1/core
            .github/workflows
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate source and test syntax
        run: |
          node --check engine-v1/core/daily-resume-worktree-delta.mjs
          node --check engine-v1/core/daily-resume-worktree-delta.test.mjs
      - name: Replay actual Git mutations inside isolated scratch clones
        run: node --test --test-reporter=tap engine-v1/core/daily-resume-worktree-delta.test.mjs
      - name: Prove no production paths mutated
        run: git diff --exit-code HEAD -- .github/workflows/daily-deploy-snapshot.yml data/
