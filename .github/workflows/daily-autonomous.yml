name: Daily autonomous run

# Fully automatic SAME-DAY maintenance run (~16:00 Europe/Athens): awareness
# refresh, prior-day results accumulation, comprehensive fixtures, odds opening +
# drift, and coverage report. It is deliberately NOT a midnight/day-rollover
# publisher. The next-day public release is prepared separately before 00:00.

on:
  workflow_dispatch:
    inputs:
      dayKey:
        description: "Day key, YYYY-MM-DD. Empty = Europe/Athens today."
        required: false
        default: ""
  schedule:
    # Two UTC candidates cover 16:00 Europe/Athens across DST/standard time.
    # The local-time guard below admits exactly the 16:xx candidate.
    - cron: "0 13,14 * * *"

permissions:
  contents: write

concurrency:
  group: ai-matchlab-data-writer
  cancel-in-progress: false

jobs:
  run-day:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Resolve day key + Athens 16:00 maintenance guard
        shell: bash
        env:
          INPUT_DAY_KEY: ${{ inputs.dayKey }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          ATHENS_HOUR_NUM=$((10#$(TZ=Europe/Athens date +%H)))
          if [ "$EVENT_NAME" = "schedule" ] && [ "$ATHENS_HOUR_NUM" -ne 16 ]; then
            echo "Not the 16:xx Europe/Athens maintenance window (Athens $ATHENS_HOUR_NUM); skipping."
            echo "SKIP=true" >> "$GITHUB_ENV"; exit 0
          fi
          DAY_KEY="$(printf "%s" "${INPUT_DAY_KEY:-}" | grep -Eo '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -n1 || true)"
          [ -z "$DAY_KEY" ] && DAY_KEY="$(TZ=Europe/Athens date +%F)"
          echo "SKIP=false" >> "$GITHUB_ENV"
          echo "DAY_KEY=$DAY_KEY" >> "$GITHUB_ENV"

      - name: Install dependencies
        if: env.SKIP != 'true'
        run: npm ci --no-audit --no-fund

      - name: Run the autonomous day
        if: env.SKIP != 'true'
        id: run_day
        env:
          # Route Transfermarkt through the CF proxy (TM blocks the runner's IP).
          TM_PROXY_URL: ${{ secrets.TM_PROXY_URL }}
        run: node ./engine-v1/jobs/run-day.js "$DAY_KEY"

      - name: Close yesterday results and rebuild settlement
        if: env.SKIP != 'true'
        id: result_closure
        shell: bash
        run: |
          set -euo pipefail

          YESTERDAY="$(TZ=Europe/Athens date -d 'yesterday' +%F 2>/dev/null || TZ=Europe/Athens date -v-1d +%F)"
          echo "YESTERDAY=$YESTERDAY" >> "$GITHUB_ENV"

          node ./engine-v1/jobs/apply-results-truth-to-canonical-day.js "$YESTERDAY"
          node ./engine-v1/jobs/export-verified-final-results-day.js --date="$YESTERDAY" --write --all-fixtures

          if [ -f "data/deploy-snapshots/${YESTERDAY}/value.json" ]; then
            node ./engine-v1/jobs/export-verified-final-results-day.js --date="$YESTERDAY" --write
          fi

          for PLAN_FILE in plan-a2.json plan-b.json plan-b2.json; do
            PLAN_PATH="data/value-plans/${YESTERDAY}/${PLAN_FILE}"

            if [ -f "$PLAN_PATH" ]; then
              node ./engine-v1/jobs/export-verified-final-results-day.js                 --date="$YESTERDAY"                 --write                 --value-path="$PLAN_PATH"
            fi
          done

          set +e
          node ./engine-v1/jobs/verify-results-day.js "$YESTERDAY"
          VERIFY_STATUS=$?
          set -e

          node ./engine-v1/jobs/build-value-plan-comparison-day.js --date="$YESTERDAY" --write

          echo "Fresh verification exit status: $VERIFY_STATUS"

      - name: Verify results gap check
        if: env.SKIP != 'true'
        shell: bash
        run: |
          node ./engine-v1/jobs/verify-results-day.js --report "$YESTERDAY"

      - name: Commit snapshots + memory
        # Persist the harvested truth even when the results gap check above
        # fails. A few genuinely-uncollected matches (late Flashscore finalizers,
        # postponements) previously discarded EVERY result, value store and
        # memory that WAS harvested — they are truthful, just incomplete — which
        # starved the results-truth store on the ~half of runs that trip the
        # gate (audit 2026-07-07: isl.1 Keflavik v Fram never reached settlement
        # because the 07-07 harvest's commit was skipped by the failed verify).
        # The verify step still fails the run so the alert email fires; we just
        # no longer throw away good data with it. run_day must have succeeded.
        if: ${{ always() && env.SKIP != 'true' && steps.run_day.outcome == 'success' && steps.result_closure.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore --staged . || true

          [ -f "data/deploy-snapshots/${DAY_KEY}/odds.json" ] && git add "data/deploy-snapshots/${DAY_KEY}/odds.json"
          [ -f "data/deploy-snapshots/${DAY_KEY}/fixtures-all.json" ] && git add "data/deploy-snapshots/${DAY_KEY}/fixtures-all.json"
          [ -d "data/league-memory" ] && git add data/league-memory
          [ -d "data/odds-memory" ] && git add data/odds-memory
          [ -d "data/expected-matches" ] && git add data/expected-matches
          [ -d "data/verification" ] && git add data/verification
          [ -d "data/canonical-fixtures/${YESTERDAY}" ] && git add "data/canonical-fixtures/${YESTERDAY}"
          [ -d "data/final-results/${YESTERDAY}" ] && git add "data/final-results/${YESTERDAY}"
          [ -f "data/final-result-conflicts/${YESTERDAY}.json" ] && git add "data/final-result-conflicts/${YESTERDAY}.json"
          [ -d "data/value-plans/${YESTERDAY}" ] && git add "data/value-plans/${YESTERDAY}/"
          [ -f "data/value-comparison/${YESTERDAY}.json" ] && git add "data/value-comparison/${YESTERDAY}.json"

          # Statistical value stores that run-day.js rebuilds every run
          # (buildCurrentSeasonIndexes + buildModelPriors). They were regenerated
          # on the runner daily but never committed, so the deployed engine kept
          # serving stale team-form / league-form / matchups (a fresh rebuild diffs
          # thousands of lines) and the value model degraded across the season.
          # .gitignore already limits these to the pinned <season>.json files, so
          # `git add` on the dirs stages only those.
          [ -d "data/history-index" ] && git add data/history-index
          [ -d "data/model-priors" ] && git add data/model-priors

          # The per-league history-archive that run-day.js refreshes (step 2g)
          # feeds model-priors; without committing it the current season's
          # archive growth was rebuilt on the runner daily and discarded. The
          # converter skips identical files, so only real new results diff.
          [ -d "data/history-archive" ] && git add data/history-archive

          node engine-v1/jobs/guard-staged-data-boundary.js \
            --label=daily-autonomous \
            --dayKey="${DAY_KEY}" \
            --allow="^(data/deploy-snapshots/${DAY_KEY}/(odds\.json|fixtures-all\.json)$|data/league-memory/|data/odds-memory/|data/expected-matches/|data/verification/|data/canonical-fixtures/${YESTERDAY}/|data/final-results/${YESTERDAY}/|data/final-result-conflicts/${YESTERDAY}\.json$|data/value-plans/${YESTERDAY}/|data/value-comparison/${YESTERDAY}\.json$|data/history-index/|data/model-priors/|data/history-archive/)"

          # Only our autonomous artifacts may be staged.
          BAD="$(git diff --cached --name-only | grep -Ev '^(data/deploy-snapshots/|data/league-memory/|data/odds-memory/|data/expected-matches/|data/verification/|data/canonical-fixtures/|data/final-results/|data/final-result-conflicts/|data/value-plans/|data/value-comparison/|data/history-index/|data/model-priors/|data/history-archive/)' || true)"
          if [ -n "$BAD" ]; then echo "ERROR: unexpected staged files:"; echo "$BAD"; exit 1; fi

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily autonomous run for ${DAY_KEY}"
            bash tools/git-push-rebase-retry.sh
          fi
