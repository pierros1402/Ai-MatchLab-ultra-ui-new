name: P0 publication chain recovery stage 2 Day29

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-p0-publication-chain-stage2-day29-20260829.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  wait-for-day28:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Wait for atomic Day28 publication
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 270); do
            git fetch -q origin main
            LATEST_DAY="$(git show origin/main:data/deploy-snapshots/latest.json 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{try{process.stdout.write(String(JSON.parse(s).date||""))}catch{process.stdout.write("")}})')"
            echo "DAY28_WAIT attempt=$attempt latest=$LATEST_DAY"

            if [ "$LATEST_DAY" = "2026-08-28" ]; then
              echo "DAY28_ATOMIC_PUBLICATION=PASS"
              exit 0
            fi

            if [ -n "$LATEST_DAY" ] && [[ "$LATEST_DAY" > "2026-08-28" ]]; then
              echo "Day28 was already superseded by $LATEST_DAY"
              exit 0
            fi

            sleep 20
          done

          echo "ERROR: Day28 did not reach latest within watchdog window"
          exit 1

  seed-day29-adjusted-observations:
    needs: wait-for-day28
    runs-on: ubuntu-latest
    timeout-minutes: 100
    concurrency:
      group: ai-matchlab-data-writer
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Sync latest main after writer lock
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin main
          git checkout -B main origin/main
          test -z "$(git status --porcelain)"

          LATEST_DAY="$(node -e 'const x=require("./data/deploy-snapshots/latest.json");process.stdout.write(String(x.date||""))')"
          if [ "$LATEST_DAY" != "2026-08-28" ]; then
            echo "ERROR: expected latest=2026-08-28 before Day29 seed, got $LATEST_DAY"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      - name: Install engine dependencies
        working-directory: engine-v1
        run: npm ci --no-audit --no-fund

      - name: Catch up prior terminal truth before Day29 model freeze
        run: node ./engine-v1/jobs/run-prior-value-settlement-catchup.js 2026-08-29 --days-back=7

      - name: Rebuild Day29 foundations from current truth
        env:
          TM_PROXY_URL: ${{ secrets.TM_PROXY_URL }}
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
        run: node ./engine-v1/jobs/run-daily-cycle.js 2026-08-29

      - name: Synchronize Day29 canonical runtime and Details
        shell: bash
        run: |
          set -euo pipefail
          node ./engine-v1/jobs/sync-canonical-fixtures-to-json-db-day.js 2026-08-29
          node ./engine-v1/jobs/build-details-day.js 2026-08-29 --rebuild
          node ./engine-v1/jobs/run-live-status-refresh-day.js 2026-08-29 --include-all-open-states
          node ./engine-v1/jobs/build-details-day.js 2026-08-29 --rebuild
          node ./engine-v1/jobs/export-deploy-snapshot-day.js 2026-08-29 --no-update-latest

      - name: Ensure persistent Day29 model assessment input
        shell: bash
        run: |
          set -euo pipefail
          node ./engine-v1/jobs/run-odds-refresh.js 2026-08-29 --force

          node - <<'NODE'
          const fs = require("fs");
          const file = "data/deploy-snapshots/2026-08-29/odds.json";
          const payload = JSON.parse(fs.readFileSync(file, "utf8"));
          const rows = Array.isArray(payload?.matches) ? payload.matches : [];
          const assessmentRows = rows.filter(row => row?.aiAssessment?.markets && Object.keys(row.aiAssessment.markets).length > 0).length;
          console.log(JSON.stringify({ matches: rows.length, assessmentRows }, null, 2));
          if (assessmentRows <= 0) process.exit(1);
          NODE

      - name: Bootstrap missing Day29 A2 B2 observations exactly once
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import {
            buildValueA2B2Day,
            readFrozenAdjustedValueObservations
          } from "./engine-v1/jobs/build-value-a2-b2-day.js";

          const day = "2026-08-29";
          const before = readFrozenAdjustedValueObservations(day);
          const hasA2 = Boolean(before?.A2);
          const hasB2 = Boolean(before?.B2);

          if (hasA2 !== hasB2) {
            throw new Error("partial_adjusted_observation_state_refused");
          }

          if (!hasA2 && !hasB2) {
            const result = await buildValueA2B2Day(day, {
              calendarDay: "2026-08-28"
            });

            console.log(JSON.stringify({
              ok: result?.ok === true,
              freezeObservations: result?.freezeObservations,
              a2Count: Number(result?.plans?.A2?.count || 0),
              b2Count: Number(result?.plans?.B2?.count || 0)
            }, null, 2));

            if (result?.ok !== true || result?.freezeObservations !== false) {
              throw new Error("day29_adjusted_observation_bootstrap_failed");
            }
          }

          const after = readFrozenAdjustedValueObservations(day);
          if (!after?.A2 || !after?.B2) {
            throw new Error("day29_adjusted_observation_validation_failed");
          }
          NODE

      - name: Stage source-bound Day29 seed and truth foundations
        shell: bash
        run: |
          set -euo pipefail
          git restore --staged . || true

          test -d data/canonical-fixtures && git add data/canonical-fixtures
          test -d data/history && git add data/history
          test -d data/history-index && git add data/history-index
          test -d data/h2h && git add data/h2h
          test -f data/h2h-foundation/current.json && git add data/h2h-foundation/current.json
          test -d data/model-priors && git add data/model-priors
          test -d data/standings && git add data/standings
          test -f data/coverage-readiness/2026-08-29.json && git add data/coverage-readiness/2026-08-29.json
          test -f data/competition-discovery/2026-08-29.json && git add data/competition-discovery/2026-08-29.json
          test -f data/provider-competition-registry/flashscore.json && git add data/provider-competition-registry/flashscore.json
          test -f data/deploy-snapshots/2026-08-29/odds.json && git add data/deploy-snapshots/2026-08-29/odds.json
          test -f data/value-plans/2026-08-29/plan-a2.json && git add data/value-plans/2026-08-29/plan-a2.json
          test -f data/value-plans/2026-08-29/plan-a2-audit.json && git add data/value-plans/2026-08-29/plan-a2-audit.json
          test -f data/value-plans/2026-08-29/plan-b2.json && git add data/value-plans/2026-08-29/plan-b2.json
          test -f data/value-plans/2026-08-29/plan-b2-audit.json && git add data/value-plans/2026-08-29/plan-b2-audit.json
          test -d data/final-results && git add data/final-results
          test -d data/final-result-conflicts && git add data/final-result-conflicts
          test -d data/value-comparison && git add data/value-comparison
          test -d data/system-health && git add data/system-health

          STAGED="$(git diff --cached --name-only || true)"
          printf '%s\n' "$STAGED"

          BAD="$(printf '%s\n' "$STAGED" | grep -Ev '^(data/canonical-fixtures/|data/history/|data/history-index/|data/h2h/|data/h2h-foundation/current\.json$|data/model-priors/|data/standings/|data/coverage-readiness/2026-08-29\.json$|data/competition-discovery/2026-08-29\.json$|data/provider-competition-registry/flashscore\.json$|data/deploy-snapshots/2026-08-29/odds\.json$|data/value-plans/2026-08-29/(plan-a2|plan-a2-audit|plan-b2|plan-b2-audit)\.json$|data/final-results/|data/final-result-conflicts/|data/value-comparison/|data/system-health/)' || true)"
          if [ -n "$BAD" ]; then
            echo "ERROR: unexpected Day29 seed paths"
            echo "$BAD"
            exit 1
          fi

          git diff --cached --check

      - name: Commit and push Day29 source-bound recovery seed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --cached --quiet; then
            echo "No Day29 seed changes to commit."
          else
            git commit -m "P0: Seed Day29 adjusted observations from current foundations"
            bash tools/git-push-rebase-retry.sh
          fi

  dispatch-and-verify-day29:
    needs: seed-day29-adjusted-observations
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Dispatch full Day29 publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          WORKFLOW="daily-deploy-snapshot.yml"
          BEFORE="$(gh run list --workflow "$WORKFLOW" --limit 1 --json databaseId --jq '.[0].databaseId // 0')"

          gh workflow run "$WORKFLOW" \
            --ref main \
            -f dayKey=2026-08-29 \
            -f triggerRender=false

          RUN_ID=""
          for attempt in $(seq 1 30); do
            sleep 2
            CANDIDATE="$(gh run list --workflow "$WORKFLOW" --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
            if [ -n "$CANDIDATE" ] && [ "$CANDIDATE" != "0" ] && [ "$CANDIDATE" != "$BEFORE" ]; then
              RUN_ID="$CANDIDATE"
              break
            fi
          done

          if [ -z "$RUN_ID" ]; then
            echo "ERROR: unable to identify dispatched Day29 Daily run"
            exit 1
          fi

          echo "DAY29_RUN_ID=$RUN_ID"
          gh run watch "$RUN_ID" --exit-status --interval 15

      - name: Verify atomic Day29 publication on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          LATEST="$(git show origin/main:data/deploy-snapshots/latest.json)"
          printf '%s\n' "$LATEST"
          DAY="$(printf '%s' "$LATEST" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>process.stdout.write(String(JSON.parse(s).date||"")))')"
          if [ "$DAY" != "2026-08-29" ]; then
            echo "ERROR: Day29 Daily completed but latest=$DAY"
            exit 1
          fi

          git show origin/main:data/deploy-snapshots/2026-08-29/manifest.json >/tmp/day29-manifest.json
          node - <<'NODE'
          const fs = require("fs");
          const manifest = JSON.parse(fs.readFileSync("/tmp/day29-manifest.json", "utf8"));
          console.log(JSON.stringify({
            date: manifest.date,
            generatedAt: manifest.generatedAt,
            hash: manifest.hash,
            counts: manifest.counts,
            valueGate: manifest.valueGate
          }, null, 2));
          if (manifest.date !== "2026-08-29") process.exit(1);
          NODE

      - name: Emit P0 chain closure
        run: |
          echo "P0_PUBLICATION_CHAIN_27_28_29=PASS"
